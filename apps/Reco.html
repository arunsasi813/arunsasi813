  _rvShowKept() {
    const p = ExcelLink._plan;
    p.previouslyKept.forEach(x => { x.cat = 'conflict'; x.take = false; p.conflicts.push(x); });
    p.previouslyKept = [];
    p.tab = 'conflicts';
    ExcelLink._rvRerender();
  },
  closeReview() {
    ExcelLink._plan = null;
    App.closeModal();
  },
  exportReviewCsv() {
    const p = ExcelLink._plan;
    if (!p) return;
    const tpl = AppState.recoTemplates.find(x => x.id === p.tplId);
    const out = [];
    const add = (cat, x, extra) => out.push(Object.assign({ category: cat, excelRow: x.r, key: x.row || x.live ? ExcelLink._keyOf(tpl, x) : x.rid, column: x.col || '',
      atExport: x.B === undefined ? '' : XlSchema.display(x.B), inReco: x.C === undefined ? '' : XlSchema.display(x.C), inExcel: x.E === undefined ? (x.eText || '') : XlSchema.display(x.E),
      decision: '', note: (x.badges || []).join(' ') }, extra || {}));
    p.changes.forEach(x => add('change', x, { decision: x.tick ? 'apply' : 'skip' }));
    p.conflicts.forEach(x => add('conflict', x, { decision: x.take ? 'take Excel' : 'keep Reco' }));
    p.problems.forEach(x => add('problem', x, { note: x.msg }));
    p.previouslyKept.forEach(x => add('previously kept Reco', x));
    U.download('excel_review_' + (p.exportId || 'file') + '.csv', Papa.unparse(out), 'text/csv');
  },

  /* ---------------- apply ---------------- */
  async apply() {
    const plan = ExcelLink._plan;
    if (!plan || ExcelLink._busy) return;
    ExcelLink._keepOffset();
    const { tpl, sess } = ExcelLink._ctx();
    if (!tpl || !sess || tpl.id !== plan.tplId) { U.toast('Open the template this review belongs to', 'error'); return; }
    const picks = plan.changes.filter(x => x.tick).concat(plan.conflicts.filter(x => x.take));
    const kept = plan.conflicts.filter(x => !x.take);
    if (!picks.length && !kept.length) return;
    ExcelLink._busy = true;
    const btn = document.getElementById('xlApplyBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }
    const abort = msg => { ExcelLink._busy = false; U.toast(msg, 'error'); ExcelLink._rvFooter(); };
    try {
      // Revalidate: nothing may have changed while the review was open.
      try { await Versioning.flushQueue(); } catch (e) {}
      if (Versioning.pendingCount() > 0) return abort('Version history is still being written — try again in a moment.');
      if (Store.lastError && Store.lastError.key === 'version history' && Store.lastError.at > plan.createdAt)
        return abort('Version history could not be written (' + Store.lastError.message + '). Fix the shared folder, then Load back again.');
      const live = new Set(sess.data);
      const extras = [...(tpl.additionalColumns || []), ...(sess.extraColumns || [])];
      const fullOf = r => extras.length ? Reco._rowWithExtras(tpl, sess, r) : r;
      for (const x of picks) {
        if (!live.has(x.row)) return abort('Data changed while reviewing — Load back again.');
        const now = XlSchema.canon(x.desc, XlSchema.currentValue(x.desc, x.row, fullOf(x.row), sess), 'reco').c;
        if (now !== x.cLive) return abort('Data changed while reviewing — Load back again.');
      }
      const styles = new Map();
      const styleOf = d => { if (!styles.has(d.name)) styles.set(d.name, XlSchema.columnStyle(sess, d)); return styles.get(d.name); };
      const edits = picks.map(x => {
        const value = XlSchema.coerce(x.desc, x.E, x.liveRaw, styleOf(x.desc));
        if (x.desc.formats && value !== '' && !FMT.validate(value, x.desc.formats)) x.badges.push('formatWarning');
        return { row: x.row, col: x.col, value };
      });
      const pkSet = new Set(picks.filter(x => x.desc.versioned && x.pk).map(x => x.pk));
      const pulled = [];
      pkSet.forEach(pk => (plan.pulledByPk[pk] || []).forEach(d => pulled.push({ pk, col: d.col, value: d.value })));
      let res = { applied: 0, rows: 0, versions: {} };
      if (edits.length) {
        try {
          res = await Reco.applyEdits(tpl, sess, edits, { source: 'excel', historyFirst: true, schema: plan.schema,
            meta: { _src: 'excel:' + (plan.exportId || 'file'), _by: ExcelLink.user() }, pulled });
        } catch (e) {
          console.error('apply excel edits', e);
          ExcelLink._busy = false;
          App.openModal('Load back', '<div class="xl-err">Nothing was changed: the version history could not be written.<br><small>' + U.esc(e.message || e) + '</small></div>',
            '<button class="primary" onclick="App.closeModal()">OK</button>');
          return;
        }
      }
      // Record what was loaded (rebase), so the next Load back only shows new edits.
      const at = new Date().toISOString();
      const rebased = {}, dismissed = {};
      picks.forEach(x => { rebased[x.key] = x.E; });
      kept.forEach(x => { dismissed[x.key] = x.E; });
      const f = plan.file || {};
      const patch = {
        rebased, dismissed,
        importAppend: { at, by: ExcelLink.user(), fileSha256: f.sha256 || '', fileMtimeNs: f.mtimeNs || '',
          counts: { applied: picks.filter(x => x.cat === 'change').length, conflictsKept: kept.length, conflictsTaken: picks.filter(x => x.cat === 'conflict').length,
            problems: plan.problems.length, newRows: 0, pulled: pulled.length },
          applied: picks.slice(0, 5000).map(x => [x.rid, x.pk, x.col, x.liveRaw == null ? '' : String(x.liveRaw), XlSchema._plain(x.E)]) },
        lastImport: { at, by: ExcelLink.user(), sha256: f.sha256 || '', mtimeNs: f.mtimeNs || '', size: f.size || 0, count: picks.length }
      };
      await ExcelLink._updateManifest(tpl, plan, patch);
      ExcelLink._plan = null;
      try { AppState.save(); await AppState.flush(); } catch (e) {}
      const a = ExcelLink._active[tpl.id];
      if (a && a.exportId === plan.exportId) {
        a.loaded = { at, count: picks.length };
        if (a.status) a.status = Object.assign({}, a.status, { newSinceLastImport: false });
      }
      ExcelLink._busy = false;
      App.closeModal();
      if (plan.reRunOffset && res.applied) Reco.recalcOffsets();
      else App.navigate('reco');
      U.toast('Applied ' + picks.length + ' change' + (picks.length === 1 ? '' : 's') + ' to ' + new Set(picks.map(x => x.row)).size + ' row(s)', 'success');
      if (ExcelLink._watch) { ExcelLink._watch.lastPoll = 0; ExcelLink._tick(); }
    } finally { ExcelLink._busy = false; }
  },
  async _updateManifest(tpl, plan, patch) {
    if (!plan.exportId || (plan.head && plan.head._synthetic)) return;
    try {
      if (ExcelLink._has('excel_link_update_manifest')) {
        const r = await ExcelLink.api().excel_link_update_manifest(plan.exportId, patch);
        if (r && r.ok === false) throw ExcelLink._err(r);
        return;
      }
      const api = ExcelLink.api();
      if (!api || typeof api.read_file !== 'function' || typeof api.write_file !== 'function') return;
      const df = (plan.head && plan.head.dataFolder) || Versioning.folderFor(tpl);
      const path = 'reco_excel/' + Versioning._safe(df) + '/_links/' + plan.exportId + '.json';
      const t = await api.read_file(path);
      if (!t) return;
      const m = JSON.parse(t);
      m.rebased = Object.assign(m.rebased || {}, patch.rebased);
      m.dismissed = Object.assign(m.dismissed || {}, patch.dismissed);
      m.imports = (m.imports || []).concat([patch.importAppend]).slice(-50);
      m.lastImport = patch.lastImport;
      m.rev = (m.rev || 0) + 1;
      await api.write_file(path, JSON.stringify(m, null, 1));
    } catch (e) {
      console.error('excel link manifest update', e);
      U.toast('Changes applied, but the link record could not be updated (' + e.message + ')', 'error');
    }
  },

  /* ---------------- Excel links panel ---------------- */
  async openLinksPanel(filter) {
    const { tpl } = ExcelLink._ctx();
    if (!tpl) return;
    const tier = await ExcelLink.tier();
    ExcelLink._panelFilter = filter || ExcelLink._panelFilter || { who: 'mine', status: '' };
    let links = tier === 'P' ? await ExcelLink.listLinks(tpl) : [];
    const cfg = ExcelLink.cfg(tpl);
    const now = Date.now();
    const stale = l => {
      if (l.status !== 'open') return false;
      const age = now - new Date(l.exportedAt || 0).getTime();
      return age > cfg.staleDays * 86400000;
    };
    const fl = ExcelLink._panelFilter;
    const me = ExcelLink.user();
    links.sort((x, y) => String(y.exportedAt).localeCompare(String(x.exportedAt)));
    const counts = { open: 0, saved: 0, closed: 0, stale: 0 };
    links.forEach(l => {
      if (l.status === 'closed') counts.closed++; else counts.open++;
      if (l.status === 'open' && l.newSinceLastImport) counts.saved++;
      if (stale(l)) counts.stale++;
    });
    let shown = links.filter(l => fl.who !== 'mine' || l.exportedBy === me);
    if (fl.status === 'open') shown = shown.filter(l => l.status === 'open');
    if (fl.status === 'saved') shown = shown.filter(l => l.status === 'open' && l.newSinceLastImport);
    if (fl.status === 'closed') shown = shown.filter(l => l.status === 'closed');
    if (fl.status === 'stale') shown = shown.filter(stale);
    const chip = (k, label, n) => '<span class="tag' + (fl.status === k ? ' active' : '') + '" onclick="ExcelLink.openLinksPanel({who:\'' + fl.who + '\',status:\'' + (fl.status === k ? '' : k) + '\'})">' + label + ' (' + n + ')</span>';
    let h = '<div style="font-size:12px;">';
    if (tier !== 'P') h += '<div class="xl-warn">This launcher keeps no shared list of Excel links. Use <b>Load from file…</b> to load an edited workbook.</div>';
    h += '<div class="pill-row"><label class="inline"><input type="radio" name="xlWho"' + (fl.who === 'mine' ? ' checked' : '') + ' onchange="ExcelLink.openLinksPanel({who:\'mine\',status:\'' + fl.status + '\'})"> Mine</label>'
      + '<label class="inline"><input type="radio" name="xlWho"' + (fl.who !== 'mine' ? ' checked' : '') + ' onchange="ExcelLink.openLinksPanel({who:\'all\',status:\'' + fl.status + '\'})"> Everyone</label>'
      + chip('open', 'Open', counts.open) + chip('saved', 'Saved, not loaded', counts.saved) + chip('closed', 'Closed', counts.closed) + chip('stale', 'Stale', counts.stale) + '</div>';
    h += '<table class="xl-rv-table"><thead><tr><th>File</th><th>Created</th><th>Rows</th><th>Status</th><th>Last saved</th><th>Last import</th><th></th></tr></thead><tbody>';
    shown.forEach(l => {
      const id = U.jsq(l.exportId);
      const st = l.status === 'closed' ? 'closed' : !l.exists ? 'file missing' : l.otherPc ? 'other PC' : l.newSinceLastImport ? '<b>saved, not loaded</b>' : l.savedSinceExport ? 'loaded' : 'not saved yet';
      const li = l.lastImport ? U.esc((l.lastImport.by || '') + ' ' + ExcelLink._when(l.lastImport.at) + (l.lastImport.count != null ? ' · ' + l.lastImport.count : '')) : '';
      h += '<tr><td>' + U.esc(l.fileName) + (l.ownerFile ? ' <span class="xl-badge" title="open in Excel">open</span>' : '') + '</td><td>' + U.esc((l.exportedBy || '') + ' ' + ExcelLink._when(l.exportedAt))
        + '</td><td>' + (l.rows != null ? l.rows : '') + '</td><td>' + st + (stale(l) ? ' <span class="xl-badge">stale</span>' : '') + '</td><td>' + U.esc(l.savedSinceExport ? ExcelLink._when(l.mtime) : '') + '</td><td>' + li + '</td><td style="white-space:nowrap;">';
      if (l.status !== 'closed' && l.exists && !l.otherPc) {
        h += '<button class="small primary" onclick="App.closeModal(); ExcelLink._loadFromPanel(\'' + id + '\',' + (l.ownerFile && l.exportedBy !== me ? 'true' : 'false') + ')">Load back</button>'
          + '<button class="small" onclick="ExcelLink.openInExcel(\'' + id + '\')">Open</button>'
          + '<button class="small" onclick="ExcelLink.reveal(\'' + id + '\')">Show in folder</button>'
          + '<button class="small" onclick="ExcelLink.saveCopy(\'' + id + '\')">Save a copy…</button>';
      }
      if (l.status !== 'closed') h += '<button class="small" onclick="ExcelLink._closeFromPanel(\'' + id + '\')">Close link</button>';
      h += '</td></tr>';
    });
    h += '</tbody></table>';
    if (!shown.length) h += '<div class="empty">No Excel links' + (fl.who === 'mine' ? ' of yours' : '') + '.</div>';
    h += '</div>';
    App.openModal('📗 Excel links — ' + tpl.name, h,
      (counts.stale ? '<button style="margin-right:auto;" onclick="ExcelLink._closeStale()">Close stale links</button>' : '')
      + '<button onclick="App.closeModal(); ExcelLink.pickAndLoad()">Load from file…</button><button class="primary" onclick="App.closeModal()">Done</button>');
    const m = document.querySelector('#appModal .modal');
    if (m) { m.style.maxWidth = '1100px'; m.dataset._xlWidened = '1'; }
  },
  _loadFromPanel(exportId, othersOpen) {
    if (othersOpen) U.toast('Someone has this workbook open in Excel — only their last save is loaded', 'error');
    ExcelLink.load({ exportId });
  },
  async _closeFromPanel(exportId) {
    await ExcelLink.closeLink(exportId, false);
    ExcelLink.openLinksPanel();
  },
  async _closeStale() {
    const { tpl } = ExcelLink._ctx();
    const cfg = ExcelLink.cfg(tpl);
    const links = await ExcelLink.listLinks(tpl);
    const now = Date.now();
    const stale = links.filter(l => l.status === 'open' && now - new Date(l.exportedAt || 0).getTime() > cfg.staleDays * 86400000 && !l.newSinceLastImport);
    if (!stale.length) { U.toast('No stale links without unloaded saves', 'success'); return; }
    if (!confirm('Close ' + stale.length + ' stale link(s)? Their workbooks are deleted.')) return;
    for (const l of stale) { try { await ExcelLink._call('excel_link_close', l.exportId, true); } catch (e) {} }
    U.toast('Closed ' + stale.length + ' link(s)', 'success');
    ExcelLink.openLinksPanel();
  }
};

/* ================================================================
   MODULE 4 — APP STATE (Updated to Nest Flat Data)
   ================================================================ */
const AppState = {
  currentPage: 'home',
  recoTemplates: [],
  recoSessions: {},
  activeRecoId: null,
  aegTemplates: [],
  aegMaster: [],
  aegSettings: { spSiteUrl:'', listMaster:'Accounts_Master_entry', listTemplates:'Templates_entry', autoSync:false, currentUser:'' },
  entryHistory: {},
  docNumberMaster: {},
  manualOffsetMaster: {},
  correctionMaster: {},
  pendingSpecialJV: {},
  groupMaster: {},
  attachmentMaster: {},
  commentMaster: {},
  customMasters: [],
  activeSection: 'action',
  activeSubSection: null,
  _activeReport: null,
  _correctionCol: null,

  /* Who is using the app. Comes from the launcher (current_username) and is
     kept per session — NOT in aegSettings.json, which is shared by everyone
     on the network folder. */
  currentUser: '',

  PERSIST_KEYS: ['recoTemplates','aegTemplates','aegMaster','aegSettings','recoSessions','entryHistory',
                 'docNumberMaster','manualOffsetMaster','correctionMaster','pendingSpecialJV',
                 'groupMaster','attachmentMaster','commentMaster','customMasters'],
  SAVE_DELAY: 250,
  _snap: {},             // key -> serialised text last loaded/saved
  _saveTimer: null,
  _saveWaiters: [],

  /* Debounced save. Many UI handlers call this on every change; bursts are
     coalesced and only keys whose content actually changed are written.
     Returns a promise that resolves once the data has reached the disk. */
  save() {
    clearTimeout(AppState._saveTimer);
    AppState._saveTimer = setTimeout(() => { AppState.flush(); }, AppState.SAVE_DELAY);
    return new Promise(res => AppState._saveWaiters.push(res));
  },

  /* Write every changed key now and wait for all pending writes. */
  async flush() {
    clearTimeout(AppState._saveTimer);
    AppState._saveTimer = null;
    const waiters = AppState._saveWaiters.splice(0);
    try {
      AppState.PERSIST_KEYS.forEach(key => {
        if (Store.readOnlyKeys[key]) return;
        let text;
        try { text = Store.serialize(key, AppState[key]); }
        catch (e) { console.error('serialize failed for ' + key, e); return; }
        if (text === AppState._snap[key]) return;
        AppState._snap[key] = text;
        Store.save(key, AppState[key], text);
      });
      await Promise.all([Store.idle(), Versioning.idle()]);
    } finally {
      waiters.forEach(w => { try { w(); } catch (e) {} });
    }
  },

  pendingCount() {
    return (AppState._saveTimer ? 1 : 0) + Store.pendingCount() + Versioning.pendingCount();
  },

  async load() {
    const d = await Store.loadAll();

    AppState.recoTemplates       = d.recoTemplates || [];
    AppState.aegTemplates        = d.aegTemplates || [];
    AppState.aegMaster           = d.aegMaster || [];
    AppState.aegSettings         = Object.assign({}, AppState.aegSettings, d.aegSettings || {});
    AppState.recoSessions        = d.recoSessions || {};
    AppState.entryHistory        = d.entryHistory || {};
    AppState.docNumberMaster     = d.docNumberMaster || {};
    AppState.manualOffsetMaster  = d.manualOffsetMaster || {};
    AppState.correctionMaster    = d.correctionMaster || {};
    AppState.pendingSpecialJV = d.pendingSpecialJV || {};
    AppState.groupMaster      = d.groupMaster || {};
    AppState.attachmentMaster = d.attachmentMaster || {};
    AppState.commentMaster    = d.commentMaster || {};
    AppState.customMasters    = d.customMasters || [];

    // Snapshot what is on disk so the first save only writes real changes.
    AppState.PERSIST_KEYS.forEach(k => {
      try { AppState._snap[k] = Store.serialize(k, AppState[k]); } catch (e) { AppState._snap[k] = null; }
    });

    if (!AppState.aegTemplates.length) {
      AppState.aegTemplates = [AEG.makeDefaultTemplate('Default DR/CR')];
    }

    // Identity for attachments / comments
    let who = '';
    if (Store._hasApi() && typeof window.pywebview.api.current_username === 'function') {
      try { who = await window.pywebview.api.current_username(); } catch (e) {}
    }
    if (!who) { try { who = localStorage.getItem('reco_user') || ''; } catch (e) {} }
    AppState.currentUser = String(who || '').trim();
  }
  
};

/* ================================================================
   MODULE 5 — APP CONTROLLER
   ================================================================ */
const App = {
  /* Back to the Automation Hub — flush pending saves first so nothing is lost. */
  async returnToHub() {
    if (typeof ExcelLink !== 'undefined' && !ExcelLink.confirmLeave()) return;
    try { await AppState.flush(); } catch (e) { console.error('flush before hub failed', e); }
    if (Store._hasApi() && typeof window.pywebview.api.return_to_hub === 'function') {
      window.pywebview.api.return_to_hub();
    } else {
      U.toast('Not running inside the Automation Hub launcher', 'error');
    }
  },
  navigate(page, param) {
    AppState.currentPage = page;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page===page));
    // Body class for full-height reco shell
    document.body.classList.toggle('reco-fullheight', page === 'reco');
    const main = document.getElementById('appMain');
    if (page === 'home') Home.render(main);
    else if (page === 'reco') Reco.render(main, param);
    else if (page === 'aeg') AEG.render(main);
  },
  openModal(title, bodyHtml, footerHtml) {
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalBody').innerHTML = bodyHtml;
    document.getElementById('appModalFooter').innerHTML = footerHtml || '';
    document.getElementById('appModal').classList.add('show');
  },
  async ensureCurrentUser() {
    if (AppState.currentUser) return AppState.currentUser;
    let osUser = '';
    if (Store._hasApi() && window.pywebview.api.current_username) {
      try { osUser = await window.pywebview.api.current_username(); } catch(e) {}
    }
    if (osUser) { AppState.currentUser = osUser; return osUser; }
    // Plain browser / old launcher: ask once and remember on this machine only.
    const name = prompt('Enter your name (used for attachments/comments):', '');
    AppState.currentUser = (name && name.trim()) || 'unknown';
    try { localStorage.setItem('reco_user', AppState.currentUser); } catch(e) {}
    return AppState.currentUser;
  },

  closeModal() {
    // A Special JV iframe may still be listening; drop its handler with the modal.
    if (typeof SpecialJV !== 'undefined' && SpecialJV._activeHandler) SpecialJV._detach();
    const xm = document.querySelector('#appModal .modal');
    if (xm && xm.dataset._xlWidened) { xm.style.maxWidth = ''; delete xm.dataset._xlWidened; }
    document.getElementById('appModal').classList.remove('show');
  },
  exportBackup() {
    const data = {
      version: 4,
      exportedAt: new Date().toISOString(),
      recoTemplates: AppState.recoTemplates,
      aegTemplates: AppState.aegTemplates,
      aegMaster: AppState.aegMaster,
      pendingSpecialJV: AppState.pendingSpecialJV,
      aegSettings: AppState.aegSettings,
      recoSessions: AppState.recoSessions,
      entryHistory: AppState.entryHistory,
      docNumberMaster: AppState.docNumberMaster,
      manualOffsetMaster: AppState.manualOffsetMaster,
      correctionMaster: AppState.correctionMaster,
      groupMaster: AppState.groupMaster,
      attachmentMaster: AppState.attachmentMaster,
      customMasters: AppState.customMasters,
      commentMaster: AppState.commentMaster
    };
    return U.download('reco_suite_backup_'+U.todayStr()+'.json', JSON.stringify(data,null,2), 'application/json');
  },

  _wireRecoHotkeys() {
    if (App._hotkeysWired) return;
    App._hotkeysWired = true;
    document.addEventListener('keydown', (e) => {
      if (AppState.currentPage !== 'reco') return;
      // Ctrl/Cmd + F → Find & Replace
      if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (typeof FindReplace !== 'undefined' && FindReplace.open) FindReplace.open();
      }
    });
  },

  importBackup(ev) {
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (!d || typeof d !== 'object' || !(d.recoTemplates || d.aegTemplates || d.recoSessions || d.templates)) {
          U.toast('This file is not a Reco backup', 'error'); return;
        }
        const when = d.exportedAt ? ' taken ' + String(d.exportedAt).replace('T', ' ').substring(0, 16) : '';
        if (!confirm('Restore this backup' + when + '?\n\nIt REPLACES the templates, sessions, masters and entry history shared by everyone using this folder.')) return;
        if (d.recoTemplates) AppState.recoTemplates = d.recoTemplates;
        if (d.aegTemplates) AppState.aegTemplates = d.aegTemplates;
        if (d.aegMaster) AppState.aegMaster = d.aegMaster;
        if (d.aegSettings) AppState.aegSettings = Object.assign(AppState.aegSettings, d.aegSettings);
        if (d.recoSessions) AppState.recoSessions = d.recoSessions;
        if (d.entryHistory) AppState.entryHistory = d.entryHistory;
        if (d.pendingSpecialJV) AppState.pendingSpecialJV = d.pendingSpecialJV;
        if (d.docNumberMaster) AppState.docNumberMaster = d.docNumberMaster;
        if (d.manualOffsetMaster) AppState.manualOffsetMaster = d.manualOffsetMaster;
        if (d.customMasters) AppState.customMasters = d.customMasters;
        if (d.correctionMaster) AppState.correctionMaster = d.correctionMaster;
        if (d.groupMaster) AppState.groupMaster = d.groupMaster;
        if (d.attachmentMaster) AppState.attachmentMaster = d.attachmentMaster;
        if (d.commentMaster) AppState.commentMaster = d.commentMaster;
        if (d.version === 2 && d.templates) AppState.aegTemplates = d.templates;
        if (d.version === 2 && d.master) AppState.aegMaster = d.master;
        AppState.flush().then(() => U.toast('Restore complete','success'));
        App.navigate('home');
      } catch(er) { U.toast('Invalid backup','error'); }
    };
    r.readAsText(file);
    ev.target.value = '';
  }
};

/* ================================================================
   MODULE 6 — HOME PAGE
   ================================================================ */

const Home = {
  render(root) {
    document.getElementById('navReco').style.display = 'none';
    let h = '';

    // Stats
    h += '<div class="summary-bar">';
    h += '<div class="item">Reco Templates: <b>' + AppState.recoTemplates.length + '</b></div>';
    h += '<div class="item">AEG Templates: <b>' + AppState.aegTemplates.length + '</b></div>';
    h += '<div class="item">Accounts Master: <b>' + AppState.aegMaster.length + '</b></div>';
    let totalEntries = 0;
    Object.keys(AppState.entryHistory||{}).forEach(k => { totalEntries += (AppState.entryHistory[k]||[]).length; });
    h += '<div class="item">Generated Entries: <b>' + totalEntries + '</b></div>';
    let pendingJV = 0;
    Object.keys(AppState.pendingSpecialJV||{}).forEach(k => { pendingJV += (AppState.pendingSpecialJV[k]||[]).length; });
    if (pendingJV) h += '<div class="item" style="color:var(--badge-amber);">⚡ Pending Special JV: <b>' + pendingJV + '</b></div>';
    h += '</div>';

    // Reco templates as cards
    h += '<div class="panel"><h2>Reconciliation Templates <span>';
    h += '<button class="primary small" onclick="RecoTemplate.create()">+ New Template</button>';
    h += '</span></h2>';
    h += '<div class="card-grid">';
    AppState.recoTemplates.forEach(t => {
      const pendCnt = (AppState.pendingSpecialJV[t.id]||[]).length;
      h += '<div class="card" onclick="RecoTemplate.open(\'' + U.jsq(t.id) + '\')">';
      h += '<h3>' + U.esc(t.name) + (pendCnt ? ' <span class="badge fc">⚡ ' + pendCnt + '</span>' : '') + '</h3>';
      h += '<p>' + U.esc(t.description || 'No description') + '</p>';
      h += '<div class="card-badges" style="margin-top:8px;">';
      h += '<span class="badge ' + (t.currencyMode==='AED'?'aed':'fc') + '">' + (t.currencyMode==='AED'?'AED':'FC') + '</span>';
      if (t.aggregate) h += '<span class="badge general">Aggregate</span>';
      if (t.enableReporting) h += '<span class="badge specific">Reports</span>';
      if (t.aegIntegration && t.aegIntegration.enabled) h += '<span class="badge exch">AEG</span>';
      h += '</div>';
      h += '<div style="margin-top:8px;">';
      h += '<button class="small" onclick="event.stopPropagation(); RecoTemplate.edit(\'' + U.jsq(t.id) + '\')">Edit</button>';
      h += '<button class="small" onclick="event.stopPropagation(); RecoTemplate.duplicate(\'' + U.jsq(t.id) + '\')">Duplicate</button>';
      h += '<button class="small danger" onclick="event.stopPropagation(); RecoTemplate.remove(\'' + U.jsq(t.id) + '\')">Delete</button>';
      h += '</div>';
      h += '</div>';
    });
    h += '<div class="card add-card" onclick="RecoTemplate.create()">+ New Template</div>';
    h += '</div></div>';

    // ====== MASTERS CARD GRID ======
    h += '<div class="panel"><h2>Masters <span>';
    h += '<button class="small" onclick="Home.openCreateMaster()">+ Create New Master</button>';
    h += '</span></h2>';
    h += '<div class="card-grid">';
    // Accounts Master card (existing AEG master)
    h += '<div class="card" onclick="App.navigate(\'aeg\'); setTimeout(()=>AEG.switchTab(\'master\'),50)">';
    h += '<h3>📒 Accounts Master</h3>';
    h += '<p>' + AppState.aegMaster.length + ' entries · Reference, RC, Nominal, SubNominal, Analysis Key, LOB</p>';
    h += '<div style="margin-top:8px;">';
    h += '<button class="small" onclick="event.stopPropagation(); App.navigate(\'aeg\'); setTimeout(()=>AEG.switchTab(\'master\'),50)">Edit</button>';
    h += '</div></div>';

    // Future: list any user-created custom masters from Store (placeholder for now)
    (AppState.customMasters || []).forEach((cm, idx) => {
      h += '<div class="card" onclick="Home.editCustomMaster(' + idx + ')">';
      h += '<h3>' + U.esc(cm.icon || '📋') + ' ' + U.esc(cm.name) + '</h3>';
      h += '<p>' + (cm.rows||[]).length + ' rows · ' + (cm.columns||[]).length + ' columns</p>';
      h += '<div style="margin-top:8px;">';
      h += '<button class="small" onclick="event.stopPropagation(); Home.editCustomMaster(' + idx + ')">Edit</button>';
      h += '<button class="small danger" onclick="event.stopPropagation(); Home.deleteCustomMaster(' + idx + ')">Delete</button>';
      h += '</div></div>';
    });
    h += '<div class="card add-card" onclick="Home.openCreateMaster()">+ Create New Master</div>';
    h += '</div></div>';

    // Special JV registry card
    if (SpecialJV.list().length) {
      h += '<div class="panel"><h2>Available Special JVs <span class="text-muted">(loaded from special_jv_mapping/)</span></h2>';
      h += '<div class="card-grid">';
      SpecialJV.list().forEach(j => {
        h += '<div class="card">';
        h += '<h3>⚡ ' + U.esc(j.displayName || j.ref) + '</h3>';
        h += '<p>Ref: <code>' + U.esc(j.ref) + '</code> · ' + (j.inputColumns||[]).length + ' inputs</p>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    // Document number lookup (unchanged)
    h += '<div class="panel"><h2>Document Number Lookup <span class="text-muted">(search across all templates)</span></h2>';
    h += '<div class="toolbar"><input type="text" id="homeDocSearch" placeholder="Enter document number to find generated entries…" style="max-width:280px;" />';
    h += '<button class="primary small" onclick="Home.searchDocNumber()">Search</button></div>';
    h += '<div id="homeDocSearchResults"></div>';
    h += '</div>';

    root.innerHTML = h;
  },

  searchDocNumber() {
    const q = (document.getElementById('homeDocSearch').value || '').trim();
    const out = document.getElementById('homeDocSearchResults');
    if (!q) { out.innerHTML = ''; return; }
    let h = '';
    let found = false;
    Object.keys(AppState.docNumberMaster || {}).forEach(tplId => {
      const dnMap = AppState.docNumberMaster[tplId] || {};
      Object.keys(dnMap).forEach(dn => {
        if (dn.toLowerCase().includes(q.toLowerCase())) {
          const accountingId = dnMap[dn];
          const tpl = AppState.recoTemplates.find(t => t.id === tplId);
          h += '<div class="card" onclick="Home.openEntryForDoc(\''+U.jsq(tplId)+'\',\''+U.jsq(accountingId)+'\')">';
          h += '<h3>Doc# ' + U.esc(dn) + '</h3>';
          h += '<p>Template: ' + U.esc(tpl ? tpl.name : '?') + '</p>';
          h += '<p>Accounting ID: <b>' + U.esc(accountingId) + '</b></p>';
          h += '</div>';
          found = true;
        }
      });
    });
    out.innerHTML = found ? '<div class="card-grid" style="margin-top:8px;">'+h+'</div>' : '<div class="empty" style="margin-top:8px;">No matches found.</div>';
  },

  openEntryForDoc(tplId, accountingId) {
    AppState.activeRecoId = tplId;
    AppState._jumpToEntry = accountingId;
    document.getElementById('navReco').style.display = '';
    App.navigate('reco', tplId);
  },

  /* ===== Custom Masters ===== */
  openCreateMaster() {
    const name = prompt('Master name (e.g. Vendors, Cost Centers):');
    if (!name) return;
    const cols = prompt('Columns (comma-separated, e.g. Code,Name,Region):', 'Code,Name');
    if (!cols) return;
    AppState.customMasters = AppState.customMasters || [];
    AppState.customMasters.push({
      name: name.trim(),
      icon: '📋',
      columns: cols.split(',').map(s => s.trim()).filter(Boolean),
      rows: []
    });
    AppState.save();
    App.navigate('home');
  },
  editCustomMaster(idx) {
    const cm = (AppState.customMasters||[])[idx];
    if (!cm) return;
    let h = '<div class="toolbar"><button class="small primary" onclick="Home._cmAddRow('+idx+')">+ Row</button></div>';
    h += '<div style="overflow:auto; max-height:400px;"><table><thead><tr>';
    cm.columns.forEach(c => h += '<th>'+U.esc(c)+'</th>');
    h += '<th></th></tr></thead><tbody id="cmTblBody">';
    (cm.rows||[]).forEach((r, ri) => {
      h += '<tr>';
      cm.columns.forEach(c => {
        h += '<td><input type="text" value="'+U.escAttr(r[c]||'')+'" oninput="AppState.customMasters['+idx+'].rows['+ri+'][\''+U.jsq(c)+'\']=this.value" /></td>';
      });
      h += '<td><button class="small danger" onclick="AppState.customMasters['+idx+'].rows.splice('+ri+',1); AppState.save(); Home.editCustomMaster('+idx+')">×</button></td></tr>';
    });
    h += '</tbody></table></div>';
    App.openModal('Edit Master: ' + cm.name, h, '<button class="primary" onclick="AppState.save(); App.closeModal();">Save & Close</button>');
  },
  _cmAddRow(idx) {
    const cm = AppState.customMasters[idx];
    const blank = {}; cm.columns.forEach(c => blank[c]='');
    cm.rows = cm.rows || [];
    cm.rows.push(blank);
    AppState.save();
    Home.editCustomMaster(idx);
  },
  deleteCustomMaster(idx) {
    if (!confirm('Delete this master?')) return;
    AppState.customMasters.splice(idx, 1);
    AppState.save();
    App.navigate('home');
  }
};


/* ================================================================
   MODULE 7 — RECO TEMPLATE CREATION/EDITING
   ================================================================ */
const RecoTemplate = {
  _editing: null,
  _isNew: false,
  _step: 1,
  _sampleHeaders: [],
  _sampleData: [],

defaultTemplate() {
    return {
      id: U.uid(),
      name: '',
      description: '',
      columns: [],
      primaryKeys: [],
      currencyMode: 'AED',
      currencyColumn: '',
      exchangeMode: 'asRequired',
      exchangeColumn: '',
      exchangeMasterRef: 'Exchange',
      recoAccountRef: '',
      valueColumn: '',
      docNumberColumn: '',
      aggregate: false,
      aggregateBy: [],
      editableColumnConfig: {},
      toleranceMode: 'amount',
      toleranceValue: 0,
      enableReporting: false,
      enableCorrections: false,
      groupsEnabled: false,
      displayColumns: [],
      editableColumns: [], // <-- Added tracking for editable columns
      additionalColumns: [],
      pivotEnabled: false,
      pivotValueCol: '',
      pivotRowCols: [],
      pivotColCols: [],
      corrections: {},
      aegIntegration: {
        enabled: false,
        aegTemplateId: '',
        keywordColumn: '',
        keywordValues: '',
        postEntryColumn: '',
        postEntryValue: '',
        fromAccountOverride: '', // <-- Added AEG override
        toAccountOverride: ''    // <-- Added AEG override
      },
      reports: [],
      savedFilterSets: []
    };
  },

  create() {
    RecoTemplate._editing = RecoTemplate.defaultTemplate();
    RecoTemplate._isNew = true;
    RecoTemplate._isQuickEdit = false;
    RecoTemplate._step = 1;
    RecoTemplate._sampleHeaders = [];
    RecoTemplate._sampleData = [];
    RecoTemplate.renderEditor();
  },
  _renderAdditionalColumnsEditor(t) {
    const cols = t.columns;
    const masterCatalog = Masters.catalog(t.id);
    let h = '<div class="editor-section"><div class="section-head"><strong>Additional Columns <span class="text-muted">(tags, formulas, master lookups, cascade)</span></strong>';
    h += '<button class="small primary" onclick="RecoTemplate.addExtraCol()">+ Add</button></div>';

    if (!(t.additionalColumns||[]).length) {
      h += '<div class="empty">No additional columns yet.</div></div>';
      return h;
    }

    h += '<div class="help">Order matters for cascading: each column can reference columns declared <b>above</b> it via <code>{ColName}</code> in formulas, or via the master-match dropdown.</div>';
    h += '<table><thead><tr><th style="width:30px">↕</th><th>Name</th><th>Type</th><th>Configuration</th><th></th></tr></thead><tbody>';

    (t.additionalColumns||[]).forEach((ac,i) => {
      h += '<tr>';
      h += '<td><button class="small" onclick="RecoTemplate.moveExtra('+i+',-1)">↑</button>';
      h += '<button class="small" onclick="RecoTemplate.moveExtra('+i+',1)">↓</button></td>';
      h += '<td><input type="text" value="'+U.escAttr(ac.name)+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].name=this.value" /></td>';
      h += '<td><select onchange="RecoTemplate._setExtraType('+i+',this.value)">';
      [
        ['custom',         'Free text'],
        ['dropdown',       'Dropdown'],
        ['formula',        'Formula'],
        ['master_lookup',  'Master lookup'],
        ['master',         'Master lookup (legacy: Accounts only)']
      ].forEach(o => { h += '<option value="'+o[0]+'"'+(ac.type===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
      h += '</select></td>';
      h += '<td>'+RecoTemplate._extraConfigCell(t, ac, i, masterCatalog)+'</td>';
      h += '<td><button class="small danger" onclick="RecoTemplate._editing.additionalColumns.splice('+i+',1); RecoTemplate.renderEditor()">×</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    return h;
  },
  _editCfg(t, colName) {
    t.editableColumnConfig = t.editableColumnConfig || {};
    return t.editableColumnConfig[colName] = t.editableColumnConfig[colName] || { editType:'free' };
  },

  /* Template panel "Excel view & Excel link": defaults for 📗 Edit in Excel
     (tpl.excelLink) and the in-app Excel view (tpl.excelView). */
  _renderExcelPanel(t) {
    const L = Object.assign({}, ExcelLink.LINK_DEFAULTS, t.excelLink || {});
    const V = t.excelView || {};
    const sel = (group, key, cur, opts) => '<select onchange="RecoTemplate._setXl(\'' + group + '\',\'' + key + '\',this.value)">'
      + opts.map(o => '<option value="' + U.escAttr(o[0]) + '"' + (String(cur) === String(o[0]) ? ' selected' : '') + '>' + U.esc(o[1]) + '</option>').join('') + '</select>';
    let h = '<div class="editor-section"><div class="section-head"><strong>Excel view &amp; Excel link</strong></div>';
    h += '<div class="help">Defaults for <b>📗 Edit in Excel</b> (a real workbook with dropdowns that is loaded back after you save it in Excel) and for the in-app Excel view. Users can still change them when exporting.</div>';
    h += '<div class="grid-3" style="margin-top:8px;">';
    h += '<label class="field"><span class="label-text">Rows exported</span>' + sel('excelLink', 'scope', L.scope, [['view', 'Shown in Reco'], ['open', 'Open rows'], ['selected', 'Selected rows'], ['all', 'All rows']]) + '</label>';
    h += '<label class="field"><span class="label-text">Columns exported</span>' + sel('excelLink', 'columns', L.columns, [['asShown', 'As shown'], ['allTemplate', 'All template columns']]) + '</label>';
    h += '<label class="field"><span class="label-text">Protection</span>' + sel('excelLink', 'protect', L.protect, [['soft', 'Guarded (sorting works)'], ['locked', 'Locked sheet'], ['none', 'None']]) + '</label>';
    h += '<label class="field"><span class="label-text">Date format in Excel</span>' + sel('excelLink', 'dateFormat', L.dateFormat, [['dd-mmm-yyyy', '06-Oct-2026'], ['dd/mm/yyyy', '06/10/2026'], ['yyyy-mm-dd', '2026-10-06']]) + '</label>';
    h += '<label class="field"><span class="label-text">Save workbooks to</span>' + sel('excelLink', 'area', L.area, [['shared', 'Shared folder'], ['local', 'This PC']]) + '</label>';
    h += '<label class="field"><span class="label-text">Stale after (days)</span><input type="number" min="1" max="365" value="' + U.escAttr(L.staleDays) + '" onchange="RecoTemplate._setXl(\'excelLink\',\'staleDays\',Math.max(1, Math.min(365, parseInt(this.value, 10) || 7)))"></label>';
    h += '</div>';
    const ro = (t.columns || []).filter(c => !(t.editableColumns || []).includes(c.name));
    if (ro.length) {
      h += '<div class="help" style="margin-top:8px;">Identity columns — a row whose values here change in Excel (sorted or pasted over) is not loaded. Leave empty for automatic (keys, value and document number).</div><div>';
      ro.forEach(c => {
        const on = (L.fpCols || []).includes(c.name);
        h += '<label class="inline"><input type="checkbox"' + (on ? ' checked' : '') + ' onchange="RecoTemplate._toggleFp(\'' + U.jsq(c.name) + '\',this.checked)"> ' + U.esc(c.label || c.name) + '</label>';
      });
      h += '</div>';
    }
    h += '<div class="grid-3" style="margin-top:10px;">';
    h += '<label class="field"><span class="label-text">Excel view: who can edit</span>' + sel('excelView', 'editScope', V.editScope || 'template',
      [['template', 'Editable columns only'], ['allStandard', 'All standard columns'], ['readonly', 'Read-only']]) + '</label>';
    h += '<label class="field"><span class="label-text">Key columns</span>' + sel('excelView', 'allowPkEdit', V.allowPkEdit ? 'true' : 'false',
      [['false', 'Read-only (recommended)'], ['true', 'Editable']]) + '</label>';
    h += '</div>';
    const meta = (typeof Reco !== 'undefined' && Array.isArray(Reco.XL_OPTION_META)) ? Reco.XL_OPTION_META.filter(m => m.key !== 'editScope' && m.key !== 'allowPkEdit') : [];
    if (meta.length) {
      const defs = Reco.XL_DEFAULTS || {};
      h += '<details style="margin-top:8px;"><summary class="help" style="cursor:pointer;">More Excel view defaults (each user can override them with ⚙ View)</summary><div class="grid-3" style="margin-top:6px;">';
      meta.forEach(m => {
        const cur = V[m.key] != null ? V[m.key] : defs[m.key];
        let ctl;
        if (m.type === 'bool') ctl = sel('excelView', m.key, cur ? 'true' : 'false', [['true', 'Yes'], ['false', 'No']]);
        else if (m.type === 'number') ctl = '<input type="number"' + (m.min != null ? ' min="' + m.min + '"' : '') + (m.max != null ? ' max="' + m.max + '"' : '') + ' value="' + U.escAttr(cur == null ? '' : cur) + '" onchange="RecoTemplate._setXl(\'excelView\',\'' + U.jsq(m.key) + '\',this.value===\'\'?null:Number(this.value))">';
        else ctl = sel('excelView', m.key, cur, (m.values || []).map(v => Array.isArray(v) ? v : [v, v]));
        h += '<label class="field"><span class="label-text">' + U.esc(m.label || m.key) + '</span>' + ctl + '</label>';
      });
      h += '</div></details>';
    }
    h += '</div>';
    return h;
  },
  _setXl(group, key, value) {
    const t = RecoTemplate._editing;
    if (!t) return;
    t[group] = Object.assign({}, t[group] || {});
    if (value === 'true') value = true;
    else if (value === 'false') value = false;
    else if (typeof value === 'string' && /^-?\d+$/.test(value) && group === 'excelView') value = Number(value);
    if (value == null || value === '') delete t[group][key];
    else t[group][key] = value;
  },
  _toggleFp(name, on) {
    const t = RecoTemplate._editing;
    if (!t) return;
    t.excelLink = Object.assign({}, t.excelLink || {});
    const set = new Set(t.excelLink.fpCols || []);
    if (on) set.add(name); else set.delete(name);
    t.excelLink.fpCols = Array.from(set);
  },
  _renderEditTypeSelect(t, colName) {
    const cfg = RecoTemplate._editCfg(t, colName);
    const safe = U.jsq(colName);
    let h = '<select onchange="RecoTemplate._setEditType(\''+safe+'\',this.value)">';
    [
      ['free',     'Free text'],
      ['dropdown', 'Dropdown (strict)'],
      ['datalist', 'Dropdown w/ manual override']
    ].forEach(o => { h += '<option value="'+o[0]+'"'+(cfg.editType===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
    h += '</select>';
    return h;
  },

  _setEditType(colName, type) {
    const t = RecoTemplate._editing;
    const cfg = RecoTemplate._editCfg(t, colName);
    cfg.editType = type;
    if (type === 'dropdown' || type === 'datalist') {
      cfg.optionsSource = cfg.optionsSource || 'manual';
      cfg.manualOptions = cfg.manualOptions || [];
      cfg.masterCfg = cfg.masterCfg || { source:'accounts', field:'Reference' };
    }
    RecoTemplate.renderEditor();
  },

  _renderEditTypeConfig(t, colName) {
    const cfg = RecoTemplate._editCfg(t, colName);
    if (cfg.editType !== 'dropdown' && cfg.editType !== 'datalist') {
      return '<span class="text-muted">—</span>';
    }
    const safe = U.jsq(colName);
    const masters = Masters.catalog(t.id);
    let h = '';
    h += '<label class="inline">Source: <select onchange="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].optionsSource=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="manual"'+(cfg.optionsSource==='manual'?' selected':'')+'>Manual list</option>';
    h += '<option value="master"'+(cfg.optionsSource==='master'?' selected':'')+'>From master column</option>';
    h += '</select></label>';
    if (cfg.optionsSource === 'master') {
      const masterCols = cfg.masterCfg && cfg.masterCfg.source ? Masters.columns(cfg.masterCfg.source, t.id) : [];
      h += '<div style="display:flex; gap:4px; margin-top:4px; flex-wrap:wrap;">';
      h += '<select onchange="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].masterCfg.source=this.value; RecoTemplate.renderEditor()">';
      h += '<option value="">— master —</option>';
      masters.forEach(m => { h += '<option value="'+U.escAttr(m.id)+'"'+(cfg.masterCfg && cfg.masterCfg.source===m.id?' selected':'')+'>'+U.esc(m.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].masterCfg.field=this.value">';
      h += '<option value="">— field —</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.masterCfg && cfg.masterCfg.field===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '</div>';
    } else {
      h += '<input type="text" placeholder="opt1, opt2, opt3" value="'+U.escAttr((cfg.manualOptions||[]).join(', '))+'" oninput="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].manualOptions=this.value.split(\',\').map(s=>s.trim()).filter(Boolean)" style="margin-top:4px;" />';
    }
    return h;
  },


  _setExtraType(i, type) {
    const ac = RecoTemplate._editing.additionalColumns[i];
    ac.type = type;
    // Init defaults per type
    if (type === 'master_lookup') {
      ac.masterCfg = ac.masterCfg || { source: 'accounts', matchColumn: '', matchKey: 'Reference', returnKey: 'RC' };
    }
    if (type === 'dropdown') {
      ac.optionsSource = ac.optionsSource || 'manual';
      ac.options = ac.options || [];
      ac.optionsMasterCfg = ac.optionsMasterCfg || { source: 'accounts', field: 'Reference' };
    }
    RecoTemplate.renderEditor();
  },

  moveExtra(i, dir) {
    const arr = RecoTemplate._editing.additionalColumns;
    const j = i + dir; if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    RecoTemplate.renderEditor();
  },

  _extraConfigCell(t, ac, i, masterCatalog) {
    const cols = t.columns;
    const earlierExtras = (t.additionalColumns||[]).slice(0, i); // columns above this one
    const allRefCols = cols.map(c => ({val:c.name,label:c.label||c.name})).concat(earlierExtras.map(e => ({val:e.name, label:e.name+' (extra)'})));

    if (ac.type === 'custom') {
      return '<span class="text-muted">Free-text input per row</span>';
    }

    if (ac.type === 'formula') {
      return '<input type="text" placeholder="e.g. {Col1} - {Col2} or LEFT({Desc},5)" value="'+U.escAttr(ac.formula||'')+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].formula=this.value" />'
        + '<div class="help">Available cols: ' + allRefCols.map(c => '<code>{'+U.esc(c.val)+'}</code>').join(' ') + '</div>';
    }

    if (ac.type === 'dropdown') {
      let h = '';
      h += '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">';
      h += '<label class="inline">Source: <select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsSource=this.value; RecoTemplate.renderEditor()">';
      h += '<option value="manual"'+(ac.optionsSource==='manual'||!ac.optionsSource?' selected':'')+'>Manual list</option>';
      h += '<option value="master"'+(ac.optionsSource==='master'?' selected':'')+'>From a master column</option>';
      h += '</select></label>';
      h += '</div>';
      if (ac.optionsSource === 'master') {
        const cfg = ac.optionsMasterCfg || {};
        const masterCols = cfg.source ? Masters.columns(cfg.source, t.id) : [];
        h += '<div style="display:flex; gap:4px; margin-top:4px; flex-wrap:wrap;">';
        h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsMasterCfg.source=this.value; RecoTemplate.renderEditor()" style="flex:1; min-width:140px;">';
        h += '<option value="">— master —</option>';
        masterCatalog.forEach(m => { h += '<option value="'+U.escAttr(m.id)+'"'+(cfg.source===m.id?' selected':'')+'>'+U.esc(m.label)+'</option>'; });
        h += '</select>';
        h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsMasterCfg.field=this.value" style="flex:1; min-width:120px;">';
        h += '<option value="">— field —</option>';
        masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.field===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
        h += '</select>';
        h += '</div>';
      } else {
        h += '<input type="text" placeholder="opt1, opt2, opt3" value="'+U.escAttr((ac.options||[]).join(', '))+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].options=this.value.split(\',\').map(s=>s.trim()).filter(Boolean)" style="margin-top:4px;" />';
      }
      return h;
    }

    if (ac.type === 'master') {
      // legacy: accounts-only
      let h = '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterRefColumn=this.value" style="flex:1;min-width:120px;"><option value="">Match column…</option>';
      allRefCols.forEach(c => { h += '<option value="'+U.escAttr(c.val)+'"'+(ac.masterRefColumn===c.val?' selected':'')+'>'+U.esc(c.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterValueColumn=this.value" style="flex:1;min-width:120px;"><option value="">Master field…</option>';
      ['Reference','RC','Nominal','SubNominal','AnalysisKey','LOB'].forEach(f => { h += '<option value="'+f+'"'+(ac.masterValueColumn===f?' selected':'')+'>'+f+'</option>'; });
      h += '</select>';
      h += '</div>';
      h += '<div class="help">Legacy mode: looks up against Accounts Master only. Use <b>Master lookup</b> type to target other masters.</div>';
      return h;
    }

    if (ac.type === 'master_lookup') {
      const cfg = ac.masterCfg || {};
      const masterCols = cfg.source ? Masters.columns(cfg.source, t.id) : [];
      let h = '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.source=this.value; RecoTemplate.renderEditor()" style="flex:1; min-width:140px;"><option value="">— master —</option>';
      masterCatalog.forEach(m => { h += '<option value="'+U.escAttr(m.id)+'"'+(cfg.source===m.id?' selected':'')+'>'+U.esc(m.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.matchColumn=this.value" style="flex:1; min-width:120px;"><option value="">My column…</option>';
      allRefCols.forEach(c => { h += '<option value="'+U.escAttr(c.val)+'"'+(cfg.matchColumn===c.val?' selected':'')+'>'+U.esc(c.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.matchKey=this.value" style="flex:1; min-width:110px;"><option value="">Match against…</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.matchKey===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.returnKey=this.value" style="flex:1; min-width:110px;"><option value="">Return field…</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.returnKey===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '</div>';
      return h;
    }

    return '';
  },

  edit(id) {
    const t = AppState.recoTemplates.find(x => x.id === id);
    if (!t) return;
    RecoTemplate._editing = JSON.parse(JSON.stringify(t));
    if (!RecoTemplate._editing.editableColumnConfig) RecoTemplate._editing.editableColumnConfig = {};
    if (!RecoTemplate._editing.aegIntegration) RecoTemplate._editing.aegIntegration = { enabled:false, aegTemplateId:'', keywordColumn:'', keywordValues:'', postEntryColumn:'', postEntryValue:'' };
    if (!RecoTemplate._editing.reports) RecoTemplate._editing.reports = [];
    if (!RecoTemplate._editing.docNumberColumn) RecoTemplate._editing.docNumberColumn = '';
    if (!RecoTemplate._editing.savedFilterSets) RecoTemplate._editing.savedFilterSets = [];
    RecoTemplate._isNew = false;
    RecoTemplate._isQuickEdit = false;   // callers that want quick-edit set it after edit()
    RecoTemplate._step = 1;
    RecoTemplate._sampleHeaders = t.columns.map(c => c.name);
    RecoTemplate.renderEditor();
  },
  duplicate(id) {
    const t = AppState.recoTemplates.find(x => x.id === id);
    if (!t) return;
    const c = JSON.parse(JSON.stringify(t));
    c.id = U.uid();
    c.name = t.name + ' (copy)';
    c.dataFolder = RecoTemplate._uniqueDataFolder(c.name, c.id);   // never share the original's history
    AppState.recoTemplates.push(c);
    AppState.save();
    App.navigate('home');
    U.toast('Template duplicated','success');
  },
  remove(id) {
    const t = AppState.recoTemplates.find(x => x.id === id);
    if (!t) return;
    const nAtt = Object.keys((AppState.attachmentMaster || {})[id] || {}).length;
    if (!confirm('Delete the reconciliation template "' + t.name + '"?\n\nIts session, entry history, masters, groups, comments and pending Special JVs are deleted' + (nAtt ? ', together with ' + nAtt + ' attachment file(s)' : '') + '. The version history in reco_data/ is kept on disk.')) return;
    const atts = Object.values((AppState.attachmentMaster || {})[id] || {});
    AppState.recoTemplates = AppState.recoTemplates.filter(x => x.id !== id);
    ['recoSessions','entryHistory','docNumberMaster','manualOffsetMaster','correctionMaster',
     'pendingSpecialJV','groupMaster','attachmentMaster','commentMaster'].forEach(k => {
      if (AppState[k]) delete AppState[k][id];
    });
    if (Store._hasApi()) {
      atts.forEach(a => {
        if (a.storedPath && a.storedPath.indexOf('localStorage:') !== 0) {
          window.pywebview.api.delete_attachment(a.storedPath).catch(e => console.error('delete_attachment', e));
        }
      });
    }
    if (AppState.activeRecoId === id) AppState.activeRecoId = null;
    AppState.save();
    App.navigate('home');
  },
  open(id) {
    AppState.activeRecoId = id;
    document.getElementById('navReco').style.display = '';
    App.navigate('reco', id);
  },

  renderEditor() {
    const t = RecoTemplate._editing;
    const step = RecoTemplate._step;
    let body = '';
    const steps = ['Columns','Keys & Rules','Display & Pivot','AEG & Reports','Review'];
    body += '<div style="display:flex; gap:4px; margin-bottom:14px;">';
    steps.forEach((s,i) => {
      const cls = (i+1===step)?'active':((i+1<step)?'done':'');
      body += '<div style="flex:1; padding:8px 10px; text-align:center; font-size:11px; font-weight:600; border-radius:4px; background:' +
        (cls==='active'?'var(--primary, #2563eb)':cls==='done'?'var(--step-done-bg, #d1fae5)':'var(--step-bg, #f3f4f6)') + '; color:' +
        (cls==='active'?'#fff':cls==='done'?'var(--step-done-text, #065f46)':'var(--text-muted, #6b7280)') + ';">' + (i+1) + '. ' + s + '</div>';
    });
    body += '</div>';
    if (step === 1) body += RecoTemplate.renderStep1(t);
    else if (step === 2) body += RecoTemplate.renderStep2(t);
    else if (step === 3) body += RecoTemplate.renderStep3(t);
    else if (step === 4) body += RecoTemplate.renderStep4(t);
    else if (step === 5) body += RecoTemplate.renderStep5(t);

    let footer = '';
    // NEW: Quick Save mode for direct report editing
    if (RecoTemplate._isQuickEdit) {
      footer = '<button onclick="App.closeModal(); RecoTemplate._isQuickEdit=false;">Cancel</button><div style="flex:1"></div><button class="success" onclick="Reco.saveReportEdits(); RecoTemplate._isQuickEdit=false;">Save Report Settings</button>';
    } else {
      // Standard 5-step wizard
      if (step > 1) footer += '<button onclick="RecoTemplate._step--; RecoTemplate.renderEditor()">← Back</button>';
      footer += '<div style="flex:1"></div>';
      if (step < 5) footer += '<button class="primary" onclick="RecoTemplate._step++; RecoTemplate.renderEditor()">Next →</button>';
      if (step === 5) footer += '<button class="success" onclick="RecoTemplate.saveTemplate()">Save Template</button>';
    }

    App.openModal(RecoTemplate._isNew ? 'New Reco Template' : (RecoTemplate._isQuickEdit ? 'Quick Edit Report' : 'Edit Reco Template'), body, '<div style="display:flex;width:100%; align-items:center;">'+footer+'</div>');
  },


  /* ---------- Step 1 ---------- */
  renderStep1(t) {
    let h = '';
    h += '<label class="field"><span class="label-text">Template Name</span>';
    h += '<input type="text" value="'+U.escAttr(t.name)+'" oninput="RecoTemplate._editing.name=this.value" /></label>';
    h += '<label class="field"><span class="label-text">Description</span>';
    h += '<input type="text" value="'+U.escAttr(t.description||'')+'" oninput="RecoTemplate._editing.description=this.value" /></label>';
    h += '<div class="divider"></div>';
    h += '<h3>Define Columns</h3>';
    h += '<div class="help">Upload a sample file to auto-detect columns, or add manually. Mark <b>Date</b> columns to enable date filters and date formulas (MONTH, AGEING, etc).</div>';
    h += '<div class="toolbar" style="margin-top:8px;">';
    h += '<input type="file" id="sampleFile" accept=".csv,.xlsx" style="display:none" onchange="RecoTemplate.loadSample(event)" />';
    h += '<button onclick="document.getElementById(\'sampleFile\').click()">Upload Sample CSV/XLSX</button>';
    h += '<button onclick="RecoTemplate.showPaste()">Paste Data</button>';
    h += '<button onclick="RecoTemplate.addCol()">+ Add Column</button>';
    h += '</div>';
    h += '<div id="rtPasteBox" style="display:none; margin-bottom:10px;">';
    h += '<textarea id="rtPasteData" placeholder="Paste tab-separated or CSV data (headers in first row)"></textarea>';
    h += '<div style="margin-top:6px"><button class="primary small" onclick="RecoTemplate.parsePaste()">Parse</button>';
    h += '<button class="small" onclick="document.getElementById(\'rtPasteBox\').style.display=\'none\'">Cancel</button></div></div>';

    if (t.columns.length) {
      h += '<div style="overflow-x:auto"><table><thead><tr>';
      h += '<th>Column Name</th><th>Label</th><th>Format Patterns</th><th>Value</th><th>Date</th><th></th>';
      h += '</tr></thead><tbody>';
      t.columns.forEach((c,i) => {
        h += '<tr>';
        h += '<td><input type="text" value="'+U.escAttr(c.name)+'" oninput="RecoTemplate._editing.columns['+i+'].name=this.value" /></td>';
        h += '<td><input type="text" value="'+U.escAttr(c.label||c.name)+'" oninput="RecoTemplate._editing.columns['+i+'].label=this.value" /></td>';
        h += '<td>' + RecoTemplate.renderFormatRows(c, i) + '</td>';
        h += '<td style="text-align:center;"><input type="checkbox" '+(c.isValue?'checked':'')+' onchange="RecoTemplate._editing.columns['+i+'].isValue=this.checked" /></td>';
        h += '<td style="text-align:center;"><input type="checkbox" '+(c.isDate?'checked':'')+' onchange="RecoTemplate._editing.columns['+i+'].isDate=this.checked" /></td>';
        h += '<td><button class="small danger" onclick="RecoTemplate._editing.columns.splice('+i+',1); RecoTemplate.renderEditor()">×</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      h += '<div class="help">Format pattern letters: <code>D</code>=single digit, <code>N</code>=digits string, <code>A</code>=single letter, <code>T</code>=letters string, <code>S</code>=alphanumeric. Other characters are literal.</div>';
    }
    return h;
  },
  renderFormatRows(col, colIdx) {
    const formats = col.formats || [];
    let h = '<div>';
    if (formats.length === 0) {
      h += '<div class="text-muted" style="margin-bottom:4px;">no formats</div>';
    } else {
      formats.forEach((fmt, fi) => {
        h += '<div style="display:flex; gap:3px; margin-bottom:3px;">';
        h += '<input type="text" value="'+U.escAttr(fmt)+'" placeholder="DDDDD or N-A@D" oninput="RecoTemplate.updateFormat('+colIdx+','+fi+',this.value)" style="flex:1; min-width:90px;" />';
        h += '<button class="small danger" onclick="RecoTemplate.removeFormat('+colIdx+','+fi+')">×</button>';
        h += '</div>';
      });
    }
    h += '<button class="small" onclick="RecoTemplate.addFormat('+colIdx+')">+ Add format</button>';
    h += '</div>';
    return h;
  },
  addFormat(colIdx) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats = c.formats || [];
    c.formats.push('');
    RecoTemplate.renderEditor();
  },
  removeFormat(colIdx, fi) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats.splice(fi, 1);
    RecoTemplate.renderEditor();
  },
  updateFormat(colIdx, fi, val) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats[fi] = val;
  },

  /* ---------- Step 2 ---------- */
  renderStep2(t) {
    let h = '';
    const cols = t.columns;
    if (!cols.length) { return '<div class="empty">Define columns in Step 1 first.</div>'; }

    h += '<div class="editor-section"><div class="section-head"><strong>Primary Key</strong></div>';
    h += '<div class="help">Optional. Select column(s) that together uniquely identify each row. Used for correction tracking and offset master.</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.primaryKeys||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.togglePK(\''+U.jsq(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div></div>';

    h += RecoTemplate._renderAdditionalColumnsEditor(t);

    h += '<div class="editor-section"><div class="section-head"><strong>Currency &amp; Exchange</strong></div>';
    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Currency Mode</span>';
    h += '<select onchange="RecoTemplate._editing.currencyMode=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="AED"'+(t.currencyMode==='AED'?' selected':'')+'>AED only</option>';
    h += '<option value="fromColumn"'+(t.currencyMode==='fromColumn'?' selected':'')+'>From column</option>';
    h += '</select></label>';
    if (t.currencyMode === 'fromColumn') {
      h += '<label class="field"><span class="label-text">Currency Column</span>';
      h += RecoTemplate.colSelect('currencyColumn', t.currencyColumn);
      h += '</label>';
    } else h += '<div></div>';
    h += '<label class="field"><span class="label-text">Exchange Mode</span>';
    h += '<select onchange="RecoTemplate._editing.exchangeMode=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="asRequired"'+(t.exchangeMode==='asRequired'?' selected':'')+'>As required</option>';
    h += '<option value="autoExchange"'+(t.exchangeMode==='autoExchange'?' selected':'')+'>Auto Exchange (3 lines)</option>';
    h += '</select></label>';
    if (t.exchangeMode === 'autoExchange') {
      h += '<label class="field"><span class="label-text">Exchange Column</span>';
      h += RecoTemplate.colSelect('exchangeColumn', t.exchangeColumn);
      h += '</label>';
    } else h += '<div></div>';
    h += '</div>';
    h += '<label class="field"><span class="label-text">Reco Account Reference (From Account)</span>';
    h += '<input type="text" value="'+U.escAttr(t.recoAccountRef||'')+'" oninput="RecoTemplate._editing.recoAccountRef=this.value" placeholder="Reference in Accounts Master" /></label>';
    h += '</div>';

    h += '<div class="editor-section"><div class="section-head"><strong>Value, Document Number &amp; Aggregation</strong></div>';
    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Value Column</span>';
    h += RecoTemplate.colSelect('valueColumn', t.valueColumn);
    h += '</label>';
    h += '<label class="field"><span class="label-text">Document Number Column <span class="text-muted">(scans against past entries)</span></span>';
    h += RecoTemplate.colSelect('docNumberColumn', t.docNumberColumn || '');
    h += '</label>';
    h += '</div>';
        h += '<label class="inline"><input type="checkbox" '+(t.aggregate?'checked':'')+' onchange="RecoTemplate._editing.aggregate=this.checked; RecoTemplate.renderEditor()"> Enable Aggregation</label>';
    if (t.aggregate) {
      h += '<div style="margin-top:6px;">';
      cols.forEach(c => {
        const checked = (t.aggregateBy||[]).includes(c.name);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleAggBy(\''+U.jsq(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
      });
      // Aggregation can also include additional columns (declared above)
      (t.additionalColumns||[]).forEach(ac => {
        const checked = (t.aggregateBy||[]).includes(ac.name);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleAggBy(\''+U.jsq(ac.name)+'\',this.checked)"><span class="badge specific">extra</span> '+U.esc(ac.name)+'</label>';
      });
      h += '</div>';
    }
    h += '<div class="grid-2" style="margin-top:10px;">';
    h += '<label class="field"><span class="label-text">Tolerance Mode</span>';
    h += '<select onchange="RecoTemplate._editing.toleranceMode=this.value">';
    h += '<option value="amount"'+(t.toleranceMode==='amount'?' selected':'')+'>Amount</option>';
    h += '<option value="percentage"'+(t.toleranceMode==='percentage'?' selected':'')+'>Percentage</option>';
    h += '</select></label>';
    h += '<label class="field"><span class="label-text">Tolerance Value</span>';
    h += '<input type="number" value="'+(t.toleranceValue||0)+'" step="0.01" oninput="RecoTemplate._editing.toleranceValue=parseFloat(this.value)||0" /></label>';
    h += '</div></div>';

    h += '<div class="editor-section"><div class="section-head"><strong>Options</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.enableReporting?'checked':'')+' onchange="RecoTemplate._editing.enableReporting=this.checked"> Enable Reporting</label>';
    h += '<label class="inline"><input type="checkbox" '+(t.enableCorrections?'checked':'')+' onchange="RecoTemplate._editing.enableCorrections=this.checked"> Enable Column Corrections</label>';
    h += '<label class="inline"><input type="checkbox" '+(t.groupsEnabled?'checked':'')+' onchange="RecoTemplate._editing.groupsEnabled=this.checked"> Enable Groups <span class="text-muted">(requires primary keys)</span></label>';
    h += '</div>';

    return h;
  },
  /* ---------- Step 3: Display, Additional Cols (with master refs), Pivot ---------- */
  renderStep3(t) {
    let h = '';
    const cols = t.columns;
    if (!cols.length) { return '<div class="empty">Define columns in Step 1 first.</div>'; }

    // Display columns
    h += '<div class="editor-section"><div class="section-head"><strong>Display Columns in Reco Tab</strong>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllDisplay(true); RecoTemplate.renderEditor()">All</button>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllDisplay(false); RecoTemplate.renderEditor()">None</button>';
    h += '</div>';
    h += '<div class="help">Only checked columns will be visible in the Reco grid. Other columns remain in the data and exports.</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.displayColumns||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleDisplay(\''+U.jsq(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div></div>';

    // Editable Columns (NEW)
    h += '<div class="editor-section"><div class="section-head"><strong>Editable Columns</strong>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllEditable(true); RecoTemplate.renderEditor()">All</button>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllEditable(false); RecoTemplate.renderEditor()">None</button></div>';
    h += '<div class="help">For each column you make editable, choose how the user edits it: free text, a dropdown (manual or sourced from a master), or a dropdown with manual override (datalist).</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.editableColumns||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleEditable(\''+U.jsq(c.name)+'\',this.checked); RecoTemplate.renderEditor()"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div>';

    // Per-column edit-type config
    const editCols = (t.editableColumns||[]);
    if (editCols.length) {
      h += '<table style="margin-top:8px;"><thead><tr><th>Column</th><th>Edit type</th><th>Configuration</th></tr></thead><tbody>';
      editCols.forEach(colName => {
        h += '<tr><td><b>'+U.esc(colName)+'</b></td>';
        h += '<td>'+RecoTemplate._renderEditTypeSelect(t, colName)+'</td>';
        h += '<td>'+RecoTemplate._renderEditTypeConfig(t, colName)+'</td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';
    h += RecoTemplate._renderExcelPanel(t);


    // Additional columns are edited in step 2 (Keys & Rules).

    // Pivot (Now includes Additional Columns)
    const allPivotCols = cols.map(c => c.name).concat((t.additionalColumns||[]).map(a => a.name));
    
    h += '<div class="editor-section"><div class="section-head"><strong>Pivot</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.pivotEnabled?'checked':'')+' onchange="RecoTemplate._editing.pivotEnabled=this.checked; RecoTemplate.renderEditor()"> Enable Pivot View</label>';
    if (t.pivotEnabled) {
      h += '<div class="grid-3" style="margin-top:8px;">';
      h += '<label class="field"><span class="label-text">Value Column</span>'+RecoTemplate.colSelect('pivotValueCol',t.pivotValueCol)+'</label>';
      h += '<label class="field"><span class="label-text">Row Columns</span>';
      h += '<div>';
      allPivotCols.forEach(c => {
        const checked = (t.pivotRowCols||[]).includes(c);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleArr(\'pivotRowCols\',\''+U.jsq(c)+'\',this.checked)"> '+U.esc(c)+'</label>';
      });
      h += '</div></label>';
      h += '<label class="field"><span class="label-text">Column Columns</span>';
      h += '<div>';
      allPivotCols.forEach(c => {
        const checked = (t.pivotColCols||[]).includes(c);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleArr(\'pivotColCols\',\''+U.jsq(c)+'\',this.checked)"> '+U.esc(c)+'</label>';
      });
      h += '</div></label>';
      h += '</div>';
    }
    h += '</div>';

    return h;
  },

  renderStep4(t) {
    const cols = t.columns;
    const allColsWithExtras = cols.map(c => c.name).concat((t.additionalColumns||[]).map(ac => ac.name));
    let h = '';
    // AEG Integration
    h += '<div class="editor-section"><div class="section-head"><strong>AEG Integration</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.aegIntegration.enabled?'checked':'')+' onchange="RecoTemplate._editing.aegIntegration.enabled=this.checked; RecoTemplate.renderEditor()"> Enable AEG entry generation from this template</label>';
    if (t.aegIntegration.enabled) {

// Reports

          h += '<option value="">— select col —</option>';

          (rpt.computedCols||[]).forEach(cc => { h += '<option value="'+U.escAttr(cc.name)+'"'+(card.col===cc.name?' selected':'')+'>'+U.esc(cc.name)+' (calc)</option>'; });
          h += '</select>';
          
          // NEW: Custom Display Name Input
          h += '<input type="text" placeholder="Display Name" value="'+U.escAttr(card.displayName||'')+'" oninput="RecoTemplate._editing.reports['+ri+'].summaryCards['+ci+'].displayName=this.value" style="flex:1;" title="Leave blank to use column name" />';

          h += '<select onchange="RecoTemplate._editing.reports['+ri+'].summaryCards['+ci+'].func=this.value" style="width:80px;">';

          h += '</div>';
        });
        // Updated push object to include displayName
        h += '<button class="small" onclick="RecoTemplate._editing.reports['+ri+'].summaryCards=RecoTemplate._editing.reports['+ri+'].summaryCards||[]; RecoTemplate._editing.reports['+ri+'].summaryCards.push({col:\'\',func:\'Sum\',displayName:\'\'}); RecoTemplate.renderEditor()" style="margin-bottom:8px;">+ Add Card</button>';

        // Columns Builder
        h += '<div class="help">Columns & Date Formats (drag/arrows to reorder):</div>';
