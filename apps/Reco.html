    const c = Comments.get(tplId, cid); if (!c) return;
    if (linkedPks)    c.linkedPks    = linkedPks.slice();
    if (linkedGroups) c.linkedGroups = linkedGroups.slice();
    AppState.save();
  },

  // === Dialogs ===
  // Called by the Timeline "Add Comment" button and by the row context menu
  openAddDialog(tplId, pk) {
    const memberGroups = Groups.groupsForPk(tplId, pk);

    let h = '<label class="field"><span class="label-text">Comment</span>';
    h += '<textarea id="commentText" placeholder="Type your comment…" style="min-height:100px;"></textarea></label>';

    h += '<div class="editor-section"><div class="section-head"><strong>Link to</strong></div>';
    h += '<label class="inline"><input type="radio" name="commentLink" value="row" checked /> This row only</label>';
    memberGroups.forEach(g => {
      h += '<label class="inline"><input type="radio" name="commentLink" value="group:'+U.escAttr(g.id)+'" /> Group: <span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> <span class="text-muted">('+g.members.length+' members)</span></label>';
    });
    if (!memberGroups.length) {
      h += '<div class="text-muted" style="font-size:11px;">This row is not in any group. Add it to a group first if you want group-level comments.</div>';
    }
    h += '</div>';

    Comments._pendingAdd = { tplId, pk };
    App.openModal('Add Comment', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Comments._confirmAdd()">Post</button>');

    setTimeout(() => {
      const ta = document.getElementById('commentText');
      if (ta) ta.focus();
    }, 80);
  },

  _confirmAdd() {
    const p = Comments._pendingAdd;
    if (!p) return;
    const text = (document.getElementById('commentText')?.value || '').trim();
    if (!text) { U.toast('Comment is empty', 'error'); return; }
    const sel = document.querySelector('input[name="commentLink"]:checked');
    if (!sel) return;

    const meta = {};
    if (sel.value === 'row') {
      meta.linkedPks = [p.pk];
    } else if (sel.value.startsWith('group:')) {
      meta.linkedGroups = [sel.value.slice(6)];
    }

    const rec = Comments.create(p.tplId, text, meta);
    Comments._pendingAdd = null;
    if (rec) {
      U.toast('Comment posted', 'success');
      App.closeModal();
      Timeline.open(p.tplId, p.pk);
    } else {
      U.toast('Failed to post', 'error');
    }
  },

  // Inline edit dialog (opened from a list view; the timeline shows delete only)
  openEditDialog(tplId, cid) {
    const c = Comments.get(tplId, cid);
    if (!c) return;
    let h = '<label class="field"><span class="label-text">Edit comment</span>';
    h += '<textarea id="commentEditText" style="min-height:100px;">'+U.esc(c.text)+'</textarea></label>';
    h += '<div class="text-muted" style="font-size:11px;">Originally posted '+U.esc((c.createdAt||'').replace('T',' ').substring(0,16))+' by '+U.esc(c.createdBy||'')+'.</div>';
    Comments._pendingEdit = { tplId, cid };
    App.openModal('Edit Comment', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Comments._confirmEdit()">Save</button>');
    setTimeout(() => { const ta = document.getElementById('commentEditText'); if (ta) ta.focus(); }, 80);
  },

  _confirmEdit() {
    const p = Comments._pendingEdit;
    if (!p) return;
    const text = (document.getElementById('commentEditText')?.value || '').trim();
    if (!text) { U.toast('Comment empty', 'error'); return; }
    Comments.edit(p.tplId, p.cid, text);
    Comments._pendingEdit = null;
    App.closeModal();
    U.toast('Comment updated', 'success');
  },

  // === Helpers ===
  _currentUser() {
    return (AppState.aegSettings && AppState.aegSettings.currentUser) || 'unknown';
  }
};

/* ================================================================
   MODULE 3h — FILTER SETS
   Named snapshots of the current Reco filter state. Stored on the
   template so they survive data clears and ride along in backups.
   Captures: columnFilters, slicers, columnSorts, statusFilter,
   requireAttachment, requireComment, requireGroup.
   ================================================================ */
const FilterSets = {
  forTemplate(tpl) {
    tpl.savedFilterSets = tpl.savedFilterSets || [];
    return tpl.savedFilterSets;
  },

  list(tpl) {
    return FilterSets.forTemplate(tpl).slice().sort((a,b) => a.name.localeCompare(b.name));
  },

  get(tpl, fsid) {
    return FilterSets.forTemplate(tpl).find(f => f.id === fsid) || null;
  },

  // === Capture from session ===
  capture(sess) {
    return {
      columnFilters: JSON.parse(JSON.stringify(sess.columnFilters || {})),
      slicers:       JSON.parse(JSON.stringify(sess.slicers || {})),
      columnSorts:   sess.columnSorts ? JSON.parse(JSON.stringify(sess.columnSorts)) : null,
      statusFilter:  sess.statusFilter || 'all',
      requireAttachment: !!sess.requireAttachment,
      requireComment:    !!sess.requireComment,
      requireGroup:      !!sess.requireGroup
    };
  },

  // Quick check: does the session have any filter state worth saving?
  hasActiveFilters(sess) {
    if (sess.statusFilter && sess.statusFilter !== 'all') return true;
    if (sess.requireAttachment || sess.requireComment || sess.requireGroup) return true;
    if (sess.columnSorts && sess.columnSorts.col) return true;
    if (sess.columnFilters && Object.keys(sess.columnFilters).some(k => (sess.columnFilters[k]||[]).length)) return true;
    if (sess.slicers && Object.keys(sess.slicers).some(k => (sess.slicers[k]||[]).length)) return true;
    return false;
  },

  // === Save / Update / Delete ===
  save(tpl, name, description, state) {
    const list = FilterSets.forTemplate(tpl);
    const id = 'FS' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
    const rec = {
      id,
      name: String(name||'').trim() || 'Filter Set',
      description: String(description||''),
      state,
      createdAt: new Date().toISOString()
    };
    list.push(rec);
    AppState.save();
    return rec;
  },

  rename(tpl, fsid, name, description) {
    const f = FilterSets.get(tpl, fsid); if (!f) return;
    f.name = String(name||'').trim() || f.name;
    if (description != null) f.description = String(description);
    AppState.save();
  },

  overwrite(tpl, fsid, state) {
    const f = FilterSets.get(tpl, fsid); if (!f) return;
    f.state = state;
    f.updatedAt = new Date().toISOString();
    AppState.save();
  },

  remove(tpl, fsid) {
    tpl.savedFilterSets = FilterSets.forTemplate(tpl).filter(f => f.id !== fsid);
    AppState.save();
  },

  // === Apply ===
  apply(sess, state) {
    sess.columnFilters = JSON.parse(JSON.stringify(state.columnFilters || {}));
    sess.slicers       = JSON.parse(JSON.stringify(state.slicers || {}));
    sess.columnSorts   = state.columnSorts ? JSON.parse(JSON.stringify(state.columnSorts)) : null;
    sess.statusFilter  = state.statusFilter || 'all';
    sess.requireAttachment = !!state.requireAttachment;
    sess.requireComment    = !!state.requireComment;
    sess.requireGroup      = !!state.requireGroup;
    sess.page = 0;
    AppState.save();
  },

  clearAll(sess) {
    sess.columnFilters = {};
    sess.slicers = {};
    sess.columnSorts = null;
    sess.statusFilter = 'all';
    sess.requireAttachment = false;
    sess.requireComment = false;
    sess.requireGroup = false;
    sess.page = 0;
    AppState.save();
  },

  // Human-readable one-line summary of a state, for the manage modal
  describe(state) {
    const parts = [];
    if (state.statusFilter && state.statusFilter !== 'all') parts.push('status='+state.statusFilter);
    if (state.requireAttachment) parts.push('📎');
    if (state.requireComment)    parts.push('💬');
    if (state.requireGroup)      parts.push('📁');
    const cfCols = Object.keys(state.columnFilters||{}).filter(k => (state.columnFilters[k]||[]).length);
    if (cfCols.length) parts.push(cfCols.length+' col filter'+(cfCols.length>1?'s':''));
    const slCols = Object.keys(state.slicers||{}).filter(k => (state.slicers[k]||[]).length);
    if (slCols.length) parts.push(slCols.length+' slicer'+(slCols.length>1?'s':''));
    if (state.columnSorts && state.columnSorts.col) parts.push('sort:'+state.columnSorts.col+(state.columnSorts.dir==='desc'?'↓':'↑'));
    return parts.length ? parts.join(' · ') : 'no filters';
  }
};
/* ================================================================
   MODULE 3i — FIND & REPLACE
   Searches across standard columns (optionally an extra column for
   find-only). Replacements write through Versioning.appendChangesBatch
   so history stays clean.
   ================================================================ */
const FindReplace = {
  _state: {
    find: '',
    replace: '',
    column: '__all__',     // '__all__' or a specific column name
    matchCase: false,
    wholeWord: false,
    regex: false,
    matches: []            // { rowIdx, col, value, isExtra }
  },

  open() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess || !sess.data.length) {
      U.toast('Load data first', 'error');
      return;
    }
    FindReplace._renderModal();
  },

  _renderModal() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const s = FindReplace._state;

    let h = '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Find</span>';
    h += '<input type="text" id="frFind" value="'+U.escAttr(s.find)+'" placeholder="search text or regex" autofocus /></label>';
    h += '<label class="field"><span class="label-text">Replace with</span>';
    h += '<input type="text" id="frReplace" value="'+U.escAttr(s.replace)+'" placeholder="(leave blank to find only)" /></label>';
    h += '</div>';

    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">In column</span>';
    h += '<select id="frColumn">';
    h += '<option value="__all__"'+(s.column==='__all__'?' selected':'')+'>All standard columns</option>';
    tpl.columns.forEach(c => {
      h += '<option value="'+U.escAttr(c.name)+'"'+(s.column===c.name?' selected':'')+'>'+U.esc(c.label||c.name)+'</option>';
    });
    (tpl.additionalColumns||[]).forEach(ac => {
      h += '<option value="extra:'+U.escAttr(ac.name)+'"'+(s.column==='extra:'+ac.name?' selected':'')+'>'+U.esc(ac.name)+' (extra — find only)</option>';
    });
    h += '</select></label>';
    h += '<div><label class="inline" style="margin-top:18px;"><input type="checkbox" id="frCase"   '+(s.matchCase?'checked':'')+'> Match case</label>';
    h += '<label class="inline"><input type="checkbox" id="frWord"   '+(s.wholeWord?'checked':'')+'> Whole word</label>';
    h += '<label class="inline"><input type="checkbox" id="frRegex"  '+(s.regex?'checked':'')+'> Regex</label></div>';
    h += '</div>';

    h += '<div class="toolbar" style="margin-top:8px;">';
    h += '<button class="primary" onclick="FindReplace._runSearch()">🔍 Find All</button>';
    h += '<button onclick="FindReplace._replaceAll()">↻ Replace All</button>';
    h += '<div class="toolbar spacer"></div>';
    h += '<span id="frStatus" class="text-muted"></span>';
    h += '</div>';

    h += '<div id="frResults" style="margin-top:8px; max-height:50vh; overflow-y:auto;"></div>';

    App.openModal('Find & Replace', h,
      '<button onclick="App.closeModal()">Close</button>' +
      '<button class="primary" onclick="FindReplace._runSearch()">Find All</button>');

    setTimeout(() => {
      const inp = document.getElementById('frFind');
      if (inp) { inp.focus(); inp.select(); }
    }, 100);
  },

  _readState() {
    const s = FindReplace._state;
    s.find      = document.getElementById('frFind')?.value || '';
    s.replace   = document.getElementById('frReplace')?.value || '';
    s.column    = document.getElementById('frColumn')?.value || '__all__';
    s.matchCase = !!document.getElementById('frCase')?.checked;
    s.wholeWord = !!document.getElementById('frWord')?.checked;
    s.regex     = !!document.getElementById('frRegex')?.checked;
  },

  _buildMatcher() {
    const s = FindReplace._state;
    if (!s.find) return null;
    if (s.regex) {
      try {
        return new RegExp(s.find, s.matchCase ? 'g' : 'gi');
      } catch(e) {
        U.toast('Invalid regex: ' + e.message, 'error');
        return null;
      }
    }
    // Escape regex special chars
    let pattern = s.find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (s.wholeWord) pattern = '\\b' + pattern + '\\b';
    return new RegExp(pattern, s.matchCase ? 'g' : 'gi');
  },

  _columnsToSearch(tpl) {
    const s = FindReplace._state;
    if (s.column === '__all__') return tpl.columns.map(c => ({ name: c.name, isExtra: false }));
    if (s.column.indexOf('extra:') === 0) {
      const acName = s.column.slice(6);
      const ac = (tpl.additionalColumns||[]).find(a => a.name === acName);
      return ac ? [{ name: acName, isExtra: true, def: ac }] : [];
    }
    return [{ name: s.column, isExtra: false }];
  },

  _runSearch() {
    FindReplace._readState();
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const rx = FindReplace._buildMatcher();
    if (!rx) {
      document.getElementById('frResults').innerHTML = '';
      document.getElementById('frStatus').textContent = '';
      return;
    }
    const cols = FindReplace._columnsToSearch(tpl);
    const matches = [];
    sess.data.forEach((row, ri) => {
      cols.forEach(c => {
        let val;
        if (c.isExtra) val = Reco._extraValueForRow(tpl, sess, row, c.def);
        else val = row[c.name];
        if (val == null || val === '') return;
        if (rx.test(String(val))) {
          matches.push({ rowIdx: ri, col: c.name, value: String(val), isExtra: !!c.isExtra });
        }
      });
    });
    FindReplace._state.matches = matches;
    FindReplace._renderResults();
  },

  _renderResults() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    const matches = s.matches;

    const statusEl = document.getElementById('frStatus');
    const resEl = document.getElementById('frResults');
    if (!resEl) return;

    if (!matches.length) {
      statusEl.textContent = '0 matches';
      resEl.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    statusEl.textContent = matches.length + ' match'+(matches.length===1?'':'es')+(s.replace?' — Replace All to apply':'');

    const rx = FindReplace._buildMatcher();
    const showLimit = 200;

    let h = '<table><thead><tr><th>Row</th><th>Column</th><th>Value (preview)</th><th></th></tr></thead><tbody>';
    matches.slice(0, showLimit).forEach((m, mi) => {
      const row = sess.data[m.rowIdx];
      // Preview with highlight
      let preview = m.value;
      if (rx) {
        rx.lastIndex = 0;
        preview = preview.replace(rx, m0 => '\u0001'+m0+'\u0002');
      }
      preview = U.esc(preview).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
      // Cap preview length
      if (preview.length > 200) preview = preview.substring(0, 200) + '…';

      h += '<tr>';
      h += '<td><span class="text-muted">#'+m.rowIdx+'</span></td>';
      h += '<td><b>'+U.esc(m.col)+'</b>'+(m.isExtra?' <span class="badge fc">extra</span>':'')+'</td>';
      h += '<td style="max-width:400px;">'+preview+'</td>';
      h += '<td>';
      if (!m.isExtra && s.replace !== '') {
        h += '<button class="small primary" onclick="FindReplace._replaceOne('+mi+')">Replace</button>';
      } else if (m.isExtra) {
        h += '<span class="text-muted" style="font-size:10px;">read-only</span>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table>';
    if (matches.length > showLimit) {
      h += '<div class="text-muted" style="margin-top:4px; font-size:11px;">Showing first '+showLimit+' of '+matches.length+'. Use Replace All to apply to every match.</div>';
    }
    resEl.innerHTML = h;
  },

  async _replaceOne(matchIndex) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    const m = s.matches[matchIndex];
    if (!m || m.isExtra) return;
    const rx = FindReplace._buildMatcher(); if (!rx) return;

    const row = sess.data[m.rowIdx];
    const oldVal = row[m.col] == null ? '' : String(row[m.col]);
    rx.lastIndex = 0;
    const newVal = oldVal.replace(rx, s.replace);
    if (newVal === oldVal) {
      U.toast('No change', 'error');
      return;
    }
    row[m.col] = newVal;
    const pk = row._pk || Reco.getRowPK(tpl, row);
    if (pk) {
      try {
        const verLabel = await Versioning.appendChange(tpl, pk, row);
        row._ver = verLabel;
      } catch(e) { console.error('appendChange', e); }
    }
    AppState.save();
    // Re-search to refresh results
    FindReplace._runSearch();
    U.toast('Replaced 1 cell', 'success');
  },

  async _replaceAll() {
    FindReplace._readState();
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    if (!s.find) { U.toast('Enter something to find', 'error'); return; }
    if (s.replace === '') {
      if (!confirm('Replace with empty string? Matching text in every match will be deleted.')) return;
    }
    const rx = FindReplace._buildMatcher(); if (!rx) return;

    const cols = FindReplace._columnsToSearch(tpl).filter(c => !c.isExtra);
    if (!cols.length) { U.toast('Pick a standard column or "All standard columns" to replace.', 'error'); return; }

    let cellChanges = 0;
    const touchedRowIdx = new Set();
    sess.data.forEach((row, ri) => {
      cols.forEach(c => {
        const oldVal = row[c.name] == null ? '' : String(row[c.name]);
        if (!oldVal) return;
        rx.lastIndex = 0;
        if (!rx.test(oldVal)) return;
        rx.lastIndex = 0;
        const newVal = oldVal.replace(rx, s.replace);
        if (newVal === oldVal) return;
        row[c.name] = newVal;
        cellChanges++;
        touchedRowIdx.add(ri);
      });
    });

    if (!cellChanges) { U.toast('Nothing matched', 'error'); return; }

    // Batch-write one Cn per touched PK
    const pkRows = [];
    touchedRowIdx.forEach(ri => {
      const row = sess.data[ri];
      const pk = row._pk || Reco.getRowPK(tpl, row);
      if (pk) pkRows.push({ pk, row });
    });
    try {
      const versions = await Versioning.appendChangesBatch(tpl, pkRows);
      // Stamp _ver on each touched row
      pkRows.forEach(p => { if (versions[p.pk]) p.row._ver = versions[p.pk]; });
    } catch(e) { console.error('appendChangesBatch', e); }

    AppState.save();
    FindReplace._runSearch();
    U.toast('Replaced '+cellChanges+' cell(s) across '+touchedRowIdx.size+' row(s)', 'success');
  }
};



/* ================================================================
   MODULE 4 — APP STATE (Updated to Nest Flat Data)
   ================================================================ */

  currentPage: 'home',
  recoTemplates: [],
  recoSessions: {},
  activeRecoId: null,
  aegTemplates: [],
  aegMaster: [],
  aegSettings: { spSiteUrl:'', listMaster:'Accounts_Master_entry', listTemplates:'Templates_entry', autoSync:false, currentUser:'' },

  docNumberMaster: {},

  correctionMaster: {},

  groupMaster: {},

    AppState.docNumberMaster     = d.docNumberMaster || {};

/* ================================================================
   MODULE 5 — APP CONTROLLER
   ================================================================ */
const App = {
  init() {
    AppState.load();
    populateThemeSelect();
    App.navigate('home');
  },
  navigate(page, param) {
    AppState.currentPage = page;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page===page));
    // Body class for full-height reco shell
    document.body.classList.toggle('reco-fullheight', page === 'reco');
    const main = document.getElementById('appMain');
    if (page === 'home') Home.render(main);
    else if (page === 'reco') Reco.render(main, param);
    else if (page === 'aeg') AEG.render(main);
  },
  openModal(title, bodyHtml, footerHtml) {
    document.getElementById('appModalTitle').textContent = title;
    document.getElementById('appModalBody').innerHTML = bodyHtml;
    document.getElementById('appModalFooter').innerHTML = footerHtml || '';
    document.getElementById('appModal').classList.add('show');
  },
  async ensureCurrentUser() {
    if (AppState.aegSettings.currentUser) return AppState.aegSettings.currentUser;
    let osUser = '';
    if (Store._hasApi() && window.pywebview.api.current_username) {
      try { osUser = await window.pywebview.api.current_username(); } catch(e) {}
    }
    const name = prompt('Enter your name (used for attachments/comments):', osUser || '');
    if (name && name.trim()) {
      AppState.aegSettings.currentUser = name.trim();
      AppState.save();
    } else {
      AppState.aegSettings.currentUser = osUser || 'unknown';
    }
    return AppState.aegSettings.currentUser;
  },

  closeModal() { document.getElementById('appModal').classList.remove('show'); },
  exportBackup() {
    const data = {
      version: 4,
      exportedAt: new Date().toISOString(),
      recoTemplates: AppState.recoTemplates,
      aegTemplates: AppState.aegTemplates,
      aegMaster: AppState.aegMaster,
      pendingSpecialJV: AppState.pendingSpecialJV,
      aegSettings: AppState.aegSettings,
      recoSessions: AppState.recoSessions,
      entryHistory: AppState.entryHistory,
      docNumberMaster: AppState.docNumberMaster,
      manualOffsetMaster: AppState.manualOffsetMaster,
      correctionMaster: AppState.correctionMaster,
      groupMaster: AppState.groupMaster,
      attachmentMaster: AppState.attachmentMaster,
      customMasters: AppState.customMasters,
      commentMaster: AppState.commentMaster
    };
    U.download('reco_suite_backup_'+Date.now()+'.json', JSON.stringify(data,null,2), 'application/json');
  },

  _wireRecoHotkeys() {
    if (App._hotkeysWired) return;
    App._hotkeysWired = true;
    document.addEventListener('keydown', (e) => {
      if (AppState.currentPage !== 'reco') return;
      // Ctrl/Cmd + F → Find & Replace
      if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (typeof FindReplace !== 'undefined' && FindReplace.open) FindReplace.open();
      }
    });
  },

  importBackup(ev) {
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (d.recoTemplates) AppState.recoTemplates = d.recoTemplates;
        if (d.aegTemplates) AppState.aegTemplates = d.aegTemplates;
        if (d.aegMaster) AppState.aegMaster = d.aegMaster;
        if (d.aegSettings) AppState.aegSettings = Object.assign(AppState.aegSettings, d.aegSettings);
        if (d.recoSessions) AppState.recoSessions = d.recoSessions;
        if (d.entryHistory) AppState.entryHistory = d.entryHistory;
        if (d.pendingSpecialJV) AppState.pendingSpecialJV = d.pendingSpecialJV;
        if (d.docNumberMaster) AppState.docNumberMaster = d.docNumberMaster;
        if (d.manualOffsetMaster) AppState.manualOffsetMaster = d.manualOffsetMaster;
        if (d.customMasters) AppState.customMasters = d.customMasters;
        if (d.correctionMaster) AppState.correctionMaster = d.correctionMaster;
        if (d.groupMaster) AppState.groupMaster = d.groupMaster;
        if (d.attachmentMaster) AppState.attachmentMaster = d.attachmentMaster;
        if (d.commentMaster) AppState.commentMaster = d.commentMaster;
        if (d.version === 2 && d.templates) AppState.aegTemplates = d.templates;
        if (d.version === 2 && d.master) AppState.aegMaster = d.master;
        AppState.save();
        App.navigate('home');
        U.toast('Restore complete','success');
      } catch(er) { U.toast('Invalid backup','error'); }
    };
    r.readAsText(file);
    ev.target.value = '';
  }
};

      const dnMap = AppState.docNumberMaster[tplId] || {};
      Object.keys(dnMap).forEach(dn => {

    const name = prompt('Master name (e.g. Vendors, Cost Centers):');
    if (!name) return;
    const cols = prompt('Columns (comma-separated, e.g. Code,Name,Region):', 'Code,Name');
    if (!cols) return;
    AppState.customMasters = AppState.customMasters || [];
    AppState.customMasters.push({
      name: name.trim(),
      icon: '📋',
      columns: cols.split(',').map(s => s.trim()).filter(Boolean),
      rows: []
    });
    AppState.save();
    App.navigate('home');
  },
  editCustomMaster(idx) {
    const cm = (AppState.customMasters||[])[idx];
    if (!cm) return;
    let h = '<div class="toolbar"><button class="small primary" onclick="Home._cmAddRow('+idx+')">+ Row</button></div>';
    h += '<div style="overflow:auto; max-height:400px;"><table><thead><tr>';
    cm.columns.forEach(c => h += '<th>'+U.esc(c)+'</th>');
    h += '<th></th></tr></thead><tbody id="cmTblBody">';
    (cm.rows||[]).forEach((r, ri) => {
      h += '<tr>';
      cm.columns.forEach(c => {
        h += '<td><input type="text" value="'+U.escAttr(r[c]||'')+'" oninput="AppState.customMasters['+idx+'].rows['+ri+'][\''+U.escAttr(c)+'\']=this.value" /></td>';
      });
      h += '<td><button class="small danger" onclick="AppState.customMasters['+idx+'].rows.splice('+ri+',1); AppState.save(); Home.editCustomMaster('+idx+')">×</button></td></tr>';
    });
    h += '</tbody></table></div>';
    App.openModal('Edit Master: ' + cm.name, h, '<button class="primary" onclick="AppState.save(); App.closeModal();">Save & Close</button>');
  },
  _cmAddRow(idx) {
    const cm = AppState.customMasters[idx];
    const blank = {}; cm.columns.forEach(c => blank[c]='');
    cm.rows = cm.rows || [];
    cm.rows.push(blank);
    AppState.save();
    Home.editCustomMaster(idx);
  },
  deleteCustomMaster(idx) {
    if (!confirm('Delete this master?')) return;
    AppState.customMasters.splice(idx, 1);
    AppState.save();
    App.navigate('home');
  }
};

defaultTemplate() {

      toleranceMode: 'amount',

      editableColumns: [], // <-- Added tracking for editable columns

  create() {

    RecoTemplate._isNew = true;
    RecoTemplate._step = 1;
    RecoTemplate._sampleHeaders = [];
    RecoTemplate._sampleData = [];
    RecoTemplate.renderEditor();
  },
  _renderAdditionalColumnsEditor(t) {

    let h = '<div class="editor-section"><div class="section-head"><strong>Additional Columns <span class="text-muted">(tags, formulas, master lookups, cascade)</span></strong>';
    h += '<button class="small primary" onclick="RecoTemplate.addExtraCol()">+ Add</button></div>';

    if (!(t.additionalColumns||[]).length) {
      h += '<div class="empty">No additional columns yet.</div></div>';
      return h;
    }

    h += '<div class="help">Order matters for cascading: each column can reference columns declared <b>above</b> it via <code>{ColName}</code> in formulas, or via the master-match dropdown.</div>';
    h += '<table><thead><tr><th style="width:30px">↕</th><th>Name</th><th>Type</th><th>Configuration</th><th></th></tr></thead><tbody>';

    (t.additionalColumns||[]).forEach((ac,i) => {
      h += '<tr>';
      h += '<td><button class="small" onclick="RecoTemplate.moveExtra('+i+',-1)">↑</button>';
      h += '<button class="small" onclick="RecoTemplate.moveExtra('+i+',1)">↓</button></td>';

      h += '<td><select onchange="RecoTemplate._setExtraType('+i+',this.value)">';
      [
        ['custom',         'Free text'],
        ['dropdown',       'Dropdown'],
        ['formula',        'Formula'],
        ['master_lookup',  'Master lookup'],
        ['master',         'Master lookup (legacy: Accounts only)']
      ].forEach(o => { h += '<option value="'+o[0]+'"'+(ac.type===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
      h += '</select></td>';
      h += '<td>'+RecoTemplate._extraConfigCell(t, ac, i, masterCatalog)+'</td>';
      h += '<td><button class="small danger" onclick="RecoTemplate._editing.additionalColumns.splice('+i+',1); RecoTemplate.renderEditor()">×</button></td>';
      h += '</tr>';

  },
  _editCfg(t, colName) {
    t.editableColumnConfig = t.editableColumnConfig || {};
    return t.editableColumnConfig[colName] = t.editableColumnConfig[colName] || { editType:'free' };
  },

  _renderEditTypeSelect(t, colName) {
    const cfg = RecoTemplate._editCfg(t, colName);
    const safe = U.escAttr(colName);
    let h = '<select onchange="RecoTemplate._setEditType(\''+safe+'\',this.value)">';
    [
      ['free',     'Free text'],
      ['dropdown', 'Dropdown (strict)'],
      ['datalist', 'Dropdown w/ manual override']
    ].forEach(o => { h += '<option value="'+o[0]+'"'+(cfg.editType===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
    h += '</select>';
    return h;
  },

  _setEditType(colName, type) {
    const t = RecoTemplate._editing;
    const cfg = RecoTemplate._editCfg(t, colName);
    cfg.editType = type;
    if (type === 'dropdown' || type === 'datalist') {
      cfg.optionsSource = cfg.optionsSource || 'manual';
      cfg.manualOptions = cfg.manualOptions || [];
      cfg.masterCfg = cfg.masterCfg || { source:'accounts', field:'Reference' };
    }
    RecoTemplate.renderEditor();
  },

  _renderEditTypeConfig(t, colName) {
    const cfg = RecoTemplate._editCfg(t, colName);
    if (cfg.editType !== 'dropdown' && cfg.editType !== 'datalist') {
      return '<span class="text-muted">—</span>';
    }
    const safe = U.escAttr(colName);
    const masters = Masters.catalog(t.id);
    let h = '';
    h += '<label class="inline">Source: <select onchange="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].optionsSource=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="manual"'+(cfg.optionsSource==='manual'?' selected':'')+'>Manual list</option>';
    h += '<option value="master"'+(cfg.optionsSource==='master'?' selected':'')+'>From master column</option>';
    h += '</select></label>';

      const masterCols = cfg.masterCfg && cfg.masterCfg.source ? Masters.columns(cfg.masterCfg.source, t.id) : [];

      h += '<select onchange="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].masterCfg.field=this.value">';
      h += '<option value="">— field —</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.masterCfg && cfg.masterCfg.field===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '</div>';
    } else {
      h += '<input type="text" placeholder="opt1, opt2, opt3" value="'+U.escAttr((cfg.manualOptions||[]).join(', '))+'" oninput="RecoTemplate._editing.editableColumnConfig[\''+safe+'\'].manualOptions=this.value.split(\',\').map(s=>s.trim()).filter(Boolean)" style="margin-top:4px;" />';
    }
    return h;
  },


  _setExtraType(i, type) {
    const ac = RecoTemplate._editing.additionalColumns[i];
    ac.type = type;
    // Init defaults per type
    if (type === 'master_lookup') {
      ac.masterCfg = ac.masterCfg || { source: 'accounts', matchColumn: '', matchKey: 'Reference', returnKey: 'RC' };
    }
    if (type === 'dropdown') {
      ac.optionsSource = ac.optionsSource || 'manual';
      ac.options = ac.options || [];
      ac.optionsMasterCfg = ac.optionsMasterCfg || { source: 'accounts', field: 'Reference' };
    }
    RecoTemplate.renderEditor();
  },

  moveExtra(i, dir) {
    const arr = RecoTemplate._editing.additionalColumns;
    const j = i + dir; if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    RecoTemplate.renderEditor();
  },

  _extraConfigCell(t, ac, i, masterCatalog) {
    const cols = t.columns;
    const earlierExtras = (t.additionalColumns||[]).slice(0, i); // columns above this one
    const allRefCols = cols.map(c => ({val:c.name,label:c.label||c.name})).concat(earlierExtras.map(e => ({val:e.name, label:e.name+' (extra)'})));

    if (ac.type === 'custom') {
      return '<span class="text-muted">Free-text input per row</span>';
    }

    if (ac.type === 'formula') {
      return '<input type="text" placeholder="e.g. {Col1} - {Col2} or LEFT({Desc},5)" value="'+U.escAttr(ac.formula||'')+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].formula=this.value" />'
        + '<div class="help">Available cols: ' + allRefCols.map(c => '<code>{'+U.esc(c.val)+'}</code>').join(' ') + '</div>';
    }

    if (ac.type === 'dropdown') {
      let h = '';
      h += '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">';
      h += '<label class="inline">Source: <select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsSource=this.value; RecoTemplate.renderEditor()">';
      h += '<option value="manual"'+(ac.optionsSource==='manual'||!ac.optionsSource?' selected':'')+'>Manual list</option>';
      h += '<option value="master"'+(ac.optionsSource==='master'?' selected':'')+'>From a master column</option>';
      h += '</select></label>';
      h += '</div>';
      if (ac.optionsSource === 'master') {
        const cfg = ac.optionsMasterCfg || {};
        const masterCols = cfg.source ? Masters.columns(cfg.source, t.id) : [];
        h += '<div style="display:flex; gap:4px; margin-top:4px; flex-wrap:wrap;">';
        h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsMasterCfg.source=this.value; RecoTemplate.renderEditor()" style="flex:1; min-width:140px;">';
        h += '<option value="">— master —</option>';
        masterCatalog.forEach(m => { h += '<option value="'+U.escAttr(m.id)+'"'+(cfg.source===m.id?' selected':'')+'>'+U.esc(m.label)+'</option>'; });
        h += '</select>';
        h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].optionsMasterCfg.field=this.value" style="flex:1; min-width:120px;">';
        h += '<option value="">— field —</option>';
        masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.field===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
        h += '</select>';
        h += '</div>';
      } else {
        h += '<input type="text" placeholder="opt1, opt2, opt3" value="'+U.escAttr((ac.options||[]).join(', '))+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].options=this.value.split(\',\').map(s=>s.trim()).filter(Boolean)" style="margin-top:4px;" />';
      }
      return h;
    }

    if (ac.type === 'master') {
      // legacy: accounts-only
      let h = '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterRefColumn=this.value" style="flex:1;min-width:120px;"><option value="">Match column…</option>';
      allRefCols.forEach(c => { h += '<option value="'+U.escAttr(c.val)+'"'+(ac.masterRefColumn===c.val?' selected':'')+'>'+U.esc(c.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterValueColumn=this.value" style="flex:1;min-width:120px;"><option value="">Master field…</option>';
      ['Reference','RC','Nominal','SubNominal','AnalysisKey','LOB'].forEach(f => { h += '<option value="'+f+'"'+(ac.masterValueColumn===f?' selected':'')+'>'+f+'</option>'; });
      h += '</select>';
      h += '</div>';
      h += '<div class="help">Legacy mode: looks up against Accounts Master only. Use <b>Master lookup</b> type to target other masters.</div>';
      return h;
    }

    if (ac.type === 'master_lookup') {
      const cfg = ac.masterCfg || {};
      const masterCols = cfg.source ? Masters.columns(cfg.source, t.id) : [];
      let h = '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.source=this.value; RecoTemplate.renderEditor()" style="flex:1; min-width:140px;"><option value="">— master —</option>';
      masterCatalog.forEach(m => { h += '<option value="'+U.escAttr(m.id)+'"'+(cfg.source===m.id?' selected':'')+'>'+U.esc(m.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.matchColumn=this.value" style="flex:1; min-width:120px;"><option value="">My column…</option>';
      allRefCols.forEach(c => { h += '<option value="'+U.escAttr(c.val)+'"'+(cfg.matchColumn===c.val?' selected':'')+'>'+U.esc(c.label)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.matchKey=this.value" style="flex:1; min-width:110px;"><option value="">Match against…</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.matchKey===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterCfg.returnKey=this.value" style="flex:1; min-width:110px;"><option value="">Return field…</option>';
      masterCols.forEach(c => { h += '<option value="'+U.escAttr(c)+'"'+(cfg.returnKey===c?' selected':'')+'>'+U.esc(c)+'</option>'; });
      h += '</select>';
      h += '</div>';
      return h;
    }

    return '';
  },

  edit(id) {
    const t = AppState.recoTemplates.find(x => x.id === id);
    if (!t) return;
    RecoTemplate._editing = JSON.parse(JSON.stringify(t));
    if (!RecoTemplate._editing.editableColumnConfig) RecoTemplate._editing.editableColumnConfig = {};
    if (!RecoTemplate._editing.aegIntegration) RecoTemplate._editing.aegIntegration = { enabled:false, aegTemplateId:'', keywordColumn:'', keywordValues:'', postEntryColumn:'', postEntryValue:'' };
    if (!RecoTemplate._editing.reports) RecoTemplate._editing.reports = [];
    if (!RecoTemplate._editing.docNumberColumn) RecoTemplate._editing.docNumberColumn = '';
    if (!RecoTemplate._editing.savedFilterSets) RecoTemplate._editing.savedFilterSets = [];
    RecoTemplate._isNew = false;
    RecoTemplate._step = 1;
    RecoTemplate._sampleHeaders = t.columns.map(c => c.name);
    RecoTemplate.renderEditor();
  },
  duplicate(id) {
    const t = AppState.recoTemplates.find(x => x.id === id);
    if (!t) return;
    const c = JSON.parse(JSON.stringify(t));
    c.id = U.uid();
    c.name = t.name + ' (copy)';
    AppState.recoTemplates.push(c);
    AppState.save();
    App.navigate('home');
    U.toast('Template duplicated','success');
  },
  remove(id) {
    if (!confirm('Delete this reconciliation template?')) return;
    AppState.recoTemplates = AppState.recoTemplates.filter(x => x.id !== id);
    delete AppState.recoSessions[id];
    delete AppState.entryHistory[id];
    delete AppState.docNumberMaster[id];
    delete AppState.manualOffsetMaster[id];
    delete AppState.correctionMaster[id];
    AppState.save();
    App.navigate('home');
  },
  open(id) {
    AppState.activeRecoId = id;
    document.getElementById('navReco').style.display = '';
    App.navigate('reco', id);
  },

  renderEditor() {
    const t = RecoTemplate._editing;
    const step = RecoTemplate._step;
    let body = '';
    const steps = ['Columns','Keys & Rules','Display & Pivot','AEG & Reports','Review'];
    body += '<div style="display:flex; gap:4px; margin-bottom:14px;">';
    steps.forEach((s,i) => {
      const cls = (i+1===step)?'active':((i+1<step)?'done':'');
      body += '<div style="flex:1; padding:8px 10px; text-align:center; font-size:11px; font-weight:600; border-radius:4px; background:' +
        (cls==='active'?'var(--primary, #2563eb)':cls==='done'?'var(--step-done-bg, #d1fae5)':'var(--step-bg, #f3f4f6)') + '; color:' +
        (cls==='active'?'#fff':cls==='done'?'var(--step-done-text, #065f46)':'var(--text-muted, #6b7280)') + ';">' + (i+1) + '. ' + s + '</div>';
    });
    body += '</div>';
    if (step === 1) body += RecoTemplate.renderStep1(t);
    else if (step === 2) body += RecoTemplate.renderStep2(t);
    else if (step === 3) body += RecoTemplate.renderStep3(t);
    else if (step === 4) body += RecoTemplate.renderStep4(t);
    else if (step === 5) body += RecoTemplate.renderStep5(t);

    let footer = '';
    // NEW: Quick Save mode for direct report editing
    if (RecoTemplate._isQuickEdit) {
      footer = '<button onclick="App.closeModal(); RecoTemplate._isQuickEdit=false;">Cancel</button><div style="flex:1"></div><button class="success" onclick="Reco.saveReportEdits(); RecoTemplate._isQuickEdit=false;">Save Report Settings</button>';
    } else {
      // Standard 5-step wizard
      if (step > 1) footer += '<button onclick="RecoTemplate._step--; RecoTemplate.renderEditor()">← Back</button>';
      footer += '<div style="flex:1"></div>';
      if (step < 5) footer += '<button class="primary" onclick="RecoTemplate._step++; RecoTemplate.renderEditor()">Next →</button>';
      if (step === 5) footer += '<button class="success" onclick="RecoTemplate.saveTemplate()">Save Template</button>';
    }

    App.openModal(RecoTemplate._isNew ? 'New Reco Template' : (RecoTemplate._isQuickEdit ? 'Quick Edit Report' : 'Edit Reco Template'), body, '<div style="display:flex;width:100%; align-items:center;">'+footer+'</div>');
  },


  /* ---------- Step 1 ---------- */
  renderStep1(t) {
    let h = '';
    h += '<label class="field"><span class="label-text">Template Name</span>';
    h += '<input type="text" value="'+U.escAttr(t.name)+'" oninput="RecoTemplate._editing.name=this.value" /></label>';
    h += '<label class="field"><span class="label-text">Description</span>';
    h += '<input type="text" value="'+U.escAttr(t.description||'')+'" oninput="RecoTemplate._editing.description=this.value" /></label>';
    h += '<div class="divider"></div>';
    h += '<h3>Define Columns</h3>';
    h += '<div class="help">Upload a sample file to auto-detect columns, or add manually. Mark <b>Date</b> columns to enable date filters and date formulas (MONTH, AGEING, etc).</div>';
    h += '<div class="toolbar" style="margin-top:8px;">';
    h += '<input type="file" id="sampleFile" accept=".csv,.xlsx" style="display:none" onchange="RecoTemplate.loadSample(event)" />';
    h += '<button onclick="document.getElementById(\'sampleFile\').click()">Upload Sample CSV/XLSX</button>';
    h += '<button onclick="RecoTemplate.showPaste()">Paste Data</button>';
    h += '<button onclick="RecoTemplate.addCol()">+ Add Column</button>';
    h += '</div>';
    h += '<div id="rtPasteBox" style="display:none; margin-bottom:10px;">';
    h += '<textarea id="rtPasteData" placeholder="Paste tab-separated or CSV data (headers in first row)"></textarea>';
    h += '<div style="margin-top:6px"><button class="primary small" onclick="RecoTemplate.parsePaste()">Parse</button>';
    h += '<button class="small" onclick="document.getElementById(\'rtPasteBox\').style.display=\'none\'">Cancel</button></div></div>';

    if (t.columns.length) {
      h += '<div style="overflow-x:auto"><table><thead><tr>';
      h += '<th>Column Name</th><th>Label</th><th>Format Patterns</th><th>Value</th><th>Date</th><th></th>';
      h += '</tr></thead><tbody>';
      t.columns.forEach((c,i) => {
        h += '<tr>';
        h += '<td><input type="text" value="'+U.escAttr(c.name)+'" oninput="RecoTemplate._editing.columns['+i+'].name=this.value" /></td>';
        h += '<td><input type="text" value="'+U.escAttr(c.label||c.name)+'" oninput="RecoTemplate._editing.columns['+i+'].label=this.value" /></td>';
        h += '<td>' + RecoTemplate.renderFormatRows(c, i) + '</td>';
        h += '<td style="text-align:center;"><input type="checkbox" '+(c.isValue?'checked':'')+' onchange="RecoTemplate._editing.columns['+i+'].isValue=this.checked" /></td>';
        h += '<td style="text-align:center;"><input type="checkbox" '+(c.isDate?'checked':'')+' onchange="RecoTemplate._editing.columns['+i+'].isDate=this.checked" /></td>';
        h += '<td><button class="small danger" onclick="RecoTemplate._editing.columns.splice('+i+',1); RecoTemplate.renderEditor()">×</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      h += '<div class="help">Format pattern letters: <code>D</code>=single digit, <code>N</code>=digits string, <code>A</code>=single letter, <code>T</code>=letters string, <code>S</code>=alphanumeric. Other characters are literal.</div>';
    }
    return h;
  },
  renderFormatRows(col, colIdx) {
    const formats = col.formats || [];
    let h = '<div>';
    if (formats.length === 0) {
      h += '<div class="text-muted" style="margin-bottom:4px;">no formats</div>';
    } else {
      formats.forEach((fmt, fi) => {
        h += '<div style="display:flex; gap:3px; margin-bottom:3px;">';
        h += '<input type="text" value="'+U.escAttr(fmt)+'" placeholder="DDDDD or N-A@D" oninput="RecoTemplate.updateFormat('+colIdx+','+fi+',this.value)" style="flex:1; min-width:90px;" />';
        h += '<button class="small danger" onclick="RecoTemplate.removeFormat('+colIdx+','+fi+')">×</button>';
        h += '</div>';
      });
    }
    h += '<button class="small" onclick="RecoTemplate.addFormat('+colIdx+')">+ Add format</button>';
    h += '</div>';
    return h;
  },
  addFormat(colIdx) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats = c.formats || [];
    c.formats.push('');
    RecoTemplate.renderEditor();
  },
  removeFormat(colIdx, fi) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats.splice(fi, 1);
    RecoTemplate.renderEditor();
  },
  updateFormat(colIdx, fi, val) {
    const c = RecoTemplate._editing.columns[colIdx];
    c.formats[fi] = val;
  },

  /* ---------- Step 2 ---------- */
  renderStep2(t) {
    let h = '';
    const cols = t.columns;
    if (!cols.length) { return '<div class="empty">Define columns in Step 1 first.</div>'; }

    h += '<div class="editor-section"><div class="section-head"><strong>Primary Key</strong></div>';
    h += '<div class="help">Optional. Select column(s) that together uniquely identify each row. Used for correction tracking and offset master.</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.primaryKeys||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.togglePK(\''+U.escAttr(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div></div>';

    h += RecoTemplate._renderAdditionalColumnsEditor(t);

    h += '<div class="editor-section"><div class="section-head"><strong>Currency &amp; Exchange</strong></div>';
    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Currency Mode</span>';
    h += '<select onchange="RecoTemplate._editing.currencyMode=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="AED"'+(t.currencyMode==='AED'?' selected':'')+'>AED only</option>';
    h += '<option value="fromColumn"'+(t.currencyMode==='fromColumn'?' selected':'')+'>From column</option>';
    h += '</select></label>';
    if (t.currencyMode === 'fromColumn') {
      h += '<label class="field"><span class="label-text">Currency Column</span>';
      h += RecoTemplate.colSelect('currencyColumn', t.currencyColumn);
      h += '</label>';
    } else h += '<div></div>';
    h += '<label class="field"><span class="label-text">Exchange Mode</span>';
    h += '<select onchange="RecoTemplate._editing.exchangeMode=this.value; RecoTemplate.renderEditor()">';
    h += '<option value="asRequired"'+(t.exchangeMode==='asRequired'?' selected':'')+'>As required</option>';
    h += '<option value="autoExchange"'+(t.exchangeMode==='autoExchange'?' selected':'')+'>Auto Exchange (3 lines)</option>';
    h += '</select></label>';
    if (t.exchangeMode === 'autoExchange') {
      h += '<label class="field"><span class="label-text">Exchange Column</span>';
      h += RecoTemplate.colSelect('exchangeColumn', t.exchangeColumn);
      h += '</label>';
    } else h += '<div></div>';
    h += '</div>';
    h += '<label class="field"><span class="label-text">Reco Account Reference (From Account)</span>';
    h += '<input type="text" value="'+U.escAttr(t.recoAccountRef||'')+'" oninput="RecoTemplate._editing.recoAccountRef=this.value" placeholder="Reference in Accounts Master" /></label>';
    h += '</div>';

    h += '<div class="editor-section"><div class="section-head"><strong>Value, Document Number &amp; Aggregation</strong></div>';
    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Value Column</span>';
    h += RecoTemplate.colSelect('valueColumn', t.valueColumn);
    h += '</label>';
    h += '<label class="field"><span class="label-text">Document Number Column <span class="text-muted">(scans against past entries)</span></span>';
    h += RecoTemplate.colSelect('docNumberColumn', t.docNumberColumn || '');
    h += '</label>';
    h += '</div>';
        h += '<label class="inline"><input type="checkbox" '+(t.aggregate?'checked':'')+' onchange="RecoTemplate._editing.aggregate=this.checked; RecoTemplate.renderEditor()"> Enable Aggregation</label>';
    if (t.aggregate) {
      h += '<div style="margin-top:6px;">';
      cols.forEach(c => {
        const checked = (t.aggregateBy||[]).includes(c.name);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleAggBy(\''+U.escAttr(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
      });
      // Aggregation can also include additional columns (declared above)
      (t.additionalColumns||[]).forEach(ac => {
        const checked = (t.aggregateBy||[]).includes(ac.name);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleAggBy(\''+U.escAttr(ac.name)+'\',this.checked)"><span class="badge specific">extra</span> '+U.esc(ac.name)+'</label>';
      });
      h += '</div>';
    }
    h += '<div class="grid-2" style="margin-top:10px;">';
    h += '<label class="field"><span class="label-text">Tolerance Mode</span>';
    h += '<select onchange="RecoTemplate._editing.toleranceMode=this.value">';
    h += '<option value="amount"'+(t.toleranceMode==='amount'?' selected':'')+'>Amount</option>';
    h += '<option value="percentage"'+(t.toleranceMode==='percentage'?' selected':'')+'>Percentage</option>';
    h += '</select></label>';
    h += '<label class="field"><span class="label-text">Tolerance Value</span>';
    h += '<input type="number" value="'+(t.toleranceValue||0)+'" step="0.01" oninput="RecoTemplate._editing.toleranceValue=parseFloat(this.value)||0" /></label>';
    h += '</div></div>';

    h += '<div class="editor-section"><div class="section-head"><strong>Options</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.enableReporting?'checked':'')+' onchange="RecoTemplate._editing.enableReporting=this.checked"> Enable Reporting</label>';
    h += '<label class="inline"><input type="checkbox" '+(t.enableCorrections?'checked':'')+' onchange="RecoTemplate._editing.enableCorrections=this.checked"> Enable Column Corrections</label>';
    h += '<label class="inline"><input type="checkbox" '+(t.groupsEnabled?'checked':'')+' onchange="RecoTemplate._editing.groupsEnabled=this.checked"> Enable Groups <span class="text-muted">(requires primary keys)</span></label>';
    h += '</div>';

    return h;
  },
  /* ---------- Step 3: Display, Additional Cols (with master refs), Pivot ---------- */
  renderStep3(t) {
    let h = '';
    const cols = t.columns;
    if (!cols.length) { return '<div class="empty">Define columns in Step 1 first.</div>'; }

    // Display columns
    h += '<div class="editor-section"><div class="section-head"><strong>Display Columns in Reco Tab</strong>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllDisplay(true); RecoTemplate.renderEditor()">All</button>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllDisplay(false); RecoTemplate.renderEditor()">None</button>';
    h += '</div>';
    h += '<div class="help">Only checked columns will be visible in the Reco grid. Other columns remain in the data and exports.</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.displayColumns||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleDisplay(\''+U.escAttr(c.name)+'\',this.checked)"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div></div>';

    // Editable Columns (NEW)
    h += '<div class="editor-section"><div class="section-head"><strong>Editable Columns</strong>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllEditable(true); RecoTemplate.renderEditor()">All</button>';
    h += '<button class="small" onclick="RecoTemplate.toggleAllEditable(false); RecoTemplate.renderEditor()">None</button></div>';
    h += '<div class="help">For each column you make editable, choose how the user edits it: free text, a dropdown (manual or sourced from a master), or a dropdown with manual override (datalist).</div>';
    h += '<div style="margin-top:6px;">';
    cols.forEach(c => {
      const checked = (t.editableColumns||[]).includes(c.name);
      h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleEditable(\''+U.escAttr(c.name)+'\',this.checked); RecoTemplate.renderEditor()"> '+U.esc(c.label||c.name)+'</label>';
    });
    h += '</div>';

    // Per-column edit-type config
    const editCols = (t.editableColumns||[]);
    if (editCols.length) {
      h += '<table style="margin-top:8px;"><thead><tr><th>Column</th><th>Edit type</th><th>Configuration</th></tr></thead><tbody>';
      editCols.forEach(colName => {
        h += '<tr><td><b>'+U.esc(colName)+'</b></td>';
        h += '<td>'+RecoTemplate._renderEditTypeSelect(t, colName)+'</td>';
        h += '<td>'+RecoTemplate._renderEditTypeConfig(t, colName)+'</td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';


    if ((t.additionalColumns||[]).length) {
      h += '<table><thead><tr><th>Name</th><th>Type</th><th>Configuration</th><th></th></tr></thead><tbody>';
      (t.additionalColumns||[]).forEach((ac,i) => {
        h += '<tr>';
        h += '<td><input type="text" value="'+U.escAttr(ac.name)+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].name=this.value" /></td>';
        h += '<td><select onchange="RecoTemplate._editing.additionalColumns['+i+'].type=this.value; RecoTemplate.renderEditor()">';
        h += '<option value="dropdown"'+(ac.type==='dropdown'?' selected':'')+'>Dropdown</option>';
        h += '<option value="custom"'+(ac.type==='custom'?' selected':'')+'>Free text</option>';
        h += '<option value="formula"'+(ac.type==='formula'?' selected':'')+'>Formula</option>';
        h += '<option value="master"'+(ac.type==='master'?' selected':'')+'>Master lookup</option>';
        h += '</select></td>';
        h += '<td>';
        if (ac.type==='dropdown') {
          h += '<input type="text" placeholder="opt1, opt2, opt3" value="'+U.escAttr((ac.options||[]).join(', '))+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].options=this.value.split(\',\').map(s=>s.trim()).filter(Boolean)" />';
        } else if (ac.type==='formula') {
          h += '<input type="text" placeholder="e.g. {Col1} - {Col2} or LEFT({Desc},5)" value="'+U.escAttr(ac.formula||'')+'" oninput="RecoTemplate._editing.additionalColumns['+i+'].formula=this.value" />';
        } else if (ac.type==='master') {
          h += '<div style="display:flex; gap:4px; flex-wrap:wrap;">';
          h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterRefColumn=this.value" style="flex:1;min-width:100px;"><option value="">Match column…</option>';
          cols.forEach(c2 => { h += '<option value="'+U.escAttr(c2.name)+'"'+(ac.masterRefColumn===c2.name?' selected':'')+'>'+U.esc(c2.label||c2.name)+'</option>'; });
          h += '</select>';
          h += '<select onchange="RecoTemplate._editing.additionalColumns['+i+'].masterValueColumn=this.value" style="flex:1;min-width:100px;"><option value="">Master field…</option>';
          ['Reference','RC','Nominal','SubNominal','AnalysisKey','LOB'].forEach(f => { h += '<option value="'+f+'"'+(ac.masterValueColumn===f?' selected':'')+'>'+f+'</option>'; });
          h += '</select>';
          h += '</div>';
        } else {
          h += '<span class="text-muted">Free text input per row</span>';
        }
        h += '</td>';
        h += '<td><button class="small danger" onclick="RecoTemplate._editing.additionalColumns.splice('+i+',1); RecoTemplate.renderEditor()">×</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';

    // Pivot (Now includes Additional Columns)
    const allPivotCols = cols.map(c => c.name).concat((t.additionalColumns||[]).map(a => a.name));
    
    h += '<div class="editor-section"><div class="section-head"><strong>Pivot</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.pivotEnabled?'checked':'')+' onchange="RecoTemplate._editing.pivotEnabled=this.checked; RecoTemplate.renderEditor()"> Enable Pivot View</label>';
    if (t.pivotEnabled) {
      h += '<div class="grid-3" style="margin-top:8px;">';
      h += '<label class="field"><span class="label-text">Value Column</span>'+RecoTemplate.colSelect('pivotValueCol',t.pivotValueCol)+'</label>';
      h += '<label class="field"><span class="label-text">Row Columns</span>';
      h += '<div>';
      allPivotCols.forEach(c => {
        const checked = (t.pivotRowCols||[]).includes(c);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleArr(\'pivotRowCols\',\''+U.escAttr(c)+'\',this.checked)"> '+U.esc(c)+'</label>';
      });
      h += '</div></label>';
      h += '<label class="field"><span class="label-text">Column Columns</span>';
      h += '<div>';
      allPivotCols.forEach(c => {
        const checked = (t.pivotColCols||[]).includes(c);
        h += '<label class="inline"><input type="checkbox" '+(checked?'checked':'')+' onchange="RecoTemplate.toggleArr(\'pivotColCols\',\''+U.escAttr(c)+'\',this.checked)"> '+U.esc(c)+'</label>';
      });
      h += '</div></label>';
      h += '</div>';
    }
    h += '</div>';

    return h;
  },

  renderStep4(t) {
    const cols = t.columns;
    const allColsWithExtras = cols.map(c => c.name).concat((t.additionalColumns||[]).map(ac => ac.name));
    let h = '';
    // AEG Integration
    h += '<div class="editor-section"><div class="section-head"><strong>AEG Integration</strong></div>';
    h += '<label class="inline"><input type="checkbox" '+(t.aegIntegration.enabled?'checked':'')+' onchange="RecoTemplate._editing.aegIntegration.enabled=this.checked; RecoTemplate.renderEditor()"> Enable AEG entry generation from this template</label>';
    if (t.aegIntegration.enabled) {
      h += '<div class="grid-2" style="margin-top:8px;">';
      h += '<label class="field"><span class="label-text">Linked AEG Template</span>';
      h += '<select onchange="RecoTemplate._editing.aegIntegration.aegTemplateId=this.value; RecoTemplate.renderEditor()">';
      h += '<option value="">— select AEG template —</option>';
      AppState.aegTemplates.forEach(at => {
        h += '<option value="'+U.escAttr(at.id)+'"'+(t.aegIntegration.aegTemplateId===at.id?' selected':'')+'>'+U.esc(at.name)+'</option>';
      });
      h += '</select></label>';
      
      // Inline AEG Dropdown Overrides inside Reco
      const linkedAegTpl = AppState.aegTemplates.find(at => at.id === t.aegIntegration.aegTemplateId);
      if (linkedAegTpl) {
        const needsFrom = linkedAegTpl.fromAccount.mode === 'select' && (linkedAegTpl.fromAccount.options || []).length;
        const needsTo = (linkedAegTpl.toAccount.mode === 'select' || linkedAegTpl.toAccount.mode === 'inputOrSelect') && (linkedAegTpl.toAccount.options || []).length;
        
        if (needsFrom) {

    h += '<option value="">— select —</option>';

  togglePK(name, checked) {
    const t = RecoTemplate._editing;
    t.primaryKeys = t.primaryKeys || [];

    else t.primaryKeys = t.primaryKeys.filter(x=>x!==name);
  },
  toggleAggBy(name, checked) {
    const t = RecoTemplate._editing;
    t.aggregateBy = t.aggregateBy || [];
    if (checked) { if (!t.aggregateBy.includes(name)) t.aggregateBy.push(name); }
    else t.aggregateBy = t.aggregateBy.filter(x=>x!==name);
  },
  toggleDisplay(name, checked) {
    const t = RecoTemplate._editing;
    t.displayColumns = t.displayColumns || [];
    if (checked) { if (!t.displayColumns.includes(name)) t.displayColumns.push(name); }
    else t.displayColumns = t.displayColumns.filter(x=>x!==name);
  },
  toggleEditable(name, checked) {
    const t = RecoTemplate._editing;
    t.editableColumns = t.editableColumns || [];
    if (checked) { if (!t.editableColumns.includes(name)) t.editableColumns.push(name); }
    else t.editableColumns = t.editableColumns.filter(x=>x!==name);
  },
  toggleAllEditable(all) {
    const t = RecoTemplate._editing;
    t.editableColumns = all ? t.columns.map(c => c.name) : [];
  },
  toggleAllDisplay(all) {
    const t = RecoTemplate._editing;
    t.displayColumns = all ? t.columns.map(c => c.name) : [];
  },
  toggleArr(arrKey, name, checked) {
    const t = RecoTemplate._editing;
    t[arrKey] = t[arrKey] || [];
    if (checked) { if (!t[arrKey].includes(name)) t[arrKey].push(name); }
    else t[arrKey] = t[arrKey].filter(x=>x!==name);
  },
  addCol() {
    const name = 'Column' + (RecoTemplate._editing.columns.length+1);
    RecoTemplate._editing.columns.push({ name, label: name, formats: [], isValue: false, isDate: false });
    RecoTemplate.renderEditor();
  },
  addExtraCol() {
    RecoTemplate._editing.additionalColumns = RecoTemplate._editing.additionalColumns || [];
    RecoTemplate._editing.additionalColumns.push({ name: 'Extra', type: 'custom', options: [], formula: '', masterRefColumn: '', masterValueColumn: '' });
    RecoTemplate.renderEditor();
  },
  addReport() {
    RecoTemplate._editing.reports = RecoTemplate._editing.reports || [];
    RecoTemplate._editing.reports.push({ 
      id: U.uid(), 
      name: 'Report ' + (RecoTemplate._editing.reports.length+1), 
      columns: [], filters: [], logic: 'AND', sortCol: '', sortDir: 'asc', computedCols: [],
      showHeader: true, showTotalRow: false, summaryCards: [], dateFormats: {} 
    });
    RecoTemplate.renderEditor();
  },
  moveReportCol(ri, ci, dir) {
    const r = RecoTemplate._editing.reports[ri];
    const arr = r.columns;
    if (!arr) return;
    const j = ci + dir;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[ci]; arr[ci] = arr[j]; arr[j] = tmp;
    RecoTemplate.renderEditor();
  },
  updateReportDateFormat(ri, colName, fmt) {
    const r = RecoTemplate._editing.reports[ri];
    r.dateFormats = r.dateFormats || {};
    r.dateFormats[colName] = fmt;
  },
  toggleReportCol(ri, name, checked) {
    const r = RecoTemplate._editing.reports[ri];
    r.columns = r.columns || [];
    if (checked) { if (!r.columns.includes(name)) r.columns.push(name); }
    else r.columns = r.columns.filter(x => x !== name);
  },
  addReportFilter(ri) {
    const r = RecoTemplate._editing.reports[ri];
    r.filters = r.filters || [];
    r.filters.push({ col: '', op: 'contains', val: '', val2: '' });
    RecoTemplate.renderEditor();
  },
  showPaste() {
    setTimeout(() => { const el = document.getElementById('rtPasteBox'); if(el) el.style.display='block'; }, 50);
  },
  loadSample(ev) {
    const file = ev.target.files[0]; if (!file) return;
    U.parseFile(file, (data, fields) => {
      RecoTemplate._sampleHeaders = fields;
      RecoTemplate._editing.columns = fields.map(f => ({ name: f, label: f, formats: [], isValue: false, isDate: false }));
      if (!RecoTemplate._editing.displayColumns.length) RecoTemplate._editing.displayColumns = fields.slice();
      RecoTemplate.renderEditor();
      U.toast('Detected '+fields.length+' columns','success');
    });
    ev.target.value = '';
  },
  parsePaste() {
    const txt = document.getElementById('rtPasteData')?.value?.trim();
    if (!txt) return;
    const { data, fields } = U.parsePaste(txt);
    RecoTemplate._sampleHeaders = fields;
    RecoTemplate._editing.columns = fields.map(f => ({ name: f, label: f, formats: [], isValue: false, isDate: false }));
    if (!RecoTemplate._editing.displayColumns.length) RecoTemplate._editing.displayColumns = fields.slice();
    RecoTemplate.renderEditor();
    U.toast('Detected '+fields.length+' columns','success');
  },
  saveTemplate() {
    const t = RecoTemplate._editing;
    if (!t.name?.trim()) { U.toast('Name is required','error'); return; }
    if (!t.columns.length) { U.toast('Define at least one column','error'); return; }
    
    // Ensure display columns exist
    if (!t.displayColumns.length) t.displayColumns = t.columns.map(c=>c.name);

    if (RecoTemplate._isNew) {
      AppState.recoTemplates.push(t);
    } else {
      const i = AppState.recoTemplates.findIndex(x=>x.id===t.id);
      if (i!==-1) AppState.recoTemplates[i] = t;
    }

    // --- THE CRITICAL FIX ---
    // This triggers the bridge we set up in Module 3/4 
    // which flattens the data and sends it to Python.
    AppState.save(); 

    App.closeModal();
    App.navigate('home');
    U.toast('Template saved to database','success');
  }
};

/* ================================================================
   MODULE 8 — RECONCILIATION ENGINE
   Full-height shell for Reco page; preserves manual offsets across
   re-calculation; integrates AEG; supports document number scan.
   ================================================================ */
const Reco = {
  // Add this state tracker at the top level of your Reco object
// 1. The state tracker
  _dragState: { isDragging: false, mode: 'select' },

  // 2. Start Drag
  startDragSelect(e, rowId) {
    // Right-click and middle-click handled elsewhere
    if (e.button !== 0) return;
    // Ignore if clicking a button or input
    if (['INPUT', 'SELECT', 'BUTTON'].includes(e.target.tagName)) return;

    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (!sess) return;
    
    if (sess.spreadsheetMode) return;
    
    sess.selectedRows = sess.selectedRows || {};
    const isCurrentlySelected = !!sess.selectedRows[rowId];

    if (e.ctrlKey || e.metaKey) {
      Reco._dragState.mode = isCurrentlySelected ? 'deselect' : 'select';
      if (isCurrentlySelected) delete sess.selectedRows[rowId];
      else sess.selectedRows[rowId] = true;
    } else {
      sess.selectedRows = {};
      sess.selectedRows[rowId] = true;
      Reco._dragState.mode = 'select';
    }

    Reco._dragState.isDragging = true;
    Reco._updateVisualRow(e.currentTarget, Reco._dragState.mode === 'select');

    // Attach global mouseup listener pointing explicitly to Reco
    document.addEventListener('mouseup', Reco.endDragSelect, { once: true });
  },
_xlUpdateTable(worksheet, cell, col, row, value /*, label, cellName */) {
  // col = x index, row = y index, cell = the <td> element
  if (!Reco._xlRows || !Reco._xlCols) return;
  const r = Reco._xlRows[row];
  if (!r) return;
  const id   = AppState.activeRecoId;
  const sess = AppState.recoSessions[id];
  const tpl  = AppState.recoTemplates.find(x => x.id === id);
  if (!sess || !tpl) return;

  // Status column (x = 0): rich badges
  if (col === 0) {
    cell.innerHTML = Reco._xlStatusBadgeHtml ? Reco._xlStatusBadgeHtml(r, sess, tpl)
      : (sess.offsets[r._id] ? 'Offset' : 'Open');
    cell.style.whiteSpace = 'nowrap';
    return;
  }

  // Data columns: format-error / corrected / offset coloring
  const colName = Reco._xlCols[col];
  if (!colName) return;
  const colDef = tpl.columns.find(c => c.name === colName);
  cell.classList.remove('jss-err', 'jss-corr', 'jss-row-offset');
  if (r['_corrected_' + colName]) {
    cell.classList.add('jss-corr');
  } else if (colDef && colDef.formats && colDef.formats.length && !FMT.validate(r[colName], colDef.formats)) {
    cell.classList.add('jss-err');
  }
  if (sess.offsets && sess.offsets[r._id]) cell.classList.add('jss-row-offset');
},
