_ssVisibleCols() {
  const wrap = document.querySelector('.reco-table-wrap');
  if (!wrap) return [];
  return Array.from(wrap.querySelectorAll('thead th[data-col]')).map(th => th.dataset.col);
},

_ssApplyHighlight() {
  const wrap = document.querySelector('.reco-table-wrap');
  if (!wrap) return;
  wrap.querySelectorAll('td.ss-active-cell, td.ss-selected-cell').forEach(td => {
    td.classList.remove('ss-active-cell', 'ss-selected-cell');
  });
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.spreadsheetMode) { wrap.classList.remove('ss-mode'); return; }
  wrap.classList.add('ss-mode');

  const cols = Reco._ssVisibleCols();
  const sr = sess.selRange;
  if (sr) {
    const minF = Math.min(sr.startFidx, sr.endFidx);
    const maxF = Math.max(sr.startFidx, sr.endFidx);
    const sc = cols.indexOf(sr.startCol), ec = cols.indexOf(sr.endCol);
    const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
    for (let f = minF; f <= maxF; f++) {
      const tr = wrap.querySelector('tr[data-frow="'+f+'"]');
      if (!tr) continue;
      for (let c = minC; c <= maxC; c++) {
        const col = cols[c];
        if (!col) continue;
        const td = tr.querySelector('td[data-col="'+CSS.escape(col)+'"]');
        if (td) td.classList.add('ss-selected-cell');
      }
    }
  }
  const ac = sess.activeCell;
  if (ac) {
    const td = wrap.querySelector('tr[data-frow="'+ac.fidx+'"] td[data-col="'+CSS.escape(ac.col)+'"]');
    if (td) td.classList.add('ss-active-cell');
  }
  Reco._ssUpdateStats();
  Reco._ssUpdateFormulaBar();
  Reco._ssRenderFillHandle();
},

_ssUpdateStats() {
  let bar = document.getElementById('ssStatusBar');
  const shell = document.querySelector('.reco-shell');
  if (!shell) return;
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'ssStatusBar';
    bar.className = 'ss-statusbar';
    shell.appendChild(bar);
  }
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.spreadsheetMode) { bar.classList.remove('show'); return; }

  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const cells = Reco._ssCellsInRange(sess, filtered);
  if (!cells.length) { bar.classList.remove('show'); return; }

  let sum = 0, count = 0, numCount = 0, minV = Infinity, maxV = -Infinity;
  cells.forEach(v => {
    count++;
    const n = parseFloat(String(v).replace(/,/g, ''));
    if (!isNaN(n) && isFinite(n)) {
      sum += n; numCount++;
      if (n < minV) minV = n;
      if (n > maxV) maxV = n;
    }
  });
  const avg = numCount ? sum / numCount : 0;
  let h = '<span>Count: <b>'+count+'</b></span>';
  if (numCount) {
    h += '<span>Sum: <b>'+U.fmtNum(sum)+'</b></span>';
    h += '<span>Avg: <b>'+U.fmtNum(avg)+'</b></span>';
    h += '<span>Min: <b>'+U.fmtNum(minV)+'</b></span>';
    h += '<span>Max: <b>'+U.fmtNum(maxV)+'</b></span>';
  }
  const ac = sess.activeCell;
  if (ac) h += '<span><code>'+U.esc(ac.col)+'</code> · row '+(ac.fidx+1)+'</span>';
  bar.innerHTML = h;
  bar.classList.add('show');
},

_ssCellsInRange(sess, filtered) {
  const out = [];
  const sr = sess.selRange, ac = sess.activeCell;
  const cols = Reco._ssVisibleCols();
  if (sr) {
    const minF = Math.min(sr.startFidx, sr.endFidx), maxF = Math.max(sr.startFidx, sr.endFidx);
    const sc = cols.indexOf(sr.startCol), ec = cols.indexOf(sr.endCol);
    const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
    for (let f = minF; f <= maxF; f++) {
      const row = filtered[f]; if (!row) continue;
      for (let c = minC; c <= maxC; c++) {
        const col = cols[c]; if (!col) continue;
        out.push(row[col] != null ? row[col] : '');
      }
    }
  } else if (ac) {
    const row = filtered[ac.fidx];
    if (row) out.push(row[ac.col] != null ? row[ac.col] : '');
  }
  return out;
},

_ssSetActiveCell(fidx, col, extend) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.spreadsheetMode) return;
  if (extend && sess.activeCell) {
    sess.selRange = {
      startFidx: sess.activeCell.fidx, endFidx: fidx,
      startCol:  sess.activeCell.col,  endCol:  col
    };
  } else {
    sess.activeCell = { fidx, col };
    sess.selRange = null;
  }
  Reco._ssEnsureVisible(fidx);
  Reco._ssApplyHighlight();
},

_ssEnsureVisible(fidx) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess) return;
  const pageSize = sess.pageSize || 200;
  const targetPage = Math.floor(fidx / pageSize);
  if (targetPage !== sess.page) {
    sess.page = targetPage;
    AppState.save();
    App.navigate('reco');
    setTimeout(() => Reco._ssScrollFidxIntoView(fidx), 60);
    return;
  }
  Reco._ssScrollFidxIntoView(fidx);
},

_ssScrollFidxIntoView(fidx) {
  const wrap = document.querySelector('.reco-table-wrap');
  if (!wrap) return;
  const tr = wrap.querySelector('tr[data-frow="'+fidx+'"]');
  if (tr) { tr.scrollIntoView({ block: 'nearest', behavior: 'auto' }); return; }
  // virtualized — scroll approx and let scroll handler re-render
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const rowH = sess._virtRowHeight || Reco._VIRT_DEFAULT_H;
  const pageSize = sess.pageSize || 200;
  const vi = fidx - (sess.page * pageSize);
  wrap.scrollTop = Math.max(0, (vi * rowH) - wrap.clientHeight / 2);
  setTimeout(() => {
    const tr2 = wrap.querySelector('tr[data-frow="'+fidx+'"]');
    if (tr2) tr2.scrollIntoView({ block: 'nearest' });
    Reco._ssApplyHighlight();
  }, 40);
},

_ssOnClick(e) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.spreadsheetMode) return;
  // Don't hijack clicks on inputs / selects / buttons / badges
  if (e.target.closest('input, select, button, .badge, .col-filter-btn, .col-resize-handle, .col-grip')) return;
  const td = e.target.closest('td[data-col]');
  const tr = e.target.closest('tr[data-frow]');
  if (!td || !tr) return;
  const col = td.dataset.col;
  const fidx = parseInt(tr.dataset.frow, 10);
  if (isNaN(fidx)) return;
  Reco._ssSetActiveCell(fidx, col, e.shiftKey);
  e.preventDefault();
},

_ssOnKey(e) {
  if (AppState.currentPage !== 'reco') return;
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.spreadsheetMode) return;
  // Phase 8: Ctrl+F in Excel View opens JSS's native search
  if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
    const sub = AppState.activeSubSection;
    if (sub === 'excel' && Reco._xlInstance) {
      e.preventDefault();
      Reco._xlOpenSearch();
      return;
    }
  }
  // F2 focuses the formula bar even when nothing else is focused
    if (e.key === 'F2' && sess.activeCell) {
      e.preventDefault();
      const inp = document.getElementById('formulaInput');
      if (inp) { inp.focus(); inp.select(); }
      return;
    }

  // Alt+H toggles the format toolbar
  if (e.altKey && (e.key === 'h' || e.key === 'H')) {
    e.preventDefault();
    Reco.toggleFormatToolbar();
    return;
  }
  // Ctrl+B / Ctrl+I when a cell is active
  if ((e.ctrlKey || e.metaKey) && sess.activeCell && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    Reco._ssApplyFormat('bold', 'toggle');
    return;
  }
  if ((e.ctrlKey || e.metaKey) && sess.activeCell && (e.key === 'i' || e.key === 'I')) {
    e.preventDefault();
    Reco._ssApplyFormat('italic', 'toggle');
    return;
  }


  // Don't interfere when typing in input/select/textarea
  if (e.target.matches('input, select, textarea')) return;
  if (!sess.activeCell) return;
  // Delete / Backspace clears the active cell
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    Reco._ssClearActive();
    return;
  }

  // Type-to-edit: any printable single key with no modifier starts typing in the formula bar
  if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const inp = document.getElementById('formulaInput');
    if (inp) {
      inp.value = e.key;
      inp.focus();
      // Place caret at end
      const v = inp.value; inp.value = ''; inp.value = v;
      e.preventDefault();
      return;
    }
  }

  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const total = filtered.length;
  const cols = Reco._ssVisibleCols();
  const cur = sess.activeCell;
  let { fidx, col } = cur;
  let cIdx = cols.indexOf(col);

  const key = e.key;
  let handled = true;
  let dr = 0, dc = 0;

  if (key === 'ArrowDown')  dr = 1;
  else if (key === 'ArrowUp')    dr = -1;
  else if (key === 'ArrowRight') dc = 1;
  else if (key === 'ArrowLeft')  dc = -1;
  else if (key === 'Home')  { cIdx = 0; }
  else if (key === 'End')   { cIdx = cols.length - 1; }
  else if (key === 'PageDown') dr = 20;
  else if (key === 'PageUp')   dr = -20;
  else if (key === 'Escape')   { sess.activeCell = null; sess.selRange = null; Reco._ssApplyHighlight(); return; }
  else handled = false;

  if (!handled) return;
  e.preventDefault();

  if (e.ctrlKey || e.metaKey) {
    // Jump to extremes; on Ctrl+Down, first jump to last of page, second jump = last of all
    if (dr === 1) {
      const pageSize = sess.pageSize || 200;
      const pageEnd = Math.min(total - 1, (sess.page + 1) * pageSize - 1);
      fidx = (fidx === pageEnd) ? total - 1 : pageEnd;
    } else if (dr === -1) {
      const pageStart = sess.page * (sess.pageSize || 200);
      fidx = (fidx === pageStart) ? 0 : pageStart;
    } else if (dc === 1)  cIdx = cols.length - 1;
    else if (dc === -1)   cIdx = 0;
  } else {
    fidx = Math.max(0, Math.min(total - 1, fidx + dr));
    cIdx = Math.max(0, Math.min(cols.length - 1, cIdx + dc));
  }

  Reco._ssSetActiveCell(fidx, cols[cIdx], e.shiftKey);
},

_ssAttachHandlers() {
  const wrap = document.querySelector('.reco-table-wrap');
  if (wrap && !wrap._ssWired) {
    wrap._ssWired = true;
    wrap.addEventListener('click', Reco._ssOnClick);
  }
  if (!document._ssKeysWired) {
    document._ssKeysWired = true;
    document.addEventListener('keydown', Reco._ssOnKey);
  }
},

_renderEditableCell(tpl, i, col, val, cls, fmtStyle) {
  const cfg = ((tpl.editableColumnConfig || {})[col]) || { editType: 'free' };
     const onchange = 'Reco.editCell(' + i + ',\'' + U.jsq(col) + '\',this.value)';
     const dataAttr = ' data-col="' + U.escAttr(col) + '"';
     const styleAttr = fmtStyle ? ' style="' + fmtStyle + '"' : '';

  if (cfg.editType === 'dropdown' || cfg.editType === 'datalist') {
    let opts = [];
    if (cfg.optionsSource === 'master' && cfg.masterCfg && cfg.masterCfg.source && cfg.masterCfg.field) {
      opts = Masters.distinctValues(cfg.masterCfg.source, tpl.id, cfg.masterCfg.field);
    } else {
      opts = (cfg.manualOptions || []).slice();
    }

    if (cfg.editType === 'dropdown') {
      let h = '<td' + dataAttr + ' class="' + cls + '"><select onchange="' + onchange + '">';
      h += '<option value="">— select —</option>';
      opts.forEach(o => {
        h += '<option value="' + U.escAttr(o) + '"' + (String(val) === o ? ' selected' : '') + '>' + U.esc(o) + '</option>';
      });
      if (val && opts.indexOf(String(val)) === -1) {
        h += '<option value="' + U.escAttr(val) + '" selected>' + U.esc(val) + ' (custom)</option>';
      }
      h += '</select></td>';
      return h;
    }

    // datalist (dropdown with manual override)
    const listId = 'editlist_' + i + '_' + U.uid();

  /* ============== ROW CONTEXT MENU / TIMELINE / DRAG-DROP ============== */
  _resolveRowFromId(rowId) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return null;
    const row = sess.data.find(r => r._id === rowId);
    if (!row) return null;
    const pk = Reco.getRowPK(tpl, row);
    return { tpl, sess, row, pk };
  },

  _rowSummary(tpl, row) {
    const cols = (tpl.displayColumns||tpl.columns.map(c=>c.name)).slice(0, 3);
    return cols.map(c => row[c]).filter(v => v != null && v !== '').join(' · ');
  },

  openRowTimeline(rowId) {
    const ctx = Reco._resolveRowFromId(rowId);
    if (!ctx) return;
    if (!ctx.pk) {
      U.toast('Row has no primary key — attachments/comments need PKs', 'error');
      return;
    }
    App.ensureCurrentUser().then(() => {
      Timeline.open(ctx.tpl.id, ctx.pk, Reco._rowSummary(ctx.tpl, ctx.row));
    });
  },

  openRowContextMenu(ev, rowId) {
    ev.preventDefault();
    document.querySelectorAll('.row-ctx-menu').forEach(d => d.remove());
    const ctx = Reco._resolveRowFromId(rowId);
    if (!ctx) return;
    const hasPk = !!ctx.pk;

    const menu = document.createElement('div');
    menu.className = 'col-dropdown row-ctx-menu';
    menu.style.position = 'fixed';
    menu.style.left = ev.clientX + 'px';
    menu.style.top  = ev.clientY + 'px';
    menu.style.minWidth = '200px';

    let h = '';
    h += '<div style="font-weight:600; font-size:11px; margin-bottom:6px;">Row actions</div>';
    h += '<button class="small" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Reco.openRowTimeline(\''+U.jsq(rowId)+'\')" '+(hasPk?'':'disabled')+'>👁 View details (timeline)</button>';
    h += '<button class="small" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Reco.addAttachmentToRow(\''+U.jsq(rowId)+'\')" '+(hasPk?'':'disabled')+'>📎 Add attachment</button>';
    if (typeof Comments !== 'undefined' && Comments && Comments.openAddDialog) {
      h += '<button class="small" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Comments.openAddDialog(\''+U.jsq(ctx.tpl.id)+'\',\''+U.jsq(ctx.pk||'')+'\')" '+(hasPk?'':'disabled')+'>💬 Add comment</button>';
    }
    if (ctx.tpl.groupsEnabled) {
      const memberships = ctx.pk ? Groups.groupsForPk(ctx.tpl.id, ctx.pk) : [];
      if (memberships.length) {
        h += '<button class="small" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Reco.showRowGroups(\''+U.jsq(ctx.pk)+'\')">📁 View groups ('+memberships.length+')</button>';
      }
    }


    // Phase 5: added-row actions
    const ctxRow = ctx.row;
    if (ctxRow && ctxRow._ssAdded) {
      const singleNow = !!ctxRow._ssSingleUse;
      h += '<div class="divider" style="margin:6px 0;"></div>';
      h += '<button class="small" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Reco.ssToggleRowSingleUse(\''+U.jsq(rowId)+'\')">'+(singleNow?'✓ Unmark single-use':'⏱ Mark single-use')+'</button>';
      h += '<button class="small danger" style="width:100%; text-align:left;" onclick="document.querySelectorAll(\'.row-ctx-menu\').forEach(d=>d.remove()); Reco.ssDeleteRow(\''+U.jsq(rowId)+'\')">🗑 Delete row</button>';
    }

    if (!hasPk) h += '<div class="text-muted" style="font-size:10px; margin-top:6px;">Row has no primary key</div>';

    menu.innerHTML = h;
    document.body.appendChild(menu);
    const close = e => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } };
    setTimeout(() => document.addEventListener('click', close), 0);
  },

  addAttachmentToRow(rowId) {
    const ctx = Reco._resolveRowFromId(rowId);
    if (!ctx || !ctx.pk) return;
    App.ensureCurrentUser().then(() => {
      Timeline._chooseAddAttachment(ctx.tpl.id, ctx.pk);
    });
  },

  onRowDragOver(ev) {
    if (!ev.dataTransfer || !ev.dataTransfer.types) return;
    if (!Array.from(ev.dataTransfer.types).includes('Files')) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'copy';
    ev.currentTarget.classList.add('row-drop-hover');
  },

  onRowDrop(ev, rowId) {
    if (ev.currentTarget.classList) ev.currentTarget.classList.remove('row-drop-hover');
    if (!ev.dataTransfer || !ev.dataTransfer.files || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    const ctx = Reco._resolveRowFromId(rowId);
    if (!ctx) return;
    if (!ctx.pk) { U.toast('Row has no primary key', 'error'); return; }
    const files = Array.from(ev.dataTransfer.files);
    App.ensureCurrentUser().then(() => {
      // For a single file, open the link-choice dialog. For multiple, link them all to this row.
      if (files.length === 1) {
        Timeline._showLinkDialog(ctx.tpl.id, ctx.pk, files[0]);
      } else {
        Reco._bulkUploadToRow(ctx.tpl.id, ctx.pk, files);
      }
    });
  },

  async _bulkUploadToRow(tplId, pk, files) {
    U.toast('Uploading ' + files.length + ' files…');
    let ok = 0;
    for (const f of files) {
      if (await Attachments.upload(tplId, f, { linkedPks: [pk] })) ok++;
    }
    U.toast('Uploaded ' + ok + ' of ' + files.length + ' files', ok === files.length ? 'success' : 'error');
    Timeline.open(tplId, pk);
  },

  /* Load a versioned file into a template's session. `tplId` defaults to
     the open template; auto-load passes it explicitly so a slow read cannot
     land in whichever template the user switched to meanwhile. */
  async loadVersionedFile(fullPath, tplId, files) {
    const id = tplId || AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    const { active, total, applied } = await Versioning.loadActive(tpl, fullPath, files);
    if (!total) { U.toast('File empty', 'error'); return; }
    // hydrate session.data from active rows
    sess.data = active.map(r => {
      const row = { _id: U.uid(), _pk: r._pk, _ver: r._ver };
      tpl.columns.forEach(c => row[c.name] = r[c.name] != null ? r[c.name] : '');
      return row;
    });
    sess.activeVersionFile = fullPath;
    sess.offsets = {};
    sess.selectedRows = {};
    Reco.runAutoOffset(tpl, sess);
    AppState.save();
    if (AppState.currentPage === 'reco' && AppState.activeRecoId === id) App.navigate('reco');
    U.toast('Loaded '+active.length+' active rows ('+total+' versioned rows'+(applied ? ', '+applied+' later edit(s) applied' : '')+')','success');
  },

  /* Auto-load the most recent data file when entering a template with an empty session */
  async autoLoadLatest(tpl) {
    if (!tpl) return;
    const sess = AppState.recoSessions[tpl.id];
    if (!sess || sess.data.length || sess._autoLoadAttempted) return;
    sess._autoLoadAttempted = true;
    const files = await Versioning.listFiles(tpl);
    const f = await Versioning.latestDataFile(tpl, files);
    if (f) await Reco.loadVersionedFile(f.fullPath, tpl.id, files);
  },

  // 5. Visual UI Update
  _updateVisualRow(trElement, isSelected) {
    if (!trElement) return;
    
    if (isSelected) trElement.classList.add('selected');
    else trElement.classList.remove('selected');

  bulkMarkOffset(markAsOffset) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!sess || !tpl) return;

    const selectedIds = Object.keys(sess.selectedRows || {}).filter(k => sess.selectedRows[k] === true);
    if (!selectedIds.length) {
      U.toast('Select rows first using the checkboxes or drag-select', 'error');
      return;
    }

    if (markAsOffset) {
      // Tolerance check on eligible (non-offset) rows
      const chk = Reco.checkOffsetTolerance(tpl, sess, selectedIds);
      if (!chk.ok) { U.toast(chk.msg, 'error'); return; }

      const rid = 'M' + Date.now().toString(36);
      const mm = AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};
      selectedIds.forEach(rowId => {
        const row = sess.data.find(r => r._id === rowId);
        if (!row || sess.offsets[rowId]) return; // skip already offset
        sess.offsets[rowId] = true;
        row._manualOffset = true;
        row._recoId = rid;
        const pk = Reco.getRowPK(tpl, row);
        if (pk) mm[pk] = { recoId: rid, byUser: true };
      });
    } else {
      // Smart unmark — see Patch C
      Reco.smartUnmark(selectedIds);
      return;
    }

    sess.selectedRows = {};
    AppState.save();
    App.navigate('reco');
  },
  smartUnmark(selectedIds) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;

    selectedIds = (selectedIds||[]).filter(rid => sess.offsets[rid]);
    if (!selectedIds.length) { U.toast('No offset rows in selection', 'error'); return; }

    // Group selected by _recoId
    const groups = {};
    selectedIds.forEach(rid => {
      const row = sess.data.find(r => r._id === rid);
      if (!row) return;
      const key = row._recoId || '__nogroup__';
      groups[key] = groups[key] || [];
      groups[key].push(row);
    });

    let unmarkedCount = 0;
    let blockedGroups = [];
    const mm = AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};

    Object.keys(groups).forEach(rid => {
      const selectedInGroup = groups[rid];
      // All rows currently sharing this recoId AND still offset
      const allInGroup = (rid === '__nogroup__')
        ? selectedInGroup
        : sess.data.filter(r => r._recoId === rid && sess.offsets[r._id]);
      const remaining = allInGroup.filter(r => !selectedInGroup.includes(r));

      if (remaining.length === 0) {
        // Whole group unmarked
        Reco._unmarkRows(tpl, sess, mm, allInGroup);
        if (rid !== '__nogroup__') Reco._removeRidFromMaster(mm, rid);
        unmarkedCount += allInGroup.length;
        return;
      }

      const remSum = remaining.reduce((s,r) => s + U.num(r[tpl.valueColumn]), 0);
      const remOk = Reco.isWithinTolerance(tpl, remSum, remaining);

      if (remOk) {
        // Unmark selected, regroup remaining with a fresh recoId
        Reco._unmarkRows(tpl, sess, mm, selectedInGroup);
        const newRid = 'M' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000);
        remaining.forEach(r => {
          r._recoId = newRid;
          const pk = Reco.getRowPK(tpl, r);
          if (pk) mm[pk] = { recoId: newRid, byUser: true };
        });
        if (rid !== '__nogroup__') Reco._removeRidFromMaster(mm, rid);
        unmarkedCount += selectedInGroup.length;
      } else {
        blockedGroups.push({ rid, allInGroup, selectedInGroup, remSum });
      }
    });

    // For blocked groups, ask user whether to unmark the whole group
    if (blockedGroups.length) {
      let h = '<div class="help">For these offset group(s), unmarking only your selection would leave the remaining rows outside tolerance.</div>';
      h += '<table><thead><tr><th>Reco ID</th><th>Total rows</th><th>Selected</th><th>Remainder sum</th></tr></thead><tbody>';
      blockedGroups.forEach(g => {
        h += '<tr><td><code>'+U.esc(g.rid)+'</code></td><td>'+g.allInGroup.length+'</td><td>'+g.selectedInGroup.length+'</td><td>'+U.fmtNum(g.remSum)+'</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="help">Choose: <b>Unmark Entire Groups</b> drops every row from these offset groups. <b>Skip</b> leaves them as-is.</div>';
      Reco._blockedGroups = blockedGroups;
      App.openModal('Tolerance breach on unmark',
        h,
        '<button onclick="App.closeModal(); Reco._blockedGroups=null; App.navigate(\'reco\');">Skip</button>'
      + '<button class="danger" onclick="Reco._unmarkBlockedGroups()">Unmark Entire Groups</button>');
    } else {
      sess.selectedRows = {};
      AppState.save();
      App.navigate('reco');
      U.toast('Unmarked '+unmarkedCount+' row(s)', 'success');
    }
  },

  _unmarkRows(tpl, sess, mm, rows) {
    rows.forEach(r => {
      delete sess.offsets[r._id];
      delete r._manualOffset;
      delete r._recoId;
      const pk = Reco.getRowPK(tpl, r);
      if (pk && mm[pk]) delete mm[pk];
    });
  },
  _removeRidFromMaster(mm, rid) {
    Object.keys(mm).forEach(pk => { if (mm[pk] && mm[pk].recoId === rid) delete mm[pk]; });
  },
  _unmarkBlockedGroups() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const mm = AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};
    let n = 0;
    (Reco._blockedGroups || []).forEach(g => {
      Reco._unmarkRows(tpl, sess, mm, g.allInGroup);
      Reco._removeRidFromMaster(mm, g.rid);
      n += g.allInGroup.length;
    });
    Reco._blockedGroups = null;
    sess.selectedRows = {};
    AppState.save();
    App.closeModal();
    App.navigate('reco');
    U.toast('Unmarked '+n+' row(s) from blocked groups','success');
  },

  /* Transient UI state, lives on the session object */
  ensureSessionShape(sess) {
    if (!sess) return;
    sess.data = sess.data || [];
    sess.corrections = sess.corrections || {};
    sess.offsets = sess.offsets || {};
    sess.manualTags = sess.manualTags || {};
    sess.activeSection = sess.activeSection || 'action';
    sess.columnFilters = sess.columnFilters || {};   // { colName: [ {op,val,val2,enabled} ] }
    sess.columnSorts = sess.columnSorts || null;     // { col, dir }
    sess.columnWidths = sess.columnWidths || {};     // { colName: px }
    sess.columnOrder  = sess.columnOrder || null;    // array of column names, overrides displayColumns order
    sess.zoom         = sess.zoom || 1;              // 0.5 .. 2.0
    sess.page = sess.page || 0;
    sess.pageSize = sess.pageSize || 200;
    sess.statusFilter = sess.statusFilter || 'all';
    sess.requireAttachment = !!sess.requireAttachment;
    sess.requireComment    = !!sess.requireComment;
    sess.requireGroup      = !!sess.requireGroup;
    sess.selectedRows = sess.selectedRows || {};
    sess._docMatches = sess._docMatches || [];
    sess.excelViewActive = !!sess.excelViewActive; // toggled by the Excel View tab
    sess.slicers = sess.slicers || {};               // { colName: [selected values] }
    sess._dismissDocMatches = sess._dismissDocMatches || false;
    sess.correctionExtraCols = sess.correctionExtraCols || [];
    sess.spreadsheetMode = !!sess.spreadsheetMode;
    sess.cellFormulas = sess.cellFormulas || {}; // { rowKey: { col: '=formula' } }
    sess.cellFormats = sess.cellFormats || {}; // { rowKey: { col: { bg, fg, bold, italic, align, fontSize, numFmt } } }
    sess.formatToolbarOpen = !!sess.formatToolbarOpen;
    sess.activeCell = sess.activeCell || null;     // { fidx, col }
    sess.selRange   = sess.selRange   || null;     // { startFidx, endFidx, startCol, endCol }
    sess.extraColumns = sess.extraColumns || []; // [{ name, type:'custom', _ssAdded:true, _ssSingleUse?:bool }]
    sess.hiddenCols = sess.hiddenCols || [];
  },
  makeSession() {
    const s = {};
    Reco.ensureSessionShape(s);
    return s;
  },

          root.innerHTML = h;

  setSection(sec) {
      if (Reco._xlInstance) Reco._xlDestroy();
      const id = AppState.activeRecoId;
      if (AppState.recoSessions[id]) AppState.recoSessions[id].activeSection = sec;

  loadData(ev) {
    const file = ev.target.files[0]; if (!file) return;
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    if (!tpl) return;
    U.parseFile(file, (data, fields) => {
      Reco.ingestData(tpl, data, fields);
    });
    ev.target.value = '';
  },
  showPaste() { setTimeout(() => { const el = document.getElementById('recoPasteBox'); if(el) el.style.display='block'; }, 50); },
  parsePasteData() {
    const txt = document.getElementById('recoPasteData')?.value?.trim();
    if (!txt) return;
    const { data, fields } = U.parsePaste(txt);
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    if (!tpl) return;
    Reco.ingestData(tpl, data, fields);
    const el = document.getElementById('recoPasteBox');
    if (el) el.style.display = 'none';
  },

  ingestData(tpl, rawData, rawFields) {
    const id = tpl.id;
    if (!AppState.recoSessions[id]) AppState.recoSessions[id] = Reco.makeSession();
    const sess = AppState.recoSessions[id];
    Reco.ensureSessionShape(sess);
    const definedCols = tpl.columns.map(c => c.name);

    // Map raw fields to defined columns AND assign PK + _ver upload
    const mapped = rawData.map(raw => {
      const row = { _id: U.uid() };
      definedCols.forEach(col => {
        const key = rawFields.find(f => f === col) || rawFields.find(f => String(f).toLowerCase() === col.toLowerCase());
        row[col] = key ? (raw[key] == null ? '' : raw[key]) : '';
      });
      row._pk = Reco.getRowPK(tpl, row) || ('_auto_' + U.uid());
      row._ver = 'upload';
      // Apply correction master
      const pk = row._pk;
      const tplCorr = (AppState.correctionMaster[tpl.id] || {});
      if (pk && tplCorr[pk]) {
        const corr = tplCorr[pk];
        Object.keys(corr).forEach(colName => {
          if (row[colName] === corr[colName].oldVal || row[colName] === '' || !FMT.validate(row[colName], (tpl.columns.find(c=>c.name===colName)||{}).formats)) {
            row[colName] = corr[colName].newVal;
            row['_corrected_' + colName] = true;
          }
        });
      }
      if (pk && sess.corrections[pk]) {
        const corr = sess.corrections[pk];
        Object.keys(corr).forEach(colName => {
          if (row[colName] === corr[colName].oldVal || row[colName] === '') {
            row[colName] = corr[colName].newVal;
            row['_corrected_' + colName] = true;
          }
        });
      }
      return row;
    });
    sess.data = sess.data.concat(mapped);

    // Persist as upload-rows in versioned CSV (fire and forget)
    Versioning.appendUpload(tpl, mapped).then(path => {
      sess.activeVersionFile = path;
      AppState.save();
    }).catch(e => console.error('append upload failed', e));

    // Document number scan
    sess._docMatches = [];
    sess._dismissDocMatches = false;
    if (tpl.docNumberColumn) {
      const dnMap = AppState.docNumberMaster[tpl.id] || {};
      mapped.forEach(row => {
        const dn = String(row[tpl.docNumberColumn] || '').trim();
        if (dn && dnMap[dn]) {
          sess._docMatches.push({ rowId: row._id, docNumber: dn, accountingId: dnMap[dn] });
        }
      });
    }

    Reco.runAutoOffset(tpl, sess);
    AppState.save();
    App.navigate('reco');
    U.toast('Loaded '+mapped.length+' rows','success');

    // Rows that share a primary key collapse into one when the data is
    // reopened from history — tell the user now rather than after a reload.
    if ((tpl.primaryKeys || []).length) {
      const counts = new Map();
      sess.data.forEach(r => counts.set(r._pk, (counts.get(r._pk) || 0) + 1));
      const dupKeys = Array.from(counts).filter(([, n]) => n > 1);
      if (dupKeys.length) {
        const extra = dupKeys.reduce((s, [, n]) => s + n - 1, 0);
        App.openModal('Duplicate primary keys',
          '<div class="help"><b>' + extra + '</b> row(s) share a primary key (' + U.esc(tpl.primaryKeys.join(' + ')) + ') with another row. '
          + 'Edits, offsets, corrections and comments are tracked per key, and reopening this data from history keeps only one row per key.</div>'
          + '<div class="help">Consider adding more primary-key columns in the template. Examples:</div><ul>'
          + dupKeys.slice(0, 8).map(([k, n]) => '<li><code>' + U.esc(k) + '</code> × ' + n + '</li>').join('') + '</ul>',
          '<button class="primary" onclick="App.closeModal()">OK</button>');
      }
    }
  },

  // Compute the effective value of an extra (additional) column for a row.
  // For non-extra columns, callers should just use row[col] directly.
  _extraValueForRow(tpl, sess, row, ac) {
    if (!ac) return '';
    // Formulas / lookups may reference additional columns declared above this one.
    const accum = Reco._rowWithExtras(tpl, sess, row, ac.name);
    return Reco._extraOwnValue(tpl, sess, accum, row, ac);
  },

  /* Value of one additional column given the row enriched with the columns
     declared before it (`accum`). Same rules as the grid. */
  _extraOwnValue(tpl, sess, accum, row, ac) {
    if (ac.type === 'master' || ac.type === 'master_lookup') {
      try { return Masters.evalLookup(tpl, ac, accum); } catch(e) { return ''; }
    }
    if (ac.type === 'formula') {
      try { return Formula.evaluate(ac.formula, accum); } catch(e) { return '#ERR'; }
    }
    // dropdown / custom: a value on the row wins, else the manual tag
    if (row[ac.name] != null && row[ac.name] !== '') return row[ac.name];
    return ((sess && sess.manualTags) || {})[row._id + '||' + ac.name] || '';
  },

  /* Copy of a row with every additional column (template + session) filled
     in, in declaration order. Stops before `uptoName` when given. */
  _rowWithExtras(tpl, sess, row, uptoName) {
    const out = Object.assign({}, row);
    const extras = (tpl.additionalColumns || []).concat((sess && sess.extraColumns) || []);
    for (const ac of extras) {
      if (uptoName != null && ac.name === uptoName) break;
      out[ac.name] = Reco._extraOwnValue(tpl, sess, out, row, ac);
    }
    return out;
  },

  // Returns the additionalColumn definition for a given column name, or null
  _extraDef(tpl, col) {
    return (tpl.additionalColumns || []).find(ac => ac.name === col) || null;
  },

  getRowPK(tpl, row) {
    if (!tpl.primaryKeys || !tpl.primaryKeys.length) return null;
    return tpl.primaryKeys.map(k => String(row[k]||'')).join('||');
  },

  /* Auto-offset preserves user-marked manual offsets stored in manualOffsetMaster */
  runAutoOffset(tpl, sess) {
    sess.offsets = sess.offsets || {};
    // First, restore manual offsets for any rows whose PK appears in the manual-offset master
    const mm = AppState.manualOffsetMaster[tpl.id] || {};
    sess.data.forEach(row => {
      const pk = Reco.getRowPK(tpl, row);
      if (pk && mm[pk]) {
        sess.offsets[row._id] = true;
        row._recoId = mm[pk].recoId;
        row._manualOffset = true;
      }
    });
    if (!tpl.aggregate || !tpl.aggregateBy?.length) return;
    // Auto-offset by aggregation: only for rows NOT already manually offset
    const groups = new Map();
    sess.data.forEach(row => {
      if (row._manualOffset) return; // skip manual rows from auto-grouping
      const key = tpl.aggregateBy.map(k => String(row[k]||'')).join('||');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
    });
    let recoCounter = 0;
    groups.forEach((entries, key) => {
      const sum = entries.reduce((s, r) => s + U.num(r[tpl.valueColumn]), 0);
      const within = Reco.isWithinTolerance(tpl, sum, entries);
      if (within) {
        const rid = 'R'+Date.now().toString(36)+'_'+(recoCounter++);
        entries.forEach(r => { sess.offsets[r._id] = true; r._recoId = rid; });
      } else {
        // Make sure non-matching auto rows are not marked offset
        entries.forEach(r => { if (!r._manualOffset) delete sess.offsets[r._id]; });
      }
    });
  },
  recalcOffsets() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    // Wipe non-manual offsets
    const newOffsets = {};
    sess.data.forEach(row => {
      if (row._manualOffset) newOffsets[row._id] = true;
    });
    sess.offsets = newOffsets;
    Reco.runAutoOffset(tpl, sess);
    AppState.save();
    App.navigate('reco');
    U.toast('Re-offset complete (manual offsets preserved)','success');
  },

  checkOffsetTolerance(tpl, sess, rowIds) {
    const considered = (rowIds||[]).map(id => sess.data.find(r => r._id === id)).filter(Boolean);
    const eligible = considered.filter(r => !sess.offsets[r._id]);
    if (!eligible.length) return { ok: false, sum: 0, considered: 0, msg: 'No eligible (open) rows in selection.' };
    const sum = eligible.reduce((s,r) => s + U.num(r[tpl.valueColumn]), 0);
    const within = Reco.isWithinTolerance(tpl, sum, eligible);
    return {
      ok: within,
      sum,
      considered: eligible.length,
      msg: within
        ? null
        : 'Cannot offset: ' + eligible.length + ' open row(s) sum ' + U.fmtNum(sum)
          + ' which is outside tolerance ±' + tpl.toleranceValue + ' (' + tpl.toleranceMode + ').'
    };
  },
  isWithinTolerance(tpl, sum, entries) {
    const tol = tpl.toleranceValue || 0;
    if (tpl.toleranceMode === 'percentage') {
      const totalAbs = entries.reduce((s, r) => s + Math.abs(U.num(r[tpl.valueColumn])), 0);
      if (totalAbs === 0) return Math.abs(sum) === 0;
      return (Math.abs(sum) / totalAbs * 100) <= tol;
    }
    return Math.abs(sum) <= tol;
  },
  countFormatErrors(tpl, sess) {
    let count = 0;
    sess.data.forEach(row => {
      tpl.columns.forEach(col => {
        if (col.formats && col.formats.length) {
          if (!FMT.validate(row[col.name], col.formats) && !row['_corrected_'+col.name]) count++;
        }
      });
    });
    return count;
  },
