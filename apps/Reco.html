          versions = await Versioning.appendChangesBatch(e.tpl, Array.from(e.rows, ([pk, row]) => ({ pk, row })));
        } catch (err) {
          console.error('version history write failed', err);
          Store._reportError('version history', err);
        }
        e.resolvers.forEach(r => r.res(versions[r.pk] || null));
      }
    })();
    Versioning._flushing = run;
    return run;
  },

  /* Latest change row per key written after `isoTs` (e.g. by a colleague
     while a workbook was out in Excel). Edits always go to the day's file,
     so files from that day onwards are read, older → newer; within a file
     the highest Cn wins, a later file wins over an earlier one.
     Returns Map(pk → version record). */
  async changesSince(tpl, isoTs, pkSet) {
    const out = new Map();
    const since = new Date(isoTs);
    if (!isoTs || isNaN(since.getTime())) return out;
    const day = { monthFolder: Versioning.monthFolder(since), file: Versioning.dayFile(since) };
    const dayKey = Versioning._sortKey(day);
    const files = (await Versioning.listFiles(tpl)).filter(f => Versioning._sortKey(f) >= dayKey).reverse();
    for (const f of files) {
      const rows = (await Versioning.readFile(f.fullPath))
        .filter(r => r && /^C\d+$/.test(r._ver || '') && String(r._ts || '') > isoTs && (!pkSet || pkSet.has(r._pk)));
      Versioning.collapseToActive(rows).forEach(r => out.set(r._pk, r));
    }
    return out;
  },

  /* Reduce a versioned-row list to "active" rows: highest Cn per PK, else
     upload row. On a tie the row written later wins. */
  collapseToActive(versionedRows) {
    const byPk = new Map();
    versionedRows.forEach(r => {
      const pk = r._pk;
      if (!pk) return;
      const cur = byPk.get(pk);
      const score = Versioning._verScore(r._ver);
      if (!cur || score >= Versioning._verScore(cur._ver)) byPk.set(pk, r);
    });
    return Array.from(byPk.values());
  },
  _verScore(v) {
    if (!v) return -1;
    if (v === 'upload') return 0;
    const m = String(v).match(/^C(\d+)$/);
    return m ? parseInt(m[1], 10) : -1;
  },

  /* Active rows of a file *including edits saved later*. Edits always go to
     the day's file, so changes made after the upload day live in newer files;
     apply their latest Cn per PK on top. */
  async loadActive(tpl, fullPath, files) {
    files = files || await Versioning.listFiles(tpl);
    const base = await Versioning.readFile(fullPath);
    const active = Versioning.collapseToActive(base);
    const idx = files.findIndex(f => f.fullPath === fullPath);
    let applied = 0;
    if (idx > 0) {
      const byPk = new Map(active.map((r, i) => [r._pk, i]));
      for (let i = idx - 1; i >= 0; i--) {     // older → newer
        const rows = await Versioning.readFile(files[i].fullPath);
        const changes = Versioning.collapseToActive(rows.filter(r => /^C\d+$/.test(r._ver || '') && byPk.has(r._pk)));
        changes.forEach(r => { active[byPk.get(r._pk)] = r; applied++; });
      }
    }
    return { active, total: base.length, applied };
  },

  /* Newest file that actually contains an upload (a file holding only edits
     is not a data set on its own). */
  async latestDataFile(tpl, files) {
    files = files || await Versioning.listFiles(tpl);
    for (const f of files) {
      const rows = await Versioning.readFile(f.fullPath);
      if (rows.some(r => r._ver === 'upload')) return f;
    }
    return files[0] || null;
  },

  /* Compact a version file: keep each PK's upload row and its latest Cn.
     The full history can be archived to reco_data/<tpl>/_archive/ first. */
  async compactFile(tpl, fullPath, keepArchive) {
    return Versioning._withLock(fullPath, async () => {
      const rows = await Versioning.readFile(fullPath, true);
      const latest = new Map();
      rows.forEach((r, i) => {
        const s = Versioning._verScore(r._ver);
        if (s > 0) { const cur = latest.get(r._pk); if (!cur || s >= cur.s) latest.set(r._pk, { s, i }); }
      });
      const keepIdx = new Set();
      rows.forEach((r, i) => {
        // keep every upload row (duplicate PKs in one upload stay intact)
        if (r._ver === 'upload' || Versioning._verScore(r._ver) < 0) keepIdx.add(i);
      });
      latest.forEach(v => keepIdx.add(v.i));
      const kept = rows.filter((r, i) => keepIdx.has(i));
      const result = { before: rows.length, after: kept.length, archived: '' };
      if (kept.length === rows.length) return result;
      if (keepArchive && Store._hasApi()) {
        const parts = fullPath.split('/');
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const archive = parts.slice(0, 2).join('/') + '/_archive/' + parts[2] + '_' + parts[3].replace(/\.csv$/i, '') + '_' + stamp + '.csv';
        const raw = await window.pywebview.api.read_file(fullPath);
        await window.pywebview.api.write_file(archive, raw);
        result.archived = archive;
      }
      const ok = await Versioning.writeFile(fullPath, kept, tpl);
      if (!ok) throw new Error('could not rewrite ' + fullPath);
      Versioning._noteMaxCn(fullPath, kept);
      return result;
    });
  }
};

/* ================================================================
   MODULE 3c — SPECIAL JV REGISTRY  (iframe modal, no popups)
   Loads JV definitions from special_jv_mapping/*.json. The calculator page
   is special_jv_templates/<ref>.html (ROOT-relative; ROOT/apps/ also works).
   ================================================================ */
const SpecialJV = {
  registry: {},
  _loaded: false,
  _activeHandler: null,
  _activeFrame: null,
  _onCancel: null,

  async load() {
    SpecialJV.registry = {};
    if (!Store._hasApi()) { SpecialJV._loaded = true; return; }
    const problems = [];
    try {
      const files = await Store.listFiles('special_jv_mapping');
      for (const f of files) {
        if (!f || !f.name || !/\.json$/i.test(f.name)) continue;
        try {
          const txt = await window.pywebview.api.read_file('special_jv_mapping/' + f.name);
          const def = JSON.parse(txt);
          if (!def || !def.ref) { problems.push(f.name + ' has no "ref" — skipped.'); continue; }
          def.ref = String(def.ref).trim();
          def.inputColumns = (Array.isArray(def.inputColumns) ? def.inputColumns : [])
            .map(c => (typeof c === 'string' ? { name: c } : c)).filter(c => c && c.name);
          def.htmlPath = 'special_jv_templates/' + def.ref + '.html';
          def._file = f.name;
          if (SpecialJV.registry[def.ref]) problems.push('Two mapping files use ref "' + def.ref + '"; ' + f.name + ' wins.');
          SpecialJV.registry[def.ref] = def;
        } catch(e) {
          console.error('SpecialJV mapping parse fail', f.name, e);
          problems.push(f.name + ' could not be read: ' + (e && e.message || e));
        }
      }
    } catch(e) { console.error('SpecialJV.load failed', e); }
    problems.forEach(p => Store.loadProblems.push('Special JV: ' + p));
    SpecialJV._loaded = true;
    console.log('SpecialJV loaded:', Object.keys(SpecialJV.registry));
  },

  list() { return Object.values(SpecialJV.registry); },
  get(ref) { return SpecialJV.registry[ref] || null; },
  isJvRef(ref) { return !!SpecialJV.get(ref); },

  /* Build "To Account" dropdown options: master Refs + JV refs.
     The grid asks for this on every row; renders reset the memo once
     (resetOptions) so each render builds the list a single time. */
  _optsMemo: null,
  resetOptions() { SpecialJV._optsMemo = null; },
  buildToAccountOptions() {
    if (!SpecialJV._optsMemo) SpecialJV._optsMemo = SpecialJV._buildToAccountOptions();
    return SpecialJV._optsMemo;
  },
  _buildToAccountOptions() {
    const seen = new Set();
    const masterRefs = [];
    (AppState.aegMaster || []).forEach(m => {
      const v = String(m.Reference || '').trim();
      if (!v || seen.has(v)) return;
      seen.add(v);
      masterRefs.push({ value: v, label: v, kind: 'master' });
    });
    const jvRefs = SpecialJV.list().map(j => ({
      value: String(j.ref || '').trim(),
      label: '⚡ ' + (j.displayName || j.ref) + ' (Special JV)',
      kind: 'jv'
    })).filter(o => o.value);
    return masterRefs.concat(jvRefs);
  },

  /* Value of a JV input column on a row: exact name first, then the same
     name ignoring case / spaces / underscores ("Txn Type" ~ "TxnType"). */
  pick(row, name) {
    if (row[name] != null && row[name] !== '') return row[name];
    const norm = s => String(s).toLowerCase().replace(/[\s_]/g, '');
    const want = norm(name);
    const k = Object.keys(row).find(k => norm(k) === want);
    return k != null && row[k] != null ? row[k] : '';
  },

  /* Where the JV page is. New launchers resolve it (ROOT/special_jv_templates
     or ROOT/apps/special_jv_templates); older ones get a best guess. */
  async _resolveSrc(def) {
    const api = Store._hasApi() ? window.pywebview.api : null;
    if (api && typeof api.resolve_url === 'function') {
      try { const u = await api.resolve_url(def.htmlPath); if (u) return u; } catch (e) {}
    }
    if (api && typeof api.path_exists === 'function' && /\/apps\/[^\/]*$/i.test(location.pathname)) {
      try {
        const atRoot = await api.path_exists(def.htmlPath);
        if (atRoot === true || atRoot === 'true') return '../' + def.htmlPath;
      } catch (e) {}
    }
    return def.htmlPath;
  },

  /* Open the JV inside an iframe modal — NO window.open, NO popup blocker.
     Inputs are exposed on window globals (window.parent._specialJvInputs …)
     and, for pages that cannot reach window.parent (file:// isolation), sent
     by postMessage when the page announces {type:'specialJV.ready'}.
     onComplete(result) runs only when the JV returns accounting lines;
     onCancel() runs when it is cancelled or returns nothing. */
  async open(ref, prefilledInputs, onComplete, onCancel) {
    const def = SpecialJV.get(ref);
    if (!def) { U.toast('Special JV "' + ref + '" not registered', 'error'); return; }
    SpecialJV._detach();

    // Expose inputs to the iframe
    window._specialJvInputs = prefilledInputs || [];
    window._specialJvRef = ref;
    window._specialJvDef = def;

    // Cache-bust the iframe src so changes to the JV HTML reload immediately
    const base = await SpecialJV._resolveSrc(def);
    const src = base + (base.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
    const body = ''
      + '<div style="height:72vh; display:flex; flex-direction:column;">'
      + '  <div class="text-muted" style="margin-bottom:6px;">'
      +     '⚡ ' + U.esc(def.displayName || ref) + ' · '
      +     (prefilledInputs||[]).length + ' input row(s) sent · '
      +     '<code>' + U.esc(def.htmlPath) + '</code>'
      + '  </div>'
      + '  <iframe id="specialJvFrame" src="' + U.escAttr(src) + '"'
      +     ' style="flex:1; width:100%; border:1px solid var(--border, #e5e7eb); border-radius:4px; background:#fff;"></iframe>'
      + '</div>';

    const footer = '<button onclick="SpecialJV._cancel()">Cancel JV</button>';

    App.openModal('Special JV — ' + (def.displayName || ref), body, footer);

    // Widen the modal for the iframe
    const modalEl = document.querySelector('#appModal .modal');
    if (modalEl) { modalEl.style.maxWidth = '1180px'; modalEl.dataset._jvWidened = '1'; }

    const frame = document.getElementById('specialJvFrame');
    SpecialJV._activeFrame = frame;
    SpecialJV._onCancel = onCancel || null;

    const handler = (ev) => {
      const d = ev.data;
      if (!d || typeof d !== 'object' || d.ref !== ref) return;
      // Only listen to our own iframe (file:// pages all post with origin "null").
      if (!frame.contentWindow || ev.source !== frame.contentWindow) return;
      if (d.type === 'specialJV.ready') {
        frame.contentWindow.postMessage({ type: 'specialJV.init', ref, def, inputs: window._specialJvInputs }, '*');
        return;
      }
      if (d.type !== 'specialJV.complete' && d.type !== 'specialJV.cancel') return;
      const lines = Array.isArray(d.lines) ? d.lines : [];
      const cancelled = d.type === 'specialJV.cancel' || !lines.length;
      const cancelCb = SpecialJV._onCancel;
      SpecialJV._detach();
      SpecialJV._restoreModal();
      App.closeModal();
      if (cancelled) {
        U.toast('Special JV cancelled — nothing was recorded', 'error');
        try { cancelCb && cancelCb(); } catch(e) { console.error(e); }
        return;
      }
      try { onComplete && onComplete(d); } catch(e) { console.error(e); }
    };
    window.addEventListener('message', handler);
    SpecialJV._activeHandler = handler;
  },

  _detach() {
    if (SpecialJV._activeHandler) window.removeEventListener('message', SpecialJV._activeHandler);
    SpecialJV._activeHandler = null;
    SpecialJV._activeFrame = null;
    SpecialJV._onCancel = null;
  },

  _cancel() {
    const cancelCb = SpecialJV._onCancel;
    SpecialJV._detach();
    SpecialJV._restoreModal();
    App.closeModal();
    U.toast('Special JV cancelled', 'error');
    try { cancelCb && cancelCb(); } catch(e) { console.error(e); }
  },

  _restoreModal() {
    const modalEl = document.querySelector('#appModal .modal');
    if (modalEl && modalEl.dataset._jvWidened) {
      modalEl.style.maxWidth = '';
      delete modalEl.dataset._jvWidened;
    }
  },

  /* Does a completed (pending) JV belong to exactly this set of rows? */
  matchesRows(pending, rows) {
    const sent = (pending.sentPks && pending.sentPks.length) ? pending.sentPks
      : (pending.inputData || []).map(x => x && x._pk).filter(Boolean);
    const want = (rows || []).map(r => r._pk).filter(Boolean);
    if (!sent.length || sent.length !== want.length) return false;
    const set = new Set(sent);
    return want.every(pk => set.has(pk));
  }
};

/* ================================================================
   MODULE 3d — GROUPS
   Template-level master of groups. Each group holds a set of
   primary keys. An item can be in many groups. When a PK isn't
   in the current session, we resolve it from versioned files.
   ================================================================ */
const Groups = {
  // === CRUD ===
  forTemplate(tplId) {
    AppState.groupMaster = AppState.groupMaster || {};
    AppState.groupMaster[tplId] = AppState.groupMaster[tplId] || {};
    return AppState.groupMaster[tplId];
  },

  list(tplId) {
    const m = Groups.forTemplate(tplId);
    return Object.keys(m).map(k => m[k]).sort((a,b) => a.name.localeCompare(b.name));
  },

  get(tplId, gid) {
    return Groups.forTemplate(tplId)[gid] || null;
  },

  create(tplId, name, description, color) {
    const id = 'G' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
    const g = {
      id,
      name: String(name||'').trim() || 'Group',
      description: String(description||''),
      members: [],
      color: color || Groups._randomColor(),
      createdAt: new Date().toISOString()
    };
    Groups.forTemplate(tplId)[id] = g;
    AppState.save();
    return g;
  },

  rename(tplId, gid, name, description) {
    const g = Groups.get(tplId, gid); if (!g) return;
    g.name = String(name||'').trim() || g.name;
    if (description != null) g.description = String(description);
    AppState.save();
  },

  remove(tplId, gid) {
    const m = Groups.forTemplate(tplId);
    delete m[gid];
    AppState.save();
  },

  // === Membership ===
  addMembers(tplId, gid, pks) {
    const g = Groups.get(tplId, gid); if (!g) return 0;
    let added = 0;
    pks.forEach(pk => {
      if (!pk) return;
      if (!g.members.includes(pk)) { g.members.push(pk); added++; }
    });
    AppState.save();
    return added;
  },

  removeMembers(tplId, gid, pks) {
    const g = Groups.get(tplId, gid); if (!g) return 0;
    const before = g.members.length;
    g.members = g.members.filter(pk => !pks.includes(pk));
    AppState.save();
    return before - g.members.length;
  },

  // Returns all groups containing this PK
  groupsForPk(tplId, pk) {
    if (!pk) return [];
    return Groups.list(tplId).filter(g => g.members.includes(pk));
  },

  // Returns total group-memberships in the current session
  countMembershipsInSession(tpl, sess) {
    let n = 0;
    (sess.data||[]).forEach(r => {
      const pk = Reco.getRowPK(tpl, r);
      if (pk && Groups.groupsForPk(tpl.id, pk).length) n++;
    });
    return n;
  },

  // === Cross-file PK resolver ===
  // Resolve a PK to its latest row. Tries session first, then versioned files newest-first.
  // Returns { row, source: 'session'|'versionFile', filePath?: string } or null.
  async resolvePk(tpl, pk, cache) {
    if (!pk) return null;
    const sess = AppState.recoSessions[tpl.id];
    if (sess) {
      const found = (sess.data||[]).find(r => Reco.getRowPK(tpl, r) === pk);
      if (found) return { row: found, source: 'session' };
    }
    // Scan versioned files newest first (each file read once per resolveGroup)
    cache = cache || {};
    try {
      const files = cache.files || (cache.files = await Versioning.listFiles(tpl));
      cache.active = cache.active || {};
      for (const f of files) {
        let byPk = cache.active[f.fullPath];
        if (!byPk) {
          byPk = new Map(Versioning.collapseToActive(await Versioning.readFile(f.fullPath)).map(r => [r._pk, r]));
          cache.active[f.fullPath] = byPk;
        }
        const hit = byPk.get(pk);
        if (hit) {
          // hydrate into tpl shape
          const row = { _id: 'hist_' + U.uid(), _pk: pk, _ver: hit._ver, _historic: true };
          tpl.columns.forEach(c => row[c.name] = hit[c.name] != null ? hit[c.name] : '');
          return { row, source: 'versionFile', filePath: f.fullPath };
        }
      }
    } catch(e) { console.error('Groups.resolvePk scan failed', e); }
    return null;
  },

  // Resolve a whole group's members.
  // Returns { resolved: [{pk, row, source, filePath?}], unresolved: [pk,...] }
  async resolveGroup(tpl, gid) {
    const g = Groups.get(tpl.id, gid);
    if (!g) return { resolved: [], unresolved: [] };
    const resolved = [];
    const unresolved = [];
    const cache = {};
    for (const pk of g.members) {
      const r = await Groups.resolvePk(tpl, pk, cache);
      if (r) resolved.push(Object.assign({ pk }, r));
      else unresolved.push(pk);
    }
    return { resolved, unresolved, group: g };
  },

  _randomColor() {
    const palette = ['#2563eb','#059669','#dc2626','#9333ea','#ea580c','#0891b2','#be185d','#65a30d','#7c3aed','#0ea5e9'];
    return palette[Math.floor(Math.random() * palette.length)];
  }
};


/* ================================================================
   MODULE 3e — ATTACHMENTS
   Files stored on disk via pywebview API. Metadata in
   AppState.attachmentMaster, keyed by templateId then attachmentId.
   Each attachment can be linked to one or more PKs and/or groups.
   ================================================================ */
const Attachments = {
  forTemplate(tplId) {
    AppState.attachmentMaster = AppState.attachmentMaster || {};
    AppState.attachmentMaster[tplId] = AppState.attachmentMaster[tplId] || {};
    return AppState.attachmentMaster[tplId];
  },

  list(tplId) {
    const m = Attachments.forTemplate(tplId);
    return Object.keys(m).map(k => m[k])
      .sort((a,b) => (b.uploadedAt||'').localeCompare(a.uploadedAt||''));
  },

  get(tplId, aid) {
    return Attachments.forTemplate(tplId)[aid] || null;
  },

  // Returns all attachments visible for a given PK:
  //   - direct attachments where linkedPks includes this PK
  //   - inherited attachments where linkedGroups includes any group containing this PK
  forPk(tplId, pk) {
    if (!pk) return [];
    const groups = Groups.groupsForPk(tplId, pk).map(g => g.id);
    return Attachments.list(tplId).filter(a => {
      if ((a.linkedPks||[]).includes(pk)) return true;
      if ((a.linkedGroups||[]).some(gid => groups.includes(gid))) return true;
      return false;
    });
  },

  // === Upload ===
  // file: a File object (from input or drop). meta: {comments, linkedPks, linkedGroups, uploadedBy}
  async upload(tplId, file, meta) {
    if (!file) return null;
    const b64 = await Attachments._fileToBase64(file);

    let saved;
    if (Store._hasApi()) {
      // Inside the launcher the file must reach the shared folder; never fall
      // back silently to browser storage (it would look saved but not be).
      try {
        saved = await window.pywebview.api.save_attachment(tplId, file.name, b64);
      } catch(e) {
        console.error('save_attachment failed', e);
        U.toast('Could not save "' + file.name + '" to the shared folder: ' + (e && e.message || e), 'error');
        return null;
      }
      if (!saved || saved.error || !saved.storedPath) {
        U.toast('Could not save "' + file.name + '": ' + ((saved && saved.error) || 'no path returned'), 'error');
        return null;
      }
    } else {
      // Plain browser (testing): keep base64 in localStorage (small files only)
      const id = 'A' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
      if (!Store._localSet('attBlob_' + id, b64)) { U.toast('File too large for browser storage', 'error'); return null; }
      saved = { id, storedPath: 'localStorage:attBlob_' + id, size: file.size };
    }

    const rec = {
      id: saved.id,
      filename: file.name,
      mime: file.type || '',
      size: saved.size || file.size || 0,
      storedPath: saved.storedPath,
      uploadedAt: new Date().toISOString(),
      uploadedBy: (meta && meta.uploadedBy) || Attachments._currentUser(),
      comments: (meta && meta.comments) || '',
      linkedPks: (meta && meta.linkedPks) ? meta.linkedPks.slice() : [],
      linkedGroups: (meta && meta.linkedGroups) ? meta.linkedGroups.slice() : []
    };
    Attachments.forTemplate(tplId)[rec.id] = rec;
    AppState.save();
    return rec;
  },

  // === Download / View ===
  async fetchBase64(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return null;

    if (rec.storedPath && rec.storedPath.indexOf('localStorage:') === 0) {
      const key = rec.storedPath.split(':')[1];
      return Store._localGet(key, null);
    }
    if (Store._hasApi()) {
      try {
        return await window.pywebview.api.read_attachment(rec.storedPath);
      } catch(e) { console.error('read_attachment failed', e); return null; }
    }
    return null;
  },

  async download(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return;
    const b64 = await Attachments.fetchBase64(tplId, aid);
    if (!b64) { U.toast('Attachment data missing on disk', 'error'); return; }
    const byteChars = atob(b64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    U.download(rec.filename, bytes, rec.mime || 'application/octet-stream');
  },

  // === Delete ===
  async remove(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return false;
    if (rec.storedPath && rec.storedPath.indexOf('localStorage:') === 0) {
      const key = rec.storedPath.split(':')[1];
      try { localStorage.removeItem(Store._localPrefix + key); } catch(e) {}
    } else if (Store._hasApi()) {
      try { await window.pywebview.api.delete_attachment(rec.storedPath); }
      catch(e) { console.error('delete_attachment failed', e); }
    }
    delete Attachments.forTemplate(tplId)[aid];
    AppState.save();
    return true;
  },

  // Re-link an existing attachment (e.g. promote a row-only attachment to a group)
  updateLinks(tplId, aid, linkedPks, linkedGroups) {
    const rec = Attachments.get(tplId, aid); if (!rec) return;
    if (linkedPks)    rec.linkedPks    = linkedPks.slice();
    if (linkedGroups) rec.linkedGroups = linkedGroups.slice();
    AppState.save();
  },

  // === Helpers ===
  _fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error('read failed'));
      r.readAsDataURL(file);
    });
  },

  _currentUser() {
    return AppState.currentUser || 'unknown';
  },

  formatSize(bytes) {
    if (!bytes) return '0 B';
    const k = 1024;
    const units = ['B','KB','MB','GB','TB'];
    const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(k)));
    return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + units[i];
  },

  iconFor(mime, filename) {
    const ext = (filename||'').split('.').pop().toLowerCase();
    if ((mime||'').startsWith('image/') || ['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return '🖼';
    if ((mime||'') === 'application/pdf' || ext === 'pdf') return '📄';
    if (['xls','xlsx','csv'].includes(ext)) return '📊';
    if (['doc','docx'].includes(ext)) return '📝';
    if (['zip','7z','rar','tar','gz'].includes(ext)) return '🗜';
    if (['mp3','wav','m4a','ogg'].includes(ext)) return '🎵';
    if (['mp4','mov','avi','mkv'].includes(ext)) return '🎬';
    return '📎';
  }
};

/* ================================================================
   MODULE 3f — TIMELINE
   Unified chronological view of attachments + comments for a row.
   Pulls inherited items from any groups the row's PK belongs to.
   ================================================================ */
const Timeline = {
  // Build the combined event list for a PK.
  // Each event: {type:'attachment'|'comment', id, at, by, source:'row'|'group:<gid>', payload}
  eventsForPk(tplId, pk) {
    const events = [];
    if (!pk) return events;

    const groupIds = Groups.groupsForPk(tplId, pk).map(g => g.id);

    // Attachments
    Attachments.list(tplId).forEach(a => {
      let source = null;
      if ((a.linkedPks||[]).includes(pk)) source = 'row';
      else {
        const viaGroup = (a.linkedGroups||[]).find(gid => groupIds.includes(gid));
        if (viaGroup) source = 'group:' + viaGroup;
      }
      if (!source) return;
      events.push({
        type: 'attachment',
        id: a.id,
        at: a.uploadedAt,
        by: a.uploadedBy,
        source,
        payload: a
      });
    });

    // Comments (Feature 3 will add Comments module — guard for now)
    if (typeof Comments !== 'undefined' && Comments && Comments.list) {
      Comments.list(tplId).forEach(c => {
        let source = null;
        if ((c.linkedPks||[]).includes(pk)) source = 'row';
        else {
          const viaGroup = (c.linkedGroups||[]).find(gid => groupIds.includes(gid));
          if (viaGroup) source = 'group:' + viaGroup;
        }
        if (!source) return;
        events.push({
          type: 'comment',
          id: c.id,
          at: c.createdAt,
          by: c.createdBy,
          source,
          payload: c
        });
      });
    }

    // newest first
    events.sort((a,b) => (b.at||'').localeCompare(a.at||''));
    return events;
  },

  // Open the timeline modal for a row
  open(tplId, pk, rowSummary) {
    const tpl = AppState.recoTemplates.find(x => x.id === tplId);
    const events = Timeline.eventsForPk(tplId, pk);
    const memberGroups = Groups.groupsForPk(tplId, pk);

    let h = '';
    h += '<div class="tl-header">';
    h += '<div><b>Row PK:</b> <code style="font-size:11px;">'+U.esc(pk)+'</code></div>';
    if (rowSummary) h += '<div class="text-muted" style="margin-top:4px;">'+U.esc(rowSummary)+'</div>';
    if (memberGroups.length) {
      h += '<div style="margin-top:4px;">In groups: ';
      memberGroups.forEach(g => {
        h += '<span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> ';
      });
      h += '</div>';
    }
    h += '</div>';

    h += '<div class="tl-actions">';
    h += '<button class="small primary" onclick="Timeline._chooseAddAttachment(\''+U.jsq(tplId)+'\',\''+U.jsq(pk)+'\')">📎 Add Attachment</button>';
    if (typeof Comments !== 'undefined' && Comments && Comments.openAddDialog) {
      h += '<button class="small" onclick="Comments.openAddDialog(\''+U.jsq(tplId)+'\',\''+U.jsq(pk)+'\')">💬 Add Comment</button>';
    }
    h += '</div>';

    if (!events.length) {
      h += '<div class="empty">No attachments or comments for this row yet.</div>';
    } else {
      h += '<div class="tl-list">';
      events.forEach(ev => {
        h += Timeline._renderEvent(tplId, pk, ev);
      });
      h += '</div>';
    }

    App.openModal('Timeline', h, '<button onclick="App.closeModal()">Close</button>');
  },

  _renderEvent(tplId, pk, ev) {
    const isAtt = ev.type === 'attachment';
    const p = ev.payload;
    const sourceTag = ev.source === 'row'
      ? '<span class="badge aed">row</span>'
      : '<span class="badge fc" title="inherited from group">group</span>';
    const when = (ev.at||'').replace('T',' ').substring(0,16);

    let h = '<div class="tl-event '+(isAtt?'tl-att':'tl-com')+'">';
    h += '<div class="tl-event-head">';
    h += '<span class="tl-event-type">'+(isAtt ? Attachments.iconFor(p.mime, p.filename) : '💬')+'</span>';
    h += '<b>'+U.esc(isAtt ? p.filename : 'Comment')+'</b>';
    h += sourceTag;
    h += '<div style="flex:1"></div>';
    h += '<span class="text-muted" style="font-size:10px;">'+U.esc(when)+' · '+U.esc(ev.by||'')+'</span>';
    h += '</div>';

    if (isAtt) {
      h += '<div class="tl-event-body">';
      h += '<span class="text-muted">'+U.esc(Attachments.formatSize(p.size))+(p.comments ? ' · '+U.esc(p.comments) : '')+'</span>';
      h += '</div>';
      h += '<div class="tl-event-actions">';
      h += '<button class="small primary" onclick="Attachments.download(\''+U.jsq(tplId)+'\',\''+U.jsq(p.id)+'\')">Download</button>';
      h += '<button class="small danger" onclick="Timeline._deleteAttachment(\''+U.jsq(tplId)+'\',\''+U.jsq(p.id)+'\',\''+U.jsq(pk)+'\')">Delete</button>';
      h += '</div>';
    } else {
      h += '<div class="tl-event-body" style="white-space:pre-wrap;">'+U.esc(p.text||'')+'</div>';
      if (typeof Comments !== 'undefined' && Comments && Comments.removeForRow) {
        h += '<div class="tl-event-actions">';
        h += '<button class="small danger" onclick="Comments.removeForRow(\''+U.jsq(tplId)+'\',\''+U.jsq(p.id)+'\',\''+U.jsq(pk)+'\')">Delete</button>';
        h += '</div>';
      }
    }

    h += '</div>';
    return h;
  },

  async _deleteAttachment(tplId, aid, pk) {
    if (!confirm('Delete this attachment permanently?')) return;
    await Attachments.remove(tplId, aid);
    Timeline.open(tplId, pk);
  },

  // Add-attachment dialog: ask whether to attach to row only or to a group
  _chooseAddAttachment(tplId, pk) {
    const input = document.createElement('input');
    input.type = 'file';
    input.style.display = 'none';
    input.onchange = async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      Timeline._showLinkDialog(tplId, pk, file);
    };
    document.body.appendChild(input);
    input.click();
    setTimeout(() => input.remove(), 1000);
  },

  // Modal that asks: link to row only OR to a group?
  _showLinkDialog(tplId, pk, file) {
    const memberGroups = Groups.groupsForPk(tplId, pk);
    const comment = '';

    let h = '<div class="help">File: <b>'+U.esc(file.name)+'</b> · '+U.esc(Attachments.formatSize(file.size))+'</div>';
    h += '<label class="field"><span class="label-text">Optional comment</span>';
    h += '<input type="text" id="attComment" placeholder="e.g. signed copy, invoice scan" /></label>';

    h += '<div class="editor-section"><div class="section-head"><strong>Link to</strong></div>';
    h += '<label class="inline"><input type="radio" name="attLink" value="row" checked /> This row only</label>';
    memberGroups.forEach(g => {
      h += '<label class="inline"><input type="radio" name="attLink" value="group:'+U.escAttr(g.id)+'" /> Group: <span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> <span class="text-muted">('+g.members.length+' members)</span></label>';
    });
    if (!memberGroups.length) {
      h += '<div class="text-muted" style="font-size:11px;">This row is not in any group. Add it to a group first if you want group-level attachments.</div>';
    }
    h += '</div>';

    Timeline._pendingUpload = { tplId, pk, file };
    App.openModal('Attach File', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Timeline._confirmUpload()">Upload</button>');
  },

  async _confirmUpload() {
    const p = Timeline._pendingUpload;
    if (!p) return;
    const comment = (document.getElementById('attComment')?.value || '').trim();
    const sel = document.querySelector('input[name="attLink"]:checked');
    if (!sel) return;

    const meta = { comments: comment };
    if (sel.value === 'row') {
      meta.linkedPks = [p.pk];
    } else if (sel.value.startsWith('group:')) {
      meta.linkedGroups = [sel.value.slice(6)];
    }

    U.toast('Uploading…');
    const rec = await Attachments.upload(p.tplId, p.file, meta);
    if (rec) {
      Timeline._pendingUpload = null;
      U.toast('Uploaded: ' + rec.filename, 'success');
      App.closeModal();
      Timeline.open(p.tplId, p.pk);
    }   // on failure Attachments.upload already explained why; the dialog stays open to retry
  }
};

/* ================================================================
   MODULE 3g — COMMENTS
   Free-text comments per template. Each comment can be linked to
   one or more PKs and/or groups. Group-linked comments are
   inherited by all current and future group members.
   ================================================================ */
const Comments = {
  forTemplate(tplId) {
    AppState.commentMaster = AppState.commentMaster || {};
    AppState.commentMaster[tplId] = AppState.commentMaster[tplId] || {};
    return AppState.commentMaster[tplId];
  },

  list(tplId) {
    const m = Comments.forTemplate(tplId);
    return Object.keys(m).map(k => m[k])
      .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  },

  get(tplId, cid) {
    return Comments.forTemplate(tplId)[cid] || null;
  },

  // Returns comments visible for a given PK (own + inherited from groups)
  forPk(tplId, pk) {
    if (!pk) return [];
    const groupIds = Groups.groupsForPk(tplId, pk).map(g => g.id);
    return Comments.list(tplId).filter(c => {
      if ((c.linkedPks||[]).includes(pk)) return true;
      if ((c.linkedGroups||[]).some(gid => groupIds.includes(gid))) return true;
      return false;
    });
  },

  // === CRUD ===
  create(tplId, text, meta) {
    const id = 'C' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
    const rec = {
      id,
      text: String(text||'').trim(),
      createdAt: new Date().toISOString(),
      createdBy: (meta && meta.createdBy) || Comments._currentUser(),
      linkedPks: (meta && meta.linkedPks) ? meta.linkedPks.slice() : [],
      linkedGroups: (meta && meta.linkedGroups) ? meta.linkedGroups.slice() : [],
      edited: false,
      editedAt: null
    };
    if (!rec.text) return null;
    Comments.forTemplate(tplId)[id] = rec;
    AppState.save();
    return rec;
  },

  edit(tplId, cid, newText) {
    const c = Comments.get(tplId, cid);
    if (!c) return false;
    const trimmed = String(newText||'').trim();
    if (!trimmed) return false;
    if (trimmed === c.text) return true;
    c.text = trimmed;
    c.edited = true;
    c.editedAt = new Date().toISOString();
    AppState.save();
    return true;
  },

  remove(tplId, cid) {
    delete Comments.forTemplate(tplId)[cid];
    AppState.save();
  },

  // Called from the timeline delete button
  removeForRow(tplId, cid, pk) {
    if (!confirm('Delete this comment permanently?')) return;
    Comments.remove(tplId, cid);
    Timeline.open(tplId, pk);
  },

  // Re-link an existing comment
  updateLinks(tplId, cid, linkedPks, linkedGroups) {
    const c = Comments.get(tplId, cid); if (!c) return;
    if (linkedPks)    c.linkedPks    = linkedPks.slice();
    if (linkedGroups) c.linkedGroups = linkedGroups.slice();
    AppState.save();
  },

  // === Dialogs ===
  // Called by the Timeline "Add Comment" button and by the row context menu
  openAddDialog(tplId, pk) {
    const memberGroups = Groups.groupsForPk(tplId, pk);

    let h = '<label class="field"><span class="label-text">Comment</span>';
    h += '<textarea id="commentText" placeholder="Type your comment…" style="min-height:100px;"></textarea></label>';

    h += '<div class="editor-section"><div class="section-head"><strong>Link to</strong></div>';
    h += '<label class="inline"><input type="radio" name="commentLink" value="row" checked /> This row only</label>';
    memberGroups.forEach(g => {
      h += '<label class="inline"><input type="radio" name="commentLink" value="group:'+U.escAttr(g.id)+'" /> Group: <span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> <span class="text-muted">('+g.members.length+' members)</span></label>';
    });
    if (!memberGroups.length) {
      h += '<div class="text-muted" style="font-size:11px;">This row is not in any group. Add it to a group first if you want group-level comments.</div>';
    }
    h += '</div>';

    Comments._pendingAdd = { tplId, pk };
    App.openModal('Add Comment', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Comments._confirmAdd()">Post</button>');

    setTimeout(() => {
      const ta = document.getElementById('commentText');
      if (ta) ta.focus();
    }, 80);
  },

  _confirmAdd() {
    const p = Comments._pendingAdd;
    if (!p) return;
    const text = (document.getElementById('commentText')?.value || '').trim();
    if (!text) { U.toast('Comment is empty', 'error'); return; }
    const sel = document.querySelector('input[name="commentLink"]:checked');
    if (!sel) return;

    const meta = {};
    if (sel.value === 'row') {
      meta.linkedPks = [p.pk];
    } else if (sel.value.startsWith('group:')) {
      meta.linkedGroups = [sel.value.slice(6)];
    }

    const rec = Comments.create(p.tplId, text, meta);
    Comments._pendingAdd = null;
    if (rec) {
      U.toast('Comment posted', 'success');
      App.closeModal();
      Timeline.open(p.tplId, p.pk);
    } else {
      U.toast('Failed to post', 'error');
    }
  },

  // Inline edit dialog (opened from a list view; the timeline shows delete only)
  openEditDialog(tplId, cid) {
    const c = Comments.get(tplId, cid);
    if (!c) return;
    let h = '<label class="field"><span class="label-text">Edit comment</span>';
    h += '<textarea id="commentEditText" style="min-height:100px;">'+U.esc(c.text)+'</textarea></label>';
    h += '<div class="text-muted" style="font-size:11px;">Originally posted '+U.esc((c.createdAt||'').replace('T',' ').substring(0,16))+' by '+U.esc(c.createdBy||'')+'.</div>';
    Comments._pendingEdit = { tplId, cid };
    App.openModal('Edit Comment', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Comments._confirmEdit()">Save</button>');
    setTimeout(() => { const ta = document.getElementById('commentEditText'); if (ta) ta.focus(); }, 80);
  },

  _confirmEdit() {
    const p = Comments._pendingEdit;
    if (!p) return;
    const text = (document.getElementById('commentEditText')?.value || '').trim();
    if (!text) { U.toast('Comment empty', 'error'); return; }
    Comments.edit(p.tplId, p.cid, text);
    Comments._pendingEdit = null;
    App.closeModal();
    U.toast('Comment updated', 'success');
  },

  // === Helpers ===
  _currentUser() {
    return AppState.currentUser || 'unknown';
  }
};

/* ================================================================
   MODULE 3h — FILTER SETS
   Named snapshots of the current Reco filter state. Stored on the
   template so they survive data clears and ride along in backups.
   Captures: columnFilters, slicers, columnSorts, statusFilter,
   requireAttachment, requireComment, requireGroup.
   ================================================================ */
const FilterSets = {
  forTemplate(tpl) {
    tpl.savedFilterSets = tpl.savedFilterSets || [];
    return tpl.savedFilterSets;
  },

  list(tpl) {
    return FilterSets.forTemplate(tpl).slice().sort((a,b) => a.name.localeCompare(b.name));
  },

  get(tpl, fsid) {
    return FilterSets.forTemplate(tpl).find(f => f.id === fsid) || null;
  },

  // === Capture from session ===
  capture(sess) {
    return {
      columnFilters: JSON.parse(JSON.stringify(sess.columnFilters || {})),
      slicers:       JSON.parse(JSON.stringify(sess.slicers || {})),
      columnSorts:   sess.columnSorts ? JSON.parse(JSON.stringify(sess.columnSorts)) : null,
      statusFilter:  sess.statusFilter || 'all',
      requireAttachment: !!sess.requireAttachment,
      requireComment:    !!sess.requireComment,
      requireGroup:      !!sess.requireGroup
    };
  },

  // Quick check: does the session have any filter state worth saving?
  hasActiveFilters(sess) {
    if (sess.statusFilter && sess.statusFilter !== 'all') return true;
    if (sess.requireAttachment || sess.requireComment || sess.requireGroup) return true;
    if (sess.columnSorts && sess.columnSorts.col) return true;
    if (sess.columnFilters && Object.keys(sess.columnFilters).some(k => (sess.columnFilters[k]||[]).length)) return true;
    if (sess.slicers && Object.keys(sess.slicers).some(k => (sess.slicers[k]||[]).length)) return true;
    return false;
  },

  // === Save / Update / Delete ===
  save(tpl, name, description, state) {
    const list = FilterSets.forTemplate(tpl);
    const id = 'FS' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
    const rec = {
      id,
      name: String(name||'').trim() || 'Filter Set',
      description: String(description||''),
      state,
      createdAt: new Date().toISOString()
    };
    list.push(rec);
    AppState.save();
    return rec;
  },

  rename(tpl, fsid, name, description) {
    const f = FilterSets.get(tpl, fsid); if (!f) return;
    f.name = String(name||'').trim() || f.name;
    if (description != null) f.description = String(description);
    AppState.save();
  },

  overwrite(tpl, fsid, state) {
    const f = FilterSets.get(tpl, fsid); if (!f) return;
    f.state = state;
    f.updatedAt = new Date().toISOString();
    AppState.save();
  },

  remove(tpl, fsid) {
    tpl.savedFilterSets = FilterSets.forTemplate(tpl).filter(f => f.id !== fsid);
    AppState.save();
  },

  // === Apply ===
  apply(sess, state) {
    sess.columnFilters = JSON.parse(JSON.stringify(state.columnFilters || {}));
    sess.slicers       = JSON.parse(JSON.stringify(state.slicers || {}));
    sess.columnSorts   = state.columnSorts ? JSON.parse(JSON.stringify(state.columnSorts)) : null;
    sess.statusFilter  = state.statusFilter || 'all';
    sess.requireAttachment = !!state.requireAttachment;
    sess.requireComment    = !!state.requireComment;
    sess.requireGroup      = !!state.requireGroup;
    sess.page = 0;
    AppState.save();
  },

  clearAll(sess) {
    sess.columnFilters = {};
    sess.slicers = {};
    sess.columnSorts = null;
    sess.statusFilter = 'all';
    sess.requireAttachment = false;
    sess.requireComment = false;
    sess.requireGroup = false;
    sess.page = 0;
    AppState.save();
  },

  // Human-readable one-line summary of a state, for the manage modal
  describe(state) {
    const parts = [];
    if (state.statusFilter && state.statusFilter !== 'all') parts.push('status='+state.statusFilter);
    if (state.requireAttachment) parts.push('📎');
    if (state.requireComment)    parts.push('💬');
    if (state.requireGroup)      parts.push('📁');
    const cfCols = Object.keys(state.columnFilters||{}).filter(k => (state.columnFilters[k]||[]).length);
    if (cfCols.length) parts.push(cfCols.length+' col filter'+(cfCols.length>1?'s':''));
    const slCols = Object.keys(state.slicers||{}).filter(k => (state.slicers[k]||[]).length);
    if (slCols.length) parts.push(slCols.length+' slicer'+(slCols.length>1?'s':''));
    if (state.columnSorts && state.columnSorts.col) parts.push('sort:'+state.columnSorts.col+(state.columnSorts.dir==='desc'?'↓':'↑'));
    return parts.length ? parts.join(' · ') : 'no filters';
  }
};
/* ================================================================
   MODULE 3i — FIND & REPLACE
   Searches across standard columns (optionally an extra column for
   find-only). Replacements write through Versioning.appendChangesBatch
   so history stays clean.
   ================================================================ */
const FindReplace = {
  _state: {
    find: '',
    replace: '',
    column: '__all__',     // '__all__' or a specific column name
    matchCase: false,
    wholeWord: false,
    regex: false,
    matches: []            // { rowIdx, col, value, isExtra }
  },

  open() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess || !sess.data.length) {
      U.toast('Load data first', 'error');
      return;
    }
    FindReplace._renderModal();
  },

  _renderModal() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const s = FindReplace._state;

    let h = '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">Find</span>';
    h += '<input type="text" id="frFind" value="'+U.escAttr(s.find)+'" placeholder="search text or regex" autofocus /></label>';
    h += '<label class="field"><span class="label-text">Replace with</span>';
    h += '<input type="text" id="frReplace" value="'+U.escAttr(s.replace)+'" placeholder="(leave blank to find only)" /></label>';
    h += '</div>';

    h += '<div class="grid-2">';
    h += '<label class="field"><span class="label-text">In column</span>';
    h += '<select id="frColumn">';
    h += '<option value="__all__"'+(s.column==='__all__'?' selected':'')+'>All standard columns</option>';
    tpl.columns.forEach(c => {
      h += '<option value="'+U.escAttr(c.name)+'"'+(s.column===c.name?' selected':'')+'>'+U.esc(c.label||c.name)+'</option>';
    });
    (tpl.additionalColumns||[]).forEach(ac => {
      h += '<option value="extra:'+U.escAttr(ac.name)+'"'+(s.column==='extra:'+ac.name?' selected':'')+'>'+U.esc(ac.name)+' (extra — find only)</option>';
    });
    h += '</select></label>';
    h += '<div><label class="inline" style="margin-top:18px;"><input type="checkbox" id="frCase"   '+(s.matchCase?'checked':'')+'> Match case</label>';
    h += '<label class="inline"><input type="checkbox" id="frWord"   '+(s.wholeWord?'checked':'')+'> Whole word</label>';
    h += '<label class="inline"><input type="checkbox" id="frRegex"  '+(s.regex?'checked':'')+'> Regex</label></div>';
    h += '</div>';

    h += '<div class="toolbar" style="margin-top:8px;">';
    h += '<button class="primary" onclick="FindReplace._runSearch()">🔍 Find All</button>';
    h += '<button onclick="FindReplace._replaceAll()">↻ Replace All</button>';
    h += '<div class="toolbar spacer"></div>';
    h += '<span id="frStatus" class="text-muted"></span>';
    h += '</div>';

    h += '<div id="frResults" style="margin-top:8px; max-height:50vh; overflow-y:auto;"></div>';

    App.openModal('Find & Replace', h,
      '<button onclick="App.closeModal()">Close</button>' +
      '<button class="primary" onclick="FindReplace._runSearch()">Find All</button>');

    setTimeout(() => {
      const inp = document.getElementById('frFind');
      if (inp) { inp.focus(); inp.select(); }
    }, 100);
  },

  _readState() {
    const s = FindReplace._state;
    s.find      = document.getElementById('frFind')?.value || '';
    s.replace   = document.getElementById('frReplace')?.value || '';
    s.column    = document.getElementById('frColumn')?.value || '__all__';
    s.matchCase = !!document.getElementById('frCase')?.checked;
    s.wholeWord = !!document.getElementById('frWord')?.checked;
    s.regex     = !!document.getElementById('frRegex')?.checked;
  },

  _buildMatcher() {
    const s = FindReplace._state;
    if (!s.find) return null;
    if (s.regex) {
      try {
        return new RegExp(s.find, s.matchCase ? 'g' : 'gi');
      } catch(e) {
        U.toast('Invalid regex: ' + e.message, 'error');
        return null;
      }
    }
    // Escape regex special chars
    let pattern = s.find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (s.wholeWord) pattern = '\\b' + pattern + '\\b';
    return new RegExp(pattern, s.matchCase ? 'g' : 'gi');
  },

  /* Plain-text mode replaces literally ($& / $1 have no special meaning);
     regex mode keeps JavaScript's $1 group references. */
  _replacement() {
    const s = FindReplace._state;
    return s.regex ? s.replace : () => s.replace;
  },

  _columnsToSearch(tpl) {
    const s = FindReplace._state;
    if (s.column === '__all__') return tpl.columns.map(c => ({ name: c.name, isExtra: false }));
    if (s.column.indexOf('extra:') === 0) {
      const acName = s.column.slice(6);
      const ac = (tpl.additionalColumns||[]).find(a => a.name === acName);
      return ac ? [{ name: acName, isExtra: true, def: ac }] : [];
    }
    return [{ name: s.column, isExtra: false }];
  },

  _runSearch() {
    FindReplace._readState();
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const rx = FindReplace._buildMatcher();
    if (!rx) {
      document.getElementById('frResults').innerHTML = '';
      document.getElementById('frStatus').textContent = '';
      return;
    }
    const cols = FindReplace._columnsToSearch(tpl);
    const matches = [];
    sess.data.forEach((row, ri) => {
      cols.forEach(c => {
        let val;
        if (c.isExtra) val = Reco._extraValueForRow(tpl, sess, row, c.def);
        else val = row[c.name];
        if (val == null || val === '') return;
        rx.lastIndex = 0;
        if (rx.test(String(val))) {
          matches.push({ rowIdx: ri, col: c.name, value: String(val), isExtra: !!c.isExtra });
        }
      });
    });
    FindReplace._state.matches = matches;
    FindReplace._renderResults();
  },

  _renderResults() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    const matches = s.matches;

    const statusEl = document.getElementById('frStatus');
    const resEl = document.getElementById('frResults');
    if (!resEl) return;

    if (!matches.length) {
      statusEl.textContent = '0 matches';
      resEl.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    statusEl.textContent = matches.length + ' match'+(matches.length===1?'':'es')+(s.replace?' — Replace All to apply':'');

    const rx = FindReplace._buildMatcher();
    const showLimit = 200;

    let h = '<table><thead><tr><th>Row</th><th>Column</th><th>Value (preview)</th><th></th></tr></thead><tbody>';
    matches.slice(0, showLimit).forEach((m, mi) => {
      const row = sess.data[m.rowIdx];
      // Preview with highlight
      // Cap length before escaping/highlighting so a cut never splits a tag or entity
      let preview = m.value.length > 200 ? m.value.substring(0, 200) + '…' : m.value;
      if (rx) {
        rx.lastIndex = 0;
        preview = preview.replace(rx, m0 => '\u0001'+m0+'\u0002');
      }
      preview = U.esc(preview).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');

      h += '<tr>';
      h += '<td><span class="text-muted">#'+m.rowIdx+'</span></td>';
      h += '<td><b>'+U.esc(m.col)+'</b>'+(m.isExtra?' <span class="badge fc">extra</span>':'')+'</td>';
      h += '<td style="max-width:400px;">'+preview+'</td>';
      h += '<td>';
      if (!m.isExtra && s.replace !== '') {
        h += '<button class="small primary" onclick="FindReplace._replaceOne('+mi+')">Replace</button>';
      } else if (m.isExtra) {
        h += '<span class="text-muted" style="font-size:10px;">read-only</span>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table>';
    if (matches.length > showLimit) {
      h += '<div class="text-muted" style="margin-top:4px; font-size:11px;">Showing first '+showLimit+' of '+matches.length+'. Use Replace All to apply to every match.</div>';
    }
    resEl.innerHTML = h;
  },

  async _replaceOne(matchIndex) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    const m = s.matches[matchIndex];
    if (!m || m.isExtra) return;
    const rx = FindReplace._buildMatcher(); if (!rx) return;

    const row = sess.data[m.rowIdx];
    const oldVal = row[m.col] == null ? '' : String(row[m.col]);
    rx.lastIndex = 0;
    const newVal = oldVal.replace(rx, FindReplace._replacement());
    if (newVal === oldVal) {
      U.toast('No change', 'error');
      return;
    }
    row[m.col] = newVal;
    const pk = row._pk || Reco.getRowPK(tpl, row);
    if (pk) {
      try {
        const verLabel = await Versioning.appendChange(tpl, pk, row);
        row._ver = verLabel;
      } catch(e) { console.error('appendChange', e); }
    }
    AppState.save();
    // Re-search to refresh results
    FindReplace._runSearch();
    U.toast('Replaced 1 cell', 'success');
  },

  async _replaceAll() {
    FindReplace._readState();
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const s = FindReplace._state;
    if (!s.find) { U.toast('Enter something to find', 'error'); return; }
    if (s.replace === '') {
      if (!confirm('Replace with empty string? Matching text in every match will be deleted.')) return;
    }
    const rx = FindReplace._buildMatcher(); if (!rx) return;

    const cols = FindReplace._columnsToSearch(tpl).filter(c => !c.isExtra);
    if (!cols.length) { U.toast('Pick a standard column or "All standard columns" to replace.', 'error'); return; }

    let cellChanges = 0;
    const touchedRowIdx = new Set();
    sess.data.forEach((row, ri) => {
      cols.forEach(c => {
        const oldVal = row[c.name] == null ? '' : String(row[c.name]);
        if (!oldVal) return;
        rx.lastIndex = 0;
        if (!rx.test(oldVal)) return;
        rx.lastIndex = 0;
        const newVal = oldVal.replace(rx, FindReplace._replacement());
        if (newVal === oldVal) return;
        row[c.name] = newVal;
        cellChanges++;
        touchedRowIdx.add(ri);
      });
    });

    if (!cellChanges) { U.toast('Nothing matched', 'error'); return; }

    // Batch-write one Cn per touched PK
    const pkRows = [];

/* ================================================================

   columns exist, which are editable and with what editor, the single
   normaliser used to compare values (canon), and write-back in the style

  SEP: String.fromCharCode(31),

  _ctl: new RegExp('[' + String.fromCharCode(0) + '-' + String.fromCharCode(8) + String.fromCharCode(11, 12)

  aegTemplateFor(tpl) {

      if (!ac || !ac.name || seen.has(ac.name) || colDefs.has(ac.name)) return;
      const isTo = ac.name === toAcc;
      const type = ac.type || 'custom';
      const computed = !isTo && (type === 'formula' || type === 'master' || type === 'master_lookup');

      if (showExtras === 'inputs' && computed) return;

      const d = { name: ac.name, header: header(ac.name), kind: 'text', role: isTo ? 'toAccount' : (computed ? 'computed' : 'tag'),
        isPk: false, isDate: false, isValue: false, versioned: false, editable: !computed && scope !== 'readonly',
