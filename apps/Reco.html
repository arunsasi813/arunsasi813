  /* Apply ALL active filters / slicers / status / sorts to produce the filtered list */
  applyTableFiltersSort(tpl, sess) {
    const all = sess.data.slice();
    let filtered = all;
    // Status
    if (sess.statusFilter === 'open') filtered = filtered.filter(r => !sess.offsets?.[r._id]);
    else if (sess.statusFilter === 'offset') filtered = filtered.filter(r => sess.offsets?.[r._id]);

    // Status-extra filters: attachment / comment / group presence
    if (sess.requireAttachment) {
      filtered = filtered.filter(r => {
        const pk = Reco.getRowPK(tpl, r);
        return pk && typeof Attachments !== 'undefined' && Attachments.forPk(tpl.id, pk).length > 0;
      });
    }
    if (sess.requireComment) {
      filtered = filtered.filter(r => {
        const pk = Reco.getRowPK(tpl, r);
        return pk && typeof Comments !== 'undefined' && Comments.forPk(tpl.id, pk).length > 0;
      });
    }
    if (sess.requireGroup) {
      filtered = filtered.filter(r => {
        const pk = Reco.getRowPK(tpl, r);
        return pk && typeof Groups !== 'undefined' && Groups.groupsForPk(tpl.id, pk).length > 0;
      });
    }
    // Column filters: each column has an array of filter conditions; row passes if ALL conditions on ALL columns pass
      const colFilters = sess.columnFilters || {};
      Object.keys(colFilters).forEach(col => {
        const conds = colFilters[col].filter(c => c.enabled !== false);
        if (!conds.length) return;
        const extraDef = Reco._extraDef(tpl, col);
        filtered = filtered.filter(row => {
          const val = extraDef ? Reco._extraValueForRow(tpl, sess, row, extraDef) : row[col];
          return conds.every(c => FilterOps.evaluate(val, c.op, c.val, c.val2));
        });
      });

    
    // Slicers
      Object.keys(sess.slicers || {}).forEach(col => {
        const sel = sess.slicers[col];
        if (!sel || !sel.length) return;
        const extraDef = Reco._extraDef(tpl, col);
        filtered = filtered.filter(row => {
          const val = extraDef ? Reco._extraValueForRow(tpl, sess, row, extraDef) : row[col];
          return sel.includes(String(val||''));
        });
      });

    // Sort
      if (sess.columnSorts && sess.columnSorts.col) {
        const { col, dir } = sess.columnSorts;
        const colDef = tpl.columns.find(c => c.name === col);
        const extraDef = Reco._extraDef(tpl, col);
        const isDate = colDef && colDef.isDate;
        const getVal = (r) => extraDef ? Reco._extraValueForRow(tpl, sess, r, extraDef) : r[col];
        const keyed = filtered.map(r => ({ r, v: getVal(r) }));   // compute each value once
        keyed.sort((a, b) => Reco._compareValues(a.v, b.v, isDate, dir === 'desc' ? -1 : 1));
        filtered = keyed.map(k => k.r);
      }
    return filtered;
  },

  /* Sort comparator: dates (for date columns), then numbers (1,234.50 aware),
     then text. dir = 1 ascending / -1 descending; blanks always sort last. */
  _compareValues(va, vb, isDate, dir) {
    dir = dir || 1;
    const ea = va == null || va === '', eb = vb == null || vb === '';
    if (ea || eb) return ea === eb ? 0 : (ea ? 1 : -1);
    if (isDate) {
      const da = U.parseDate(va), db = U.parseDate(vb);
      if (da && db) return (da - db) * dir;
    }
    if (U.isNumeric(va) && U.isNumeric(vb)) return (U.num(va) - U.num(vb)) * dir;
    return String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' }) * dir;
  },

  renderSlicers(tpl, sess) {
    const slicers = sess.slicers || {};
    const active = Object.keys(slicers).filter(k => (slicers[k]||[]).length);
    if (!active.length) return '';
    let h = '<div class="slicer-panel">';
    h += '<div style="display:flex; justify-content:space-between; align-items:center;"><b>Active Slicers</b>';
    h += '<button class="small" onclick="Reco.clearAllSlicers()">Clear All</button></div>';
    active.forEach(col => {
      const vals = slicers[col];
      h += '<div style="margin-top:6px;"><b style="font-size:11px;">'+U.esc(col)+':</b> ';
      vals.forEach(v => {
        h += '<span class="tag">'+U.esc(v)+' <span class="x" onclick="Reco.toggleSlicer(\''+U.jsq(col)+'\',\''+U.jsq(v)+'\')">×</span></span>';
      });
      h += '</div>';
    });
    h += '</div>';
    return h;
  },
  toggleSlicer(col, val) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.slicers = sess.slicers || {};
    sess.slicers[col] = sess.slicers[col] || [];
    const i = sess.slicers[col].indexOf(val);
    if (i >= 0) sess.slicers[col].splice(i,1);
    else sess.slicers[col].push(val);
    sess.page = 0;
    AppState.save();
    App.navigate('reco');
  },
  clearAllSlicers() {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.slicers = {};
    sess.page = 0;
    AppState.save();
    App.navigate('reco');
  },
  // Build the effective ordered column list for the reco table.
  // Honours: tpl.displayColumns, AEG-injected To Account column, and sess.columnOrder.
  effectiveDisplayCols(tpl, sess) {
    let base = (tpl.displayColumns && tpl.displayColumns.length)
      ? tpl.displayColumns.slice()
      : tpl.columns.map(c => c.name);

    // Inject AEG-required "To Account" column if missing (mirrors original logic)
    if (tpl.aegIntegration && tpl.aegIntegration.enabled && tpl.aegIntegration.aegTemplateId) {
      const aegTpl = AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId);
      if (aegTpl && aegTpl.toAccount && (aegTpl.toAccount.mode === 'input' || aegTpl.toAccount.mode === 'inputOrSelect')) {
        const reqCol = aegTpl.toAccount.inputColumn;
        if (reqCol && tpl.columns.find(c => c.name === reqCol) && !base.includes(reqCol)) {
          base.push(reqCol);
        }
      }
    }

    // Filter out hidden columns (Phase 1)
    base = base.filter(c => !(sess.hiddenCols || []).includes(c));

    // Apply saved column order
    const order = Array.isArray(sess.columnOrder) ? sess.columnOrder : [];
    if (!order.length) return base;

    const ordered     = order.filter(c => base.includes(c));
    const notOrdered  = base.filter(c => !ordered.includes(c));
    return ordered.concat(notOrdered).filter(c => !(sess.hiddenCols || []).includes(c));
  },


/* ============== DOM VIRTUALIZATION ============== */
_VIRT_WINDOW: 110,
_VIRT_BUFFER: 20,
_VIRT_DEFAULT_H: 32,

_computeVirtWindow(slice, sess) {
  const total = slice.length;
  const rowH = sess._virtRowHeight || Reco._VIRT_DEFAULT_H;
  if (total <= Reco._VIRT_WINDOW) {
    return { startIdx: 0, endIdx: total, topPx: 0, botPx: 0, rowH };
  }
  const wrap = document.querySelector('.reco-table-wrap');
  const scrollTop = wrap ? wrap.scrollTop : (sess._initialScrollTop || 0);
  let startIdx = Math.max(0, Math.floor(scrollTop / rowH) - Reco._VIRT_BUFFER);
  let endIdx = Math.min(total, startIdx + Reco._VIRT_WINDOW);
  startIdx = Math.max(0, endIdx - Reco._VIRT_WINDOW);
  return {
    startIdx, endIdx,
    topPx: startIdx * rowH,
    botPx: (total - endIdx) * rowH,
    rowH
  };
},

_buildRowIdxMap(sess) {
  const m = new Map();
  sess.data.forEach((r, i) => m.set(r._id, i));
  return m;
},

_attachVirtScroll() {
  const wrap = document.querySelector('.reco-table-wrap');
  if (!wrap || wrap._virtWired) return;
  wrap._virtWired = true;
  let pending = false;
  wrap.addEventListener('scroll', () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      Reco._refreshVirtBody();
    });
  }, { passive: true });
},

_measureVirtRow(sess) {
  if (sess._virtRowHeight) return; // measure once, then keep stable
  const sample = document.querySelector('.reco-table-wrap tbody tr:not(.virt-spacer-top):not(.virt-spacer-bot)');
  if (sample && sample.offsetHeight) sess._virtRowHeight = sample.offsetHeight;
},

_refreshVirtBody() {
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  if (!tpl || !sess) return;
  const tbody = document.querySelector('.reco-table-wrap tbody');
  if (!tbody) return;

  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const pageSize = sess.pageSize || 200;
  const start = sess.page * pageSize;
  const slice = filtered.slice(start, start + pageSize);
  if (!slice.length) return;
  SpecialJV.resetOptions();

  const displayCols = Reco.effectiveDisplayCols(tpl, sess);
  const extraCols = [...(tpl.additionalColumns || []), ...(sess.extraColumns || [])];
  if (tpl.aegIntegration && tpl.aegIntegration.enabled && tpl.aegIntegration.aegTemplateId) {
    const aegTpl = AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId);
    if (aegTpl && aegTpl.toAccount && (aegTpl.toAccount.mode === 'input' || aegTpl.toAccount.mode === 'inputOrSelect')) {
      const reqCol = aegTpl.toAccount.inputColumn;
      if (reqCol && !tpl.columns.find(c => c.name === reqCol) && !extraCols.find(c => c.name === reqCol)) {
        extraCols.push({ name: reqCol, type: 'custom' });
      }
    }
  }

  const idxMap = Reco._buildRowIdxMap(sess);
  const win = Reco._computeVirtWindow(slice, sess);
  const colspan = 2 + displayCols.length + extraCols.length;
  let h = '';
  if (win.topPx > 0) {
    h += '<tr class="virt-spacer-top" style="height:'+win.topPx+'px;"><td colspan="'+colspan+'"></td></tr>';
  }
  for (let vi = win.startIdx; vi < win.endIdx; vi++) {
    const fidx = sess.page * pageSize + vi;
    h += Reco._renderOneRow(tpl, sess, slice[vi], displayCols, extraCols, idxMap, fidx);
  }
  if (win.botPx > 0) {
    h += '<tr class="virt-spacer-bot" style="height:'+win.botPx+'px;"><td colspan="'+colspan+'"></td></tr>';
  }
  tbody.innerHTML = h;
  Reco._ssApplyHighlight();
  Reco._measureVirtRow(sess);
},

_renderOneRow(tpl, sess, row, displayCols, extraCols, idxMap, filteredIdx) {
  let h = '';
  const i = idxMap ? idxMap.get(row._id) : sess.data.indexOf(row);
  const isOffset = sess.offsets && sess.offsets[row._id];
  const isSelected = sess.selectedRows && sess.selectedRows[row._id];
  const rowClass = isOffset ? 'row-offset' : 'row-open';
  const selClass = isSelected ? ' selected' : '';
  const rowPkAttr = U.escAttr(Reco.getRowPK(tpl, row) || '');
     const addedCls = row._ssAdded ? ' row-ss-added' : '';


  h += '<tr class="' + rowClass + selClass + addedCls + '" '
     + 'data-pk="' + rowPkAttr + '" '
     + 'data-frow="' + filteredIdx + '" '
     + 'onmousedown="Reco.startDragSelect(event, \'' + U.jsq(row._id) + '\')" '
     + 'onmouseenter="Reco.dragOver(event, \'' + U.jsq(row._id) + '\')" '
     + 'oncontextmenu="Reco.openRowContextMenu(event, \'' + U.jsq(row._id) + '\'); return false;" '
     + 'ondblclick="Reco.openRowTimeline(\'' + U.jsq(row._id) + '\')" '
     + 'ondragover="Reco.onRowDragOver(event)" '
     + 'ondrop="Reco.onRowDrop(event, \'' + U.jsq(row._id) + '\')">';

  h += '<td style="text-align:center;"><input type="checkbox" ' + (isSelected ? 'checked' : '') + ' onchange="Reco.toggleRowSelect(\'' + U.jsq(row._id) + '\',this.checked)" /></td>';

  let statusHtml = (isOffset ? '<span class="badge offset">Offset' + (row._manualOffset ? ' ✋' : '') + '</span>' : '<span class="badge open">Open</span>');
    if (row._ssAdded)      statusHtml += ' <span class="badge ss-added" title="Added row">✚</span>';
    if (row._ssPersistent) statusHtml += ' <span class="badge ss-persist" title="Persistent (in versioned CSV)">💾</span>';
    if (row._ssSingleUse)  statusHtml += ' <span class="badge ss-single" title="Single-use — removed after next entry">⏱</span>';
  const rowPkForBadges = Reco.getRowPK(tpl, row);
  if (tpl.groupsEnabled) {
    const memberships = rowPkForBadges ? Groups.groupsForPk(tpl.id, rowPkForBadges) : [];
    if (memberships.length) {
      const titles = memberships.map(g => g.name).join(' · ');
      statusHtml += ' <span class="badge general" style="cursor:pointer;" title="In groups: ' + U.escAttr(titles) + '" onclick="event.stopPropagation(); Reco.showRowGroups(\'' + U.jsq(rowPkForBadges) + '\')">📁 ' + memberships.length + '</span>';
    }
  }
  if (rowPkForBadges) {
    const attCount = Attachments.forPk(tpl.id, rowPkForBadges).length;
    const comCount = Comments.forPk(tpl.id, rowPkForBadges).length;
    if (attCount) statusHtml += ' <span class="badge fc" style="cursor:pointer;" title="'+attCount+' attachment(s)" onclick="event.stopPropagation(); Reco.openRowTimeline(\''+U.jsq(row._id)+'\')">📎 '+attCount+'</span>';
    if (comCount) statusHtml += ' <span class="badge specific" style="cursor:pointer;" title="'+comCount+' comment(s)" onclick="event.stopPropagation(); Reco.openRowTimeline(\''+U.jsq(row._id)+'\')">💬 '+comCount+'</span>';
  }
  h += '<td class="status-cell">' + statusHtml + '</td>';

  displayCols.forEach(col => {
    const dataAttr = ' data-col="' + U.escAttr(col) + '"';
    const colDef = tpl.columns.find(c => c.name === col);
    let val = row[col];
          // Phase 4: per-cell format
          const fmt = Reco._ssFmtFor(sess, row, col);
          const fmtStyle = Reco._ssFmtStyle(fmt);
          const fmtCls   = Reco._ssFmtClass(fmt);

    // Phase 2: if a per-cell formula exists, evaluate and override the displayed value
          const rowKey = Reco._ssRowKey(row);
          const cellFormula = sess.spreadsheetMode ? ((sess.cellFormulas || {})[rowKey] || {})[col] : null;
          let formulaCls = '';
          if (cellFormula) {
            val = Reco._ssEvalFormula(cellFormula, row, tpl);
            formulaCls = ' ss-formula-cell';
          }  

    if (col.toLowerCase().includes('date')) val = U.formatExcelDate(val);
    let cls = '';
    if (row['_corrected_'+col]) cls = 'cell-corrected';
    else if (colDef && colDef.formats && colDef.formats.length && !FMT.validate(val, colDef.formats)) cls = 'cell-error';

    const aegTpl2 = (tpl.aegIntegration && tpl.aegIntegration.enabled)
      ? AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId) : null;
    const isToAcctCol = aegTpl2 && aegTpl2.toAccount &&
      (aegTpl2.toAccount.mode === 'input' || aegTpl2.toAccount.mode === 'inputOrSelect') &&
      aegTpl2.toAccount.inputColumn === col;

    if (isToAcctCol) {
      const opts = SpecialJV.buildToAccountOptions();
      h += '<td' + dataAttr + ' class="' + cls + fmtCls + '" style="' + fmtStyle + '"><select onchange="Reco.editCell(' + i + ',\'' + U.jsq(col) + '\',this.value)" style="min-width:140px;">';
      h += '<option value="">— select —</option>';
      const masters = opts.filter(o => o.kind === 'master');
      const jvs = opts.filter(o => o.kind === 'jv');
      if (masters.length) {
        h += '<optgroup label="Accounts Master">';
        masters.forEach(o => { h += '<option value="'+U.escAttr(o.value)+'"'+(String(val)===o.value?' selected':'')+'>'+U.esc(o.label)+'</option>'; });
        h += '</optgroup>';
      }
      if (jvs.length) {
        h += '<optgroup label="Special JVs">';
        jvs.forEach(o => { h += '<option value="'+U.escAttr(o.value)+'"'+(String(val)===o.value?' selected':'')+'>'+U.esc(o.label)+'</option>'; });
        h += '</optgroup>';
      }
      if (val && !opts.find(o => o.value === val)) h += '<option value="'+U.escAttr(val)+'" selected>'+U.esc(val)+' (custom)</option>';
      h += '</select></td>';
    } else {
      const isEditable = (tpl.editableColumns || []).includes(col);
      if (isEditable) h += Reco._renderEditableCell(tpl, i, col, val, cls + fmtCls, fmtStyle);
      else {
                 if (fmt && fmt.numFmt) val = Reco._ssApplyNumFmt(val, fmt.numFmt);
                 h += '<td' + dataAttr + ' class="' + cls + fmtCls + '" style="white-space:nowrap; padding: 6px;' + fmtStyle + '">' + U.esc(val) + '</td>';
               }
    }
  });

  const accum = Object.assign({}, row);
  extraCols.forEach(ac => {
    const dataAttr = ' data-col="' + U.escAttr(ac.name) + '"';

    const aegTplX = (tpl.aegIntegration && tpl.aegIntegration.enabled)
      ? AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId) : null;
    const isToAcctExtra = aegTplX && aegTplX.toAccount &&
      (aegTplX.toAccount.mode === 'input' || aegTplX.toAccount.mode === 'inputOrSelect') &&
      aegTplX.toAccount.inputColumn === ac.name;
    if (isToAcctExtra) {
      const curVal = row[ac.name] != null ? String(row[ac.name]) : '';
      const opts = SpecialJV.buildToAccountOptions();
      h += '<td' + dataAttr + '><select onchange="Reco.editCell('+i+',\''+U.jsq(ac.name)+'\',this.value)" style="min-width:140px;">';
      h += '<option value="">— select —</option>';
      const masters = opts.filter(o => o.kind === 'master');
      const jvs     = opts.filter(o => o.kind === 'jv');
      if (masters.length) { h += '<optgroup label="Accounts Master">'; masters.forEach(o => { h += '<option value="'+U.escAttr(o.value)+'"'+(curVal===o.value?' selected':'')+'>'+U.esc(o.label)+'</option>'; }); h += '</optgroup>'; }
      if (jvs.length)     { h += '<optgroup label="Special JVs">';     jvs.forEach(o => { h += '<option value="'+U.escAttr(o.value)+'"'+(curVal===o.value?' selected':'')+'>'+U.esc(o.label)+'</option>'; }); h += '</optgroup>'; }
      if (curVal && !opts.find(o => o.value === curVal)) h += '<option value="'+U.escAttr(curVal)+'" selected>'+U.esc(curVal)+' (custom)</option>';
      h += '</select></td>';
      accum[ac.name] = curVal;
      return;
    }

    let v;
    if (ac.type === 'master' || ac.type === 'master_lookup') {
      v = Masters.evalLookup(tpl, ac, accum);
      accum[ac.name] = v;
      h += '<td' + dataAttr + ' class="text-muted" style="white-space:nowrap; padding: 6px;">'+U.esc(v)+'</td>';
    } else if (ac.type === 'formula') {
      try { v = Formula.evaluate(ac.formula, accum); } catch(e) { v = '#ERR'; }
      accum[ac.name] = v;
      h += '<td' + dataAttr + ' class="text-muted" style="white-space:nowrap; padding: 6px;">'+U.esc(v)+'</td>';
    } else {
      const tagKey = row._id + '||' + ac.name;
      const tagVal = (row[ac.name] != null && row[ac.name] !== '')
        ? String(row[ac.name])
        : ((sess.manualTags || {})[tagKey] || '');
      accum[ac.name] = tagVal;
      if (ac.type === 'dropdown') {
        const dropOpts = Masters._extraDropdownOptions(tpl, ac);
        h += '<td' + dataAttr + '><select onchange="Reco.setTag(\''+U.jsq(row._id)+'\',\''+U.jsq(ac.name)+'\',this.value)">';
        h += '<option value="">—</option>';
        dropOpts.forEach(o => { h += '<option value="'+U.escAttr(o)+'"'+(tagVal===o?' selected':'')+'>'+U.esc(o)+'</option>'; });
        if (tagVal && dropOpts.indexOf(tagVal) === -1) h += '<option value="'+U.escAttr(tagVal)+'" selected>'+U.esc(tagVal)+' (custom)</option>';
        h += '</select></td>';
      } else {
        h += '<td' + dataAttr + '><input type="text" value="'+U.escAttr(tagVal)+'" onchange="Reco.setTag(\''+U.jsq(row._id)+'\',\''+U.jsq(ac.name)+'\',this.value)" /></td>';
      }
    }
  });

  h += '</tr>';
  return h;
},



/* Render the main reco table with pagination, column filters, slicers, row selection */
renderRecoTable(tpl, sess) {
    SpecialJV.resetOptions();
    // 1. Effective display order (honours saved sess.columnOrder + AEG To Account injection)
    const displayCols = Reco.effectiveDisplayCols(tpl, sess);
    const extraCols = [...(tpl.additionalColumns || []), ...(sess.extraColumns || [])];

    // 2. Inject "To Account" as an extra column only if it isn't already in standard columns
    if (tpl.aegIntegration && tpl.aegIntegration.enabled && tpl.aegIntegration.aegTemplateId) {
      const aegTpl = AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId);
      if (aegTpl && aegTpl.toAccount && (aegTpl.toAccount.mode === 'input' || aegTpl.toAccount.mode === 'inputOrSelect')) {
        const reqCol = aegTpl.toAccount.inputColumn;
        if (reqCol && !tpl.columns.find(c => c.name === reqCol)) {
          const isExtra = extraCols.find(c => c.name === reqCol);
          if (!isExtra) extraCols.push({ name: reqCol, type: 'custom' });
        }
      }
    }

    const filtered = Reco.applyTableFiltersSort(tpl, sess);
    const pageSize = sess.pageSize || 200;
    const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if (sess.page >= pages) sess.page = pages - 1;
    if (sess.page < 0) sess.page = 0;
    const start = sess.page * pageSize;
    const slice = filtered.slice(start, start + pageSize);

    let h = '';
    h += '<div class="pager" style="padding: 6px 14px 0 14px; flex-shrink: 0;">';
    h += '<button class="small" onclick="Reco.setPage(0)" '+(sess.page===0?'disabled':'')+'>⏮</button>';
    h += '<button class="small" onclick="Reco.setPage('+(sess.page-1)+')" '+(sess.page===0?'disabled':'')+'>◀</button>';
    h += '<span class="page-info">Page '+(sess.page+1)+' / '+pages+' &middot; Showing '+slice.length+' of '+filtered.length+' filtered ('+sess.data.length+' total)</span>';
    h += '<button class="small" onclick="Reco.setPage('+(sess.page+1)+')" '+(sess.page>=pages-1?'disabled':'')+'>▶</button>';
    h += '<button class="small" onclick="Reco.setPage('+(pages-1)+')" '+(sess.page>=pages-1?'disabled':'')+'>⏭</button>';
    h += '<select onchange="Reco.setPageSize(+this.value)">';
    [100,200,500,1000,5000,10000].forEach(s => { h += '<option value="'+s+'"'+(sess.pageSize===s?' selected':'')+'>'+s+' / page</option>'; });
    h += '</select>';
    h += '<div style="flex:1"></div>';
    
    // NEW: Bulk Offset Actions (Replacing the removed Actions column)
    h += '<button class="small" onclick="Reco.bulkMarkOffset(true)" style="margin-right:4px;">Mark Offset</button>';
    h += '<button class="small" onclick="Reco.bulkMarkOffset(false)" style="margin-right:12px;">Unmark</button>';

    if (tpl.groupsEnabled) {
      h += '<button class="small" onclick="Reco.openGroupMenu(this)" style="margin-right:12px;">📁 Group ▾</button>';
    }

    if (tpl.aegIntegration && tpl.aegIntegration.enabled) {
      h += '<button class="small primary" onclick="Reco.previewEntryFromSelection(true)">Preview Entry</button>';
      h += '<span class="text-muted" style="margin-left:4px;" title="Top button uses all open rows when nothing selected; selection-bar Preview always uses selection.">ⓘ</span>';
    }


    h += '</div>';

    // Table Header
    if (sess.spreadsheetMode) h += Reco._ssRenderFormulaBar(sess);
    if (sess.spreadsheetMode && sess.formatToolbarOpen) h += Reco._ssRenderFormatToolbar(sess);
    h += '<div class="reco-table-wrap"><table><thead><tr>';
    h += '<th style="width:30px;"><input type="checkbox" onchange="Reco.toggleAllRows(this.checked)" /></th>';
          h += '<th class="status-th" style="min-width:130px; white-space:nowrap;">Status<span class="col-filter-btn'+(Reco._anyStatusFilterActive(sess)?' active':'')+'" onclick="Reco.openStatusFilter(this, event)">▼</span></th>';
    displayCols.forEach((col, ci) => {
      const cf = (sess.columnFilters[col]||[]).filter(c => c.enabled !== false);
      const hasFilter = cf.length > 0 || ((sess.slicers[col]||[]).length > 0);
      const isSorted = sess.columnSorts && sess.columnSorts.col === col;
      const w = sess.columnWidths[col] ? 'width:'+sess.columnWidths[col]+'px;' : '';
      h += '<th class="col-draggable" '
         + 'draggable="true" '
         + 'data-col="'+U.escAttr(col)+'" '
         + 'style="'+w+'min-width:60px;" '
         + 'ondragstart="Reco.onColDragStart(event, \''+U.jsq(col)+'\')" '
         + 'ondragover="Reco.onColDragOver(event, \''+U.jsq(col)+'\')" '
         + 'ondragleave="Reco.onColDragLeave(event)" '
         + 'ondrop="Reco.onColDrop(event, \''+U.jsq(col)+'\')" '
         + 'ondragend="Reco.onColDragEnd(event)">';
      h += '<span class="col-grip" title="Drag to reorder">⋮⋮</span> ';
      h += U.esc(col);
      if (isSorted) h += ' <span class="text-muted">'+(sess.columnSorts.dir==='asc'?'▲':'▼')+'</span>';
      h += '<span class="col-filter-btn'+(hasFilter||isSorted?' active':'')+'" onclick="Reco.toggleColDropdown(\''+U.jsq(col)+'\', this, event)">▼</span>';
               h += '<span class="col-resize-handle" draggable="false" data-col="'+U.escAttr(col)+'" ondragstart="event.preventDefault(); event.stopPropagation();"></span>';
      h += '</th>';
    });



      extraCols.forEach(ac => {
        const cf = (sess.columnFilters[ac.name]||[]).filter(c => c.enabled !== false);
        const hasFilter = cf.length > 0 || ((sess.slicers[ac.name]||[]).length > 0);
        const isSorted = sess.columnSorts && sess.columnSorts.col === ac.name;
        const isAdded = !!ac._ssAdded;
        h += '<th data-col="'+U.escAttr(ac.name)+'" class="'+(isAdded?'col-ss-added':'')+'" style="min-width:60px;">';
        if (isAdded) h += '<span class="col-marker" title="Added column">✚</span>';
        else h += '<span class="text-muted" style="font-size:9px;">extra</span> ';
        h += U.esc(ac.name);
        if (ac._ssSingleUse) h += ' <span class="badge ss-single" title="Single-use">⏱</span>';
      if (isSorted) h += ' <span class="text-muted">'+(sess.columnSorts.dir==='asc'?'▲':'▼')+'</span>';
      h += '<span class="col-filter-btn'+(hasFilter||isSorted?' active':'')+'" onclick="Reco.toggleColDropdown(\''+U.jsq(ac.name)+'\', this, event)">▼</span>';
      h += '</th>';
    });

    // REMOVED: Actions Column Header
    h += '</tr></thead><tbody>';


    const idxMap = Reco._buildRowIdxMap(sess);
      const win = Reco._computeVirtWindow(slice, sess);
      const colspan = 2 + displayCols.length + extraCols.length;
      if (win.topPx > 0) {
        h += '<tr class="virt-spacer-top" style="height:'+win.topPx+'px;"><td colspan="'+colspan+'"></td></tr>';
      }
      
      for (let vi = win.startIdx; vi < win.endIdx; vi++) {
        const fidx = sess.page * pageSize + vi;
        h += Reco._renderOneRow(tpl, sess, slice[vi], displayCols, extraCols, idxMap, fidx);
      }
      if (win.botPx > 0) {
        h += '<tr class="virt-spacer-bot" style="height:'+win.botPx+'px;"><td colspan="'+colspan+'"></td></tr>';
      }
      if (!slice.length) {
        h += '<tr><td colspan="'+colspan+'"><div class="empty">No rows match current filters.</div></td></tr>';
      }

    h += '</tbody></table></div>';

    setTimeout(() => {
      Reco._attachResizeHandlers();
      Reco._attachZoomHandler();
      Reco._applyZoom();
      Reco._attachVirtScroll();
      Reco._measureVirtRow(sess);
      Reco._ssAttachHandlers();
      Reco._ssApplyHighlight();
    }, 0);
    return h;
  },


  _attachResizeHandlers() {
    const handles = document.querySelectorAll('.col-resize-handle');
    handles.forEach(h => {
      if (h._wired) return;
      h._wired = true;
      h.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        const th = h.parentElement;
        const startX = e.clientX;
        const startW = th.offsetWidth;
        const col = h.dataset.col;
        const onMove = (ev) => {
          const w = Math.max(40, startW + (ev.clientX - startX));
          th.style.width = w + 'px';
          th.style.minWidth = w + 'px';
          const sess = AppState.recoSessions[AppState.activeRecoId];
          if (sess) sess.columnWidths[col] = w;
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          AppState.save();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  },

  /* ============== COLUMN DRAG-REORDER ============== */
  _dragCol: null,

  onColDragStart(ev, col) {
    Reco._dragCol = col;
    try {
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', col);
    } catch(e) {}
    ev.currentTarget.classList.add('col-dragging');
  },

  onColDragOver(ev, col) {
    if (!Reco._dragCol || Reco._dragCol === col) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = 'move'; } catch(e) {}
    // Highlight which side: left half = insert before, right half = insert after
    const rect = ev.currentTarget.getBoundingClientRect();
    const isLeft = (ev.clientX - rect.left) < rect.width / 2;
    ev.currentTarget.classList.remove('col-drop-left', 'col-drop-right');
    ev.currentTarget.classList.add(isLeft ? 'col-drop-left' : 'col-drop-right');
  },

  onColDragLeave(ev) {
    ev.currentTarget.classList.remove('col-drop-left', 'col-drop-right');
  },

  onColDrop(ev, targetCol) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('col-drop-left', 'col-drop-right');
    const sourceCol = Reco._dragCol;
    Reco._dragCol = null;
    if (!sourceCol || sourceCol === targetCol) return;

    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;

    // Start from current effective order
    let order = Reco.effectiveDisplayCols(tpl, sess).slice();
    order = order.filter(c => c !== sourceCol);
    const targetIdx = order.indexOf(targetCol);
    if (targetIdx < 0) { order.push(sourceCol); }
    else {
      // Decide before/after based on mouse position
      const rect = ev.currentTarget.getBoundingClientRect();
      const isLeft = (ev.clientX - rect.left) < rect.width / 2;
      order.splice(isLeft ? targetIdx : targetIdx + 1, 0, sourceCol);
    }
    sess.columnOrder = order;
    AppState.save();
    App.navigate('reco');
  },

  onColDragEnd(ev) {
    Reco._dragCol = null;
    document.querySelectorAll('.col-draggable').forEach(th => {
      th.classList.remove('col-dragging', 'col-drop-left', 'col-drop-right');
    });
  },

  // Reset column order (and optionally widths/zoom) back to template defaults
  resetTableView(opts) {
    opts = opts || {};
    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (!sess) return;
    sess.columnOrder = null;
    if (opts.widths !== false) sess.columnWidths = {};
    if (opts.zoom !== false) sess.zoom = 1;
    AppState.save();
    App.navigate('reco');
    U.toast('Table view reset', 'success');
  },

  /* ============== ZOOM ============== */
  _attachZoomHandler() {
    const wrap = document.querySelector('.reco-table-wrap');
    if (!wrap || wrap._zoomWired) return;
    wrap._zoomWired = true;
    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const sess = AppState.recoSessions[AppState.activeRecoId];
      if (!sess) return;
      const step = e.deltaY < 0 ? 0.1 : -0.1;
      let z = (sess.zoom || 1) + step;
      z = Math.round(z * 10) / 10;
      if (z < 0.5) z = 0.5;
      if (z > 2.0) z = 2.0;
      sess.zoom = z;
      Reco._applyZoom();
      Reco._updateZoomIndicator();
      // Debounce save
      clearTimeout(Reco._zoomSaveTimer);
      Reco._zoomSaveTimer = setTimeout(() => AppState.save(), 300);
    }, { passive: false });
  },

  _applyZoom() {
    const wrap = document.querySelector('.reco-table-wrap');
    if (!wrap) return;
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const z = (sess && sess.zoom) || 1;
    // CSS `zoom` is non-standard but widely supported in Chromium (which pywebview uses).
    // It rescales without breaking layout, unlike `transform: scale`.
    wrap.style.zoom = z;
    Reco._updateZoomIndicator();
  },

  _updateZoomIndicator() {
    const el = document.getElementById('zoomIndicator');
    if (!el) return;
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const z = (sess && sess.zoom) || 1;
    el.textContent = Math.round(z * 100) + '%';
  },

  zoomBy(delta) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    if (!sess) return;
    let z = (sess.zoom || 1) + delta;
    z = Math.round(z * 10) / 10;
    if (z < 0.5) z = 0.5;
    if (z > 2.0) z = 2.0;
    sess.zoom = z;
    Reco._applyZoom();
    AppState.save();
  },

  zoomReset() {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    if (!sess) return;
    sess.zoom = 1;
    Reco._applyZoom();
    AppState.save();
  },

  setPage(p) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.page = p;
    App.navigate('reco');
  },
  setPageSize(s) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.pageSize = s;
    sess.page = 0;
    AppState.save();
    App.navigate('reco');
  },

  /* Column header dropdown: filters, sort, slicer */
  toggleColDropdown(col, btn, ev) {
    ev.stopPropagation();
    document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
    const conds = sess.columnFilters[col] || [];
    let h = '<div style="font-weight:600; margin-bottom:6px; font-size:11px;">Column: '+U.esc(col)+'</div>';
    // Sort
    const isSorted = sess.columnSorts && sess.columnSorts.col === col;
    h += '<div style="display:flex; gap:3px; margin-bottom:6px;">';
    h += '<button class="small" onclick="Reco.applySort(\''+U.jsq(col)+'\',\'asc\')">Sort A→Z</button>';
    h += '<button class="small" onclick="Reco.applySort(\''+U.jsq(col)+'\',\'desc\')">Sort Z→A</button>';
    if (isSorted) h += '<button class="small" onclick="Reco.clearSort()">Clear Sort</button>';
    h += '</div>';
    // Slicer button
    h += '<div style="margin-bottom:6px;"><button class="small primary" onclick="Reco.openSlicer(\''+U.jsq(col)+'\')">🔍 Slicer (pick values)</button></div>';
    // Filters: list each condition
    h += '<div style="font-size:10px; font-weight:600; margin-bottom:3px;">Filters (combined as AND):</div>';
    if (conds.length === 0) h += '<div class="text-muted" style="margin-bottom:4px;">no filter conditions</div>';
    conds.forEach((c, ci) => {
      h += '<div style="display:flex; gap:3px; margin-bottom:3px; flex-wrap:wrap;">';
      h += '<select onchange="Reco.updateColFilter(\''+U.jsq(col)+'\','+ci+',\'op\',this.value)" style="flex:1; min-width:80px;">';
      FilterOps.list.forEach(o => { h += '<option value="'+o.op+'"'+(c.op===o.op?' selected':'')+'>'+o.label+'</option>'; });
      h += '</select>';
      if (FilterOps.needsValue(c.op)) h += '<input type="text" value="'+U.escAttr(c.val||'')+'" placeholder="value" oninput="Reco.updateColFilter(\''+U.jsq(col)+'\','+ci+',\'val\',this.value)" style="flex:1; min-width:60px;" />';
      if (FilterOps.needsSecondValue(c.op)) h += '<input type="text" value="'+U.escAttr(c.val2||'')+'" placeholder="and" oninput="Reco.updateColFilter(\''+U.jsq(col)+'\','+ci+',\'val2\',this.value)" style="flex:1; min-width:60px;" />';
      h += '<button class="small danger" onclick="Reco.removeColFilter(\''+U.jsq(col)+'\','+ci+')">×</button>';
      h += '</div>';
    });
    h += '<div style="display:flex; gap:3px; margin-top:5px;">';
    h += '<button class="small" onclick="Reco.addColFilter(\''+U.jsq(col)+'\')">+ Add Filter</button>';
    if (conds.length) h += '<button class="small" onclick="Reco.clearColFilters(\''+U.jsq(col)+'\')">Clear All</button>';
    h += '<button class="small primary" onclick="Reco.applyColFilters()">Apply</button>';
    h += '<div class="divider" style="margin:6px 0;"></div>';
    // Phase 5: added-column actions
    const tpl_p5 = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
    const sessExtra  = (sess.extraColumns || []).find(c => c.name === col);
    const tplAdded   = (tpl_p5.additionalColumns || []).find(c => c.name === col && c._ssAdded);
    const addedCol   = sessExtra || tplAdded;
    if (addedCol) {
      h += '<div class="divider" style="margin:6px 0;"></div>';
      const singleNow = !!addedCol._ssSingleUse;
      h += '<button class="small" onclick="Reco.ssToggleColSingleUse(\''+U.jsq(col)+'\')">'+(singleNow?'✓ Unmark single-use':'⏱ Mark single-use')+'</button>';
      if (sessExtra) h += '<button class="small" onclick="Reco.ssPromoteCol(\''+U.jsq(col)+'\')">⬆ Promote to template</button>';
      h += '<button class="small danger" onclick="Reco.ssDeleteCol(\''+U.jsq(col)+'\')">🗑 Delete column</button>';
    }
    h += '<button class="small danger" onclick="Reco.hideCol(\''+U.jsq(col)+'\')">Hide this column</button>';
    h += '</div>';

    const dd = document.createElement('div');
    dd.className = 'col-dropdown';
    dd.innerHTML = h;
    btn.parentElement.appendChild(dd);
    const close = e => { if (!dd.contains(e.target)) { dd.remove(); document.removeEventListener('click', close); } };
    setTimeout(() => document.addEventListener('click', close), 0);
  },
  applySort(col, dir) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.columnSorts = { col, dir };
    AppState.save();
    App.navigate('reco');
  },
  clearSort() {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.columnSorts = null;
    AppState.save();
    App.navigate('reco');
  },
  addColFilter(col) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.columnFilters[col] = sess.columnFilters[col] || [];
    sess.columnFilters[col].push({ op: 'contains', val: '', val2: '', enabled: true });
    AppState.save();
    App.navigate('reco');
  },
  updateColFilter(col, idx, key, val) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    if (!sess.columnFilters[col]) return;
    sess.columnFilters[col][idx][key] = val;
    AppState.save();
  },
  removeColFilter(col, idx) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    if (!sess.columnFilters[col]) return;
    sess.columnFilters[col].splice(idx, 1);
    if (!sess.columnFilters[col].length) delete sess.columnFilters[col];
    AppState.save();
    App.navigate('reco');
  },
  clearColFilters(col) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    delete sess.columnFilters[col];
    AppState.save();
    App.navigate('reco');
  },
  applyColFilters() {
    document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
    App.navigate('reco');
  },

  /* Slicer modal: pick distinct values for a column */
  openSlicer(col) {
    document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
    const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const extraDef = Reco._extraDef(tpl, col);
    const distinct = Array.from(new Set(sess.data.map(r => {
     const val = extraDef ? Reco._extraValueForRow(tpl, sess, r, extraDef) : r[col];
     return String(val||'');
    }))).sort();
    const sel = sess.slicers[col] || [];
    let h = '<div class="help">Pick one or more values to filter the table by <b>'+U.esc(col)+'</b>. Multiple values are combined as OR.</div>';
    h += '<div class="toolbar"><input type="text" id="slicerSearch" placeholder="Search values…" oninput="Reco._slicerSearch(this.value)" /></div>';
    h += '<div id="slicerItems" class="slicer-panel" style="margin-top:6px; max-height:300px; overflow-y:auto;">';
    h += '<div class="slicer-items">';
    distinct.forEach(v => {
      const isSel = sel.includes(v);
      h += '<div class="slicer-item '+(isSel?'selected':'')+'" data-val="'+U.escAttr(v)+'" onclick="Reco._slicerToggleItem(this)">'+U.esc(v||'(empty)')+'</div>';
    });
    h += '</div></div>';
    Reco._slicerCol = col;
    App.openModal('Slicer: ' + col, h, '<button onclick="App.closeModal()">Cancel</button><button class="primary" onclick="Reco._slicerApply()">Apply</button><button onclick="Reco._slicerClear()">Clear</button>');
  },
  _slicerSearch(q) {
    q = (q||'').toLowerCase();
    document.querySelectorAll('#slicerItems .slicer-item').forEach(el => {
      const v = (el.dataset.val||'').toLowerCase();
      el.style.display = (!q || v.includes(q)) ? '' : 'none';
    });
  },
  _slicerToggleItem(el) { el.classList.toggle('selected'); },
  _slicerApply() {
    const col = Reco._slicerCol;
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const selected = [];
    document.querySelectorAll('#slicerItems .slicer-item.selected').forEach(el => selected.push(el.dataset.val));
    sess.slicers[col] = selected;
    sess.page = 0;
    AppState.save();
    App.closeModal();
    App.navigate('reco');
  },
  _slicerClear() {
    const col = Reco._slicerCol;
    const sess = AppState.recoSessions[AppState.activeRecoId];
    delete sess.slicers[col];
    sess.page = 0;
    AppState.save();
    App.closeModal();
    App.navigate('reco');
  },

  /* Row selection + sum bar */

  toggleRowSelect(rowId, checked) {
    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (!sess) return;
    
    sess.selectedRows = sess.selectedRows || {};
    
    // Explicitly add or delete the row from the tracking object
    if (checked) {
      sess.selectedRows[rowId] = true;
    } else {
      delete sess.selectedRows[rowId]; 
    }
    
    // Trigger a full app render so your summary bar, totals, and action buttons 
    // instantly recalculate based on the new selection.
    App.navigate('reco'); 
  },

  toggleAllRows(checked) {
    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (!sess) return;
    
    sess.selectedRows = {};
    
    if (checked) {
      // If "select all" is checked, select all rows currently matching the filter
      const tpl = AppState.recoTemplates.find(t => t.id === id);
      const filtered = Reco.applyTableFiltersSort(tpl, sess);
      filtered.forEach(r => { sess.selectedRows[r._id] = true; });
    }
    
    // Full re-render to update all visible checkboxes
    App.navigate('reco'); 
  },

  updateSelSumBar() {
    const bar = document.getElementById('selSumBar');
    if (!bar) return;
    const sess = AppState.recoSessions[AppState.activeRecoId];
    const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
    if (!sess || !tpl) { bar.classList.remove('show'); return; }
    const ids = Object.keys(sess.selectedRows || {});
    if (!ids.length) { bar.classList.remove('show'); bar.innerHTML=''; return; }
    let sum = 0; let count = 0;
    const selRows = [];
    sess.data.forEach(r => { if (sess.selectedRows[r._id]) { sum += U.num(r[tpl.valueColumn]); count++; selRows.push(r); } });
    const tol = tpl.toleranceValue || 0;
    const within = Reco.isWithinTolerance(tpl, sum, selRows);
    const tolLabel = tpl.toleranceMode === 'percentage' ? tol + '%' : tol;
    let h = '<span>Selected: <b>'+count+'</b></span>';
    h += '<span>Σ '+U.esc(tpl.valueColumn||'value')+': <b>'+U.fmtNum(sum)+'</b></span>';
    h += within ? '<span style="background:rgba(255,255,255,0.18); padding:2px 8px; border-radius:8px;">Within tolerance ✓</span>' : '<span style="background:rgba(220,38,38,0.85); padding:2px 8px; border-radius:8px;">Outside tolerance (±'+tolLabel+')</span>';
    if (count > 0 && within) h += '<button class="small" style="background:#fff;color:var(--primary);" onclick="Reco.offsetSelected()">Offset Selected</button>';
    if (tpl.aegIntegration && tpl.aegIntegration.enabled) h += '<button class="small" style="background:#fff;color:var(--primary);" onclick="Reco.previewEntryFromSelection()">Preview Entry</button>';
    h += '<button class="small" style="background:transparent;color:#fff;border-color:#fff;" onclick="Reco.clearSelection()">Clear</button>';
    bar.innerHTML = h;
    bar.classList.add('show');
  },
  clearSelection() {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    sess.selectedRows = {};
    Reco.updateSelSumBar();
    App.navigate('reco');
  },

  offsetSelected() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;

    const selectedIds = Object.keys(sess.selectedRows || {}).filter(k => sess.selectedRows[k]);
    if (!selectedIds.length) { U.toast('Select rows first','error'); return; }

    const chk = Reco.checkOffsetTolerance(tpl, sess, selectedIds);
    if (!chk.ok) { U.toast(chk.msg, 'error'); return; }

    const rid = 'M' + Date.now().toString(36);
    const mm = AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};
    let n = 0;
    selectedIds.forEach(rowId => {
      const row = sess.data.find(r => r._id === rowId);
      if (!row || sess.offsets[row._id]) return;
      sess.offsets[row._id] = true;
      row._recoId = rid;
      row._manualOffset = true;
      const pk = Reco.getRowPK(tpl, row);
      if (pk) mm[pk] = { recoId: rid, byUser: true };
      n++;
    });
    sess.selectedRows = {};
    AppState.save();
    App.navigate('reco');
    U.toast('Offset '+n+' rows (sum '+U.fmtNum(chk.sum)+', within tolerance)','success');
  },

  /* The one write path for cell edits (grid, in-app Excel view, Excel link).
     edits: [{row, col, value}]
     opts: { source:'excel'|'xl-view'|'xl-undo'|'xl-redo'|'grid', historyFirst,
             meta:{_src,_by}, pulled:[{pk,col,value}], scope, allowPkEdit,
             schema (prebuilt XlSchema), trusted (caller already checked
             editability, e.g. the grid) }
     historyFirst: the version rows are written first and nothing in the
     session changes when that write fails (Excel link). Otherwise the rows
     change at once and history follows (batched like typing in the grid).
     Resolves { applied, rows, versions:{pk:'Cn'}, sessionOnly:[], rejected:[], noop }. */
  async applyEdits(tpl, sess, edits, opts) {
    opts = opts || {};
    const res = { applied: 0, rows: 0, versions: {}, sessionOnly: [], rejected: [], noop: 0 };
    if (!tpl || !sess || !Array.isArray(edits) || !edits.length) return res;
    const S = opts.schema || XlSchema.build(tpl, sess, { scope: opts.scope || 'template', allowPkEdit: opts.allowPkEdit,
      includeHidden: true, showExtras: 'all' });
    const colDefs = new Map(tpl.columns.map(c => [c.name, c]));
    const extras = [...(tpl.additionalColumns || []), ...(sess.extraColumns || [])];
    const versioned = [], sessionOnly = [];
    const fullCache = new Map();
    const fullOf = row => {
      if (!fullCache.has(row)) fullCache.set(row, extras.length ? Reco._rowWithExtras(tpl, sess, row) : row);
      return fullCache.get(row);
    };
    for (const e of edits) {
      if (!e || !e.row || e.col == null) continue;
      let desc = S.byName.get(e.col);
      if (!desc && opts.trusted && colDefs.has(e.col)) {
        desc = { name: e.col, kind: 'text', role: 'tpl', versioned: true, editable: true, writeTo: 'row', editor: 'text' };
      }
      if (!desc) { res.rejected.push({ row: e.row, col: e.col, reason: 'unknown' }); continue; }
      if (!desc.editable && !(opts.trusted && desc.role !== 'status' && desc.role !== 'computed')) {
        res.rejected.push({ row: e.row, col: e.col, reason: desc.lockReason || 'notEditable' }); continue;
      }
      if (desc.role === 'status' || desc.role === 'computed') { res.rejected.push({ row: e.row, col: e.col, reason: desc.role }); continue; }
      const value = e.value == null ? '' : e.value;
      const cur = XlSchema.currentValue(desc, e.row, fullOf(e.row), sess);
      if (String(value) === String(cur)) { res.noop++; continue; }
      if (!opts.trusted && XlSchema.canon(desc, value, 'reco').c === XlSchema.canon(desc, cur, 'reco').c) { res.noop++; continue; }
      const pk = e.row._pk || Reco.getRowPK(tpl, e.row);
      const isVersioned = desc.writeTo === 'row' && (desc.role === 'tpl' || (desc.role === 'toAccount' && colDefs.has(desc.name)));
      if (isVersioned && pk) versioned.push({ row: e.row, col: desc.name, value, pk });
      else sessionOnly.push({ row: e.row, col: desc.name, value, desc,
        reason: desc.writeTo === 'tag' ? 'tag' : (isVersioned ? 'noPk' : 'sessionOnly') });
    }

    const setCell = (row, col, value) => {
      row[col] = value;
      delete row['_corrected_' + col];
      const rk = row._pk || row._id;
      if (sess.cellFormulas && sess.cellFormulas[rk]) delete sess.cellFormulas[rk][col];
    };
    const touched = new Set();

    if (versioned.length) {
      const byPk = new Map();
      versioned.forEach(v => {
        const en = byPk.get(v.pk) || { rows: new Set(), changes: {} };
        en.rows.add(v.row);
        en.changes[v.col] = v.value;
        byPk.set(v.pk, en);
      });
      if (opts.historyFirst) {
        const pulled = {};
        (opts.pulled || []).forEach(p => {
          if (!p || !p.pk || !byPk.has(p.pk) || !colDefs.has(p.col)) return;
          (pulled[p.pk] || (pulled[p.pk] = {}))[p.col] = p.value;
        });
        const pkRows = [];
        byPk.forEach((en, pk) => {
          const live = en.rows.values().next().value;
          pkRows.push({ pk, row: Object.assign({}, live, pulled[pk] || {}, en.changes) });
        });
        // Throws when the history write fails: nothing has been changed yet.
        const versions = await Versioning.appendChangesBatch(tpl, pkRows, opts.meta);
        // Every live row with the key takes the values (history keeps one row per key).
        const livePk = new Map();
        sess.data.forEach(r => {
          const k = r._pk || Reco.getRowPK(tpl, r);
          if (k && byPk.has(k)) { if (!livePk.has(k)) livePk.set(k, []); livePk.get(k).push(r); }
        });
        byPk.forEach((en, pk) => {
          const rows = livePk.get(pk) || Array.from(en.rows);
          rows.forEach(r => {
            Object.keys(pulled[pk] || {}).forEach(c => setCell(r, c, pulled[pk][c]));
            Object.keys(en.changes).forEach(c => setCell(r, c, en.changes[c]));
            if (versions[pk]) r._ver = versions[pk];
            touched.add(r);
          });
          res.applied += Object.keys(en.changes).length;
        });
        res.versions = versions;
      } else {
        byPk.forEach((en, pk) => {
          en.rows.forEach(r => {
            Object.keys(en.changes).forEach(c => setCell(r, c, en.changes[c]));
            touched.add(r);
          });
          res.applied += Object.keys(en.changes).length;
          const row = en.rows.values().next().value;
          Versioning.queueChange(tpl, pk, row).then(v => {
            if (v) en.rows.forEach(r => { r._ver = v; });
          });
        });
      }
    }

    sessionOnly.forEach(s => {
      if (s.desc.writeTo === 'tag') {
        sess.manualTags = sess.manualTags || {};
        const k = s.row._id + '||' + s.col;
        if (s.value === '' || s.value == null) delete sess.manualTags[k];
        else sess.manualTags[k] = s.value;
        // A value on the row would hide the tag (see _extraOwnValue).
        delete s.row[s.col];
      } else setCell(s.row, s.col, s.value);
      touched.add(s.row);
      res.applied++;
      res.sessionOnly.push({ row: s.row, col: s.col, reason: s.reason });
    });
    res.rows = touched.size;
    if (res.applied) AppState.save();
    return res;
  },

  editCell(rowIdx, col, val) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess || !sess.data[rowIdx]) return;
    Reco.applyEdits(tpl, sess, [{ row: sess.data[rowIdx], col, value: val }], { source: 'grid', trusted: true });
  },

  setTag(rowId, tagName, val) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    const row = sess.data.find(r => r._id === rowId);
    if (row) { Reco.applyEdits(tpl, sess, [{ row, col: tagName, value: val }], { source: 'grid', trusted: true }); return; }
    sess.manualTags = sess.manualTags || {};
    sess.manualTags[rowId + '||' + tagName] = val;
    AppState.save();
  },

  manualOffset(rowIdx) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!sess || !sess.data[rowIdx]) return;
    const row = sess.data[rowIdx];
    if (sess.offsets[row._id]) { U.toast('Row already offset','error'); return; }

    const chk = Reco.checkOffsetTolerance(tpl, sess, [row._id]);
    if (!chk.ok) { U.toast(chk.msg, 'error'); return; }

    const rid = 'M'+Date.now().toString(36);
    sess.offsets[row._id] = true;
    row._recoId = rid;
    row._manualOffset = true;
    const pk = Reco.getRowPK(tpl, row);
    if (pk) {
      AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};
      AppState.manualOffsetMaster[id][pk] = { recoId: rid, byUser: true };
    }
    AppState.save();
    App.navigate('reco');
  },

  unmarkOffset(rowIdx) {
    const sess = AppState.recoSessions[AppState.activeRecoId];
    if (!sess || !sess.data[rowIdx]) return;
    Reco.smartUnmark([sess.data[rowIdx]._id]);
  },

  renderPivot(tpl, sess) {
    if (!tpl.pivotValueCol || !tpl.pivotRowCols?.length) return '<div class="empty">Configure pivot settings in the template.</div>';
    const pivotColCols = tpl.pivotColCols || [];
    const pivotData = {};
    const colValues = new Set();
    
    sess.data.forEach(row => {
      // Row with Extra Columns computed the same way as the grid
      const valMap = Reco._rowWithExtras(tpl, sess, row);

      const rowKey = tpl.pivotRowCols.map(k => String(valMap[k]||'')).join(' | ');
      const colKey = pivotColCols.length ? pivotColCols.map(k => String(valMap[k]||'')).join(' | ') : 'Value';
      colValues.add(colKey);
      if (!pivotData[rowKey]) pivotData[rowKey] = {};
      pivotData[rowKey][colKey] = (pivotData[rowKey][colKey] || 0) + U.num(valMap[tpl.pivotValueCol]);
    });
    
    const colArr = Array.from(colValues).sort();
    let h = '<div style="overflow-x:auto"><table><thead><tr>';
    h += '<th>'+U.esc(tpl.pivotRowCols.join(' / '))+'</th>';
    colArr.forEach(c => { h += '<th>'+U.esc(c)+'</th>'; });
    h += '<th>Total</th></tr></thead><tbody>';
    Object.keys(pivotData).sort().forEach(rk => {
      h += '<tr><td><b>'+U.esc(rk)+'</b></td>';
      let rowTotal = 0;
      colArr.forEach(ck => {
        const v = pivotData[rk][ck] || 0;
        rowTotal += v;
        h += '<td>'+U.fmtNum(v)+'</td>';
      });
      h += '<td><b>'+U.fmtNum(rowTotal)+'</b></td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  },

  exportData(kind) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    const filtered = Reco.applyTableFiltersSort(tpl, sess);
    const cols = tpl.columns.map(c => c.name);
    const extraCols = (tpl.additionalColumns || []).concat(sess.extraColumns || []);
    const header = ['Status', 'RecoId'].concat(cols, extraCols.map(ac => ac.name).filter(n => !cols.includes(n)));
    const rows = filtered.map(r => {
      const full = Reco._rowWithExtras(tpl, sess, r);
      const o = { Status: sess.offsets?.[r._id] ? 'Offset' : 'Open', RecoId: r._recoId || '' };
      header.slice(2).forEach(c => { o[c] = full[c] != null ? full[c] : ''; });
      return o;
    });
    const name = Versioning._safe(tpl.name) + '_' + U.todayStr();
    if (kind === 'csv') {
      return U.download(name + '.csv', Papa.unparse({ fields: header, data: rows }), 'text/csv');
    }
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Reco');
    return U.downloadWorkbook(wb, name + '.xlsx');
  },
  /* ============== CORRECTION SECTION ============== */
  renderCorrection(tpl, sess) {
    let h = '<div class="panel"><h2>Column Corrections <span>';
    h += '<button class="small primary" onclick="Reco.addCorrectionCol()">+ Add Column Rule</button>';
    h += '</span></h2>';
    const formatCols = tpl.columns.filter(c => c.formats && c.formats.length);
    if (!formatCols.length) {
      h += '<div class="empty">No columns have format rules defined. Click <b>+ Add Column Rule</b> or define formats in the template.</div></div>';
      return h;
    }
    const activeCol = AppState._correctionCol || formatCols[0].name;
    h += '<div class="section-tabs">';
    formatCols.forEach(col => {
      const errors = sess.data.filter(r => !FMT.validate(r[col.name], col.formats) && !r['_corrected_'+col.name]).length;
      const cls = errors > 0 ? 'has-errors' : 'all-good';
      h += '<div class="section-tab '+(activeCol===col.name?'active ':'')+cls+'" onclick="AppState._correctionCol=\''+U.jsq(col.name)+'\'; App.navigate(\'reco\')">'+U.esc(col.label||col.name)+' ('+errors+')</div>';
    });
    h += '</div>';
    const col = formatCols.find(c => c.name === activeCol) || formatCols[0];
    h += '<div class="help">Format rules for <b>'+U.esc(col.label||col.name)+'</b>: '+col.formats.map(f=>'<code>'+U.esc(f)+'</code>').join(', ')+'</div>';

    // Show rows with errors for this column
    const errorRows = [];
    sess.data.forEach((row, i) => {
      if (!FMT.validate(row[col.name], col.formats) && !row['_corrected_'+col.name]) {
        errorRows.push({ row, idx: i });
      }
    });
    if (errorRows.length) {
      h += '<table><thead><tr>';
      if (tpl.primaryKeys.length) tpl.primaryKeys.forEach(pk => { h += '<th>'+U.esc(pk)+'</th>'; });
      h += '<th>Current Value</th><th>Corrected Value</th><th></th></tr></thead><tbody>';
      errorRows.forEach(({ row, idx }) => {
        const inputId = 'corr_'+idx;
        h += '<tr>';
        if (tpl.primaryKeys.length) tpl.primaryKeys.forEach(pk => { h += '<td>'+U.esc(row[pk])+'</td>'; });
        h += '<td class="cell-error">'+U.esc(row[col.name])+'</td>';
        h += '<td><input type="text" id="'+inputId+'" placeholder="Enter corrected value" /></td>';
        h += '<td><button class="small primary" onclick="Reco.applyCorrection('+idx+',\''+U.jsq(col.name)+'\',document.getElementById(\''+inputId+'\').value)">Apply</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    } else {
      h += '<div class="empty" style="color:var(--success, #059669);">All values match the required format.</div>';
    }

    // Master list of corrections (across all columns) - the user wants this back
    h += '<div class="divider"></div>';
    h += '<h3>Master List of Corrections <span class="text-muted">(auto-applied on every data load)</span></h3>';
    const corrMaster = AppState.correctionMaster[tpl.id] || {};
    const allMasterRows = [];
    Object.keys(corrMaster).forEach(pk => {
      Object.keys(corrMaster[pk]).forEach(c2 => {
        allMasterRows.push({ pk, col: c2, oldVal: corrMaster[pk][c2].oldVal, newVal: corrMaster[pk][c2].newVal });
      });
    });
    // Also include session corrections (legacy)
    Object.keys(sess.corrections || {}).forEach(pk => {
      Object.keys(sess.corrections[pk] || {}).forEach(c2 => {
        if (!corrMaster[pk] || !corrMaster[pk][c2]) {
          allMasterRows.push({ pk, col: c2, oldVal: sess.corrections[pk][c2].oldVal, newVal: sess.corrections[pk][c2].newVal, sessionOnly: true });
        }
      });
    });
    if (allMasterRows.length) {
      h += '<table><thead><tr><th>Primary Key</th><th>Column</th><th>Old Value</th><th>New Value</th><th>Scope</th><th></th></tr></thead><tbody>';
      allMasterRows.forEach(r => {
        h += '<tr><td><code>'+U.esc(r.pk)+'</code></td><td>'+U.esc(r.col)+'</td><td>'+U.esc(r.oldVal)+'</td><td>'+U.esc(r.newVal)+'</td>';
        h += '<td>'+(r.sessionOnly?'<span class="badge fc">session</span>':'<span class="badge aed">master</span>')+'</td>';
        h += '<td><button class="small danger" onclick="Reco.removeCorrection(\''+U.jsq(r.pk)+'\',\''+U.jsq(r.col)+'\','+(r.sessionOnly?'true':'false')+')">Remove</button></td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="help">Removing from master also removes the auto-application on future data loads. Session-only corrections only affect the current data.</div>';
    } else {
      h += '<div class="empty">No corrections saved yet.</div>';
    }

    h += '</div>';
    return h;
  },
  addCorrectionCol() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    if (!tpl) return;
    const name = prompt('Column name to add a format rule for:');
    if (!name) return;
    const fmt = prompt('Format pattern (e.g. DDDDD, N-A@D):');
    if (!fmt) return;
    const existing = tpl.columns.find(c => c.name === name);
    if (existing) {
      existing.formats = existing.formats || [];
      existing.formats.push(fmt);
    } else {
      tpl.columns.push({ name, label: name, formats: [fmt], isValue: false, isDate: false });
    }
    AppState.save();
    App.navigate('reco');
    U.toast('Format rule added','success');
  },
  applyCorrection(rowIdx, colName, newVal) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess || !sess.data[rowIdx]) return;
    const col = tpl.columns.find(c => c.name === colName);
    if (col && col.formats && col.formats.length && !FMT.validate(newVal, col.formats)) {
      U.toast('Value does not match required format','error');
      return;
    }
    const row = sess.data[rowIdx];
    const oldVal = row[colName];
    row[colName] = newVal;
    row['_corrected_'+colName] = true;
    const pk = Reco.getRowPK(tpl, row);
    if (pk) {
      // Save to both session corrections and the cross-session correction master
      sess.corrections = sess.corrections || {};
      if (!sess.corrections[pk]) sess.corrections[pk] = {};
      sess.corrections[pk][colName] = { oldVal, newVal };
      AppState.correctionMaster[id] = AppState.correctionMaster[id] || {};
      if (!AppState.correctionMaster[id][pk]) AppState.correctionMaster[id][pk] = {};
      AppState.correctionMaster[id][pk][colName] = { oldVal, newVal };
    }
    AppState.save();
    App.navigate('reco');

  },
  removeCorrection(pk, colName, sessionOnly) {
    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (sess && sess.corrections[pk]) {
      delete sess.corrections[pk][colName];
      if (!Object.keys(sess.corrections[pk]).length) delete sess.corrections[pk];
    }
    if (!sessionOnly) {
      const m = AppState.correctionMaster[id];
      if (m && m[pk]) {
        delete m[pk][colName];
        if (!Object.keys(m[pk]).length) delete m[pk];
      }
    }

  addCustomReport() { 
    RecoTemplate.edit(AppState.activeRecoId); 
    
    // Fix: Pre-fill all columns immediately so they appear in the UI for reordering/formatting
    const rpt = { 
      id: U.uid(), 
      name: 'Report ' + (RecoTemplate._editing.reports.length+1), 
      columns: RecoTemplate._editing.columns.map(c => c.name), 
      filters: [], logic: 'AND', sortCol: '', sortDir: 'asc', computedCols: [],
      showHeader: true, showTotalRow: false,totalColumns: [], summaryCards: [], dateFormats: {} 
    };
    RecoTemplate._editing.reports.push(rpt);
    
    RecoTemplate._step = 4; 
    RecoTemplate._isQuickEdit = true; 
    RecoTemplate.renderEditor(); 
  },
  
  editCustomReport(idx) { 
    RecoTemplate.edit(AppState.activeRecoId); 
    const rpt = RecoTemplate._editing.reports[idx];
    
    // Fix: If an older report has empty columns, auto-fill them so they can be reordered
    if (!rpt.columns || rpt.columns.length === 0) {
        rpt.columns = RecoTemplate._editing.columns.map(c => c.name);
    }
    
    RecoTemplate._step = 4; 
    RecoTemplate._isQuickEdit = true; 
    RecoTemplate.renderEditor(); 
  },
  
  deleteCustomReport(idx) {
    if(!confirm('Delete this report?')) return;
    const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
    if(tpl) { 
      tpl.reports.splice(idx, 1); 
      // Indexes after the deleted report shift down by one.
      const m = /^custom_(\d+)$/.exec(AppState._activeReport || '');
      if (m) {
        const cur = +m[1];
        AppState._activeReport = cur === idx ? null : (cur > idx ? 'custom_' + (cur - 1) : AppState._activeReport);
      }
      AppState.save(); 
      App.navigate('reco'); 
    }
  },
  
  saveReportEdits() {
    const t = RecoTemplate._editing;
    const i = AppState.recoTemplates.findIndex(x => x.id === t.id);
    if (i !== -1) AppState.recoTemplates[i] = t;
    AppState.save();
    App.closeModal();
    App.navigate('reco');
    U.toast('Report settings saved successfully!', 'success');
  },

  renderSummaryReport(tpl, sess) {
    const total = sess.data.length;
    const offsetCount = Object.keys(sess.offsets || {}).filter(k => sess.offsets[k]).length;
    const openCount = total - offsetCount;
    const totalVal = sess.data.reduce((s,r) => s + U.num(r[tpl.valueColumn]), 0);
    const offsetVal = sess.data.filter(r => sess.offsets?.[r._id]).reduce((s,r) => s + U.num(r[tpl.valueColumn]), 0);
    const openVal = totalVal - offsetVal;
    let h = '<h3>Summary Report</h3>';
    h += '<div class="grid-4">';
    h += '<div class="stat-card panel"><div class="stat-val">'+total+'</div><div class="stat-label">Total Rows</div></div>';
    h += '<div class="stat-card panel"><div class="stat-val" style="color:var(--success, #059669);">'+offsetCount+'</div><div class="stat-label">Offset</div></div>';
    h += '<div class="stat-card panel"><div class="stat-val" style="color:var(--danger, #dc2626);">'+openCount+'</div><div class="stat-label">Open</div></div>';
    h += '<div class="stat-card panel"><div class="stat-val">'+U.fmtNum(openVal)+'</div><div class="stat-label">Open Value</div></div>';
    h += '</div>';
    const pct = (total ? offsetCount/total*100 : 0).toFixed(1);
    h += '<div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:'+pct+'%; background:var(--success, #059669);"></div></div>';
    h += '<div class="text-muted" style="margin-top:4px;">'+pct+'% reconciled</div>';
    return h;
  },
  renderOpenItemsReport(tpl, sess) {
    const openRows = sess.data.filter(r => !sess.offsets?.[r._id]);
    if (!openRows.length) return '<div class="empty" style="color:var(--success, #059669);">All items are offset!</div>';
    const cols = tpl.columns.map(c => c.name);
    let h = '<h3>Open Items ('+openRows.length+')</h3>';
    h += '<button class="success small" onclick="Reco.exportRowsCsv(\'open_items\','+U.esc(JSON.stringify(cols))+')">Export CSV</button>';
    h += '<div style="overflow-x:auto; max-height:400px; overflow-y:auto"><table><thead><tr>';
    cols.forEach(c => { h += '<th>'+U.esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    openRows.slice(0, 5000).forEach(r => {
      h += '<tr>';
      cols.forEach(c => { h += '<td>'+U.esc(r[c])+'</td>'; });

    });

    if (openRows.length > 5000) h += '<div class="text-muted">Showing 5000 of '+openRows.length+'. Export to CSV for full list.</div>';

  },

renderCustomReport(tpl, sess, rpt, idx) {
    const rows = Reco.runReport(tpl, sess, rpt);
    
    // FIX: Use the spread operator [...] to prevent permanently mutating the saved template!
    const cols = (rpt.columns||[]).length ? [...rpt.columns] : tpl.columns.map(c=>c.name);
    (rpt.computedCols||[]).forEach(cc => { if (!cols.includes(cc.name)) cols.push(cc.name); });
    
    let h = '';

    // 1. Title & Toolbar
    h += '<h3>'+U.esc(rpt.name)+'</h3>';
    h += '<div class="toolbar"><span class="text-muted">'+rows.length+' rows · logic: '+(rpt.logic||'AND')+'</span>';
    h += '<button class="success small" onclick="Reco.exportCustomReport('+idx+')">Export CSV</button></div>';

    // 2. Render Summary Cards
    if (rpt.summaryCards && rpt.summaryCards.length > 0) {
        h += '<div class="report-cards" style="display:flex; gap:10px; margin-bottom:15px;">';
        rpt.summaryCards.forEach(card => {
            if (!card.col) return;
            const func = card.func || 'Sum';
            const cardTitle = card.displayName || (func + ' of ' + card.col);
            const filled = rows.map(r => r[card.col]).filter(v => v != null && v !== '');
            const nums = filled.filter(v => U.isNumeric(v)).map(v => U.num(v));
            let cardValue;
            if (func === 'Count') cardValue = filled.length.toLocaleString();
            else if (!nums.length) cardValue = '—';
            else if (func === 'Avg') cardValue = U.fmtNum(nums.reduce((a, b) => a + b, 0) / nums.length);
            else if (func === 'Min') cardValue = U.fmtNum(Math.min(...nums));
            else if (func === 'Max') cardValue = U.fmtNum(Math.max(...nums));
            else cardValue = U.fmtNum(nums.reduce((a, b) => a + b, 0));
            
            h += `<div class="card" style="padding:10px; border:1px solid var(--border, #ccc); border-radius:5px;">
                    <div class="card-title text-muted">${U.esc(cardTitle)}</div>
                    <div class="card-value"><strong>${U.esc(cardValue)}</strong></div>
                  </div>`;
        });
        h += '</div>';
    }  

    h += '<div style="overflow-x:auto; max-height:500px; overflow-y:auto"><table>';
    
    // 3. Table Header Logic (Keeping or removing table headings)
    if (rpt.showHeader !== false) {
        h += '<thead><tr>';
        cols.forEach(c => { h += '<th>'+U.esc(c)+'</th>'; });
        h += '</tr></thead>';
    }

    h += '<tbody>';
    
    rows.slice(0, 5000).forEach(r => {
      h += '<tr>';
      cols.forEach(c => { 
        let val = r[c];
        if (val == null) val = '';
        const colDef = tpl.columns.find(x => x.name === c);
        
        // Date format override
        if (rpt.dateFormats && rpt.dateFormats[c] && val !== '') {
            const parsedDate = (!isNaN(val) && Number(val) > 10000) ? U._excelSerialToDate(Number(val)) : U.parseDate(val);
            if (parsedDate) val = U.fmtDate(parsedDate, rpt.dateFormats[c]);
        } 
        // Fallback to standard date formatting
        else if (colDef && colDef.isDate) {
            val = U.formatExcelDate(val);
        }

        h += '<td>'+U.esc(val)+'</td>'; 
      });
      h += '</tr>';
    });

    // 4. Render Total Row (Only for selected columns)
    if (rpt.showTotalRow && rows.length > 0) {
        const selectedTotals = rpt.totalColumns || []; // Fallback to empty array if undefined
        
        h += '<tr style="font-weight:bold; background:var(--summary-bar-bg, #f9fafb); border-top: 2px solid var(--border, #e5e7eb);">';
        cols.forEach((c, idx) => {
            // Check if user selected this specific column for totals
            if (selectedTotals.includes(c)) {
                let sum = 0;
                rows.forEach(r => {
                    const v = r[c];
                    if (v !== '' && v != null && !isNaN(parseFloat(String(v).replace(/,/g, '')))) {
                        sum += U.num(v);
                    }
                });
                h += '<td>'+U.fmtNum(sum)+'</td>';
            } 
            // If it's the first column and not a total, label it "Total"
            else if (idx === 0) { 
                h += '<td>Total</td>'; 
            } 
            // Otherwise leave the cell blank
            else {
                h += '<td></td>';
            }
        });
        h += '</tr>';
    }

    h += '</tbody></table></div>';
    if (rows.length > 5000) h += '<div class="text-muted">Showing 5000 of '+rows.length+'. Export to CSV for full list.</div>';
    return h;
  },




  /* Run a custom report definition against the data */
  runReport(tpl, sess, rpt) {
    let rows = sess.data.slice();

    // 1. Calculate Extra Columns & Computed Columns First (so they can be filtered/sorted)
    rows = rows.map(r => {
      // Extra Cols (same values as the grid), then computed columns, which
      // may reference extras and computed columns defined before them.
      const out = Reco._rowWithExtras(tpl, sess, r);
      (rpt.computedCols||[]).forEach(cc => {
        try { out[cc.name] = Formula.evaluate(cc.formula, out); } catch(e) { out[cc.name] = '#ERR'; }
      });
      return out;
    });

    // 2. Apply Filters
    const filters = (rpt.filters||[]);
    const logic = rpt.logic || 'AND';
    if (filters.length) {
      rows = rows.filter(row => {
        const tester = (f) => {
          let val;
          if (f.col === '_status') val = sess.offsets?.[row._id] ? 'offset' : 'open';
          else val = row[f.col];
          return FilterOps.evaluate(val, f.op, f.val, f.val2);
        };
        return logic === 'OR' ? filters.some(tester) : filters.every(tester);
      });
    }

    // 3. Apply Sort
    if (rpt.sortCol) {
      const sc = rpt.sortCol, dir = rpt.sortDir === 'desc' ? -1 : 1;
      const colDef = tpl.columns.find(c => c.name === sc);
      rows = rows.slice().sort((a,b) => Reco._compareValues(a[sc], b[sc], colDef && colDef.isDate, dir));
    }
    return rows;
  },

   exportCustomReport(idx) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const rpt = (tpl.reports||[])[idx];
    if (!rpt) return;
    const cols = (rpt.columns||[]).length ? rpt.columns.slice() : tpl.columns.map(c=>c.name);
    (rpt.computedCols||[]).forEach(cc => { if (!cols.includes(cc.name)) cols.push(cc.name); });
    const rows = Reco.runReport(tpl, sess, rpt).map(r => {
      const o = {};
      cols.forEach(c => o[c] = r[c] != null ? r[c] : '');
      return o;
    });
    U.download(Versioning._safe(rpt.name||'report')+'_'+U.todayStr()+'.csv', Papa.unparse({ fields: cols, data: rows }), 'text/csv');
  },
  exportRowsCsv(name, cols) {

      return o;
    });
    U.download(name+'_'+U.todayStr()+'.csv', Papa.unparse({ fields: cols, data: rows }), 'text/csv');
  },

  /* Search through generated entries by document number */
  searchEntryByDoc() {
    const q = (document.getElementById('entrySearch').value||'').trim();
    if (!q) return;
    const id = AppState.activeRecoId;
    const dnMap = AppState.docNumberMaster[id] || {};
    const ql = q.toLowerCase();
    // Exact document number first, then the first partial match
    let found = null;
    const exact = Object.keys(dnMap).find(dn => dn.toLowerCase() === ql);
    if (exact) found = dnMap[exact];
    else {
      const partial = Object.keys(dnMap).find(dn => dn.toLowerCase().includes(ql));
      if (partial) found = dnMap[partial];
    }
    if (found) {
      AppState._activeEntryId = found;
      App.navigate('reco');
      U.toast('Found entry '+found,'success');
    } else {
      U.toast('No entry matches that document number','error');
    }
  },
