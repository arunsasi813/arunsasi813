  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg, #f5f6f8); color: var(--text, #1f2937); font-size: 13px; }

  header button { background: var(--header-btn-bg, #374151); color: var(--header-text, #fff); border: 1px solid var(--header-btn-border, #4b5563); }

  .nav-bar { display: flex; background: var(--nav-bg, #111827); padding: 0 18px; gap: 0; }

  main { padding: 16px 18px; }

  .badge.open { background: var(--badge-amber-bg, #fef3c7); color: var(--badge-amber, #92400e); }

  .toast.success { background: var(--success, #059669); }
  .toast.error { background: var(--danger, #dc2626); }
  .summary-bar { display: flex; gap: 18px; padding: 9px 12px; background: var(--summary-bar-bg, #f9fafb); border-radius: 5px; font-size: 12px; margin: 8px 0; flex-wrap: wrap; }
  .summary-bar .item b { color: var(--text, #1f2937); }
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 40px 16px; overflow-y: auto; }
.badge.ss-added    { background: var(--badge-blue-bg, #dbeafe); color: var(--badge-blue, #1e40af); }
.badge.ss-single   { background: var(--badge-amber-bg, #fef3c7); color: var(--badge-amber, #92400e); }
.badge.ss-persist  { background: var(--badge-green-bg, #dcfce7); color: var(--badge-green, #166534); }
tr.row-ss-added td { box-shadow: inset 3px 0 0 0 var(--primary, #2563eb); }
th.col-ss-added .col-marker {
  display: inline-block;
  background: var(--primary, #2563eb);
  color: #fff;
  border-radius: 3px;
  padding: 0 4px;
  font-size: 9px;
  margin-right: 3px;
}

.excel-view-toolbar {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border, #e5e7eb);

  flex-wrap: wrap;

}

/* Color palette popover (re-used from Phase 4 if loaded; safe to add either way) */
.xl-palette {
  position: fixed;
  background: var(--panel-bg, #fff);
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 4px;
  padding: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  z-index: 1100;
  width: 170px;
}
.xl-palette .sw { width: 28px; height: 22px; border: 1px solid var(--border, #e5e7eb); border-radius: 3px; cursor: pointer; }
.xl-palette .sw:hover { transform: scale(1.1); border-color: var(--primary, #2563eb); }
.xl-palette .sw.none::after { content: '∅'; display:flex; align-items:center; justify-content:center; height:100%; color: var(--text-muted, #6b7280); }

/* Phase 4 — format toolbar */
.format-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-bottom: 1px solid var(--border, #e5e7eb);
  background: var(--summary-bar-bg, #f9fafb);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.format-toolbar .sep {
  display: inline-block;
  width: 1px;
  height: 18px;
  background: var(--border, #e5e7eb);
  margin: 0 4px;
}
.format-toolbar .fmt-btn {
  margin: 0;
  padding: 3px 8px;
  min-width: 26px;
  font-size: 12px;
}
.format-toolbar .fmt-btn.active {
  background: var(--primary, #2563eb);
  color: #fff;
  border-color: var(--primary, #2563eb);
}
.format-toolbar select {
  width: auto;
  min-width: 90px;
  padding: 3px 6px;
}
.format-toolbar .sel-info {
  font-size: 11px;
  color: var(--text-muted, #6b7280);
  margin-left: auto;
}

/* color palette popover */
.color-palette {
  position: fixed;
  background: var(--panel-bg, #fff);
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 4px;
  padding: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  z-index: 1100;
  width: 160px;
}
.color-palette .color-swatch {
  width: 26px;
  height: 22px;
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
}
.color-palette .color-swatch:hover { transform: scale(1.1); border-color: var(--primary, #2563eb); }
.color-palette .color-swatch.none::after {
  content: '∅';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text-muted, #6b7280);
}

/* font-size classes (applied to td and bubble down) */

.fmt-sm { font-size: 11px !important; }
.fmt-md { font-size: 12px !important; }
.fmt-lg { font-size: 14px !important; }

.reco-table-wrap td input,
.reco-table-wrap td select {

  text-decoration: inherit;

  font-size: inherit;
}

  .modal-bg.show { display: flex; }

  /* Ensure inputs are still selectable/editable */
  .reco-table-wrap tbody input, 
  .reco-table-wrap tbody select { user-select: auto; -webkit-user-select: auto; }
  
  /* Visual indicator for selected rows */
  .reco-table-wrap tbody tr { cursor: pointer; transition: background-color 0.1s; }
  .reco-table-wrap tbody tr.selected td { background: var(--row-selected-bg, #eaf4ff) !important; }

  /* column filter dropdown */
  .col-filter-btn { cursor: pointer; margin-left: 4px; opacity: 0.6; font-size: 10px; vertical-align: middle; }
  .col-filter-btn:hover, .col-filter-btn.active { opacity: 1; color: var(--primary, #2563eb); }
  .col-dropdown { position: absolute; top: 100%; left: 0; min-width: 220px; max-width: 320px; z-index: 100; padding: 8px; background: var(--panel-bg, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .col-resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 3; background: transparent; }
  .col-resize-handle:hover { background: var(--primary, #2563eb); opacity: 0.4; }
  /* selection sum bar */
  .sel-sum-bar { position: sticky; bottom: 0; left: 0; right: 0; background: var(--primary, #2563eb); color: #fff; padding: 8px 14px; font-size: 12px; font-weight: 600; display: none; gap: 18px; align-items: center; flex-wrap: wrap; z-index: 10; }
  .sel-sum-bar.show { display: flex; }
  /* slicer panel */
  .slicer-panel { background: var(--th-bg, #f9fafb); border: 1px solid var(--border, #e5e7eb); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
  .slicer-panel .slicer-items { display: flex; gap: 4px; flex-wrap: wrap; max-height: 100px; overflow-y: auto; margin-top: 6px; }
  .slicer-panel .slicer-item { padding: 3px 9px; background: var(--panel-bg, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 12px; font-size: 11px; cursor: pointer; user-select: none; }
  .slicer-panel .slicer-item.selected { background: var(--primary, #2563eb); color: #fff; border-color: var(--primary, #2563eb); }
  /* doc-match banner */
  .doc-banner { background: var(--badge-amber-bg, #fef3c7); color: var(--badge-amber, #92400e); border: 1px solid var(--badge-amber, #d97706); padding: 8px 14px; border-radius: 4px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pager { display: flex; align-items: center; gap: 5px; padding: 6px 0; font-size: 11px; flex-wrap: wrap; }
  .pager button { margin: 0; }
  .pager .page-info { color: var(--text-muted, #6b7280); }
  .pager select { width: auto; min-width: 60px; }


/* Phase 7a — Excel view container */
.excel-view-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
.excel-view-host {
  flex: 1;
  overflow: auto;
  background: var(--panel-bg, #fff);
}
.excel-view-host .jss_container,
.excel-view-host .jspreadsheet,
.excel-view-host table.jss { width: 100%; height: 100%; }

/* Light-touch coloring for JSS cells via inline class (set on init) */
.excel-view-host td.jss-err  { background: var(--danger-bg, #fee2e2) !important; color: var(--danger, #b91c1c); font-weight: 600; }
.excel-view-host td.jss-corr { background: var(--success-bg, #d1fae5) !important; color: var(--success, #065f46); }
.excel-view-host td.jss-row-offset { opacity: 0.7; }


  /* Row drop hover */
  .reco-table-wrap tbody tr.row-drop-hover td { background: var(--badge-amber-bg, #fef3c7) !important; outline: 1px dashed var(--primary, #2563eb); }

  /* Row context menu */
  .row-ctx-menu { padding: 6px; }
  .row-ctx-menu button { display: block; margin: 2px 0; padding: 6px 10px; }
.ss-fill-handle {
  position: absolute;
  width: 9px;
  height: 9px;
  background: var(--primary, #2563eb);
  border: 1px solid #fff;
  cursor: crosshair;
  z-index: 6;
  display: none;
  box-shadow: 0 0 2px rgba(0,0,0,0.35);
}
.ss-fill-handle:hover {
  transform: scale(1.25);
  background: var(--primary-hover, #1d4ed8);
}
.reco-table-wrap td.ss-fill-preview {
  outline: 2px dashed var(--primary, #2563eb);
  outline-offset: -2px;
}
.ss-fill-tooltip {
  position: fixed;
  background: var(--header-bg, #1f2937);
  color: #fff;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  pointer-events: none;
  z-index: 1100;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  display: none;
}
  /* Timeline */
  .tl-header { background: var(--th-bg, #f9fafb); border: 1px solid var(--border, #e5e7eb); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .tl-actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tl-list { display: flex; flex-direction: column; gap: 8px; }
  .tl-event { border: 1px solid var(--border, #e5e7eb); border-left: 3px solid var(--primary, #2563eb); border-radius: 5px; padding: 8px 10px; background: var(--panel-bg, #fff); }
  .tl-event.tl-com { border-left-color: var(--success, #059669); }
  .tl-event-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tl-event-type { font-size: 16px; }
  .tl-event-body { margin-top: 4px; font-size: 12px; color: var(--text, #1f2937); }
  .tl-event-actions { margin-top: 6px; display: flex; gap: 4px; }

  /* Column drag-reorder */
  .col-draggable { cursor: grab; }
  .col-draggable:active { cursor: grabbing; }
  .col-grip { color: var(--text-muted, #9ca3af); font-size: 9px; margin-right: 3px; cursor: grab; user-select: none; }
  th.col-dragging { opacity: 0.4; }
  th.col-drop-left { box-shadow: inset 3px 0 0 0 var(--primary, #2563eb); }
  th.col-drop-right { box-shadow: inset -3px 0 0 0 var(--primary, #2563eb); }

  /* View controls in topbar */
  .view-controls { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-left: 1px solid var(--border, #e5e7eb); border-right: 1px solid var(--border, #e5e7eb); margin: 0 6px; }
  .view-controls button { margin: 0; }
  .view-controls #zoomIndicator { min-width: 38px; text-align: center; font-size: 11px; font-weight: 600; }

  /* Compact chrome when Reco is open */
  body.reco-fullheight header { padding: 6px 14px; }
  body.reco-fullheight header h1 { font-size: 13px; }
  body.reco-fullheight .nav-bar { display: none; }
  body.reco-fullheight .reco-shell { height: calc(100vh - 50px); }

  /* Zoom container needs to allow overflow */
  .reco-table-wrap { transform-origin: top left; }

  /* Find/Replace highlight */
  mark { background: var(--badge-amber-bg, #fef3c7); color: var(--badge-amber, #92400e); padding: 0 1px; border-radius: 2px; font-weight: 600; }

  /* Active toolbar pill (filters or other) */
  .view-controls button.active { background: var(--primary, #2563eb); color: #fff; border-color: var(--primary, #2563eb); }
`
};

const PALETTE_ORDER = ['classic-blue','forest-green','royal-purple','midnight-dark','warm-sand','ocean-teal','rose-gold'];

function applyTheme(key) {
  const t = THEMES[key] || THEMES['default'];
  document.getElementById('theme-styles').textContent = t.css;
  try { localStorage.setItem('reco_theme', key); } catch(e) {}
}
function setTheme(key) {
  applyTheme(key);
  const sel = document.getElementById('themeSelect');
  if (sel && sel.value !== key) sel.value = key;
}
function applyPalette(key) {
  const p = COLOR_PALETTES[key] || COLOR_PALETTES['classic-blue'];
  let css = ':root {\n';
  Object.keys(p.vars).forEach(k => { css += '  ' + k + ': ' + p.vars[k] + ';\n'; });
  css += '}';
  document.getElementById('palette-styles').textContent = css;
  try { localStorage.setItem('reco_palette', key); } catch(e) {}
}
function setPalette(key) {
  applyPalette(key);
  const sel = document.getElementById('paletteSelect');
  if (sel && sel.value !== key) sel.value = key;
}
function populateThemeSelect() {
  const sel = document.getElementById('themeSelect');
  if (sel) {
    sel.innerHTML = '';
    let saved = 'default';
    try { saved = localStorage.getItem('reco_theme') || 'default'; } catch(e) {}
    THEME_ORDER.forEach(k => {
      if (!THEMES[k]) return;
      const o = document.createElement('option');
      o.value = k; o.textContent = THEMES[k].name;
      if (k === saved) o.selected = true;
      sel.appendChild(o);
    });
  }
  const psel = document.getElementById('paletteSelect');
  if (psel) {
    psel.innerHTML = '';
    let savedp = 'classic-blue';
    try { savedp = localStorage.getItem('reco_palette') || 'classic-blue'; } catch(e) {}
    PALETTE_ORDER.forEach(k => {
      if (!COLOR_PALETTES[k]) return;
      const o = document.createElement('option');
      o.value = k; o.textContent = COLOR_PALETTES[k].name;
      if (k === savedp) o.selected = true;
      psel.appendChild(o);
    });
  }
}
(function() {
  let t = null, p = null;
  try { t = localStorage.getItem('reco_theme'); p = localStorage.getItem('reco_palette'); } catch(e) {}
  applyTheme(t || 'default');
  applyPalette(p || 'classic-blue');
})();
</script>

<script>
/* ================================================================
   MODULE 1 — CORE UTILITIES
   ================================================================ */
const U = {
  uid() { return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); },
  esc(v) { if (v==null) return ''; return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  escAttr(v) { return U.esc(v); },
  num(v) { if (v==null||v==='') return 0; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; },
  fmtNum(n) { if (n==null) return '0.00'; const v=Number(n); return isNaN(v)?'0.00':v.toFixed(2); },
  toast(msg, kind) {
    const t=document.createElement('div');
    t.className='toast'+(kind?' '+kind:'');
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2600);
  },
  formatExcelDate(serial) {
    // If it's empty, not a number, or already formatted, return as-is
    if (serial === '' || serial == null || isNaN(serial)) return serial;
    
    const num = Number(serial);
    // Standard Excel dates are usually > 10000 (which is year 1927). 
    // This prevents accidentally formatting small integers as dates.
    if (num < 10000 || num > 99999) return serial;

    // Excel's epoch starts at 1900. Unix epoch starts at 1970.
    // 25569 is the exact number of days between the two.
    const date = new Date(Math.round((num - 25569) * 86400 * 1000));
    
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = String(date.getFullYear()).slice(-2); // Extracts "26" from "2026"
    
    return `${d}/${m}/${y}`;
  },
  download(filename, content, mime) {
    const blob=new Blob([content],{type:mime||'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },
  todayStr() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  parseFile(file, cb) {
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if (ext==='csv') {
      const r=new FileReader();
      r.onload=e=> { const p=Papa.parse(e.target.result,{header:true,skipEmptyLines:true}); cb(p.data, p.meta.fields||Object.keys(p.data[0]||{})); };
      r.readAsText(file);
    } else {
      const r=new FileReader();
      r.onload=e=> { const wb=XLSX.read(e.target.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const j=XLSX.utils.sheet_to_json(ws,{defval:''}); cb(j, Object.keys(j[0]||{})); };
      r.readAsArrayBuffer(file);
    }
  },
  parsePaste(txt) {
    const sep=txt.indexOf('\t')!==-1?'\t':',';
    const r=Papa.parse(txt,{header:true,delimiter:sep,skipEmptyLines:true});
    return { data: r.data, fields: r.meta.fields||Object.keys(r.data[0]||{}) };
  },
  /* parse a date robustly: accepts dd/mm/yyyy, yyyy-mm-dd, mm/dd/yyyy, Excel serial, etc */
  parseDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    if (typeof v === 'number') {
      // Excel serial date (since 1899-12-30)
      const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
      return isNaN(d.getTime()) ? null : d;
    }
    const s = String(v).trim();
    if (!s) return null;
    // try ISO yyyy-mm-dd
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) { const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d.getTime()) ? null : d; }
    // dd/mm/yyyy or dd-mm-yyyy
    m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      const d = new Date(y, +m[2]-1, +m[1]);
      return isNaN(d.getTime()) ? null : d;
    }
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  },
  monthNames: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  /* format a date with simple tokens: YYYY, YY, MMM, MM, DD, MMM-YY, etc */
  fmtDate(d, fmt) {
    if (!d) return '';
    const Y = d.getFullYear();
    const M = d.getMonth();
    const D = d.getDate();
    return (fmt || 'YYYY-MM-DD')
      .replace(/YYYY/g, String(Y))
      .replace(/YY/g, String(Y).slice(-2))
      .replace(/MMM/g, U.monthNames[M])
      .replace(/MM/g, String(M+1).padStart(2,'0'))
      .replace(/DD/g, String(D).padStart(2,'0'));
  },
  daysBetween(a, b) {
    if (!a || !b) return 0;
    return Math.floor((b.getTime() - a.getTime()) / 86400000);
  }
};

/* ================================================================
   MODULE 2 — FORMAT VALIDATION ENGINE
   D = single digit, N = string of digits, A = single letter,
   T = string of letters, S = alphanumeric string. Other characters
   are treated literally.
   ================================================================ */
const FMT = {
  _cache: new Map(),
  toRegex(pattern) {
    if (!pattern) return null;
    if (FMT._cache.has(pattern)) return FMT._cache.get(pattern);
    let regex = '^';
    let i = 0;
    while (i < pattern.length) {
      const c = pattern[i];
      if (c === 'D') { regex += '\\d'; i++; }
      else if (c === 'N') { regex += '\\d+'; i++; }
      else if (c === 'A') { regex += '[A-Za-z]'; i++; }
      else if (c === 'T') { regex += '[A-Za-z]+'; i++; }
      else if (c === 'S') { regex += '[A-Za-z0-9]+'; i++; }
      else { regex += '\\' + c; i++; }
    }
    regex += '$';
    let rx = null;
    try { rx = new RegExp(regex); } catch(e) { rx = null; }
    FMT._cache.set(pattern, rx);
    return rx;
  },
  validate(value, patterns) {
    if (!patterns || !patterns.length) return true;
    const v = String(value || '');
    if (!v) return true;
    return patterns.some(p => {
      const rx = FMT.toRegex(p);
      return rx ? rx.test(v) : true;
    });
  },
  describePattern(p) { return p; }
};

/* ================================================================
   MODULE 2b — FORMULA ENGINE (string + date + arithmetic helpers)
   Supports tokens like {ColName} substituted from a row, and the
   following helper functions:

   STRING:
     LEFT(s,n)             RIGHT(s,n)              MID(s,start,n)
     LEN(s)                UPPER(s)                LOWER(s)
     TRIM(s)               PROPER(s)               CLEAN(s)
     REPT(s,n)             CONCAT(...)             JOIN(sep,...)
     PAD_LEFT(s,n,ch)      PAD_RIGHT(s,n,ch)
     REPLACE(s,start,n,r)  SUBSTITUTE(s,old,new,inst)
     FIND(find,s,start)    CONTAINS(s,sub)
     STARTS_WITH(s,pre)    ENDS_WITH(s,suf)
     EXTRACT_NUM(s)        REMOVE_SPACES(s)        NORMALIZE(s)
     TEXT_BEFORE(s,sep)    TEXT_AFTER(s,sep)       TEXT_BETWEEN(s,a,b)

   NUMBER / MATH:
     ABS(n)                ROUND(n,d)              ROUNDUP(n,d)
     ROUNDDOWN(n,d)        FLOOR(n,sig)            CEILING(n,sig)
     INT(n)                MOD(n,d)                SIGN(n)
     SQRT(n)               POWER(n,e)              NEGATE(n)
     CURRENCY(n,d)         MIN(...)                MAX(...)
     SUM(...)              AVERAGE(...)

   LOGICAL:
     IF(c,a,b)             IFS(c1,v1,c2,v2,...)    SWITCH(val,k1,v1,...)
     AND(...)              OR(...)                 NOT(v)
     IFERROR(v,alt)        ISBLANK(v)              ISNUMBER(v)
     ISTEXT(v)

   DATE:
     MONTH(d,fmt)          YEAR(d)                 DAY(d)
     WEEKDAY(d)            QUARTER(d)              YEAR_MONTH(d)
     DATE_FORMAT(d,fmt)    TODAY()
     ADD_DAYS(d,n)         ADD_MONTHS(d,n)         EOMONTH(d,n)
     DATE_DIFF(d1,d2,unit)
     AGEING(d)

   RECONCILIATION:
     AGEING_BUCKET(d,b0,b1,b2,b3)
     VARIANCE(a,b)         VARIANCE_PCT(a,b)
     WITHIN_TOLERANCE(a,b,tol)
     MATCH_STATUS(a,b,tol)
     BREAK_AMOUNT(a,b)     SIGN_FLIP(n)
     NET(g,d,c,t,s)        OUTSTANDING(g,d,c)
     EFFECTIVE_RATE(tax,gross)
     CATEGORY(v,v1,l1,...,default)
     FLAG(condition,yes,no)
     RECON_STATUS(a,b,tol)

   Arithmetic: + - * / and parentheses are also supported.
   ================================================================ */
const Formula = {
  /* Substitute {ColName} tokens with row values, escape strings safely. */
  substituteTokens(formula, row) {
    if (!formula) return '';
    return String(formula).replace(/\{([^}]+)\}/g, (m, k) => {
      const v = row && row[k] != null ? row[k] : '';
      const num = parseFloat(String(v).replace(/,/g,''));
      if (!isNaN(num) && /^-?\d+(\.\d+)?$/.test(String(v).trim())) return String(num);
      return JSON.stringify(String(v));
    });
  },

  /* Helper functions exposed to the formula evaluator */
  _helpers: {

    // ── String ────────────────────────────────────────────────────────────
    LEFT(s, n)            { return String(s||'').substring(0, n|0); },
    RIGHT(s, n)           { const v = String(s||''); return v.substring(Math.max(0, v.length - (n|0))); },
    MID(s, start, n)      { return String(s||'').substring((start|0)-1, (start|0)-1+(n|0)); },
    LEN(s)                { return String(s||'').length; },
    UPPER(s)              { return String(s||'').toUpperCase(); },
    LOWER(s)              { return String(s||'').toLowerCase(); },
    TRIM(s)               { return String(s||'').trim(); },
    AGE(d)               { return Formula._helpers.AGEING(d); },
    DELIMIT(sep, ...parts) { return Formula._helpers.JOIN(sep, ...parts); },
    PROPER(s)             { return String(s||'').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()); },
    CLEAN(s)              { return String(s||'').replace(/[^\x20-\x7E]/g, '').trim(); },
    REPT(s, n)            { return String(s||'').repeat(Math.max(0, n|0)); },
    CONCAT(...parts)      { return parts.map(p => p == null ? '' : String(p)).join(''); },
    JOIN(sep, ...parts)   { return parts.map(p => p == null ? '' : String(p)).join(String(sep||'')); },
    PAD_LEFT(s, n, ch)    { return String(s||'').padStart(n|0, ch || '0'); },
    PAD_RIGHT(s, n, ch)   { return String(s||'').padEnd(n|0, ch || ' '); },
    REPLACE(s, start, n, r) {
      const v = String(s||'');
      return v.substring(0, (start|0)-1) + String(r||'') + v.substring((start|0)-1+(n|0));
    },
    SUBSTITUTE(s, old, nw, inst) {
      const v = String(s||''), o = String(old||''), n = String(nw||'');
      if (!o) return v;
      if (inst == null) return v.split(o).join(n);
      let idx = -1, count = 0, i = 0;
      while ((i = v.indexOf(o, i)) !== -1) {
        count++;
        if (count === (inst|0)) { idx = i; break; }
        i += o.length;
      }
      return idx < 0 ? v : v.substring(0, idx) + n + v.substring(idx + o.length);
    },
    FIND(find, s, start)  { const i = String(s||'').indexOf(String(find||''), (start||1)-1); return i < 0 ? '' : i + 1; },
    CONTAINS(s, sub)      { return String(s||'').toLowerCase().includes(String(sub||'').toLowerCase()); },
    STARTS_WITH(s, pre)   { return String(s||'').toLowerCase().startsWith(String(pre||'').toLowerCase()); },
    ENDS_WITH(s, suf)     { return String(s||'').toLowerCase().endsWith(String(suf||'').toLowerCase()); },
    EXTRACT_NUM(s)        { const m = String(s||'').replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : ''; },
    REMOVE_SPACES(s)      { return String(s||'').replace(/\s+/g, ''); },
    NORMALIZE(s)          { return String(s||'').trim().toUpperCase().replace(/[\s\-_\/\.]+/g, ''); },
    TEXT_BEFORE(s, sep)   { const v = String(s||''), i = v.indexOf(String(sep||'')); return i < 0 ? '' : v.substring(0, i); },
    TEXT_AFTER(s, sep)    { const v = String(s||''), sp = String(sep||''), i = v.indexOf(sp); return i < 0 ? '' : v.substring(i + sp.length); },
    TEXT_BETWEEN(s, a, b) {
      const v = String(s||''), ai = v.indexOf(String(a||''));
      if (ai < 0) return '';
      const after = v.substring(ai + String(a||'').length);
      const bi = after.indexOf(String(b||''));
      return bi < 0 ? after : after.substring(0, bi);
    },

    // ── Number / Math ─────────────────────────────────────────────────────
    ABS(n)                { return Math.abs(+n||0); },
    ROUND(n, d)           { const f = Math.pow(10, d|0); return Math.round((+n||0) * f) / f; },
    ROUNDUP(n, d)         { const f = Math.pow(10, d|0); return Math.ceil((+n||0) * f) / f; },
    ROUNDDOWN(n, d)       { const f = Math.pow(10, d|0); return Math.floor((+n||0) * f) / f; },
    FLOOR(n, sig)         { const s = +sig||1; return Math.floor((+n||0) / s) * s; },
    CEILING(n, sig)       { const s = +sig||1; return Math.ceil((+n||0) / s) * s; },
    INT(n)                { return Math.trunc(+n||0); },
    MOD(n, d)             { return (+n||0) % ((+d)||1); },
    SIGN(n)               { return Math.sign(+n||0); },
    SQRT(n)               { return Math.sqrt(Math.abs(+n||0)); },
    POWER(n, e)           { return Math.pow(+n||0, +e||0); },
    NEGATE(n)             { return -(+n||0); },
    CURRENCY(n, d)        { const dec = d == null ? 2 : d|0; const f = Math.pow(10, dec); return Math.round((+n||0) * f) / f; },
    MIN(...a)             { const nums = a.flat().map(v => +v).filter(v => !isNaN(v)); return nums.length ? Math.min(...nums) : ''; },
    MAX(...a)             { const nums = a.flat().map(v => +v).filter(v => !isNaN(v)); return nums.length ? Math.max(...nums) : ''; },
    SUM(...a)             { return a.flat().reduce((s, v) => s + (+v||0), 0); },
    AVERAGE(...a)         { const f = a.flat().map(v => +v).filter(v => !isNaN(v)); return f.length ? f.reduce((s,v) => s+v, 0) / f.length : ''; },

    // ── Logical ───────────────────────────────────────────────────────────
    IF(c, a, b)           { return c ? a : b; },
    IFS(...args) {
      for (let i = 0; i < args.length - 1; i += 2) if (args[i]) return args[i+1];
      return args.length % 2 === 1 ? args[args.length-1] : '';
    },
    SWITCH(val, ...args) {
      for (let i = 0; i < args.length - 1; i += 2) if (val == args[i]) return args[i+1];
      return args.length % 2 === 1 ? args[args.length-1] : '';
    },
    AND(...a)             { return a.every(Boolean); },
    OR(...a)              { return a.some(Boolean); },
    NOT(v)                { return !v; },
    IFERROR(v, alt)       { return (v == null || v === '' || v === '#ERR' || v !== v) ? alt : v; },
    ISBLANK(v)            { return v == null || String(v).trim() === ''; },
    ISNUMBER(v)           { const n = parseFloat(String(v||'').replace(/,/g,'')); return !isNaN(n) && isFinite(n); },
    ISTEXT(v)             { return isNaN(parseFloat(String(v||'').replace(/,/g,''))) && String(v||'').trim() !== ''; },

    // ── Date ──────────────────────────────────────────────────────────────
    MONTH(d, fmt)         { const dt = U.parseDate(d); return dt ? U.fmtDate(dt, fmt || 'MMM-YY') : ''; },
    YEAR(d)               { const dt = U.parseDate(d); return dt ? dt.getFullYear() : ''; },
    DAY(d)                { const dt = U.parseDate(d); return dt ? dt.getDate() : ''; },
    WEEKDAY(d)            { const dt = U.parseDate(d); return dt ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()] : ''; },
    QUARTER(d)            { const dt = U.parseDate(d); return dt ? 'Q' + Math.ceil((dt.getMonth()+1) / 3) : ''; },
    YEAR_MONTH(d)         { const dt = U.parseDate(d); if (!dt) return ''; return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'); },
    DATE_FORMAT(d, fmt)   { const dt = U.parseDate(d); return dt ? U.fmtDate(dt, fmt || 'DD-MMM-YY') : ''; },
    TODAY()               { return U.todayStr(); },
    ADD_DAYS(d, n)        { const dt = U.parseDate(d); if (!dt) return ''; const r = new Date(dt); r.setDate(r.getDate() + (n|0)); return U.fmtDate(r, 'DD-MMM-YY'); },
    ADD_MONTHS(d, n)      { const dt = U.parseDate(d); if (!dt) return ''; const r = new Date(dt); r.setMonth(r.getMonth() + (n|0)); return U.fmtDate(r, 'DD-MMM-YY'); },
    EOMONTH(d, n)         { const dt = U.parseDate(d); if (!dt) return ''; const r = new Date(dt); r.setMonth(r.getMonth() + (n|0) + 1); r.setDate(0); return U.fmtDate(r, 'DD-MMM-YY'); },
    DATE_DIFF(d1, d2, unit) {
      const a = U.parseDate(d1), b = U.parseDate(d2); if (!a || !b) return '';
      const ms = b - a;
      if (unit === 'M') return Math.round(ms / (1000*60*60*24*30.44));
      if (unit === 'Y') return Math.round(ms / (1000*60*60*24*365.25));
      return Math.round(ms / (1000*60*60*24));
    },
    AGEING(d)             { const dt = U.parseDate(d); if (!dt) return ''; return U.daysBetween(dt, new Date()); },

    // ── Reconciliation ────────────────────────────────────────────────────
    AGEING_BUCKET(d, b0, b1, b2, b3) {
      const dt = U.parseDate(d); if (!dt) return '';
      const days = U.daysBetween(dt, new Date());
      const buckets = [b0||'0-30', b1||'31-60', b2||'61-90', b3||'90+'];
      if (days <= 30) return buckets[0];
      if (days <= 60) return buckets[1];
      if (days <= 90) return buckets[2];
      return buckets[3];
    },
    VARIANCE(a, b)        { return (+b||0) - (+a||0); },
    VARIANCE_PCT(a, b)    { const av = +a||0; if (av === 0) return ''; return Math.round(((+b||0) - av) / Math.abs(av) * 10000) / 100; },
    WITHIN_TOLERANCE(a, b, tol) { return Math.abs((+a||0) - (+b||0)) <= (+tol||0); },
    MATCH_STATUS(a, b, tol)     { return Math.abs((+a||0) - (+b||0)) <= (+tol||0.01) ? 'MATCHED' : 'BREAK'; },
    BREAK_AMOUNT(a, b)    { return (+b||0) - (+a||0); },
    SIGN_FLIP(n)          { return -(+n||0); },
    NET(g, d, c, t, s)    { return (+g||0) - (+d||0) - (+c||0) + (+t||0) + (+s||0); },
    OUTSTANDING(g, d, c)  { return (+g||0) - (+d||0) - (+c||0); },
    EFFECTIVE_RATE(tax, gross) { return (+gross||0) ? Math.round((+tax||0) / (+gross||0) * 100 * 10000) / 10000 : ''; },
    CATEGORY(v, ...args) {
      for (let i = 0; i < args.length - 1; i += 2) if (String(v) === String(args[i])) return args[i+1];
      return args.length % 2 === 1 ? args[args.length-1] : '';
    },
    FLAG(condition, yes, no) { return condition ? (yes||'FLAG') : (no||''); },
    RECON_STATUS(a, b, tol) {
      if (a === '' || a == null) return 'MISSING IN A';
      if (b === '' || b == null) return 'MISSING IN B';
      return Math.abs((+a||0) - (+b||0)) <= (+tol||0.01) ? 'OK' : 'BREAK';
    },
  },

  /* Evaluate a formula string against a row */
  evaluate(formula, row) {
    if (!formula) return '';
    try {
      const subbed = Formula.substituteTokens(formula, row);
      const scope = Formula._helpers;
      const fn = new Function(...Object.keys(scope), 'return (' + subbed + ');');
      const out = fn(...Object.values(scope));
      return out == null ? '' : out;
    } catch (e) {
      return '#ERR';
    }
  }
};

/* ================================================================
   MODULE 2c — FILTER OPERATORS
   A central place for all filter operations used in column filters,
   reports, and slicers.
   ================================================================ */
const FilterOps = {
  list: [
    { op: 'equals',         label: 'equals' },
    { op: 'not_equals',     label: 'does not equal' },
    { op: 'contains',       label: 'contains' },
    { op: 'not_contains',   label: 'does not contain' },
    { op: 'starts_with',    label: 'starts with' },
    { op: 'not_starts_with',label: 'does not start with' },
    { op: 'ends_with',      label: 'ends with' },
    { op: 'not_ends_with',  label: 'does not end with' },
    { op: 'greater',        label: '>' },
    { op: 'greater_eq',     label: '>=' },
    { op: 'less',           label: '<' },
    { op: 'less_eq',        label: '<=' },
    { op: 'between',        label: 'between' },
    { op: 'not_between',    label: 'not between' },
    { op: 'before',         label: 'date before' },
    { op: 'after',          label: 'date after' },
    { op: 'on_or_before',   label: 'date on or before' },
    { op: 'on_or_after',    label: 'date on or after' },
    { op: 'empty',          label: 'is empty' },
    { op: 'not_empty',      label: 'is not empty' },
    { op: 'in_list',        label: 'in list (a,b,c)' },
    { op: 'not_in_list',    label: 'not in list' }
  ],
  evaluate(rawVal, op, val, val2, isDate) {
    const v = rawVal == null ? '' : String(rawVal);
    const lv = v.toLowerCase();
    const lqv = String(val||'').toLowerCase();
    switch(op) {
      case 'equals':         return lv === lqv;
      case 'not_equals':     return lv !== lqv;
      case 'contains':       return lv.includes(lqv);
      case 'not_contains':   return !lv.includes(lqv);
      case 'starts_with':    return lv.startsWith(lqv);
      case 'not_starts_with':return !lv.startsWith(lqv);
      case 'ends_with':      return lv.endsWith(lqv);
      case 'not_ends_with':  return !lv.endsWith(lqv);
      case 'greater':        return parseFloat(v) > parseFloat(val);
      case 'greater_eq':     return parseFloat(v) >= parseFloat(val);
      case 'less':           return parseFloat(v) < parseFloat(val);
      case 'less_eq':        return parseFloat(v) <= parseFloat(val);
      case 'between':        return parseFloat(v) >= parseFloat(val) && parseFloat(v) <= parseFloat(val2);
      case 'not_between':    return !(parseFloat(v) >= parseFloat(val) && parseFloat(v) <= parseFloat(val2));
      case 'before':         { const a = U.parseDate(v); const b = U.parseDate(val); return a && b ? a.getTime() < b.getTime() : false; }
      case 'after':          { const a = U.parseDate(v); const b = U.parseDate(val); return a && b ? a.getTime() > b.getTime() : false; }
      case 'on_or_before':   { const a = U.parseDate(v); const b = U.parseDate(val); return a && b ? a.getTime() <= b.getTime() : false; }
      case 'on_or_after':    { const a = U.parseDate(v); const b = U.parseDate(val); return a && b ? a.getTime() >= b.getTime() : false; }
      case 'empty':          return !v;
      case 'not_empty':      return !!v;
      case 'in_list':        { const list = String(val||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); return list.includes(lv); }
      case 'not_in_list':    { const list = String(val||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); return !list.includes(lv); }
    }
    return true;
  },
  needsValue(op) { return !['empty','not_empty'].includes(op); },
  needsSecondValue(op) { return ['between','not_between'].includes(op); }
};

/* ================================================================
   MODULE 3 — DATA STORE
   Routes each piece of state to the correct LauncherAPI bridge:
     - aegMaster      -> save_master / load_master   (CSV)
     - aegTemplates   -> save_template / load_templates / delete_template (one JSON per template)
     - everything else -> write_file / read_file under reco/<key>.json
   Falls back to localStorage when running in a plain browser.
   ================================================================ */
const Store = {
  _localPrefix: 'reco_',
  _hasApi() { return !!(window.pywebview && window.pywebview.api); },

  _localGet(key, def) {
    try { return JSON.parse(localStorage.getItem(Store._localPrefix + key)) || def; }
    catch(e) { return def; }
  },
  _localSet(key, val) {
    try { localStorage.setItem(Store._localPrefix + key, JSON.stringify(val)); } catch(e) {}
  },

  /* fire-and-forget save dispatcher */
  save(key, data) {
    if (!Store._hasApi()) { Store._localSet(key, data); return; }
    const api = window.pywebview.api;

    if (key === 'aegMaster') {
      try {
        const arr = Array.isArray(data) ? data : [];
        const csv = arr.length
          ? Papa.unparse(arr)
          : 'Reference,RC,Nominal,SubNominal,AnalysisKey,LOB';
        api.save_master(csv).catch(e => console.error('save_master failed', e));
      } catch(e) { console.error('aegMaster save error', e); }
      return;
    }

    if (key === 'aegTemplates') {
      Store._syncAegTemplates(data || []);
      return;
    }

    // generic JSON file
    const path = 'reco/' + key + '.json';
    try {
      api.write_file(path, JSON.stringify(data, null, 2))
         .catch(e => console.error('write_file failed for ' + key, e));
    } catch(e) { console.error('save error for ' + key, e); }
  },

  /* keep aegtemplates folder in sync: delete removed, write current */
  async _syncAegTemplates(templates) {
    const api = window.pywebview.api;
    try {
      const existing = await api.load_templates();
      const existingIds = new Set((existing || []).map(t => t && t.id).filter(Boolean));
      const newIds = new Set(templates.map(t => t.id));

      for (const id of existingIds) {
        if (!newIds.has(id)) {
          try { await api.delete_template(id); }
          catch(e) { console.error('delete_template failed for ' + id, e); }
        }
      }
      for (const t of templates) {
        if (!t || !t.id) continue;
        try { await api.save_template(t.id, JSON.stringify(t, null, 2)); }
        catch(e) { console.error('save_template failed for ' + t.id, e); }
      }
    } catch(e) { console.error('aegTemplates sync error', e); }
  },

  async loadAll() {
    if (!Store._hasApi()) {
      return {
        recoTemplates:       Store._localGet('recoTemplates', []),
        aegTemplates:        Store._localGet('aegTemplates', []),
        aegMaster:           Store._localGet('aegMaster', []),
        aegSettings:         Store._localGet('aegSettings', {}),
        recoSessions:        Store._localGet('recoSessions', {}),
        entryHistory:        Store._localGet('entryHistory', {}),
        docNumberMaster:     Store._localGet('docNumberMaster', {}),
        manualOffsetMaster:  Store._localGet('manualOffsetMaster', {}),
        pendingSpecialJV: Store._localGet('pendingSpecialJV', {}),
        correctionMaster:    Store._localGet('correctionMaster', {}),
        groupMaster:         Store._localGet('groupMaster', {}),
        attachmentMaster:    Store._localGet('attachmentMaster', {}),
        commentMaster:       Store._localGet('commentMaster', {}),
        customMasters:       Store._localGet('customMasters', [])
      };
    }

    const api = window.pywebview.api;
    const out = {
      recoTemplates: [], aegTemplates: [], aegMaster: [], aegSettings: {},
      recoSessions: {}, entryHistory: {}, docNumberMaster: {},
      manualOffsetMaster: {}, correctionMaster: {}
    };

    // 1. accounts master (CSV)
    try {
      const csv = await api.load_master();
      if (csv && typeof csv === 'string' && csv.trim()) {
        const parsed = Papa.parse(csv, { header: true, skipEmptyLines: true });
        out.aegMaster = parsed.data || [];
      }
    } catch(e) { console.error('load_master failed', e); }

    // 2. AEG templates (folder of JSONs)
    try {
      const tpls = await api.load_templates();
      out.aegTemplates = Array.isArray(tpls) ? tpls : [];
    } catch(e) { console.error('load_templates failed', e); }

    // 3. everything else (JSON files under reco/)
    const readJson = async (key, def) => {
      try {
        const txt = await api.read_file('reco/' + key + '.json');
        if (!txt || typeof txt !== 'string' || !txt.trim()) return def;
        return JSON.parse(txt);
      } catch(e) { console.error('read_file failed for ' + key, e); return def; }
    };

    out.recoTemplates       = await readJson('recoTemplates', []);
    out.aegSettings         = await readJson('aegSettings', {});
    out.recoSessions        = await readJson('recoSessions', {});
    out.entryHistory        = await readJson('entryHistory', {});
    out.pendingSpecialJV = await readJson('pendingSpecialJV', {});
    out.docNumberMaster     = await readJson('docNumberMaster', {});
    out.manualOffsetMaster  = await readJson('manualOffsetMaster', {});
    out.correctionMaster    = await readJson('correctionMaster', {});
    out.groupMaster         = await readJson('groupMaster', {});
    out.attachmentMaster    = await readJson('attachmentMaster', {});
    out.commentMaster       = await readJson('commentMaster', {});
    out.customMasters       = await readJson('customMasters', []);

    return out;
  }
};

/* ================================================================
   MODULE 3aa — MASTERS HELPER
   Uniform read access over: Accounts, Document Numbers,
   Corrections (per template), and Custom Masters.
   ================================================================ */
const Masters = {
  /* Returns the catalog of masters available in this app instance. */
  catalog(tplId) {
    const out = [
      { id: 'accounts',   label: '📒 Accounts Master',                     columns: ['Reference','RC','Nominal','SubNominal','AnalysisKey','LOB'] },
      { id: 'docNumbers', label: '🔢 Document Number Master (this template)', columns: ['DocNumber','AccountingId'] },
      { id: 'corrections',label: '✏️ Correction Master (this template)',     columns: ['PrimaryKey','Column','OldValue','NewValue'] }
    ];
    (AppState.customMasters || []).forEach((cm, idx) => {
      out.push({ id: 'custom:' + idx, label: '📋 ' + cm.name, columns: cm.columns || [] });
    });
    return out;
  },

  /* Returns the list of rows for a master source (id from catalog). */
  rows(sourceId, tplId) {
    if (sourceId === 'accounts') return AppState.aegMaster || [];
    if (sourceId === 'docNumbers') {
      const m = AppState.docNumberMaster[tplId] || {};
      return Object.keys(m).map(k => ({ DocNumber: k, AccountingId: m[k] }));
    }
    if (sourceId === 'corrections') {
      const m = AppState.correctionMaster[tplId] || {};
      const out = [];
      Object.keys(m).forEach(pk => {
        Object.keys(m[pk] || {}).forEach(col => {
          out.push({
            PrimaryKey: pk,
            Column: col,
            OldValue: m[pk][col].oldVal,
            NewValue: m[pk][col].newVal
          });
        });
      });
      return out;
    }
    if (typeof sourceId === 'string' && sourceId.indexOf('custom:') === 0) {
      const idx = parseInt(sourceId.split(':')[1], 10);
      return (AppState.customMasters[idx] || {}).rows || [];
    }
    return [];
  },

  columns(sourceId, tplId) {
    const c = Masters.catalog(tplId).find(x => x.id === sourceId);
    if (c) return c.columns.slice();
    // fallback: derive from first row
    const r = (Masters.rows(sourceId, tplId) || [])[0];
    return r ? Object.keys(r) : [];
  },

  /* Find a single row by matching `matchKey` against `matchValue`, return `returnKey`. */
  lookup(sourceId, tplId, matchKey, matchValue, returnKey) {
    if (matchValue == null || matchValue === '') return '';
    const v = String(matchValue).trim();
    const rows = Masters.rows(sourceId, tplId);
    const r = rows.find(x => String(x[matchKey] || '').trim() === v);
    return r ? (r[returnKey] != null ? r[returnKey] : '') : '';
  },

  /* Distinct values from a given column of a master. Useful for dropdown options. */
  distinctValues(sourceId, tplId, field) {
    const set = new Set();
    Masters.rows(sourceId, tplId).forEach(r => {
      const v = String(r[field] || '').trim();
      if (v) set.add(v);
    });
    return Array.from(set).sort();
  },

  /* Run a lookup based on an additionalColumn config.
     Supports both legacy (`type:'master'`) and new (`type:'master_lookup'`). */
  evalLookup(tpl, ac, row) {
    // Legacy: type=='master', masterRefColumn / masterValueColumn against accounts master
    if (ac.type === 'master') {
      const matchKey = ac.masterRefColumn ? row[ac.masterRefColumn] : '';
      const m = (AppState.aegMaster || []).find(x => String(x.Reference || '').trim() === String(matchKey || '').trim());
      return m ? (m[ac.masterValueColumn] || '') : '';
    }
    // New unified config:
    // ac.masterCfg = { source, matchColumn, matchKey, returnKey }
    const cfg = ac.masterCfg || {};
    if (!cfg.source || !cfg.matchColumn || !cfg.matchKey || !cfg.returnKey) return '';
    return Masters.lookup(cfg.source, tpl.id, cfg.matchKey, row[cfg.matchColumn], cfg.returnKey);
  }
};

Masters._extraDropdownOptions = function(tpl, ac) {
  // Source: 'manual' (use ac.options array) or 'master'
  const src = (ac.optionsSource || 'manual');
  if (src === 'manual') return Array.isArray(ac.options) ? ac.options.slice() : [];
  if (src === 'master') {
    const cfg = ac.optionsMasterCfg || {};
    if (!cfg.source || !cfg.field) return [];
    return Masters.distinctValues(cfg.source, tpl.id, cfg.field);
  }
  return [];
};



/* ================================================================
   MODULE 3b — VERSIONED DATA STORAGE
   Stores each template's data as: reco_data/<templateName>/MMM-YY/DD.csv
   Each row gets a _ver column: "upload", "C1", "C2", ...
   The "active" view = highest Cn for each PK, falling back to upload row.
   ================================================================ */
const Versioning = {
  _safe(s) { return String(s || '').replace(/[^A-Za-z0-9_\-]/g, '_').slice(0, 60); },

  monthFolder(d) {
    d = d || new Date();
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const y = String(d.getFullYear()).slice(-2);
    return m + '-' + y;
  },
  dayFile(d) {
    d = d || new Date();
    return String(d.getDate()).padStart(2, '0') + '.csv';
  },

  /* Build the CSV path for today (or a specific date). */
  pathFor(tplName, date) {
    return 'reco_data/' + Versioning._safe(tplName) + '/' + Versioning.monthFolder(date) + '/' + Versioning.dayFile(date);
  },

  /* List all versioned files for a template, newest first.
     Returns array of {monthFolder, file, fullPath, label}. */
  async listFiles(tplName) {
    if (!Store._hasApi()) {
      // browser fallback - no listing
      const arr = Store._localGet('versionFiles_' + tplName, []);
      return arr;
    }
    const api = window.pywebview.api;
    const out = [];
    try {
      // list month folders
      const monthsRaw = await api.list_directories('reco_data/' + Versioning._safe(tplName));
      const months = Array.isArray(monthsRaw) ? monthsRaw : [];
      for (const mf of months) {
        try {
          const filesJson = await api.list_folder_files('reco_data/' + Versioning._safe(tplName) + '/' + mf);
          const files = JSON.parse(filesJson || '[]');
          if (Array.isArray(files)) {
            files.forEach(f => {
              if (f && f.name && f.name.toLowerCase().endsWith('.csv')) {
                out.push({
                  monthFolder: mf,
                  file: f.name,
                  fullPath: 'reco_data/' + Versioning._safe(tplName) + '/' + mf + '/' + f.name,
                  label: mf + ' / ' + f.name.replace('.csv','')
                });
              }
            });
          }
        } catch(e) { /* skip month */ }
      }
    } catch(e) { console.error('listFiles failed', e); }
    // sort newest-first by path string is good enough since MMM-YY orders chronologically by year, then month text — improve:
    out.sort((a, b) => {
      const pa = Versioning._sortKey(a);
      const pb = Versioning._sortKey(b);
      return pb - pa;
    });
    return out;
  },
  _sortKey(item) {
    const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const m = item.monthFolder.match(/^([A-Za-z]{3})-(\d{2})$/);
    if (!m) return 0;
    const yr = 2000 + parseInt(m[2], 10);
    const mo = months[m[1]] != null ? months[m[1]] : 0;
    const d = parseInt(item.file.replace('.csv',''), 10) || 0;
    return yr * 10000 + mo * 100 + d;
  },

  /* Read a specific CSV file, return parsed rows. */
  async readFile(fullPath) {
    if (!Store._hasApi()) return [];
    try {
      const txt = await window.pywebview.api.read_file(fullPath);
      if (!txt) return [];
      const p = Papa.parse(txt, { header: true, skipEmptyLines: true });
      return p.data || [];
    } catch(e) { console.error('Versioning.readFile', e); return []; }
  },

  /* Write rows back to a CSV file. */
  async writeFile(fullPath, rows) {
    if (!Store._hasApi()) {
      Store._localSet('verfile_' + fullPath, rows);
      return true;
    }
    try {
      const csv = rows && rows.length ? Papa.unparse(rows) : '';
      await window.pywebview.api.write_file(fullPath, csv);
      return true;
    } catch(e) { console.error('Versioning.writeFile', e); return false; }
  },

  /* Append upload-rows for the data the user just loaded.
     Each new raw row gets _ver="upload", _pk=computedPK, _ts=ISO date. */
  async appendUpload(tpl, rawRows) {
    const path = Versioning.pathFor(tpl.name);
    const existing = await Versioning.readFile(path);
    const stamp = new Date().toISOString();
    const out = existing.slice();
    rawRows.forEach(r => {
      const pk = Reco.getRowPK(tpl, r) || ('_auto_' + U.uid());
      const rec = { _pk: pk, _ver: 'upload', _ts: stamp };
      tpl.columns.forEach(c => { rec[c.name] = r[c.name] != null ? r[c.name] : ''; });
      out.push(rec);
    });
    await Versioning.writeFile(path, out);
    return path;
  },

  /* Append a "Cn" change row for a single PK with the new column values.
     Returns the version label written (e.g. "C3"). */
  async appendChange(tpl, pk, changedRow) {
    const path = Versioning.pathFor(tpl.name);
    const existing = await Versioning.readFile(path);
    // figure out next Cn for this PK
    let max = 0;
    existing.forEach(r => {
      if (r._pk === pk && r._ver && r._ver.match(/^C(\d+)$/)) {
        const n = parseInt(r._ver.slice(1), 10);
        if (n > max) max = n;
      }
    });
    const nextVer = 'C' + (max + 1);
    const rec = { _pk: pk, _ver: nextVer, _ts: new Date().toISOString() };
    tpl.columns.forEach(c => { rec[c.name] = changedRow[c.name] != null ? changedRow[c.name] : ''; });
    existing.push(rec);
    await Versioning.writeFile(path, existing);
    return nextVer;
  },
  /* Append change rows for many PKs at once. Each unique PK gets exactly
     one new Cn version row reflecting the latest values across all the
     column changes batched in. `pkRows` is an array of { pk, row } pairs.
     Returns a map { pk: 'Cn' } of version labels written. */
  async appendChangesBatch(tpl, pkRows) {
    if (!pkRows || !pkRows.length) return {};
    const path = Versioning.pathFor(tpl.name);
    const existing = await Versioning.readFile(path);

    // Compute current max Cn per PK from existing file
    const maxByPk = {};
    existing.forEach(r => {
      const pk = r._pk;
      if (!pk || !r._ver) return;
      const m = r._ver.match(/^C(\d+)$/);
      if (m) {
        const n = parseInt(m[1], 10);
        if (n > (maxByPk[pk]||0)) maxByPk[pk] = n;
      }
    });

    // De-dupe by PK — keep the latest row sent for each PK
    const latestByPk = {};
    pkRows.forEach(p => { if (p && p.pk) latestByPk[p.pk] = p.row; });

    const stamp = new Date().toISOString();
    const versionsOut = {};
    Object.keys(latestByPk).forEach(pk => {
      const nextN = (maxByPk[pk] || 0) + 1;
      const verLabel = 'C' + nextN;
      versionsOut[pk] = verLabel;
      const rec = { _pk: pk, _ver: verLabel, _ts: stamp };
      tpl.columns.forEach(c => { rec[c.name] = latestByPk[pk][c.name] != null ? latestByPk[pk][c.name] : ''; });
      existing.push(rec);
    });

    await Versioning.writeFile(path, existing);
    return versionsOut;
  },

  /* Reduce a versioned-row list to "active" rows: highest Cn per PK, else upload row. */
  collapseToActive(versionedRows) {
    const byPk = new Map();
    versionedRows.forEach(r => {
      const pk = r._pk;
      if (!pk) return;
      const cur = byPk.get(pk);
      const score = Versioning._verScore(r._ver);
      if (!cur || score > Versioning._verScore(cur._ver)) byPk.set(pk, r);
    });
    return Array.from(byPk.values());
  },
  _verScore(v) {
    if (!v) return -1;
    if (v === 'upload') return 0;
    const m = String(v).match(/^C(\d+)$/);
    return m ? parseInt(m[1], 10) : -1;
  }
};

/* ================================================================
   MODULE 3c — SPECIAL JV REGISTRY
   Loads JV definitions from special_jv_mapping/*.json
   ================================================================ */

/* ================================================================
   MODULE 3c — SPECIAL JV REGISTRY  (iframe modal, no popups)
   ================================================================ */
const SpecialJV = {
  registry: {},
  _loaded: false,
  _activeHandler: null,

  async load() {
    SpecialJV.registry = {};
    if (!Store._hasApi()) { SpecialJV._loaded = true; return; }
    try {
      const filesJson = await window.pywebview.api.list_folder_files('special_jv_mapping');
      let files;
      try { files = JSON.parse(filesJson || '[]'); } catch(e) { files = []; }
      if (!Array.isArray(files)) { SpecialJV._loaded = true; return; }
      for (const f of files) {
        if (!f.name || !f.name.toLowerCase().endsWith('.json')) continue;
        try {
          const txt = await window.pywebview.api.read_file('special_jv_mapping/' + f.name);
          const def = JSON.parse(txt);
          if (def && def.ref) {
            def.htmlPath = 'special_jv_templates/' + def.ref + '.html';
            SpecialJV.registry[def.ref] = def;
          }
        } catch(e) { console.error('SpecialJV mapping parse fail', f.name, e); }
      }
    } catch(e) { console.error('SpecialJV.load failed', e); }
    SpecialJV._loaded = true;
    console.log('SpecialJV loaded:', Object.keys(SpecialJV.registry));
  },

  list() { return Object.values(SpecialJV.registry); },
  get(ref) { return SpecialJV.registry[ref] || null; },
  isJvRef(ref) { return !!SpecialJV.get(ref); },

  /* Build "To Account" dropdown options: master Refs + JV refs */
  buildToAccountOptions() {
    const seen = new Set();
    const masterRefs = [];
    (AppState.aegMaster || []).forEach(m => {
      const v = String(m.Reference || '').trim();
      if (!v || seen.has(v)) return;
      seen.add(v);
      masterRefs.push({ value: v, label: v, kind: 'master' });
    });
    const jvRefs = SpecialJV.list().map(j => ({
      value: String(j.ref || '').trim(),
      label: '⚡ ' + (j.displayName || j.ref) + ' (Special JV)',
      kind: 'jv'
    })).filter(o => o.value);
    return masterRefs.concat(jvRefs);
  },

  /* Open the JV inside an iframe modal — NO window.open, NO popup blocker.
     Inputs are exposed on window globals so the iframe can read them
     via window.parent._specialJvInputs / .._specialJvDef / .._specialJvRef. */
  open(ref, prefilledInputs, onComplete) {
    const def = SpecialJV.get(ref);
    if (!def) { U.toast('Special JV "' + ref + '" not registered', 'error'); return; }

    // Expose inputs to the iframe
    window._specialJvInputs = prefilledInputs || [];
    window._specialJvRef = ref;
    window._specialJvDef = def;

    // Build modal body with iframe
    // Cache-bust the iframe src so changes to the JV HTML reload immediately
    const src = def.htmlPath + '?t=' + Date.now();
    const body = ''
      + '<div style="height:72vh; display:flex; flex-direction:column;">'
      + '  <div class="text-muted" style="margin-bottom:6px;">'
      +     '⚡ ' + U.esc(def.displayName || ref) + ' · '
      +     (prefilledInputs||[]).length + ' input row(s) sent · '
      +     '<code>' + U.esc(def.htmlPath) + '</code>'
      + '  </div>'
      + '  <iframe id="specialJvFrame" src="' + U.escAttr(src) + '"'
      +     ' style="flex:1; width:100%; border:1px solid var(--border, #e5e7eb); border-radius:4px; background:#fff;"></iframe>'
      + '</div>';

    const footer = '<button onclick="SpecialJV._cancel()">Cancel JV</button>';

    App.openModal('Special JV — ' + (def.displayName || ref), body, footer);

    // Widen the modal for the iframe
    const modalEl = document.querySelector('#appModal .modal');
    if (modalEl) { modalEl.style.maxWidth = '1180px'; modalEl.dataset._jvWidened = '1'; }

    // One-shot postMessage listener
    const handler = (ev) => {
      if (!ev.data || ev.data.type !== 'specialJV.complete') return;
      if (ev.data.ref !== ref) return;
      window.removeEventListener('message', handler);
      SpecialJV._activeHandler = null;
      SpecialJV._restoreModal();
      App.closeModal();
      try { onComplete && onComplete(ev.data); } catch(e) { console.error(e); }
    };
    window.addEventListener('message', handler);
    SpecialJV._activeHandler = handler;
  },

  _cancel() {
    if (SpecialJV._activeHandler) {
      window.removeEventListener('message', SpecialJV._activeHandler);
      SpecialJV._activeHandler = null;
    }
    SpecialJV._restoreModal();
    App.closeModal();
    U.toast('Special JV cancelled', 'error');
  },

  _restoreModal() {
    const modalEl = document.querySelector('#appModal .modal');
    if (modalEl && modalEl.dataset._jvWidened) {
      modalEl.style.maxWidth = '';
      delete modalEl.dataset._jvWidened;
    }
  }
};

/* ================================================================
   MODULE 3d — GROUPS
   Template-level master of groups. Each group holds a set of
   primary keys. An item can be in many groups. When a PK isn't
   in the current session, we resolve it from versioned files.
   ================================================================ */
const Groups = {
  // === CRUD ===
  forTemplate(tplId) {
    AppState.groupMaster = AppState.groupMaster || {};
    AppState.groupMaster[tplId] = AppState.groupMaster[tplId] || {};
    return AppState.groupMaster[tplId];
  },

  list(tplId) {
    const m = Groups.forTemplate(tplId);
    return Object.keys(m).map(k => m[k]).sort((a,b) => a.name.localeCompare(b.name));
  },

  get(tplId, gid) {
    return Groups.forTemplate(tplId)[gid] || null;
  },

  create(tplId, name, description, color) {
    const id = 'G' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
    const g = {
      id,
      name: String(name||'').trim() || 'Group',
      description: String(description||''),
      members: [],
      color: color || Groups._randomColor(),
      createdAt: new Date().toISOString()
    };
    Groups.forTemplate(tplId)[id] = g;
    AppState.save();
    return g;
  },

  rename(tplId, gid, name, description) {
    const g = Groups.get(tplId, gid); if (!g) return;
    g.name = String(name||'').trim() || g.name;
    if (description != null) g.description = String(description);
    AppState.save();
  },

  remove(tplId, gid) {
    const m = Groups.forTemplate(tplId);
    delete m[gid];
    AppState.save();
  },

  // === Membership ===
  addMembers(tplId, gid, pks) {
    const g = Groups.get(tplId, gid); if (!g) return 0;
    let added = 0;
    pks.forEach(pk => {
      if (!pk) return;
      if (!g.members.includes(pk)) { g.members.push(pk); added++; }
    });
    AppState.save();
    return added;
  },

  removeMembers(tplId, gid, pks) {
    const g = Groups.get(tplId, gid); if (!g) return 0;
    const before = g.members.length;
    g.members = g.members.filter(pk => !pks.includes(pk));
    AppState.save();
    return before - g.members.length;
  },

  // Returns all groups containing this PK
  groupsForPk(tplId, pk) {
    if (!pk) return [];
    return Groups.list(tplId).filter(g => g.members.includes(pk));
  },

  // Returns total group-memberships in the current session
  countMembershipsInSession(tpl, sess) {
    let n = 0;
    (sess.data||[]).forEach(r => {
      const pk = Reco.getRowPK(tpl, r);
      if (pk && Groups.groupsForPk(tpl.id, pk).length) n++;
    });
    return n;
  },

  // === Cross-file PK resolver ===
  // Resolve a PK to its latest row. Tries session first, then versioned files newest-first.
  // Returns { row, source: 'session'|'versionFile', filePath?: string } or null.
  async resolvePk(tpl, pk) {
    if (!pk) return null;
    const sess = AppState.recoSessions[tpl.id];
    if (sess) {
      const found = (sess.data||[]).find(r => Reco.getRowPK(tpl, r) === pk);
      if (found) return { row: found, source: 'session' };
    }
    // Scan versioned files newest first
    try {
      const files = await Versioning.listFiles(tpl.name);
      for (const f of files) {
        const all = await Versioning.readFile(f.fullPath);
        const active = Versioning.collapseToActive(all);
        const hit = active.find(r => r._pk === pk);
        if (hit) {
          // hydrate into tpl shape
          const row = { _id: 'hist_' + U.uid(), _pk: pk, _ver: hit._ver, _historic: true };
          tpl.columns.forEach(c => row[c.name] = hit[c.name] != null ? hit[c.name] : '');
          return { row, source: 'versionFile', filePath: f.fullPath };
        }
      }
    } catch(e) { console.error('Groups.resolvePk scan failed', e); }
    return null;
  },

  // Resolve a whole group's members.
  // Returns { resolved: [{pk, row, source, filePath?}], unresolved: [pk,...] }
  async resolveGroup(tpl, gid) {
    const g = Groups.get(tpl.id, gid);
    if (!g) return { resolved: [], unresolved: [] };
    const resolved = [];
    const unresolved = [];
    for (const pk of g.members) {
      const r = await Groups.resolvePk(tpl, pk);
      if (r) resolved.push(Object.assign({ pk }, r));
      else unresolved.push(pk);
    }
    return { resolved, unresolved, group: g };
  },

  _randomColor() {
    const palette = ['#2563eb','#059669','#dc2626','#9333ea','#ea580c','#0891b2','#be185d','#65a30d','#7c3aed','#0ea5e9'];
    return palette[Math.floor(Math.random() * palette.length)];
  }
};


/* ================================================================
   MODULE 3e — ATTACHMENTS
   Files stored on disk via pywebview API. Metadata in
   AppState.attachmentMaster, keyed by templateId then attachmentId.
   Each attachment can be linked to one or more PKs and/or groups.
   ================================================================ */
const Attachments = {
  forTemplate(tplId) {
    AppState.attachmentMaster = AppState.attachmentMaster || {};
    AppState.attachmentMaster[tplId] = AppState.attachmentMaster[tplId] || {};
    return AppState.attachmentMaster[tplId];
  },

  list(tplId) {
    const m = Attachments.forTemplate(tplId);
    return Object.keys(m).map(k => m[k])
      .sort((a,b) => (b.uploadedAt||'').localeCompare(a.uploadedAt||''));
  },

  get(tplId, aid) {
    return Attachments.forTemplate(tplId)[aid] || null;
  },

  // Returns all attachments visible for a given PK:
  //   - direct attachments where linkedPks includes this PK
  //   - inherited attachments where linkedGroups includes any group containing this PK
  forPk(tplId, pk) {
    if (!pk) return [];
    const groups = Groups.groupsForPk(tplId, pk).map(g => g.id);
    return Attachments.list(tplId).filter(a => {
      if ((a.linkedPks||[]).includes(pk)) return true;
      if ((a.linkedGroups||[]).some(gid => groups.includes(gid))) return true;
      return false;
    });
  },

  // === Upload ===
  // file: a File object (from input or drop). meta: {comments, linkedPks, linkedGroups, uploadedBy}
  async upload(tplId, file, meta) {
    if (!file) return null;
    const b64 = await Attachments._fileToBase64(file);

    let saved;
    if (Store._hasApi()) {
      try {
        saved = await window.pywebview.api.save_attachment(tplId, file.name, b64);
      } catch(e) { console.error('save_attachment failed', e); }
    }
    if (!saved || saved.error) {
      // Browser fallback: keep base64 in localStorage (small files only)
      const id = 'A' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
      Store._localSet('attBlob_' + id, b64);
      saved = { id, storedPath: 'localStorage:attBlob_' + id, size: file.size };
    }

    const rec = {
      id: saved.id,
      filename: file.name,
      mime: file.type || '',
      size: saved.size || file.size || 0,
      storedPath: saved.storedPath,
      uploadedAt: new Date().toISOString(),
      uploadedBy: (meta && meta.uploadedBy) || Attachments._currentUser(),
      comments: (meta && meta.comments) || '',
      linkedPks: (meta && meta.linkedPks) ? meta.linkedPks.slice() : [],
      linkedGroups: (meta && meta.linkedGroups) ? meta.linkedGroups.slice() : []
    };
    Attachments.forTemplate(tplId)[rec.id] = rec;
    AppState.save();
    return rec;
  },

  // === Download / View ===
  async fetchBase64(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return null;

    if (rec.storedPath && rec.storedPath.indexOf('localStorage:') === 0) {
      const key = rec.storedPath.split(':')[1];
      return Store._localGet(key, null);
    }
    if (Store._hasApi()) {
      try {
        return await window.pywebview.api.read_attachment(rec.storedPath);
      } catch(e) { console.error('read_attachment failed', e); return null; }
    }
    return null;
  },

  async download(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return;
    const b64 = await Attachments.fetchBase64(tplId, aid);
    if (!b64) { U.toast('Attachment data missing on disk', 'error'); return; }
    const byteChars = atob(b64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNums)], { type: rec.mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = rec.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

  // === Delete ===
  async remove(tplId, aid) {
    const rec = Attachments.get(tplId, aid);
    if (!rec) return false;
    if (rec.storedPath && rec.storedPath.indexOf('localStorage:') === 0) {
      const key = rec.storedPath.split(':')[1];
      try { localStorage.removeItem(Store._localPrefix + key); } catch(e) {}
    } else if (Store._hasApi()) {
      try { await window.pywebview.api.delete_attachment(rec.storedPath); }
      catch(e) { console.error('delete_attachment failed', e); }
    }
    delete Attachments.forTemplate(tplId)[aid];
    AppState.save();
    return true;
  },

  // Re-link an existing attachment (e.g. promote a row-only attachment to a group)
  updateLinks(tplId, aid, linkedPks, linkedGroups) {
    const rec = Attachments.get(tplId, aid); if (!rec) return;
    if (linkedPks)    rec.linkedPks    = linkedPks.slice();
    if (linkedGroups) rec.linkedGroups = linkedGroups.slice();
    AppState.save();
  },

  // === Helpers ===
  _fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error('read failed'));
      r.readAsDataURL(file);
    });
  },

  _currentUser() {
    return (AppState.aegSettings && AppState.aegSettings.currentUser) || 'unknown';
  },

  formatSize(bytes) {
    if (!bytes) return '0 B';
    const k = 1024;
    const units = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + units[i];
  },

  iconFor(mime, filename) {
    const ext = (filename||'').split('.').pop().toLowerCase();
    if ((mime||'').startsWith('image/') || ['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return '🖼';
    if ((mime||'') === 'application/pdf' || ext === 'pdf') return '📄';
    if (['xls','xlsx','csv'].includes(ext)) return '📊';
    if (['doc','docx'].includes(ext)) return '📝';
    if (['zip','7z','rar','tar','gz'].includes(ext)) return '🗜';
    if (['mp3','wav','m4a','ogg'].includes(ext)) return '🎵';
    if (['mp4','mov','avi','mkv'].includes(ext)) return '🎬';
    return '📎';
  }
};

/* ================================================================
   MODULE 3f — TIMELINE
   Unified chronological view of attachments + comments for a row.
   Pulls inherited items from any groups the row's PK belongs to.
   ================================================================ */
const Timeline = {
  // Build the combined event list for a PK.
  // Each event: {type:'attachment'|'comment', id, at, by, source:'row'|'group:<gid>', payload}
  eventsForPk(tplId, pk) {
    const events = [];
    if (!pk) return events;

    const groupIds = Groups.groupsForPk(tplId, pk).map(g => g.id);

    // Attachments
    Attachments.list(tplId).forEach(a => {
      let source = null;
      if ((a.linkedPks||[]).includes(pk)) source = 'row';
      else {
        const viaGroup = (a.linkedGroups||[]).find(gid => groupIds.includes(gid));
        if (viaGroup) source = 'group:' + viaGroup;
      }
      if (!source) return;
      events.push({
        type: 'attachment',
        id: a.id,
        at: a.uploadedAt,
        by: a.uploadedBy,
        source,
        payload: a
      });
    });

    // Comments (Feature 3 will add Comments module — guard for now)
    if (typeof Comments !== 'undefined' && Comments && Comments.list) {
      Comments.list(tplId).forEach(c => {
        let source = null;
        if ((c.linkedPks||[]).includes(pk)) source = 'row';
        else {
          const viaGroup = (c.linkedGroups||[]).find(gid => groupIds.includes(gid));
          if (viaGroup) source = 'group:' + viaGroup;
        }
        if (!source) return;
        events.push({
          type: 'comment',
          id: c.id,
          at: c.createdAt,
          by: c.createdBy,
          source,
          payload: c
        });
      });
    }

    // newest first
    events.sort((a,b) => (b.at||'').localeCompare(a.at||''));
    return events;
  },

  // Open the timeline modal for a row
  open(tplId, pk, rowSummary) {
    const tpl = AppState.recoTemplates.find(x => x.id === tplId);
    const events = Timeline.eventsForPk(tplId, pk);
    const memberGroups = Groups.groupsForPk(tplId, pk);

    let h = '';
    h += '<div class="tl-header">';
    h += '<div><b>Row PK:</b> <code style="font-size:11px;">'+U.esc(pk)+'</code></div>';
    if (rowSummary) h += '<div class="text-muted" style="margin-top:4px;">'+U.esc(rowSummary)+'</div>';
    if (memberGroups.length) {
      h += '<div style="margin-top:4px;">In groups: ';
      memberGroups.forEach(g => {
        h += '<span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> ';
      });
      h += '</div>';
    }
    h += '</div>';

    h += '<div class="tl-actions">';
    h += '<button class="small primary" onclick="Timeline._chooseAddAttachment(\''+U.escAttr(tplId)+'\',\''+U.escAttr(pk)+'\')">📎 Add Attachment</button>';
    if (typeof Comments !== 'undefined' && Comments && Comments.openAddDialog) {
      h += '<button class="small" onclick="Comments.openAddDialog(\''+U.escAttr(tplId)+'\',\''+U.escAttr(pk)+'\')">💬 Add Comment</button>';
    }
    h += '</div>';

    if (!events.length) {
      h += '<div class="empty">No attachments or comments for this row yet.</div>';
    } else {
      h += '<div class="tl-list">';
      events.forEach(ev => {
        h += Timeline._renderEvent(tplId, pk, ev);
      });
      h += '</div>';
    }

    App.openModal('Timeline', h, '<button onclick="App.closeModal()">Close</button>');
  },

  _renderEvent(tplId, pk, ev) {
    const isAtt = ev.type === 'attachment';
    const p = ev.payload;
    const sourceTag = ev.source === 'row'
      ? '<span class="badge aed">row</span>'
      : '<span class="badge fc" title="inherited from group">group</span>';
    const when = (ev.at||'').replace('T',' ').substring(0,16);

    let h = '<div class="tl-event '+(isAtt?'tl-att':'tl-com')+'">';
    h += '<div class="tl-event-head">';
    h += '<span class="tl-event-type">'+(isAtt ? Attachments.iconFor(p.mime, p.filename) : '💬')+'</span>';
    h += '<b>'+U.esc(isAtt ? p.filename : 'Comment')+'</b>';
    h += sourceTag;
    h += '<div style="flex:1"></div>';
    h += '<span class="text-muted" style="font-size:10px;">'+U.esc(when)+' · '+U.esc(ev.by||'')+'</span>';
    h += '</div>';

    if (isAtt) {
      h += '<div class="tl-event-body">';
      h += '<span class="text-muted">'+U.esc(Attachments.formatSize(p.size))+(p.comments ? ' · '+U.esc(p.comments) : '')+'</span>';
      h += '</div>';
      h += '<div class="tl-event-actions">';
      h += '<button class="small primary" onclick="Attachments.download(\''+U.escAttr(tplId)+'\',\''+U.escAttr(p.id)+'\')">Download</button>';
      h += '<button class="small danger" onclick="Timeline._deleteAttachment(\''+U.escAttr(tplId)+'\',\''+U.escAttr(p.id)+'\',\''+U.escAttr(pk)+'\')">Delete</button>';
      h += '</div>';
    } else {
      h += '<div class="tl-event-body" style="white-space:pre-wrap;">'+U.esc(p.text||'')+'</div>';
      if (typeof Comments !== 'undefined' && Comments && Comments.removeForRow) {
        h += '<div class="tl-event-actions">';
        h += '<button class="small danger" onclick="Comments.removeForRow(\''+U.escAttr(tplId)+'\',\''+U.escAttr(p.id)+'\',\''+U.escAttr(pk)+'\')">Delete</button>';
        h += '</div>';
      }
    }

    h += '</div>';
    return h;
  },

  async _deleteAttachment(tplId, aid, pk) {
    if (!confirm('Delete this attachment permanently?')) return;
    await Attachments.remove(tplId, aid);
    Timeline.open(tplId, pk);
  },

  // Add-attachment dialog: ask whether to attach to row only or to a group
  _chooseAddAttachment(tplId, pk) {
    const input = document.createElement('input');
    input.type = 'file';
    input.style.display = 'none';
    input.onchange = async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      Timeline._showLinkDialog(tplId, pk, file);
    };
    document.body.appendChild(input);
    input.click();
    setTimeout(() => input.remove(), 1000);
  },

  // Modal that asks: link to row only OR to a group?
  _showLinkDialog(tplId, pk, file) {
    const memberGroups = Groups.groupsForPk(tplId, pk);
    const comment = '';

    let h = '<div class="help">File: <b>'+U.esc(file.name)+'</b> · '+U.esc(Attachments.formatSize(file.size))+'</div>';
    h += '<label class="field"><span class="label-text">Optional comment</span>';
    h += '<input type="text" id="attComment" placeholder="e.g. signed copy, invoice scan" /></label>';

    h += '<div class="editor-section"><div class="section-head"><strong>Link to</strong></div>';
    h += '<label class="inline"><input type="radio" name="attLink" value="row" checked /> This row only</label>';
    memberGroups.forEach(g => {
      h += '<label class="inline"><input type="radio" name="attLink" value="group:'+U.escAttr(g.id)+'" /> Group: <span class="badge general" style="background:'+U.escAttr(g.color||'#2563eb')+';color:#fff;">'+U.esc(g.name)+'</span> <span class="text-muted">('+g.members.length+' members)</span></label>';
    });
    if (!memberGroups.length) {
      h += '<div class="text-muted" style="font-size:11px;">This row is not in any group. Add it to a group first if you want group-level attachments.</div>';
    }
    h += '</div>';

    Timeline._pendingUpload = { tplId, pk, file };
    App.openModal('Attach File', h,
      '<button onclick="App.closeModal()">Cancel</button>' +
      '<button class="primary" onclick="Timeline._confirmUpload()">Upload</button>');
  },

  async _confirmUpload() {
    const p = Timeline._pendingUpload;
    if (!p) return;
    const comment = (document.getElementById('attComment')?.value || '').trim();
    const sel = document.querySelector('input[name="attLink"]:checked');
    if (!sel) return;

    const meta = { comments: comment };
    if (sel.value === 'row') {
      meta.linkedPks = [p.pk];
    } else if (sel.value.startsWith('group:')) {
      meta.linkedGroups = [sel.value.slice(6)];
    }

    U.toast('Uploading…');
    const rec = await Attachments.upload(p.tplId, p.file, meta);
    Timeline._pendingUpload = null;
    if (rec) {
      U.toast('Uploaded: ' + rec.filename, 'success');
      App.closeModal();
      Timeline.open(p.tplId, p.pk);
    } else {
      U.toast('Upload failed', 'error');
    }
  }
};

/* ================================================================
   MODULE 3g — COMMENTS
   Free-text comments per template. Each comment can be linked to
   one or more PKs and/or groups. Group-linked comments are
   inherited by all current and future group members.
   ================================================================ */
const Comments = {
  forTemplate(tplId) {
    AppState.commentMaster = AppState.commentMaster || {};
    AppState.commentMaster[tplId] = AppState.commentMaster[tplId] || {};
    return AppState.commentMaster[tplId];
  },

  list(tplId) {
    const m = Comments.forTemplate(tplId);
    return Object.keys(m).map(k => m[k])
      .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  },

  get(tplId, cid) {
    return Comments.forTemplate(tplId)[cid] || null;
  },

  // Returns comments visible for a given PK (own + inherited from groups)
  forPk(tplId, pk) {
    if (!pk) return [];
    const groupIds = Groups.groupsForPk(tplId, pk).map(g => g.id);
    return Comments.list(tplId).filter(c => {
      if ((c.linkedPks||[]).includes(pk)) return true;
      if ((c.linkedGroups||[]).some(gid => groupIds.includes(gid))) return true;
      return false;
    });
  },

  // === CRUD ===
  create(tplId, text, meta) {
    const id = 'C' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5);
    const rec = {
      id,
      text: String(text||'').trim(),
      createdAt: new Date().toISOString(),
      createdBy: (meta && meta.createdBy) || Comments._currentUser(),
      linkedPks: (meta && meta.linkedPks) ? meta.linkedPks.slice() : [],
      linkedGroups: (meta && meta.linkedGroups) ? meta.linkedGroups.slice() : [],
      edited: false,
      editedAt: null
    };
    if (!rec.text) return null;
    Comments.forTemplate(tplId)[id] = rec;
    AppState.save();
    return rec;
  },

  edit(tplId, cid, newText) {
    const c = Comments.get(tplId, cid);
    if (!c) return false;
    const trimmed = String(newText||'').trim();
    if (!trimmed) return false;
    if (trimmed === c.text) return true;
    c.text = trimmed;
    c.edited = true;
    c.editedAt = new Date().toISOString();
    AppState.save();
    return true;
  },

  remove(tplId, cid) {
    delete Comments.forTemplate(tplId)[cid];
    AppState.save();
  },

  // Called from the timeline delete button
  removeForRow(tplId, cid, pk) {
    if (!confirm('Delete this comment permanently?')) return;
    Comments.remove(tplId, cid);
    Timeline.open(tplId, pk);
  },

  // Re-link an existing comment
  updateLinks(tplId, cid, linkedPks, linkedGroups) {
