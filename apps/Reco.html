  /* Allocate document number per currency for a generated entry */
  openAllocateModal(accountingId) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    const hist = AppState.entryHistory[id] || [];
    const entry = hist.find(e => e.accountingId === accountingId);
    if (!entry) return;
    // Compute currency-wise debit sums from the lines
    const aegTpl = AppState.aegTemplates.find(t => t.id === (tpl.aegIntegration||{}).aegTemplateId);
    const drCol = aegTpl ? (aegTpl.outputColumns.find(c => c.mapping && c.mapping.type === 'value' && c.mapping.side === 'Dr')||{}).name : null;
    const crCol = aegTpl ? (aegTpl.outputColumns.find(c => c.mapping && c.mapping.type === 'value' && c.mapping.side === 'Cr')||{}).name : null;
    const curCol = aegTpl ? (aegTpl.outputColumns.find(c => c.mapping && c.mapping.type === 'currency')||{}).name : null;
    const sums = {};
    (entry.lines||[]).forEach(l => {
      const cur = curCol ? (typeof l[curCol]==='object' ? l[curCol].value : l[curCol]) : 'AED';
      const dr = drCol ? U.num(typeof l[drCol]==='object' ? l[drCol].value : l[drCol]) : 0;
      const cr = crCol ? U.num(typeof l[crCol]==='object' ? l[crCol].value : l[crCol]) : 0;
      sums[cur] = sums[cur] || { dr: 0, cr: 0 };
      sums[cur].dr += dr;
      sums[cur].cr += cr;
    });
    let h = '<div class="help">Enter a document number for each currency. Saved numbers are added to the Document Number Master so future data loads can detect duplicates.</div>';
    h += '<table><thead><tr><th>Currency</th><th>Dr</th><th>Cr</th><th>Document Number</th></tr></thead><tbody>';
    Object.keys(sums).forEach(cur => {
      const s = sums[cur];
      const existing = (entry.docNumbers||{})[cur] || '';
      h += '<tr><td><b>'+U.esc(cur)+'</b></td><td>'+U.fmtNum(s.dr)+'</td><td>'+U.fmtNum(s.cr)+'</td>';
      h += '<td><input type="text" id="alloc_'+U.escAttr(cur)+'" value="'+U.escAttr(existing)+'" placeholder="Enter doc#" /></td></tr>';
    });
    h += '</tbody></table>';
    Reco._allocateAccountingId = accountingId;
    Reco._allocateCurrencies = Object.keys(sums);
    App.openModal('Allocate Document Numbers — '+accountingId, h, '<button onclick="App.closeModal()">Cancel</button><button class="primary" onclick="Reco.saveAllocation()">Save</button>');
  },
  saveAllocation() {
    const id = AppState.activeRecoId;
    const accountingId = Reco._allocateAccountingId;
    const currencies = Reco._allocateCurrencies || [];
    const hist = AppState.entryHistory[id] || [];
    const entry = hist.find(e => e.accountingId === accountingId);
    if (!entry) return;
    entry.docNumbers = entry.docNumbers || {};
    AppState.docNumberMaster[id] = AppState.docNumberMaster[id] || {};
    const dnm = AppState.docNumberMaster[id];
    currencies.forEach(cur => {
      const v = (document.getElementById('alloc_'+cur)?.value || '').trim();
      const old = entry.docNumbers[cur];
      // A corrected doc number must not leave the old one pointing at this entry.
      if (old && old !== v && dnm[old] === accountingId) delete dnm[old];
      if (v) {
        entry.docNumbers[cur] = v;
        dnm[v] = accountingId;
      } else {
        delete entry.docNumbers[cur];
      }
    });
    AppState.save();
    App.closeModal();
    App.navigate('reco');
    U.toast('Document numbers saved','success');
  },

  /* Preview entry before generating: shows the user the lines that will be created */

  previewEntryFromSelection(forceAll) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    const aeg = tpl.aegIntegration || {};
    if (!aeg.enabled) { U.toast('AEG integration not enabled for this template','error'); return; }
    const aegTpl = AppState.aegTemplates.find(t => t.id === aeg.aegTemplateId);
    if (!aegTpl) { U.toast('Linked AEG template not found','error'); return; }

    // Selected rows when there is a selection; otherwise every visible open row.
    const selectedIds = Object.keys(sess.selectedRows || {}).filter(k => sess.selectedRows[k]);
    let originals;
    if (!selectedIds.length) {
      originals = Reco.applyTableFiltersSort(tpl, sess).filter(r => !sess.offsets[r._id]);
      if (!originals.length) { U.toast('No open rows to preview','error'); return; }
    } else {
      const sel = new Set(selectedIds);
      originals = sess.data.filter(r => sel.has(r._id));
    }

    // Work on copies: the preview computes extra-column values and must not
    // write them (or stale master lookups) back into the session rows.
    let sourceRows = originals.map(r => Object.assign({}, r));

    // Inject dynamic AEG column for additionalColumns evaluation
    const toCol = aegTpl.toAccount && aegTpl.toAccount.inputColumn;
    const extraCols = [...(tpl.additionalColumns || [])];
    if (aegTpl.toAccount && (aegTpl.toAccount.mode === 'input' || aegTpl.toAccount.mode === 'inputOrSelect')) {
      if (toCol && !tpl.columns.find(c => c.name === toCol) && !extraCols.find(c => c.name === toCol)) {
        extraCols.push({ name: toCol, type: 'custom' });
      }
    }
    extraCols.forEach(ac => {
      sourceRows.forEach(r => {
        if (ac.type === 'master' || ac.type === 'master_lookup') {
          // The To Account column keeps what the user picked (e.g. a JV ref);
          // every other lookup is recomputed from the current master.
          if (ac.name === toCol && r[ac.name] != null && r[ac.name] !== '') return;
          r[ac.name] = Masters.evalLookup(tpl, ac, r);
        } else if (ac.type === 'formula') {
          try { r[ac.name] = Formula.evaluate(ac.formula, r); } catch(e) { r[ac.name] = ''; }
        } else {
          // 'custom' or 'dropdown' — only fall back to manualTags if the row has no value yet.
          if (r[ac.name] != null && r[ac.name] !== '') return;
          r[ac.name] = (sess.manualTags||{})[r._id + '||' + ac.name] || '';
        }
      });
    });

    if (aeg.keywordColumn && aeg.keywordValues) {
      const allowed = aeg.keywordValues.split(',').map(s => s.trim()).filter(Boolean);
      sourceRows = sourceRows.filter(r => allowed.includes(String(r[aeg.keywordColumn]||'')));
      if (!sourceRows.length) { U.toast('No selected rows match the keyword filter','error'); return; }
    }

    // ====== SPLIT: standard rows vs Special JV rows ======
    const standardRows = [];
    const jvBuckets = {};   // { jvRef: [rows] }
    sourceRows.forEach(r => {
      const ref = toCol ? String(r[toCol]||'').trim() : '';
      if (ref && SpecialJV.isJvRef(ref)) {
        jvBuckets[ref] = jvBuckets[ref] || [];
        jvBuckets[ref].push(r);
      } else {
        standardRows.push(r);
      }
    });

    // Build standard lines
    const aegInputs = standardRows.map(r => {
      const o = {};
      aegTpl.inputColumns.forEach(ic => {
        if (r[ic.name] != null) o[ic.name] = r[ic.name];
        else if (r[ic.label] != null) o[ic.name] = r[ic.label];
        else o[ic.name] = '';
      });
      if (o[aegTpl.valueColumn] === '' || o[aegTpl.valueColumn] == null) {
        o[aegTpl.valueColumn] = r[tpl.valueColumn] != null && r[tpl.valueColumn] !== '' ? r[tpl.valueColumn] : 0;
      }
      return o;
    });
    const standardLines = standardRows.length
      ? Reco._buildEntryLines(aegTpl, aegInputs, aeg.fromAccountOverride, aeg.toAccountOverride)
      : [];

    // Completed JVs waiting for an entry. One completed for exactly these rows
    // satisfies the requirement; others are "carried forward" (shown with Discard).
    const pendings = (AppState.pendingSpecialJV[id] || []).map(p =>
      Object.assign({}, p, { _fromCurrentSelection: !!jvBuckets[p.ref] && SpecialJV.matchesRows(p, jvBuckets[p.ref]) }));

    Reco._pendingEntry = {
      tplId: id, aegTpl, sourceRows, standardRows, aegInputs,
      lines: standardLines,
      jvBuckets, jvCompleted: pendings
    };

    Reco._renderPreviewModal(tpl, sess);
  },

  _renderPreviewModal(tpl, sess) {
    const ctx = Reco._pendingEntry;
    const aegTpl = ctx.aegTpl;
    const cols = aegTpl.outputColumns.map(c => c.name);

    // Combine standard + completed JV lines
    const allLines = ctx.lines.slice();
    ctx.jvCompleted.forEach(p => { (p.lines||[]).forEach(l => allLines.push(l)); });

    let totalDr = 0, totalCr = 0;
    const drCol = aegTpl.outputColumns.find(c => c.mapping && c.mapping.type==='value' && c.mapping.side==='Dr');
    const crCol = aegTpl.outputColumns.find(c => c.mapping && c.mapping.type==='value' && c.mapping.side==='Cr');
    allLines.forEach(l => {
      if (drCol) totalDr += U.num(l[drCol.name] && typeof l[drCol.name]==='object' ? l[drCol.name].value : l[drCol.name]);
      if (crCol) totalCr += U.num(l[crCol.name] && typeof l[crCol.name]==='object' ? l[crCol.name].value : l[crCol.name]);
    });

    let h = '<div class="help">Review the lines before generating. Special JV references in the To Account column require completion via their dedicated UI.</div>';

    // Special JV requirement banners
    const pendingRefs = Object.keys(ctx.jvBuckets || {});
    if (pendingRefs.length || ctx.jvCompleted.length) {
      h += '<div class="editor-section"><div class="section-head"><strong>Special JV Requirements</strong></div>';
      pendingRefs.forEach(ref => {
        const def = SpecialJV.get(ref);
        const rows = ctx.jvBuckets[ref];
        const alreadyDone = ctx.jvCompleted.find(p => p.ref === ref && p._fromCurrentSelection);
        h += '<div class="doc-banner" style="margin-bottom:6px;">';
        h += '<b>⚡ ' + U.esc(def?.displayName || ref) + '</b>';
        h += '<span>'+rows.length+' selected row(s) target this JV.</span>';
        if (alreadyDone) {
          h += '<span class="badge offset">✓ Completed (JV '+U.esc(alreadyDone.jvId)+' · '+(alreadyDone.lines||[]).length+' lines)</span>';
          h += '<button class="small danger" onclick="Reco._removePendingJv(\''+U.jsq(alreadyDone.jvId)+'\')" title="Discard and redo this JV">Redo</button>';
        } else {
          h += '<button class="small primary" onclick="Reco.openSpecialJv(\''+U.jsq(ref)+'\')">Complete '+U.esc(def?.displayName || ref)+' →</button>';
        }
        h += '</div>';
      });
      // Completed but not for the current selection (carried forward into this entry)
      ctx.jvCompleted.filter(p => !p._fromCurrentSelection).forEach(p => {
        h += '<div class="doc-banner" style="margin-bottom:6px; background:var(--success-bg); color:var(--success);">';
        h += '<b>✓ Carried forward:</b> JV '+U.esc(p.jvId)+' ('+U.esc(p.ref)+') — '+(p.lines||[]).length+' lines';
        if (p.ts) h += ' <span class="text-muted">· completed '+U.esc(String(p.ts).replace('T',' ').substring(0,16))+'</span>';
        h += '<button class="small danger" onclick="Reco._removePendingJv(\''+U.jsq(p.jvId)+'\')">Discard</button>';
        h += '</div>';
      });
      h += '</div>';
    }

    h += '<div style="overflow-x:auto; max-height:300px; overflow-y:auto;"><table><thead><tr>';
    cols.forEach(c => { h += '<th>'+U.esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    allLines.forEach(l => {
      h += '<tr>';
      cols.forEach(c => {
        const cell = l[c];
        const val = cell && typeof cell==='object' ? (cell.value != null ? cell.value : '') : (cell != null ? cell : '');
        const cls = (cell && (cell._missingRC || cell._missingInfo)) ? 'cell-error' : '';
        h += '<td class="'+cls+'">'+U.esc(val)+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    const jvRowCount = pendingRefs.reduce((n, r) => n + ctx.jvBuckets[r].length, 0);
    h += '<div class="summary-bar"><div class="item">Standard rows: <b>'+ctx.standardRows.length+'</b></div>';
    if (jvRowCount) h += '<div class="item">Special JV rows: <b>'+jvRowCount+'</b></div>';
    h += '<div class="item">Lines: <b>'+allLines.length+'</b></div>';
    h += '<div class="item">Dr: <b>'+U.fmtNum(totalDr)+'</b></div>';
    h += '<div class="item">Cr: <b>'+U.fmtNum(totalCr)+'</b></div>';
    const diff = totalDr - totalCr;
    h += '<div class="item"'+(Math.abs(diff) > 0.005 ? ' style="color:var(--danger);"' : '')+'>Diff: <b>'+U.fmtNum(diff)+'</b></div></div>';

    const canGenerate = allLines.length > 0
      && pendingRefs.every(ref => ctx.jvCompleted.find(p => p.ref === ref && p._fromCurrentSelection));
    let footer = '<button onclick="App.closeModal()">Cancel</button>';
    if (!canGenerate) footer += '<button disabled title="'+(allLines.length ? 'Complete all required Special JVs first' : 'Nothing to post')+'">Generate (blocked)</button>';
    else footer += '<button class="success" onclick="Reco.commitEntryFromPreview()">Generate</button>';

    App.openModal('Entry Preview', h, footer);
  },

  /* Open the Special JV HTML, prefilled with relevant rows */
  openSpecialJv(ref) {
    const ctx = Reco._pendingEntry;
    if (!ctx) return;
    const def = SpecialJV.get(ref);
    if (!def) { U.toast('JV not registered','error'); return; }
    const rows = ctx.jvBuckets[ref] || [];
    if (!rows.length) { U.toast('No rows to send','error'); return; }

    // Payload = only the mapping's inputColumns (+ _pk/_id). Names are matched
    // exactly first, then ignoring case/spaces so "TxnType" feeds "Txn Type".
    const payload = rows.map(r => {
      const o = { _pk: r._pk, _id: r._id };
      (def.inputColumns||[]).forEach(ic => { o[ic.name] = SpecialJV.pick(r, ic.name); });
      return o;
    });
    const missing = (def.inputColumns||[]).filter(ic => payload.every(o => o[ic.name] === '' || o[ic.name] == null)).map(ic => ic.name);
    if (missing.length) U.toast('No values found for JV input(s): ' + missing.join(', ') + ' — check the column names', 'error');

    const tplId = ctx.tplId;
    const rerender = () => {
      if (Reco._pendingEntry !== ctx) return;
      Reco._renderPreviewModal(AppState.recoTemplates.find(x => x.id === tplId), AppState.recoSessions[tplId]);
    };

    SpecialJV.open(ref, payload, (result) => {
      // result = {type, ref, jvId, lines, primaryKeys, inputData, meta?}
      AppState.pendingSpecialJV[tplId] = AppState.pendingSpecialJV[tplId] || [];
      const entry = {
        jvId: result.jvId || ('JV_' + Date.now().toString(36)),
        ref: result.ref,
        lines: result.lines || [],
        primaryKeys: Array.isArray(result.primaryKeys) ? result.primaryKeys : rows.map(r => r._pk),
        sentPks: rows.map(r => r._pk),
        inputData: result.inputData || payload,
        meta: result.meta || null,
        ts: new Date().toISOString()
      };
      // Replace an earlier JV for exactly these rows (a redo), keep the rest.
      AppState.pendingSpecialJV[tplId] = AppState.pendingSpecialJV[tplId]
        .filter(p => !(p.ref === entry.ref && SpecialJV.matchesRows(p, rows)));
      AppState.pendingSpecialJV[tplId].push(entry);
      ctx.jvCompleted = ctx.jvCompleted.filter(p => !(p.ref === entry.ref && p._fromCurrentSelection));
      ctx.jvCompleted.push(Object.assign({}, entry, { _fromCurrentSelection: true }));
      AppState.save();
      U.toast('Special JV "'+ref+'" completed','success');
      rerender();
    }, rerender);
  },

  _removePendingJv(jvId) {
    const ctx = Reco._pendingEntry;
    const id = (ctx && ctx.tplId) || AppState.activeRecoId;
    AppState.pendingSpecialJV[id] = (AppState.pendingSpecialJV[id]||[]).filter(p => p.jvId !== jvId);
    if (ctx) ctx.jvCompleted = ctx.jvCompleted.filter(p => p.jvId !== jvId);
    AppState.save();
    if (ctx) Reco._renderPreviewModal(AppState.recoTemplates.find(x => x.id === id), AppState.recoSessions[id]);
  },


  _buildEntryLines(aegTpl, aegInputs, fromOverride, toOverride) {
    const groups = [];
    if (aegTpl.aggregate && aegTpl.aggregateBy && aegTpl.aggregateBy.length) {
      const map = new Map();
      aegInputs.forEach(row => {
        const key = aegTpl.aggregateBy.map(k => String(row[k]==null?'':row[k])).join('||');
        if (!map.has(key)) map.set(key, { keyFields:{}, rows: [] });
        const g = map.get(key);
        aegTpl.aggregateBy.forEach(k => g.keyFields[k] = row[k]);
        g.rows.push(row);
      });
      map.forEach(v => groups.push(v));
    } else {
      aegInputs.forEach(row => groups.push({ keyFields: Object.assign({}, row), rows: [row] }));
    }
    const lines = [];
    groups.forEach(group => {
      const rep = group.rows[0];
      const value = group.rows.reduce((s,r) => s + U.num(r[aegTpl.valueColumn]), 0);
      if (value === 0) return;
      
      let fromRef;
      if (fromOverride) fromRef = fromOverride;
      else if (aegTpl.fromAccount.mode === 'select') fromRef = aegTpl.fromAccount.options[0] || '';
      else fromRef = String(rep[aegTpl.fromAccount.inputColumn]||'');

      let toRef;
      if (toOverride) toRef = toOverride;
      else if (aegTpl.toAccount.mode === 'input') toRef = String(rep[aegTpl.toAccount.inputColumn]||'');
      else if (aegTpl.toAccount.mode === 'select') toRef = aegTpl.toAccount.options[0] || '';
      else { const v = String(rep[aegTpl.toAccount.inputColumn]||'').trim(); toRef = v || aegTpl.toAccount.options[0] || ''; }
      
      const positive = value >= 0;
      const debitSide = (aegTpl.debitOnPositive === 'to') ? (positive ? 'to' : 'from') : (positive ? 'from' : 'to');
      const absVal = Math.abs(value);
      const fromIsDebit = debitSide === 'from';
      lines.push(AEG.buildLine(aegTpl, rep, group, fromRef, fromIsDebit ? absVal : 0, fromIsDebit ? 0 : absVal, 'from'));
      lines.push(AEG.buildLine(aegTpl, rep, group, toRef, fromIsDebit ? 0 : absVal, fromIsDebit ? absVal : 0, 'to'));
    });
    return lines;
  },

  commitEntryFromPreview() {
    const pending = Reco._pendingEntry;
    if (!pending) { App.closeModal(); return; }
    const id = pending.tplId || AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) { App.closeModal(); return; }
    const accountingId = 'AE'+Date.now().toString(36).toUpperCase();

    // Combine standard + JV lines
    const allLines = pending.lines.slice();
    pending.jvCompleted.forEach(p => { (p.lines||[]).forEach(l => allLines.push(l)); });
    if (!allLines.length) { U.toast('Nothing to post', 'error'); return; }

    const byId = new Map(sess.data.map(r => [r._id, r]));
    const byPk = new Map(sess.data.filter(r => r._pk).map(r => [r._pk, r]));
    const sourceRowIds = pending.sourceRows.map(r => r._id);

    const entry = {
      accountingId,
      lines: allLines,
      sourceRowIds: sourceRowIds,
      specialJvIds: pending.jvCompleted.map(p => p.jvId),
      specialJvs: pending.jvCompleted.map(p => ({ jvId: p.jvId, ref: p.ref, primaryKeys: p.primaryKeys || [], meta: p.meta || null })),
      createdAt: new Date().toLocaleString(),
      createdBy: AppState.currentUser || '',
      docNumbers: {}
    };
    AppState.entryHistory[id] = AppState.entryHistory[id] || [];
    AppState.entryHistory[id].push(entry);

    if (tpl.docNumberColumn) {
      AppState.docNumberMaster[id] = AppState.docNumberMaster[id] || {};
      pending.sourceRows.forEach(r => {
        const dn = String(r[tpl.docNumberColumn] || '').trim();
        if (dn) AppState.docNumberMaster[id][dn] = accountingId;
      });
    }

    // Post-entry classification: the standard rows that produced lines and the
    // rows each Special JV actually consumed (rows sent to a JV but left
    // unassigned there are NOT marked as posted).
    const aeg = tpl.aegIntegration || {};
    if (aeg.postEntryColumn && aeg.postEntryValue) {
      const targets = new Map();
      (pending.standardRows || []).forEach(r => { const o = byId.get(r._id); if (o) targets.set(o._id, o); });
      pending.jvCompleted.forEach(p => {
        (p.primaryKeys||[]).forEach(pk => { const o = byPk.get(pk); if (o) targets.set(o._id, o); });
      });
      const isStdCol = tpl.columns.some(c => c.name === aeg.postEntryColumn);
      targets.forEach(o => {
        o[aeg.postEntryColumn] = aeg.postEntryValue;
        // Template columns are versioned: record the change so a reload keeps it.
        if (isStdCol && o._pk) Versioning.queueChange(tpl, o._pk, o).then(v => { if (v) o._ver = v; });
      });
    }

    // Clear pending JVs that were used in this entry
    AppState.pendingSpecialJV[id] = (AppState.pendingSpecialJV[id]||[])
      .filter(p => !pending.jvCompleted.find(c => c.jvId === p.jvId));

    sess.selectedRows = {};
    Reco._pendingEntry = null;
    App.closeModal();
    // Phase 5: drop single-use rows / columns that were part of this entry
    const cleanup = Reco._ssCleanupSingleUseAfterEntry(sourceRowIds.map(rid => byId.get(rid)).filter(Boolean));
    if (cleanup.rows || cleanup.cols) {
      U.toast('Cleaned up '+cleanup.rows+' single-use row(s) and '+cleanup.cols+' column(s)', 'success');
    }
    AppState.save();

    sess.activeSection = 'entries';
    AppState._activeEntryId = accountingId;
    App.navigate('reco');
    U.toast('Entry '+accountingId+' generated ('+entry.lines.length+' lines)','success');
    setTimeout(() => Reco.openAllocateModal(accountingId), 300);
  },

  _selectedPks() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return [];
    const pks = [];
    Object.keys(sess.selectedRows||{}).forEach(rid => {
      if (!sess.selectedRows[rid]) return;
      const row = sess.data.find(r => r._id === rid);

  /* ---- Version history: list files, compact long edit histories ---- */
  async openVersionHistoryModal() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    if (!tpl) return;
    App.openModal('Version History — ' + tpl.name, '<div class="empty">Reading version files…</div>', '<button onclick="App.closeModal()">Close</button>');
    await AppState.flush();   // make sure queued edits are on disk before counting
    const files = await Versioning.listFiles(tpl);
    const stats = [];
    for (const f of files) {
      const rows = await Versioning.readFile(f.fullPath);
      const uploads = rows.filter(r => r._ver === 'upload' || Versioning._verScore(r._ver) < 0).length;
      const edited = new Set(rows.filter(r => Versioning._verScore(r._ver) > 0).map(r => r._pk));
      stats.push({ f, rows: rows.length, uploads, edits: rows.length - uploads, removable: rows.length - uploads - edited.size });
    }
    Reco._versionStats = stats;
    let h = '<div class="help">Edits are append-only: every change adds a row (C1, C2, …) to the day\'s file. Compacting keeps each key\'s upload row and its <b>latest</b> edit and drops the intermediate ones, which makes large files faster to open. The full file can be archived to <code>_archive/</code> first.</div>';
    if (!stats.length) h += '<div class="empty">No version files yet.</div>';
    else {
      h += '<table><thead><tr><th>File</th><th>Rows</th><th>Uploads</th><th>Edits</th><th>Removable</th><th></th></tr></thead><tbody>';
      stats.forEach((st, i) => {
        h += '<tr><td><b>' + U.esc(st.f.label) + '</b><br><code style="font-size:10px;">' + U.esc(st.f.fullPath) + '</code></td>';
        h += '<td>' + st.rows + '</td><td>' + st.uploads + '</td><td>' + st.edits + '</td><td>' + st.removable + '</td>';
        h += '<td>' + (st.removable ? '<button class="small" onclick="Reco._compactVersions([' + i + '])">Compact</button>' : '<span class="text-muted">—</span>') + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<label class="inline" style="margin-top:8px;"><input type="checkbox" id="vhArchive" checked> Keep an archived copy of the full history</label>';
    }
    const total = stats.reduce((n, st) => n + st.removable, 0);
    let foot = '<button onclick="App.closeModal()">Close</button>';
    if (total) foot += '<button class="primary" onclick="Reco._compactVersions(null)">Compact all (' + total + ' rows)</button>';
    App.openModal('Version History — ' + tpl.name, h, foot);
  },

  async _compactVersions(indexes) {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const stats = Reco._versionStats || [];
    const keep = !!(document.getElementById('vhArchive') || {}).checked;
    const targets = (indexes ? indexes.map(i => stats[i]) : stats).filter(st => st && st.removable);
    if (!targets.length) return;
    if (!keep && !confirm('Compact without keeping an archive? The intermediate edit rows are deleted permanently.')) return;
    await AppState.flush();
    let removed = 0;
    for (const st of targets) {
      try {
        const r = await Versioning.compactFile(tpl, st.f.fullPath, keep);
        removed += r.before - r.after;
      } catch (e) {
        console.error('compact failed', e);
        U.toast('Could not compact ' + st.f.label + ': ' + (e && e.message || e), 'error');
      }
    }
    U.toast('Removed ' + removed + ' intermediate version row(s)', 'success');
    Reco.openVersionHistoryModal();
  },

  removeManualOffset(pk) {
    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    if (AppState.manualOffsetMaster[id]) delete AppState.manualOffsetMaster[id][pk];
    // Find the row and unmark it
    if (sess && tpl) {
      sess.data.forEach(row => {
        if (Reco.getRowPK(tpl, row) === pk) {
          delete row._manualOffset;
          delete row._recoId;
          delete sess.offsets[row._id];
        }
      });
    }
    AppState.save();
    App.closeModal();
    App.navigate('reco');
    U.toast('Manual offset removed','success');
  },

      h += '<table><thead><tr><th>Document Number</th><th>Accounting ID</th><th></th></tr></thead><tbody>';
      keys.sort().forEach(k => {

        h += '<td><button class="small primary" onclick="App.closeModal(); Reco.openEntryByAccountingId(\''+U.jsq(dn[k])+'\')">View Entry</button>';
        h += '<button class="small danger" onclick="delete AppState.docNumberMaster[\''+U.jsq(id)+'\'][\''+U.jsq(k)+'\']; AppState.save(); App.closeModal(); Reco.viewDocNumberMaster()">Remove</button></td></tr>';
      });

    }
    App.openModal('Document Number Master ('+keys.length+')', h, '<button onclick="App.closeModal()">Close</button>');
  },

  backupSession() {
    const id = AppState.activeRecoId;
    const tpl = AppState.recoTemplates.find(x => x.id === id);
    const sess = AppState.recoSessions[id];
    if (!tpl || !sess) return;
    const data = {
      template: tpl,
      session: sess,
      manualOffsetMaster: AppState.manualOffsetMaster[id]||{},
      correctionMaster: AppState.correctionMaster[id]||{},
      docNumberMaster: AppState.docNumberMaster[id]||{},
      entryHistory: AppState.entryHistory[id]||[],
      exportedAt: new Date().toISOString()
    };
    U.download('reco_session_'+Date.now()+'.json', JSON.stringify(data,null,2), 'application/json');
  },
  restoreSession(ev) {
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        const id = AppState.activeRecoId;
        const cur = AppState.recoTemplates.find(x => x.id === id);
        if (!d || !d.session) { U.toast('This file is not a session backup','error'); return; }
        if (d.template && d.template.id && d.template.id !== id) {
          if (!confirm('This backup was taken from template "' + (d.template.name || d.template.id) + '", not "' + (cur ? cur.name : id) + '". Restore it into the current template anyway?')) return;
        } else if (!confirm('Replace the loaded data, manual offsets, corrections, document numbers and entries of this template with the backup?')) return;
        if (d.session) AppState.recoSessions[id] = d.session;
        if (d.manualOffsetMaster) AppState.manualOffsetMaster[id] = d.manualOffsetMaster;
        if (d.correctionMaster) AppState.correctionMaster[id] = d.correctionMaster;
        if (d.docNumberMaster) AppState.docNumberMaster[id] = d.docNumberMaster;
        if (d.entryHistory) AppState.entryHistory[id] = d.entryHistory;
        AppState.save();
        App.navigate('reco');
        U.toast('Session restored','success');
      } catch(er) { U.toast('Invalid file','error'); }
    };
    r.readAsText(file);
    ev.target.value = '';
  },
  clearSession() {
    const id = AppState.activeRecoId;
    if (AppState.recoSessions[id]) {
      const fresh = Reco.makeSession();
      fresh._autoLoadAttempted = true;   // don't pull the latest file straight back in
      AppState.recoSessions[id] = fresh;
      AppState.save();
      App.navigate('reco');
      U.toast('Loaded data cleared','success');
    }
  }
};

    h += '<div class="tab '+(AEG.currentTab==='templates'?'active':'')+'" onclick="AEG.switchTab(\'templates\')">Templates</div>';

  currentTemplate() { return AppState.aegTemplates.find(t => t.id === AEG.currentTemplateId) || null; },

  // lookupMaster / resolveVariables / resolveFromRef / resolveToRef / buildLine
  // are defined once, further down (an earlier duplicate set was dead code).

/* ---- AEG Render functions ---- */

      '<div class="step ' + (t ? 'done' : 'active') + '">1. Template</div>' +

      '<div class="step ' + stepGen + '">3. Generate</div>' +
      '<div class="step ' + stepReady + '">4. Export</div>' +
      '</div>';

    h += '<div class="panel"><h2>Step 1 · Choose Template</h2>';
    h += '<label class="field"><span class="label-text">Template</span>';
    h += '<select onchange="AEG.currentTemplateId=this.value||null; AEG.fromSelection=\'\'; AEG.toSelection=\'\'; AEG.inputData=[]; AEG.output={lines:[],generatedAt:null}; AEG.renderProcess();">';
    h += '<option value="">— select —</option>';
    AppState.aegTemplates.forEach(x => {

        (t.currencyMode === 'AED' ? 'AED' : 'CUR/' + U.esc(t.currencyColumn || '?')) + '</span>';
      if (t.aggregate) h += '<span class="badge general">Aggregate</span>';
      if (t.exchange && t.exchange.mode !== 'asRequired')
        h += '<span class="badge exch">' + U.esc(t.exchange.mode) + '</span>';
      h += '<span class="text-muted">Value: ' + U.esc(t.valueColumn) + ' · Debit on positive: ' + U.esc(t.debitOnPositive) + '</span>';
      h += '</div>';

      const needsTo   = (t.toAccount.mode === 'select' || t.toAccount.mode === 'inputOrSelect') && (t.toAccount.options || []).length;

            '<select onchange="AEG.toSelection=this.value; AEG.renderProcess();">' +

            t.toAccount.options.map(o => '<option value="' + U.escAttr(o) + '"' +
              (o === AEG.toSelection ? ' selected' : '') + '>' + U.esc(o) + '</option>').join('') +
            '</select></label>';
        }
        h += '</div>';
      }
    }
    h += '</div>';

    if (!t) { el.innerHTML = h; return; }

    // Load data
    h += '<div class="panel"><h2>Step 2 · Load Input Data <span class="text-muted">(' + AEG.inputData.length + ' rows)</span></h2>';
    h += '<div class="toolbar">';
    h += '<input type="file" id="aegInputFile" accept=".csv,.xlsx,.xls" style="display:none" onchange="AEG.handleInputFile(event)" />';

    h += '<button onclick="document.getElementById(\'aegInputPasteBox\').style.display=\'block\'">Paste Data</button>';

    h += '</div>';

    h += '<button class="primary" onclick="AEG.generateEntries()" ' + (AEG.inputData.length ? '' : 'disabled') + '>Generate Entries</button>';

      h += '<span class="text-muted" style="margin-left:8px">Last run: ' + U.esc(AEG.output.generatedAt) + ' · ' + AEG.output.lines.length + ' lines</span>';
    }
    h += '</div>';

    // Output
    h += '<div class="panel"><h2>Step 4 · Output</h2>';
    if (AEG.output.lines.length === 0) {
      h += '<div class="empty">Nothing yet — click Generate.</div>';
    } else {
      h += '<div class="toolbar">';
      h += '<button class="success" onclick="AEG.exportOutput(\'csv\')">Export CSV</button>';
      h += '<button class="success" onclick="AEG.exportOutput(\'xlsx\')">Export XLSX</button>';
      h += '<button onclick="AEG.copyOutput()">Copy to Clipboard</button>';

      h += '</div>';
      const cols = t.outputColumns.map(c => c.name);

      cols.forEach(c => { h += '<th>' + U.esc(c) + '</th>'; });
      h += '</tr></thead><tbody>';
      AEG.output.lines.forEach(line => {
        h += '<tr>';
        cols.forEach(c => {
          const cell = line[c];
          const val = cell && typeof cell === 'object' ? (cell.value || '') : (cell || '');
          let cls = '';
          if (cell && cell._missingRC) cls = 'missing-rc';
          else if (cell && cell._missingInfo) cls = 'missing-info';
          h += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + U.esc(val) + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      h += '<div class="summary-bar">';
      h += '<div class="item">Lines: <b>' + AEG.output.lines.length + '</b></div>';
      h += '<div class="item">Total Dr: <b>' + U.fmtNum(AEG.output.totals.dr) + '</b></div>';
      h += '<div class="item">Total Cr: <b>' + U.fmtNum(AEG.output.totals.cr) + '</b></div>';
      h += '<div class="item">Diff: <b>' + U.fmtNum((AEG.output.totals.dr || 0) - (AEG.output.totals.cr || 0)) + '</b></div>';
      h += '</div>';
    }
    h += '</div>';

    el.innerHTML = h;
  },

  /* ---- AEG Generation Engine ---- */
  generateEntries() {
    const t = AEG.currentTemplate();
    if (!t) { U.toast('Select a template first', 'error'); return; }
    if (!AEG.inputData.length) { U.toast('No input data', 'error'); return; }

    const groups = [];
    if (t.aggregate && t.aggregateBy && t.aggregateBy.length) {
      const map = new Map();
      AEG.inputData.forEach(row => {
        const userKey = t.aggregateBy.map(k => String(row[k] || '')).join('||');
        const sig = AEG.computeMasterSignature(t, row);
        const key = userKey + '##' + sig;
        if (!map.has(key)) map.set(key, { keyFields: {}, rows: [] });
        const g = map.get(key);
        t.aggregateBy.forEach(k => g.keyFields[k] = row[k]);
        g.rows.push(row);
      });
      map.forEach(v => groups.push(v));
    } else {
      AEG.inputData.forEach(row => groups.push({ keyFields: { ...row }, rows: [row] }));
    }

    const lines = [];
    groups.forEach(group => {
      const rep = group.rows[0];
      const value = group.rows.reduce((s, r) => s + U.num(r[t.valueColumn]), 0);
      const exchVal = (t.exchange.mode === 'autoExchange' && t.exchange.column) ?
        group.rows.reduce((s, r) => s + U.num(r[t.exchange.column]), 0) : 0;

      if (value === 0 && exchVal === 0) return;

      const fromRef = AEG.resolveFromRef(t, rep);
      const toRef   = AEG.resolveToRef(t, rep);
      const positive = value >= 0;
      const debitSide = (t.debitOnPositive === 'to') ? (positive ? 'to' : 'from') : (positive ? 'from' : 'to');
      const absVal = Math.abs(value);

      if (t.exchange.mode === 'autoExchange' && exchVal !== 0) {
        const absExch = Math.abs(exchVal);
        const fromIsDebit = debitSide === 'from';
        const exchSetting = (t.exchange.positiveSide === 'Cr') ? 'Cr' : 'Dr';
        const exchPositive = exchVal >= 0;
        const exchIsDr = exchPositive ? (exchSetting === 'Dr') : (exchSetting === 'Cr');

        const fromContrib = fromIsDebit ? absVal  : -absVal;
        const exchContrib = exchIsDr    ? absExch : -absExch;
        const imbalance   = fromContrib + exchContrib;
        const toIsDebit   = imbalance < 0;
        const toAbs       = Math.abs(imbalance);

        lines.push(AEG.buildLine(t, rep, group, fromRef, fromIsDebit ? absVal : 0, fromIsDebit ? 0 : absVal, 'from'));
        lines.push(AEG.buildLine(t, rep, group, toRef, toIsDebit ? toAbs : 0, toIsDebit ? 0 : toAbs, 'to'));
        lines.push(AEG.buildLine(t, rep, group, t.exchange.masterRef || 'Exchange', exchIsDr ? absExch : 0, exchIsDr ? 0 : absExch, 'exchange'));
      } else {
        const fromIsDebit = debitSide === 'from';
        lines.push(AEG.buildLine(t, rep, group, fromRef, fromIsDebit ? absVal : 0, fromIsDebit ? 0 : absVal, 'from'));
        lines.push(AEG.buildLine(t, rep, group, toRef, fromIsDebit ? 0 : absVal, fromIsDebit ? absVal : 0, 'to'));
      }
    });

    let totDr = 0, totCr = 0;
    const drCol = t.outputColumns.find(c => c.mapping && c.mapping.type === 'value' && c.mapping.side === 'Dr');
    const crCol = t.outputColumns.find(c => c.mapping && c.mapping.type === 'value' && c.mapping.side === 'Cr');
    lines.forEach(l => {
      if (drCol) { const v = l[drCol.name]; totDr += U.num(v && typeof v === 'object' ? v.value : v); }
      if (crCol) { const v = l[crCol.name]; totCr += U.num(v && typeof v === 'object' ? v.value : v); }
    });

    AEG.output = { lines, totals: { dr: totDr, cr: totCr }, generatedAt: new Date().toLocaleString() };
    AEG.renderProcess();
    U.toast('Generated ' + lines.length + ' lines', 'success');
  },

  /* ---- Generator Helpers ---- */
  resolveVariables(str, template, inputRow) {
    if (str == null) return '';
    if (typeof str !== 'string') return String(str);
    if (str.indexOf('<') === -1) return str;
    return str.replace(/<([A-Za-z0-9_]+)>/g, (match, varName) => {
      const v = (template.variables || []).find(x => x.name === varName);
      if (!v) return match;
      if (v.source === 'today') {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }
      if (v.source === 'month') return String(new Date().getMonth() + 1).padStart(2,'0');
      if (v.source === 'year')  return String(new Date().getFullYear());
      if (v.source === 'fixed') return v.value || '';
      if (v.source === 'column') {
        if (!inputRow) return '';
        const val = inputRow[v.column];
        return (val == null) ? '' : String(val);
      }
      return match;
    });
  },

  computeMasterSignature(t, row) {
    const fromRef = AEG.resolveFromRef(t, row);
    const toRef   = AEG.resolveToRef(t, row);
    const fromMaster = AEG.lookupMaster(fromRef);
    const toMaster   = AEG.lookupMaster(toRef);
    const parts = ['F:' + fromRef, 'T:' + toRef];
    (t.outputColumns || []).forEach(col => {
      if (!col.mapping || col.mapping.type !== 'master') return;
      const mc = col.mapping.masterColumn;
      const fv = fromMaster ? AEG.resolveVariables(String(fromMaster[mc] || ''), t, row) : '';
      const tv = toMaster   ? AEG.resolveVariables(String(toMaster[mc] || ''), t, row) : '';
      parts.push(mc + '=F:' + fv + '|T:' + tv);
    });
    return parts.join('§');
  },

  resolveFromRef(t, row) {
    if (t.fromAccount.mode === 'select') return AEG.fromSelection || (t.fromAccount.options[0] || '');
    return String(row[t.fromAccount.inputColumn] || '');
  },

  resolveToRef(t, row) {
    if (t.toAccount.mode === 'input') return String(row[t.toAccount.inputColumn] || '');
    if (t.toAccount.mode === 'select') return AEG.toSelection || (t.toAccount.options[0] || '');
    const v = String(row[t.toAccount.inputColumn] || '').trim();
    if (v) return v;
    return AEG.toSelection || (t.toAccount.options[0] || '');
  },

  lookupMaster(ref) {
    if (!ref) return null;
    const r = String(ref).trim().toLowerCase();
    // Assuming accounts master lives in AppState.aegMaster. Adjust if named differently in Reco app.
    const masterList = AppState.aegMaster || [];
    return masterList.find(m => String(m.Reference || '').trim().toLowerCase() === r) || null;
  },

  buildLine(t, inputRow, group, accountRef, drAmt, crAmt, side) {
    const masterRow = AEG.lookupMaster(accountRef);
    const line = {};
    const userRcVal = (t.rcMode === 'any' && t.rcColumn) ? String(inputRow[t.rcColumn] || '') : '';
    const resolvedCurrency = (t.currencyMode === 'AED') ? 'AED' : String(inputRow[t.currencyColumn] || '');

    t.outputColumns.forEach(col => {
      const m = col.mapping || {};
      let val = '';
      let flag = null;

      if (m.type === 'value') {
        const v = m.side === 'Dr' ? drAmt : crAmt;
        val = (v && v !== 0) ? Number(v).toFixed(2) : '';
      } else if (m.type === 'currency') {
        val = resolvedCurrency;
      } else if (m.type === 'input') {
        const raw = inputRow[m.inputColumn];
        val = AEG.resolveVariables(raw == null ? '' : String(raw), t, inputRow);   // keep a real 0
      } else if (m.type === 'master') {
        const mc = m.masterColumn;
        if (mc === 'RC') {
          const mrc = masterRow ? String(masterRow.RC || '') : '';
          if (mrc) val = mrc;
          else if (userRcVal) val = userRcVal;
          else { val = ''; flag = 'missing-rc'; }
        } else {
          val = masterRow ? String(masterRow[mc] || '') : '';
          if (!val && masterRow == null) flag = 'missing-info';
        }
        val = AEG.resolveVariables(val, t, inputRow);
      } else if (m.type === 'custom') {
        val = AEG.resolveVariables(m.value || '', t, inputRow);
      } else if (m.type === 'side') {
        val = (side || '').toUpperCase();
      } else if (m.type === 'accountRef') {
        val = accountRef;
      }

      if (flag) {
        line[col.name] = { value: val, _missingRC: flag === 'missing-rc', _missingInfo: flag === 'missing-info' };
      } else {
        line[col.name] = val;
      }
    });

    return line;
  },

  renderTemplates() {

    h += '</span></h2>';

    AppState.aegTemplates.forEach(t => {
      h += '<tr><td><b>'+U.esc(t.name)+'</b></td>';
      h += '<td>'+U.esc(t.currencyMode)+'</td>';
      h += '<td>'+(t.aggregate?(t.aggregateBy||[]).join(', '):'—')+'</td>';
      h += '<td>';
      h += '<button class="small primary" onclick="AEG.editTemplate(\''+U.jsq(t.id)+'\')">Edit</button>';
      h += '<button class="small" onclick="AEG.duplicateTemplate(\''+U.jsq(t.id)+'\')">Dup</button>';

      h += '<button class="small danger" onclick="AEG.deleteTemplate(\''+U.jsq(t.id)+'\')">Del</button>';
      h += '</td></tr>';

  renderMaster() {
    const el = document.getElementById('aegContent');
    if (!el) return;
    let h = '<div class="panel"><h2>Accounts Master <span class="text-muted">('+AppState.aegMaster.length+')</span>';
    h += '<span>';
    h += '<input type="file" id="mFile" accept=".csv,.xlsx" style="display:none" onchange="AEG.handleMasterFile(event)" />';
    h += '<button class="small" onclick="document.getElementById(\'mFile\').click()">Upload CSV/XLSX</button>';
    h += '<button class="small" onclick="document.getElementById(\'mPasteBox\').style.display=\'block\'">Paste Data</button>';
    h += '<button class="small" onclick="AEG.addMasterRow()">+ Row</button>';
    h += '<button class="small" onclick="AEG.exportMaster()">Export</button>';
    h += '</span></h2>';
    h += '<div id="mPasteBox" style="display:none; margin-bottom:10px;">';
    h += '<textarea id="mPasteData" placeholder="Paste tab/CSV data with headers: Reference, RC, Nominal, SubNominal, Analysis Key, LOB" style="height:80px;"></textarea>';
    h += '<div style="margin-top:6px"><button class="primary small" onclick="AEG.parseMasterPaste()">Parse</button>';
    h += '<button class="small" onclick="document.getElementById(\'mPasteBox\').style.display=\'none\'">Cancel</button></div></div>';
    h += '<input type="text" placeholder="Search…" oninput="AEG.filterMaster(this.value)" style="margin-bottom:8px;max-width:280px" />';

  filterMaster(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#masterTbl tbody tr').forEach(tr => {
      const i = +tr.dataset.i;
      const m = AppState.aegMaster[i];
      const hit = !q || AEG.MASTER_FIELDS.some(f => String(m[f]||'').toLowerCase().includes(q));
      tr.style.display = hit ? '' : 'none';
    });
  },

  addMasterRow() {
    AppState.aegMaster.push({ Reference:'', RC:'', Nominal:'', SubNominal:'', AnalysisKey:'', LOB:'' });
    AppState.save(); AEG.renderMaster();
  },

  handleMasterFile(ev) {
    const file = ev.target.files[0]; if (!file) return;
    U.parseFile(file, (data) => {
      const rows = data.map(r => AEG.normalizeMasterRow(r));
      AppState.aegMaster = AppState.aegMaster.concat(rows);
      AppState.save(); AEG.renderMaster();
      U.toast('Added '+rows.length+' rows','success');
    });
    ev.target.value = '';
  },

  normalizeMasterRow(r) {
    function pick(row, names) {
      for (const n of names) { const k = Object.keys(row).find(k => String(k).trim().toLowerCase()===n.toLowerCase()); if (k!=null&&row[k]!=='') return row[k]; }
      return '';
    }
    return {
      Reference: pick(r,['Reference','Ref','Title']),
      RC: pick(r,['RC','Cost Center']),
      Nominal: pick(r,['Nominal','Account Code']),
      SubNominal: pick(r,['SubNominal','Sub Nominal']),
      AnalysisKey: pick(r,['AnalysisKey','Analysis Key']),
      LOB: pick(r,['LOB','Line of Business'])
    };
  },

  exportMaster() {
    const rows = AppState.aegMaster.map(m => { const o={}; AEG.MASTER_FIELDS.forEach(f=>o[f]=m[f]||''); return o; });
    U.download('accounts_master.csv', Papa.unparse(rows), 'text/csv');
  },

  handleInputFile(ev) {
    const file = ev.target.files[0]; if (!file) return;
    const t = AEG.currentTemplate(); if (!t) return;
    U.parseFile(file, (data, fields) => {
      const map = {};
      t.inputColumns.forEach(c => {
        const candidates = [c.name,c.label].filter(Boolean).map(s=>s.toLowerCase());
        map[c.name] = fields.find(h => candidates.includes(String(h).toLowerCase().trim())) || null;
      });
      AEG.inputData = data.map(r => {
        const o = {};
        t.inputColumns.forEach(c => { const v = map[c.name] ? r[map[c.name]] : ''; o[c.name] = v == null ? '' : v; });
        return o;
      });
      AEG.output = { lines:[], generatedAt:null };
      AEG.renderProcess();
      U.toast('Loaded '+data.length+' rows','success');
    });
    ev.target.value = '';
  },

  parseInputPaste() {
    const txt = (document.getElementById('aegInputPasteData')?.value || '').trim();
    if (!txt) return;
    const t = AEG.currentTemplate(); if (!t) return;
    const { data, fields } = U.parsePaste(txt);
    const map = {};
    t.inputColumns.forEach(c => {
      const candidates = [c.name, c.label].filter(Boolean).map(s => s.toLowerCase());
      map[c.name] = fields.find(h => candidates.includes(String(h).toLowerCase().trim())) || null;
    });
    AEG.inputData = AEG.inputData.concat(data.map(r => {
      const o = {};
      t.inputColumns.forEach(c => { const v = map[c.name] ? r[map[c.name]] : ''; o[c.name] = v == null ? '' : v; });
      return o;
    }));
    AEG.output = { lines:[], generatedAt:null };
    document.getElementById('aegInputPasteBox').style.display = 'none';
    AEG.renderProcess();
    U.toast('Parsed '+data.length+' rows','success');
  },

  parseMasterPaste() {
    const txt = (document.getElementById('mPasteData')?.value || '').trim();
    if (!txt) return;
    const { data } = U.parsePaste(txt);
    const rows = data.map(r => AEG.normalizeMasterRow(r));
    AppState.aegMaster = AppState.aegMaster.concat(rows);
    AppState.save();
    document.getElementById('mPasteBox').style.display = 'none';
    AEG.renderMaster();
    U.toast('Added '+rows.length+' rows','success');
  },

  addInputRow() {
    const t = AEG.currentTemplate(); if (!t) return;
    const blank = {}; t.inputColumns.forEach(c => blank[c.name]='');
    AEG.inputData.push(blank);
    AEG.renderProcess();
  },

  exportOutput(kind) {
    const t = AEG.currentTemplate(); if (!t) return;
    const cols = t.outputColumns.map(c=>c.name);
    const rows = AEG.output.lines.map(l => { const r={}; cols.forEach(c => { const cell=l[c]; r[c]=cell&&typeof cell==='object'?(cell.value||''):(cell||''); }); return r; });
    const name = 'entries_' + Versioning._safe(t.name) + '_' + U.todayStr();
    if (kind==='csv') U.download(name+'.csv', Papa.unparse(rows,{columns:cols}), 'text/csv');
    else {
      const ws = XLSX.utils.json_to_sheet(rows,{header:cols});
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Entries');
      U.downloadWorkbook(wb, name+'.xlsx');
    }
  },

  copyOutput() {
    const t = AEG.currentTemplate(); 
    if (!t) return;
    
    const cols = t.outputColumns.map(c => c.name);
    const lines = [cols.join('\t')];
    
    AEG.output.lines.forEach(l => {
      lines.push(cols.map(c => {
        const cell = l[c];
        // Unwrap the cell value just like we do in exportOutput
        return cell && typeof cell === 'object' ? (cell.value || '') : (cell || '');
      }).join('\t'));
    });
    
    const txt = lines.join('\n');
    navigator.clipboard.writeText(txt).then(
      () => U.toast('Copied to clipboard', 'success'),
      () => U.toast('Copy failed', 'error')
    );
  },

  newTemplate() {
    AEG.editingTemplate = AEG.makeDefaultTemplate('New Template');
    AEG.editingIsNew = true;
    AEG.openEditor();
  },

  editTemplate(id) {
    const t = AppState.aegTemplates.find(x=>x.id===id);
    if (!t) return;
    AEG.editingTemplate = JSON.parse(JSON.stringify(t));
    AEG.editingIsNew = false;
    AEG.openEditor();
  },

  duplicateTemplate(id) {
    const t = AppState.aegTemplates.find(x=>x.id===id);
    if (!t) return;
    const copy = JSON.parse(JSON.stringify(t));
    copy.id = U.uid(); copy.name = t.name+' (copy)';
    AppState.aegTemplates.push(copy);
    AppState.save(); AEG.renderTemplates();
  },

  exportTemplate(id) {
    const t = AppState.aegTemplates.find(x => x.id === id);
    if (!t) return;

    U.download(Versioning._safe(t.name || 'template') + '.json', JSON.stringify(t, null, 2), 'application/json');
  },

  importTemplate(ev) {
    const file = ev.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const t = JSON.parse(e.target.result);

        // Validation
        if (!t.outputColumns) {
          alert('Invalid template JSON');
          return;
        }

        // 1. Generate ID using your existing helper U.uid()
        // This matches your duplicateTemplate logic
        t.id = U.uid(); 
        delete t._spId;

        // 2. Update the templates array
        AppState.aegTemplates.push(t);

        // 3. Use your existing save/render helpers
        // Since duplicateTemplate uses these, we know they work
        AppState.save(); 
        AEG.renderTemplates();
      
        alert('Imported: ' + (t.name || 'Untitled'));
      } catch (err) {
        console.error(err);
        alert('Error: Could not parse the file.');
      }
    };

    reader.readAsText(file);
    ev.target.value = ''; // Clear the input so you can re-import the same file if needed
  },


  deleteTemplate(id) {
    if (!confirm('Delete?')) return;
    AppState.aegTemplates = AppState.aegTemplates.filter(x=>x.id!==id);
    if (AEG.currentTemplateId===id) AEG.currentTemplateId=null;
    AppState.save(); AEG.renderTemplates();
  },

  // 3. Save Function
  saveEditingTemplate() {
    const t = AEG.editingTemplate;
    if (!t.name || !t.name.trim()) { U.toast('Name required', 'error'); return; }
    
    if (AEG.editingIsNew) {
      AppState.aegTemplates.push(t);
    } else {
      const i = AppState.aegTemplates.findIndex(x => x.id === t.id);
      if (i !== -1) AppState.aegTemplates[i] = t;
    }

    // Trigger the bridge
    AppState.save(); 
    
    App.closeModal();
    AEG.renderTemplates();
    U.toast('AEG Template saved', 'success');
  },

  // 4. UI Helpers
  selectInputCol(t, key, current) {
    return '<select onchange="AEG.editingTemplate.' + key + '=this.value">' +
      '<option value="">— select —</option>' +
      (t.inputColumns || []).map(c => '<option value="' + U.escAttr(c.name) + '"' +
        (current === c.name ? ' selected' : '') + '>' + U.esc(c.label) + '</option>').join('') + '</select>';
  },
  selectInputColPath(t, path, current, allowBlank) {
    return '<select onchange="AEG.setEditingPath(\'' + path + '\', this.value)">' +
      (allowBlank ? '<option value="">—</option>' : '<option value="">— select —</option>') +
      (t.inputColumns || []).map(c => '<option value="' + U.escAttr(c.name) + '"' +
        (current === c.name ? ' selected' : '') + '>' + U.esc(c.label) + '</option>').join('') + '</select>';
  },
  setEditingPath(path, value) {
    const parts = path.split('.');
    let o = AEG.editingTemplate;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  },
  outputMappingControl(t, col, i) {
    const m = col.mapping;
    if (m.type === 'input') return AEG.selectMapping(t, i, 'inputColumn', m.inputColumn);
    if (m.type === 'master') {
      const displayMap = { Reference: 'Reference', RC: 'RC', Nominal: 'Nominal', SubNominal: 'SubNominal', AnalysisKey: 'Analysis Key', LOB: 'LOB' };
      // Fallback to AEG.MASTER_FIELDS if it exists in your app, otherwise hardcode
      const fields = (AEG.MASTER_FIELDS && AEG.MASTER_FIELDS.length) ? AEG.MASTER_FIELDS : ['Reference', 'RC', 'Nominal', 'SubNominal', 'AnalysisKey', 'LOB'];
      return '<select onchange="AEG.updateOutputMapping(' + i + ',\'masterColumn\',this.value)">' +
        fields.map(f => '<option value="' + f + '"' + (m.masterColumn === f ? ' selected' : '') + '>' + U.esc(displayMap[f] || f) + '</option>').join('') + '</select>';
    }
    if (m.type === 'custom') {
      return '<input type="text" placeholder="Z&lt;CUR&gt;" value="' + U.escAttr(m.value || '') + '" oninput="AEG.updateOutputMapping(' + i + ',\'value\',this.value)" />';
    }
    if (m.type === 'value') {
      return '<select onchange="AEG.updateOutputMapping(' + i + ',\'side\',this.value)">' +
        ['Dr','Cr'].map(s => '<option value="' + s + '"' + (m.side === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>';
    }
    return '<span class="text-muted">— auto —</span>';
  },
  selectMapping(t, i, key, current) {
    return '<select onchange="AEG.updateOutputMapping(' + i + ',\'' + key + '\',this.value)">' +
      '<option value="">— select —</option>' +
      (t.inputColumns || []).map(c => '<option value="' + U.escAttr(c.name) + '"' +
        (current === c.name ? ' selected' : '') + '>' + U.esc(c.label) + '</option>').join('') + '</select>';
  },

  // 5. Mutator Functions
  updateInputCol(i, key, val) { AEG.editingTemplate.inputColumns[i][key] = val; },
  addInputCol() { 
    const n = 'col' + (AEG.editingTemplate.inputColumns.length + 1); 
    AEG.editingTemplate.inputColumns.push({ name: n, label: n }); 
    AEG.openEditor(); 
  },
  removeInputCol(i) { AEG.editingTemplate.inputColumns.splice(i, 1); AEG.openEditor(); },
  addVariable() {
    AEG.editingTemplate.variables = AEG.editingTemplate.variables || [];
    AEG.editingTemplate.variables.push({ name: 'VAR' + (AEG.editingTemplate.variables.length + 1), source: 'fixed', value: '' });
    AEG.openEditor();
  },
  updateVariable(i, key, val) {
    AEG.editingTemplate.variables[i][key] = val;
    if (key === 'source') AEG.openEditor();
  },
  removeVariable(i) { AEG.editingTemplate.variables.splice(i, 1); AEG.openEditor(); },
  toggleAggregateBy(name, checked) {
    const t = AEG.editingTemplate;
    t.aggregateBy = t.aggregateBy || [];
    if (checked) { if (t.aggregateBy.indexOf(name) === -1) t.aggregateBy.push(name); }
    else t.aggregateBy = t.aggregateBy.filter(x => x !== name);
  },
  addOutputCol() {
    AEG.editingTemplate.outputColumns.push({ name: 'NewCol', mapping: { type: 'custom', value: '' } });
    AEG.openEditor();
  },
  removeOutputCol(i) { AEG.editingTemplate.outputColumns.splice(i, 1); AEG.openEditor(); },
  updateOutputCol(i, key, val) { AEG.editingTemplate.outputColumns[i][key] = val; },
  changeOutputType(i, type) {
    const c = AEG.editingTemplate.outputColumns[i];
    c.mapping = { type };
    if (type === 'master') c.mapping.masterColumn = 'Reference';
    if (type === 'value')  c.mapping.side = 'Dr';
    if (type === 'input')  c.mapping.inputColumn = '';
    if (type === 'custom') c.mapping.value = '';
    AEG.openEditor();
  },
  updateOutputMapping(i, key, val) { AEG.editingTemplate.outputColumns[i].mapping[key] = val; },
  moveOutputCol(i, dir) {
    const arr = AEG.editingTemplate.outputColumns;
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    AEG.openEditor();
  }
};


/* ================================================================
   BOOT
   ================================================================ */
let _bootStarted = false;
async function bootApp() {
  if (_bootStarted) return;          // pywebviewready and the fallback timer can both fire
  _bootStarted = true;
  try { await AppState.load(); }
  catch(e) { console.error('AppState.load failed', e); }
  try { await SpecialJV.load(); }
  catch(e) { console.error('SpecialJV.load failed', e); }
  populateThemeSelect();
  App._wireRecoHotkeys();
  App.navigate('home');
  if (Store.loadProblems.length) {
    App.openModal('Some files could not be loaded',
      '<div class="help">Reco started, but:</div><ul>' + Store.loadProblems.map(p => '<li>' + U.esc(p) + '</li>').join('') + '</ul>',
      '<button class="primary" onclick="App.closeModal()">OK</button>');
  }
}

// Give the launcher a way to flush before the window closes, and flush on unload.
window.__hubPendingWrites = () => (typeof AppState !== 'undefined' ? AppState.pendingCount() : 0);
window.__hubFlush = () => AppState.flush();
window.addEventListener('pagehide', () => { if (_bootStarted) AppState.flush(); });

// Inside pywebview
window.addEventListener('pywebviewready', bootApp);

// pywebview may finish injecting the bridge before this listener exists, so
// also poll for it; with no pywebview at all, boot in browser mode (localStorage).
(function waitForBridge(n) {
  if (_bootStarted) return;
  const api = window.pywebview && window.pywebview.api;
  if (api && typeof api.read_file === 'function') return bootApp();
  if (!window.pywebview && n <= 90) {
    console.warn('Pywebview not detected. Booting in local browser mode.');
    return bootApp();
  }
  if (n <= 0) return bootApp();
  setTimeout(() => waitForBridge(n - 1), 100);
})(100);

</script>
