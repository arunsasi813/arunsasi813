        });
        h += '<div style="display:flex; gap:4px; margin-top:8px;">';
        h += '<select onchange="if(this.value) { RecoTemplate.toggleReportCol('+ri+',this.value,true); this.value=\'\'; RecoTemplate.renderEditor(); }" style="max-width:240px;">';
        h += '<option value="">+ Add Column</option>';
        cols.forEach(c => { if(!(rpt.columns||[]).includes(c.name)) h += '<option value="'+U.escAttr(c.name)+'">'+U.esc(c.label||c.name)+'</option>'; });
        (t.additionalColumns||[]).forEach(ac => { if(!(rpt.columns||[]).includes(ac.name)) h += '<option value="'+U.escAttr(ac.name)+'">'+U.esc(ac.name)+' (extra)</option>'; });
        h += '</select>';
        h += '</div></div>';

        // Filters
        h += '<div class="help" style="margin-top:6px;">Filters (logic: <select onchange="RecoTemplate._editing.reports['+ri+'].logic=this.value"><option value="AND"'+((rpt.logic||'AND')==='AND'?' selected':'')+'>AND</option><option value="OR"'+(rpt.logic==='OR'?' selected':'')+'>OR</option></select>)</div>';
        (rpt.filters||[]).forEach((f, fi) => {
          h += RecoTemplate._renderReportFilter(t, ri, fi, f);
        });
        h += '<button class="small" onclick="RecoTemplate.addReportFilter('+ri+')">+ Add Filter</button>';
        
        // Sort
        h += '<div class="grid-2" style="margin-top:8px;">';
        h += '<label class="field"><span class="label-text">Sort Column</span><select onchange="RecoTemplate._editing.reports['+ri+'].sortCol=this.value"><option value="">—</option>';
        cols.forEach(c => { h += '<option value="'+U.escAttr(c.name)+'"'+(rpt.sortCol===c.name?' selected':'')+'>'+U.esc(c.label||c.name)+'</option>'; });
        (rpt.computedCols||[]).forEach(cc => { h += '<option value="'+U.escAttr(cc.name)+'"'+(rpt.sortCol===cc.name?' selected':'')+'>'+U.esc(cc.name)+' (Computed)</option>'; });
        h += '</select></label>';
        h += '<label class="field"><span class="label-text">Sort Direction</span><select onchange="RecoTemplate._editing.reports['+ri+'].sortDir=this.value"><option value="asc"'+(rpt.sortDir==='asc'?' selected':'')+'>Ascending</option><option value="desc"'+(rpt.sortDir==='desc'?' selected':'')+'>Descending</option></select></label>';
        h += '</div>';

        // Computed columns (formulas)
        h += '<div class="help" style="margin-top:6px;">Computed columns (formulas):</div>';
        (rpt.computedCols||[]).forEach((cc, cci) => {
          h += '<div style="display:flex;gap:4px;margin-bottom:4px;">';
          h += '<input type="text" value="'+U.escAttr(cc.name)+'" placeholder="Name" oninput="RecoTemplate._editing.reports['+ri+'].computedCols['+cci+'].name=this.value" style="flex:1;max-width:120px;" />';
          h += '<input type="text" value="'+U.escAttr(cc.formula||'')+'" placeholder="MONTH({Date},\'MMM-YY\') or AGEING({Date})" oninput="RecoTemplate._editing.reports['+ri+'].computedCols['+cci+'].formula=this.value" style="flex:2;" />';
          h += '<button class="small danger" onclick="RecoTemplate._editing.reports['+ri+'].computedCols.splice('+cci+',1); RecoTemplate.renderEditor()">×</button>';
          h += '</div>';
        });
        h += '<button class="small" onclick="RecoTemplate._editing.reports['+ri+'].computedCols=RecoTemplate._editing.reports['+ri+'].computedCols||[]; RecoTemplate._editing.reports['+ri+'].computedCols.push({name:\'Calc\',formula:\'\'}); RecoTemplate.renderEditor()">+ Computed Column</button>';
        h += '</div>';
      });
    } else {
      h += '<div class="empty">No custom reports yet. Click <b>+ Add Report</b> to define one.</div>';
    }
    h += '</div>';

    return h;
  },
  _renderReportFilter(t, ri, fi, f) {
    const cols = t.columns;
    const rpt = RecoTemplate._editing.reports[ri];
    let h = '<div style="display:flex; gap:4px; margin-bottom:4px; flex-wrap:wrap;">';
    h += '<select onchange="RecoTemplate._editing.reports['+ri+'].filters['+fi+'].col=this.value; RecoTemplate.renderEditor()" style="flex:1; min-width:120px;">';
    h += '<option value="">— column —</option>';
    h += '<option value="_status"'+(f.col==='_status'?' selected':'')+'>Status (open/offset)</option>';
    cols.forEach(c => { h += '<option value="'+U.escAttr(c.name)+'"'+(f.col===c.name?' selected':'')+'>'+U.esc(c.label||c.name)+'</option>'; });
    (t.additionalColumns||[]).forEach(ac => { h += '<option value="'+U.escAttr(ac.name)+'"'+(f.col===ac.name?' selected':'')+'>'+U.esc(ac.name)+' (extra)</option>'; });
    (rpt.computedCols||[]).forEach(cc => { h += '<option value="'+U.escAttr(cc.name)+'"'+(f.col===cc.name?' selected':'')+'>'+U.esc(cc.name)+' (Computed)</option>'; });
    h += '</select>';
    h += '<select onchange="RecoTemplate._editing.reports['+ri+'].filters['+fi+'].op=this.value; RecoTemplate.renderEditor()" style="min-width:130px;">';
    FilterOps.list.forEach(o => { h += '<option value="'+o.op+'"'+(f.op===o.op?' selected':'')+'>'+o.label+'</option>'; });
    h += '</select>';
    if (FilterOps.needsValue(f.op)) {
      h += '<input type="text" value="'+U.escAttr(f.val||'')+'" placeholder="value" oninput="RecoTemplate._editing.reports['+ri+'].filters['+fi+'].val=this.value" style="flex:1; min-width:90px;" />';
    }
    if (FilterOps.needsSecondValue(f.op)) {
      h += '<input type="text" value="'+U.escAttr(f.val2||'')+'" placeholder="and" oninput="RecoTemplate._editing.reports['+ri+'].filters['+fi+'].val2=this.value" style="flex:1; min-width:90px;" />';
    }
    h += '<button class="small danger" onclick="RecoTemplate._editing.reports['+ri+'].filters.splice('+fi+',1); RecoTemplate.renderEditor()">×</button>';
    h += '</div>';
    return h;
  },

  /* ---------- Step 5: Review ---------- */
  renderStep5(t) {
    let h = '<h3>Review Template</h3>';
    h += '<table><tbody>';
    h += '<tr><th>Name</th><td>'+U.esc(t.name)+'</td></tr>';
    h += '<tr><th>Columns</th><td>'+t.columns.map(c=>'<span class="tag">'+U.esc(c.label||c.name)+(c.isDate?' 📅':'')+'</span>').join('')+'</td></tr>';
    h += '<tr><th>Primary Keys</th><td>'+(t.primaryKeys.length?t.primaryKeys.map(k=>'<span class="tag">'+U.esc(k)+'</span>').join(''):'None')+'</td></tr>';
    h += '<tr><th>Currency</th><td>'+U.esc(t.currencyMode)+'</td></tr>';
    h += '<tr><th>Value Column</th><td>'+U.esc(t.valueColumn)+'</td></tr>';
    h += '<tr><th>Doc# Column</th><td>'+U.esc(t.docNumberColumn||'—')+'</td></tr>';
    h += '<tr><th>Aggregate</th><td>'+(t.aggregate?(t.aggregateBy||[]).join(', '):'No')+'</td></tr>';
    h += '<tr><th>Tolerance</th><td>'+t.toleranceValue+' ('+t.toleranceMode+')</td></tr>';
    h += '<tr><th>Reco Account</th><td>'+U.esc(t.recoAccountRef)+'</td></tr>';
    h += '<tr><th>Reporting</th><td>'+(t.enableReporting?'Enabled ('+(t.reports||[]).length+' custom report'+((t.reports||[]).length===1?'':'s')+')':'Disabled')+'</td></tr>';
    h += '<tr><th>Corrections</th><td>'+(t.enableCorrections?'Enabled':'Disabled')+'</td></tr>';
    h += '<tr><th>Groups</th><td>'+(t.groupsEnabled?'Enabled':'Disabled')+'</td></tr>';
    h += '<tr><th>Pivot</th><td>'+(t.pivotEnabled?'Enabled':'Disabled')+'</td></tr>';
    h += '<tr><th>AEG Integration</th><td>'+(t.aegIntegration.enabled?'Enabled (via '+(AppState.aegTemplates.find(x=>x.id===t.aegIntegration.aegTemplateId)?.name||'?')+')':'Disabled')+'</td></tr>';
    h += '<tr><th>Display Cols</th><td>'+(t.displayColumns||[]).map(c=>'<span class="tag">'+U.esc(c)+'</span>').join('')+'</td></tr>';
    h += '<tr><th>Additional Cols</th><td>'+(t.additionalColumns||[]).map(ac=>'<span class="tag">'+U.esc(ac.name)+' ('+U.esc(ac.type)+')</span>').join('')+'</td></tr>';
    h += '</tbody></table>';
    return h;
  },

  /* ---------- Helpers / mutators ---------- */
  colSelect(key, current) {
    const cols = RecoTemplate._editing.columns;
    let h = '<select onchange="RecoTemplate._editing.'+key+'=this.value">';
    h += '<option value="">— select —</option>';
    cols.forEach(c => { h += '<option value="'+U.escAttr(c.name)+'"'+(current===c.name?' selected':'')+'>'+U.esc(c.label||c.name)+'</option>'; });
    h += '</select>';
    return h;
  },
  togglePK(name, checked) {
    const t = RecoTemplate._editing;
    t.primaryKeys = t.primaryKeys || [];
    if (checked) { if (!t.primaryKeys.includes(name)) t.primaryKeys.push(name); }
    else t.primaryKeys = t.primaryKeys.filter(x=>x!==name);
  },
  toggleAggBy(name, checked) {
    const t = RecoTemplate._editing;
    t.aggregateBy = t.aggregateBy || [];
    if (checked) { if (!t.aggregateBy.includes(name)) t.aggregateBy.push(name); }
    else t.aggregateBy = t.aggregateBy.filter(x=>x!==name);
  },
  toggleDisplay(name, checked) {
    const t = RecoTemplate._editing;
    t.displayColumns = t.displayColumns || [];
    if (checked) { if (!t.displayColumns.includes(name)) t.displayColumns.push(name); }
    else t.displayColumns = t.displayColumns.filter(x=>x!==name);
  },
  toggleEditable(name, checked) {
    const t = RecoTemplate._editing;
    t.editableColumns = t.editableColumns || [];
    if (checked) { if (!t.editableColumns.includes(name)) t.editableColumns.push(name); }
    else t.editableColumns = t.editableColumns.filter(x=>x!==name);
  },
  toggleAllEditable(all) {
    const t = RecoTemplate._editing;
    t.editableColumns = all ? t.columns.map(c => c.name) : [];
  },
  toggleAllDisplay(all) {
    const t = RecoTemplate._editing;
    t.displayColumns = all ? t.columns.map(c => c.name) : [];
  },
  toggleArr(arrKey, name, checked) {
    const t = RecoTemplate._editing;
    t[arrKey] = t[arrKey] || [];
    if (checked) { if (!t[arrKey].includes(name)) t[arrKey].push(name); }
    else t[arrKey] = t[arrKey].filter(x=>x!==name);
  },
  addCol() {
    const name = 'Column' + (RecoTemplate._editing.columns.length+1);
    RecoTemplate._editing.columns.push({ name, label: name, formats: [], isValue: false, isDate: false });
    RecoTemplate.renderEditor();
  },
  addExtraCol() {
    RecoTemplate._editing.additionalColumns = RecoTemplate._editing.additionalColumns || [];
    RecoTemplate._editing.additionalColumns.push({ name: 'Extra', type: 'custom', options: [], formula: '', masterRefColumn: '', masterValueColumn: '' });
    RecoTemplate.renderEditor();
  },
  addReport() {
    RecoTemplate._editing.reports = RecoTemplate._editing.reports || [];
    RecoTemplate._editing.reports.push({ 
      id: U.uid(), 
      name: 'Report ' + (RecoTemplate._editing.reports.length+1), 
      columns: [], filters: [], logic: 'AND', sortCol: '', sortDir: 'asc', computedCols: [],
      showHeader: true, showTotalRow: false, summaryCards: [], dateFormats: {} 
    });
    RecoTemplate.renderEditor();
  },
  moveReportCol(ri, ci, dir) {
    const r = RecoTemplate._editing.reports[ri];
    const arr = r.columns;
    if (!arr) return;
    const j = ci + dir;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[ci]; arr[ci] = arr[j]; arr[j] = tmp;
    RecoTemplate.renderEditor();
  },
  updateReportDateFormat(ri, colName, fmt) {
    const r = RecoTemplate._editing.reports[ri];
    r.dateFormats = r.dateFormats || {};
    r.dateFormats[colName] = fmt;
  },
  toggleReportCol(ri, name, checked) {
    const r = RecoTemplate._editing.reports[ri];
    r.columns = r.columns || [];
    if (checked) { if (!r.columns.includes(name)) r.columns.push(name); }
    else r.columns = r.columns.filter(x => x !== name);
  },
  addReportFilter(ri) {
    const r = RecoTemplate._editing.reports[ri];
    r.filters = r.filters || [];
    r.filters.push({ col: '', op: 'contains', val: '', val2: '' });
    RecoTemplate.renderEditor();
  },
  showPaste() {
    setTimeout(() => { const el = document.getElementById('rtPasteBox'); if(el) el.style.display='block'; }, 50);
  },
  loadSample(ev) {
    const file = ev.target.files[0]; if (!file) return;
    U.parseFile(file, (data, fields) => {
      RecoTemplate._sampleHeaders = fields;
      RecoTemplate._editing.columns = fields.map(f => ({ name: f, label: f, formats: [], isValue: false, isDate: false }));
      if (!RecoTemplate._editing.displayColumns.length) RecoTemplate._editing.displayColumns = fields.slice();
      RecoTemplate.renderEditor();
      U.toast('Detected '+fields.length+' columns','success');
    });
    ev.target.value = '';
  },
  parsePaste() {
    const txt = document.getElementById('rtPasteData')?.value?.trim();
    if (!txt) return;
    const { data, fields } = U.parsePaste(txt);
    RecoTemplate._sampleHeaders = fields;
    RecoTemplate._editing.columns = fields.map(f => ({ name: f, label: f, formats: [], isValue: false, isDate: false }));
    if (!RecoTemplate._editing.displayColumns.length) RecoTemplate._editing.displayColumns = fields.slice();
    RecoTemplate.renderEditor();
    U.toast('Detected '+fields.length+' columns','success');
  },
  /* reco_data/<folder> for a new template: from its name, never shared with another template. */
  _uniqueDataFolder(name, exceptId) {
    const taken = new Set(AppState.recoTemplates.filter(x => x.id !== exceptId).map(x => Versioning.folderFor(x)));
    const base = Versioning._safe(name) || 'template';
    let f = base, n = 2;
    while (taken.has(f)) f = (base.slice(0, 55) + '_' + n++);
    return f;
  },

  saveTemplate() {
    const t = RecoTemplate._editing;
    if (!t.name?.trim()) { U.toast('Name is required','error'); return; }
    if (!t.columns.length) { U.toast('Define at least one column','error'); return; }
    t.columns.forEach(c => { c.name = String(c.name || '').trim(); });
    if (t.columns.some(c => !c.name)) { U.toast('Every column needs a name','error'); return; }
    const names = t.columns.map(c => c.name);
    const dup = names.find((n, i) => names.indexOf(n) !== i);
    if (dup) { U.toast('Column "' + dup + '" is defined twice','error'); return; }
    // Drop references to columns that no longer exist
    t.primaryKeys = (t.primaryKeys || []).filter(k => names.includes(k));
    
    // Ensure display columns exist
    if (!t.displayColumns.length) t.displayColumns = t.columns.map(c=>c.name);

    if (RecoTemplate._isNew) {
      t.dataFolder = RecoTemplate._uniqueDataFolder(t.name, t.id);
      AppState.recoTemplates.push(t);
    } else {
      const i = AppState.recoTemplates.findIndex(x=>x.id===t.id);
      const orig = i !== -1 ? AppState.recoTemplates[i] : null;
      // Keep the history folder the template already uses, even when it is renamed.
      if (!t.dataFolder) t.dataFolder = Versioning.folderFor(orig || t);
      if (orig && (orig.primaryKeys || []).length && JSON.stringify(orig.primaryKeys) !== JSON.stringify(t.primaryKeys || [])) {
        if (!confirm('You changed the primary key columns.\n\nRows saved before this change will no longer match their version history, manual offsets, corrections, groups and comments (they are keyed by the old primary key). Continue?')) return;
      }
      if (i!==-1) AppState.recoTemplates[i] = t;
    }

    // --- THE CRITICAL FIX ---
    // This triggers the bridge we set up in Module 3/4 
    // which flattens the data and sends it to Python.
    AppState.save(); 

    App.closeModal();
    App.navigate('home');
    U.toast('Template saved to database','success');
  }
};

/* ================================================================
   MODULE 8 — RECONCILIATION ENGINE
   Full-height shell for Reco page; preserves manual offsets across
   re-calculation; integrates AEG; supports document number scan.
   ================================================================ */
const Reco = {
  // Add this state tracker at the top level of your Reco object
// 1. The state tracker
  _dragState: { isDragging: false, mode: 'select' },

  // 2. Start Drag
  startDragSelect(e, rowId) {
    // Right-click and middle-click handled elsewhere
    if (e.button !== 0) return;
    // Ignore if clicking a button or input
    if (['INPUT', 'SELECT', 'BUTTON'].includes(e.target.tagName)) return;

    const id = AppState.activeRecoId;
    const sess = AppState.recoSessions[id];
    if (!sess) return;
    
    if (sess.spreadsheetMode) return;
    
    sess.selectedRows = sess.selectedRows || {};
    const isCurrentlySelected = !!sess.selectedRows[rowId];

    if (e.ctrlKey || e.metaKey) {
      Reco._dragState.mode = isCurrentlySelected ? 'deselect' : 'select';
      if (isCurrentlySelected) delete sess.selectedRows[rowId];
      else sess.selectedRows[rowId] = true;
    } else {
      sess.selectedRows = {};
      sess.selectedRows[rowId] = true;
      Reco._dragState.mode = 'select';
    }

    Reco._dragState.isDragging = true;
    Reco._updateVisualRow(e.currentTarget, Reco._dragState.mode === 'select');

    // Attach global mouseup listener pointing explicitly to Reco
    document.addEventListener('mouseup', Reco.endDragSelect, { once: true });
  },
_xlUpdateTable(worksheet, cell, col, row, value /*, label, cellName */) {
  // col = x index, row = y index, cell = the <td> element
  if (!Reco._xlRows || !Reco._xlCols) return;
  const r = Reco._xlRows[row];
  if (!r) return;
  const id   = AppState.activeRecoId;
  const sess = AppState.recoSessions[id];
  const tpl  = AppState.recoTemplates.find(x => x.id === id);
  if (!sess || !tpl) return;

  // Status column (x = 0): rich badges
  if (col === 0) {
    cell.innerHTML = Reco._xlStatusBadgeHtml ? Reco._xlStatusBadgeHtml(r, sess, tpl)
      : (sess.offsets[r._id] ? 'Offset' : 'Open');
    cell.style.whiteSpace = 'nowrap';
    return;
  }

  // Data columns: format-error / corrected / offset coloring
  const colName = Reco._xlCols[col];
  if (!colName) return;
  const colDef = tpl.columns.find(c => c.name === colName);
  cell.classList.remove('jss-err', 'jss-corr', 'jss-row-offset');
  if (r['_corrected_' + colName]) {
    cell.classList.add('jss-corr');
  } else if (colDef && colDef.formats && colDef.formats.length && !FMT.validate(r[colName], colDef.formats)) {
    cell.classList.add('jss-err');
  }
  if (sess.offsets && sess.offsets[r._id]) cell.classList.add('jss-row-offset');
},

_xlGetSelectedRange() {
  // Returns { minX, maxX, minY, maxY } or null
  const ws = Reco._xlWorksheet; if (!ws) return null;
  const sel = ws.getSelected && ws.getSelected();
  if (!sel || !sel.length) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  sel.forEach(s => {
    const x = s.x != null ? s.x : (Array.isArray(s) ? s[0] : 0);
    const y = s.y != null ? s.y : (Array.isArray(s) ? s[1] : 0);
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  return isFinite(minX) ? { minX, maxX, minY, maxY } : null;
},

_xlAct(name) {
  const ws = Reco._xlWorksheet; if (!ws) return;
  try {
    if (name === 'undo' && ws.undo) ws.undo();
    else if (name === 'redo' && ws.redo) ws.redo();
  } catch(e) { console.error('xl act', e); }
},

_xlStyle(prop, value) {
  const ws = Reco._xlWorksheet; if (!ws) return;
  const r = Reco._xlGetSelectedRange(); if (!r) { U.toast('Select cells first', 'error'); return; }
  for (let y = r.minY; y <= r.maxY; y++) {
    for (let x = r.minX; x <= r.maxX; x++) {
      try {
        const cur = ws.getStyle ? (ws.getStyle([x, y]) || '') : '';
        // Toggle if already applied with same value
        const re = new RegExp(prop + '\\s*:\\s*' + value, 'i');
        if (re.test(cur)) ws.setStyle([x, y], prop + ': ; ');
        else ws.setStyle([x, y], prop + ': ' + value + ';');
      } catch(e) {}
    }
  }
},

_xlClearFormat() {
  const ws = Reco._xlWorksheet; if (!ws) return;
  const r = Reco._xlGetSelectedRange(); if (!r) { U.toast('Select cells first', 'error'); return; }
  for (let y = r.minY; y <= r.maxY; y++) {
    for (let x = r.minX; x <= r.maxX; x++) {
      try { ws.resetStyle && ws.resetStyle([x, y]); } catch(e) {}
    }
  }
  U.toast('Cleared formatting', 'success');
},

_xlOpenPalette(e, prop) {
  document.querySelectorAll('.xl-palette').forEach(p => p.remove());
  const fillColors = ['', '#fee2e2','#fed7aa','#fef3c7','#d1fae5','#cffafe','#dbeafe','#ede9fe','#fce7f3','#f3f4f6'];
  const textColors = ['', '#b91c1c','#c2410c','#a16207','#15803d','#0e7490','#1d4ed8','#6d28d9','#be185d','#000000'];
  const colors = prop === 'color' ? textColors : fillColors;
  const palette = document.createElement('div');
  palette.className = 'xl-palette';
  colors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'sw' + (c ? '' : ' none');
    sw.style.background = c || 'transparent';
    sw.title = c || (prop === 'color' ? 'Default text' : 'No fill');
    sw.onclick = () => { Reco._xlStyle(prop, c); palette.remove(); };
    palette.appendChild(sw);
  });
  document.body.appendChild(palette);
  const r = e.target.getBoundingClientRect();
  palette.style.left = Math.min(r.left, window.innerWidth - 190) + 'px';
  palette.style.top  = (r.bottom + 6) + 'px';
  setTimeout(() => {
    const close = ev => { if (!palette.contains(ev.target) && ev.target !== e.target) { palette.remove(); document.removeEventListener('click', close); } };
    document.addEventListener('click', close);
  }, 0);
},

_xlNumFmt(fmt) {
  // Apply the same number format the Phase 4 toolbar offered, but write it to JSS as a cell style + formatted display value.
  const ws = Reco._xlWorksheet; if (!ws || !fmt) return;
  const r = Reco._xlGetSelectedRange(); if (!r) { U.toast('Select cells first', 'error'); return; }
  for (let y = r.minY; y <= r.maxY; y++) {
    for (let x = r.minX; x <= r.maxX; x++) {
      const row = Reco._xlRows[y]; if (!row) continue;
      const col = Reco._xlCols[x]; if (!col || col === '_status_') continue;
      // Get current raw value, apply format, set back as displayed value via setValue
      const raw = row[col];
      const formatted = (Reco._ssApplyNumFmt ? Reco._ssApplyNumFmt(raw, fmt) : raw);
      // Display only: the stored value stays numeric (no edit / version row).
      Reco._xlSuppressChange = true;
      try { ws.setValue([x, y], formatted, true); } catch(e) {}
      finally { Reco._xlSuppressChange = false; }
      // Cell-level alignment hint based on type
      if (['number','number0','currency','accounting','percent'].indexOf(fmt) !== -1) {
        try { ws.setStyle([x, y], 'text-align: right; font-variant-numeric: tabular-nums;'); } catch(e) {}
      }
    }
  }
  U.toast('Applied ' + fmt + ' format', 'success');
},

_xlOpenSearch() {
  const ws = Reco._xlWorksheet; if (!ws) return;
  if (ws.openSearch) { try { ws.openSearch(); return; } catch(e) {} }
  // Fallback: prompt for a search term, find first match
  const q = prompt('Find:'); if (!q) return;
  const needle = q.toLowerCase();
  for (let y = 0; y < (Reco._xlRows || []).length; y++) {
    const row = Reco._xlRows[y];
    for (let x = 0; x < Reco._xlCols.length; x++) {
      const v = row[Reco._xlCols[x]];
      if (v != null && String(v).toLowerCase().indexOf(needle) !== -1) {
        try { ws.updateSelectionFromCoords ? ws.updateSelectionFromCoords(x, y, x, y) : ws.selectCell && ws.selectCell([x, y]); return; } catch(e) {}
      }
    }
  }
  U.toast('No match for "' + q + '"', 'error');
},

_xlExportXlsx() {
  const ws = Reco._xlWorksheet; if (!ws) return;
  try {
    if (ws.download) { ws.download(true); return; }
    if (Reco._xlInstance && Reco._xlInstance.download) { Reco._xlInstance.download(true); return; }
  } catch(e) { console.error(e); }
  U.toast('Download not supported by this JSS version', 'error');
},

_xlOpenFxWizard() {
  const opts = [
    ['', 'Choose a function…'],
    ['sumifs',    'SUMIFS — sum a column where conditions match'],
    ['countifs',  'COUNTIFS — count rows where conditions match'],
    ['duplicate', 'DUPLICATE — flag duplicate values'],

  h += '<select id="fxType" onchange="Reco._xlRenderFxFields(this.value)">';

  h += '</select></label>';
  h += '<div id="fxFields"></div>';
  h += '<div class="help">The formula will be inserted at the active cell. Use the column letter to pick which column to operate on (column letters are shown in the JSS header, e.g. A, B, C…).</div>';
  App.openModal('Function Wizard',
    h,
    '<button onclick="App.closeModal()">Cancel</button>' +
    '<button class="primary" onclick="Reco._xlApplyFxWizard()">Insert</button>');

_xlRenderFxFields(type) {
  const wrap = document.getElementById('fxFields');
  if (!wrap) return;
  const colLetters = (Reco._xlCols || []).map((_, i) => Reco._xlColLetter(i));
  const colMenu = (id, label) => {
    let s = '<label class="field"><span class="label-text">'+label+'</span><select id="'+id+'">';
    (Reco._xlCols || []).forEach((name, i) => {
      if (name === '_status_') return;
      s += '<option value="'+colLetters[i]+'">'+colLetters[i]+' — '+U.esc(name)+'</option>';
    });
    s += '</select></label>';
    return s;
  };
  let h = '';
  if (type === 'sumifs') {
    h += colMenu('fxSumCol', 'Column to sum');
    h += '<div class="text-muted" style="margin: 8px 0 4px;">Conditions (up to 3 — leave blank to skip):</div>';
    for (let i = 1; i <= 3; i++) {
      h += '<div class="row" style="display:flex; gap:6px;">';
      h += colMenu('fxCondCol'+i, 'Condition column ' + i);
      h += '<label class="field" style="flex:1"><span class="label-text">Criteria</span><input id="fxCrit'+i+'" placeholder="e.g. Open, &gt;100, A2" /></label>';
      h += '</div>';
    }
  } else if (type === 'countifs') {
    h += '<div class="text-muted" style="margin: 4px 0;">Count rows where these match:</div>';
    for (let i = 1; i <= 3; i++) {
      h += '<div class="row" style="display:flex; gap:6px;">';
      h += colMenu('fxCondCol'+i, 'Column ' + i);
      h += '<label class="field" style="flex:1"><span class="label-text">Criteria</span><input id="fxCrit'+i+'" placeholder="e.g. Open" /></label>';
      h += '</div>';
    }
  } else if (type === 'duplicate') {
    h += colMenu('fxDupCol', 'Column to check');
    h += '<div class="text-muted">Inserts a formula that shows TRUE for rows where the value appears more than once in the selected column.</div>';
  } else if (type === 'textbefore' || type === 'textafter') {
    h += colMenu('fxTxtCol', 'Source column');
    h += '<label class="field"><span class="label-text">Delimiter (single char or substring)</span><input id="fxDelim" value="-" /></label>';
    h += '<label class="inline"><input type="checkbox" id="fxSkipBlanks"> Skip empty matches</label>';
  } else if (type === 'textbetween') {
    h += colMenu('fxTxtCol', 'Source column');
    h += '<label class="field"><span class="label-text">Start delimiter</span><input id="fxDelimStart" value="(" /></label>';
    h += '<label class="field"><span class="label-text">End delimiter</span><input id="fxDelimEnd"   value=")" /></label>';
  }
  wrap.innerHTML = h;
},

_xlApplyFxWizard() {
  const type = (document.getElementById('fxType') || {}).value || '';
  if (!type) { U.toast('Pick a function', 'error'); return; }
  const ws = Reco._xlWorksheet; if (!ws) return;

  // Active cell — use first cell of current selection, or 0,0 fallback
  const r = Reco._xlGetSelectedRange();
  const tx = r ? r.minX : 1;
  const ty = r ? r.minY : 0;
  const rowNum = ty + 1;       // JSS is 0-indexed; A1 references are 1-indexed
  const ROWS = (Reco._xlRows || []).length;

  const grab = id => (document.getElementById(id) || {}).value || '';
  let formula = '';

  if (type === 'sumifs') {
    const sum = grab('fxSumCol'); if (!sum) { U.toast('Pick a sum column', 'error'); return; }
    const parts = [sum + '2:' + sum + (ROWS + 1)];
    for (let i = 1; i <= 3; i++) {
      const c = grab('fxCondCol' + i), v = grab('fxCrit' + i).trim();
      if (c && v) parts.push(c + '2:' + c + (ROWS + 1), '"' + v.replace(/"/g, '""') + '"');
    }
    formula = '=SUMIFS(' + parts.join(',') + ')';
  } else if (type === 'countifs') {
    const parts = [];
    for (let i = 1; i <= 3; i++) {
      const c = grab('fxCondCol' + i), v = grab('fxCrit' + i).trim();
      if (c && v) parts.push(c + '2:' + c + (ROWS + 1), '"' + v.replace(/"/g, '""') + '"');
    }
    if (!parts.length) { U.toast('Add at least one condition', 'error'); return; }
    formula = '=COUNTIFS(' + parts.join(',') + ')';
  } else if (type === 'duplicate') {
    const c = grab('fxDupCol'); if (!c) { U.toast('Pick a column', 'error'); return; }
    formula = '=COUNTIF(' + c + '2:' + c + (ROWS + 1) + ',' + c + rowNum + ')>1';
  } else if (type === 'textbefore') {
    const c = grab('fxTxtCol'), d = grab('fxDelim');
    if (!c || !d) { U.toast('Pick a column and delimiter', 'error'); return; }
    formula = '=IFERROR(LEFT(' + c + rowNum + ',FIND("' + d + '",' + c + rowNum + ')-1),' + c + rowNum + ')';
  } else if (type === 'textafter') {
    const c = grab('fxTxtCol'), d = grab('fxDelim');
    if (!c || !d) { U.toast('Pick a column and delimiter', 'error'); return; }
    formula = '=IFERROR(MID(' + c + rowNum + ',FIND("' + d + '",' + c + rowNum + ')+' + d.length + ',999),"")';
  } else if (type === 'textbetween') {
    const c = grab('fxTxtCol'), ds = grab('fxDelimStart'), de = grab('fxDelimEnd');
    if (!c || !ds || !de) { U.toast('Fill all fields', 'error'); return; }
    formula = '=IFERROR(MID(' + c + rowNum + ',FIND("' + ds + '",' + c + rowNum + ')+' + ds.length + ',FIND("' + de + '",' + c + rowNum + ',FIND("' + ds + '",' + c + rowNum + '))-FIND("' + ds + '",' + c + rowNum + ')-' + ds.length + '),"")';
  }

  try { ws.setValue([tx, ty], formula, true); } catch(e) { console.error(e); }
  App.closeModal();
  U.toast('Inserted formula at ' + Reco._xlColLetter(tx) + rowNum, 'success');
},

_xlColLetter(idx) {
  // 0 → A, 1 → B, …, 25 → Z, 26 → AA, …
  let s = '', n = idx;
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
},


/* ============== EXCEL VIEW (JSPREADSHEET v9+) ============== */

_xlInstance: null,
_xlWorksheet: null,
_xlRows: null,     // filtered rows in order, indexed by JSS y
_xlCols: null,     // column names in order, indexed by JSS x

renderExcelView(tpl, sess) {
  let h = '<div class="excel-view-wrap">';
  h += Reco._xlToolbarHtml(tpl);
  h += '<div class="excel-view-host" id="excelViewHost"></div>';
  h += '<div class="sel-sum-bar" id="xlSelSumBar"></div>';
  h += '</div>';
  setTimeout(() => Reco._xlInit(tpl, sess), 30);
  return h;
},

_xlBuildColumns(tpl, sess, allCols) {
  SpecialJV.resetOptions();
  return allCols.map(name => {
    // Status pseudo-column (first column injected by _xlInit)
    if (name === '_status_') {
      return { type: 'text', title: 'Status', width: 80, readOnly: true };
    }

    const std = (tpl.columns || []).find(c => c.name === name);
    const editCfg = ((tpl.editableColumnConfig || {})[name]) || null;
    const isEditable = (tpl.editableColumns || []).indexOf(name) !== -1;

    // AEG "To Account" — dropdown with master refs + JV refs flattened
    const aeg = (tpl.aegIntegration && tpl.aegIntegration.enabled)
      ? AppState.aegTemplates.find(at => at.id === tpl.aegIntegration.aegTemplateId) : null;
    const isToAcct = aeg && aeg.toAccount &&
      (aeg.toAccount.mode === 'input' || aeg.toAccount.mode === 'inputOrSelect') &&
      aeg.toAccount.inputColumn === name;

    let type = 'text';
    let extra = {};
    if (isToAcct) {
      const opts = SpecialJV.buildToAccountOptions();
      type = 'dropdown';
      extra.source = opts.map(o => ({ id: o.value, name: o.label }));
      extra.autocomplete = true;
    } else if (isEditable && editCfg && (editCfg.editType === 'dropdown' || editCfg.editType === 'datalist')) {
      let opts = [];
      if (editCfg.optionsSource === 'master' && editCfg.masterCfg && editCfg.masterCfg.source && editCfg.masterCfg.field) {
        opts = Masters.distinctValues(editCfg.masterCfg.source, tpl.id, editCfg.masterCfg.field);
      } else {
        opts = (editCfg.manualOptions || []).slice();
      }
      type = 'dropdown';
      extra.source = opts;
      extra.autocomplete = editCfg.editType === 'datalist';
    } else if (std && std.isDate) {
      type = 'calendar';
      extra.options = { format: 'DD/MM/YYYY' };
    } else if (std && std.isValue) {
      type = 'numeric';
      extra.mask = '#,##0.00';
    }

    return Object.assign({
      type,
      title: name,
      width: sess.columnWidths[name] || 130,
      readOnly: !isEditable && !isToAcct && (std == null || !!std._readOnly)  // additional cols are computed → readOnly
    }, extra);
  });
},

_xlInit(tpl, sess) {
  const host = document.getElementById('excelViewHost');
  if (!host) return;
  if (typeof jspreadsheet === 'undefined') { U.toast('Jspreadsheet not loaded', 'error'); return; }

  // Build the column list — visible cols + extras, prepended with a synthetic Status column
  const displayCols = Reco.effectiveDisplayCols(tpl, sess);
  const extra = [].concat(tpl.additionalColumns || [], sess.extraColumns || []);
  const extraNames = extra.map(a => a.name).filter(n => displayCols.indexOf(n) === -1);
  const allCols = ['_status_'].concat(displayCols).concat(extraNames);

  const columns = Reco._xlBuildColumns(tpl, sess, allCols);
  const filtered = Reco.applyTableFiltersSort(tpl, sess);

  // Build rows in same order as columns
  const data = filtered.map(row => {
    // Additional-column values computed exactly as in the grid (cascading)
    const full = extra.length ? Reco._rowWithExtras(tpl, sess, row) : row;
    return allCols.map(col => {
    if (col === '_status_') {
      const isOff = sess.offsets && sess.offsets[row._id];
      return isOff ? (row._manualOffset ? 'Offset ✋' : 'Offset') : 'Open';
    }
    const acDef = extra.find(a => a.name === col);
    if (acDef && (acDef.type === 'master' || acDef.type === 'master_lookup' || acDef.type === 'formula')) {
      return full[col] != null ? full[col] : '';
    }
    let v = row[col];
    if (col.toLowerCase().includes('date')) v = U.formatExcelDate(v);
    return v != null ? v : '';
    });
  });

  Reco._xlRows = filtered;
  Reco._xlCols = allCols;
  const hostH = host.clientHeight || 600;

  Reco._xlInstance = jspreadsheet(host, {
    worksheets: [{
      data,
      columns,
      columnSorting: true,
      columnDrag:    true,
      filters:       true,
      lazyLoading:   true,        // NEW — render only the visible window
      loadingSpin:   true,        // NEW — spinner while a chunk loads
      tableOverflow: true,        // required for lazy loading
      tableHeight:   hostH + 'px',// required: a fixed scroll viewport
      tableWidth:    '100%',
      allowInsertRow:    false,
      allowInsertColumn: false,
      allowDeleteRow:    false,
      allowDeleteColumn: false
    }],
    onchange:    Reco._xlOnChange,
    onselection: Reco._xlOnSelection,
    updateTable: Reco._xlUpdateTable   // NEW — per-cell decoration (replaces _xlApplyDecorations hooks)
  });
  Reco._xlWorksheet = Reco._xlInstance.worksheets ? Reco._xlInstance.worksheets[0] : null;
},

_xlAfterLoad() {
  // Apply cell coloring for format errors and corrected cells.
  // Runs after JSS finishes building the table DOM.
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess || !tpl || !Reco._xlRows || !Reco._xlCols) return;

  const host = document.getElementById('excelViewHost'); if (!host) return;
  // Skip the status column (index 0)
  Reco._xlRows.forEach((row, y) => {
    for (let x = 1; x < Reco._xlCols.length; x++) {
      const col = Reco._xlCols[x];
      const colDef = tpl.columns.find(c => c.name === col);
      const td = host.querySelector('tr[data-y="' + y + '"] td[data-x="' + x + '"]');
      if (!td) continue;
      if (row['_corrected_' + col]) td.classList.add('jss-corr');
      else if (colDef && colDef.formats && colDef.formats.length && !FMT.validate(row[col], colDef.formats)) td.classList.add('jss-err');
      if (sess.offsets && sess.offsets[row._id]) td.classList.add('jss-row-offset');
    }
  });
},

_xlOnChange(worksheet, cell, x, y, newVal /*, oldVal */) {
  if (Reco._xlSuppressChange) return;
  const row = Reco._xlRows && Reco._xlRows[y];
  if (!row) return;
  const col = Reco._xlCols[x];
  if (!col || col === '_status_') return;

  // Skip writes to computed additional columns
  const tpl  = AppState.recoTemplates.find(t => t.id === AppState.activeRecoId);
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const acDef = ((tpl.additionalColumns || []).concat(sess.extraColumns || []))
    .find(a => a.name === col);
  if (acDef && (acDef.type === 'master' || acDef.type === 'master_lookup' || acDef.type === 'formula')) {
    U.toast('"' + col + '" is computed — edit the source columns instead', 'error');
    return;
  }

  row[col] = newVal;
  delete row['_corrected_' + col]; // user has overwritten the corrected state

  const pk = row._pk || Reco.getRowPK(tpl, row);
  if (pk) Versioning.queueChange(tpl, pk, row).then(v => { if (v) row._ver = v; });
  AppState.save();
},

_xlOnSelection(worksheet, x1, y1, x2, y2) {
  if (!Reco._xlRows || !Reco._xlCols) return;
  const tpl  = AppState.recoTemplates.find(t => t.id === AppState.activeRecoId);
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const bar  = document.getElementById('xlSelSumBar');
  if (!bar) return;

  const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);

  // If selection is a single column (or full column), compute over it as a column op
  let cellCount = 0, numCount = 0, sum = 0, min = Infinity, max = -Infinity;
  const valueCol = tpl.valueColumn;
  let valueColSum = 0;
  const selectedRowIds = new Set();

  for (let y = minY; y <= maxY; y++) {
    const row = Reco._xlRows[y]; if (!row) continue;
    selectedRowIds.add(row._id);
    for (let x = minX; x <= maxX; x++) {
      const col = Reco._xlCols[x]; if (!col || col === '_status_') continue;
      const v = row[col];
      if (v === '' || v == null) continue;
      cellCount++;
      const n = parseFloat(String(v).replace(/,/g, ''));
      if (!isNaN(n) && isFinite(n)) {
        sum += n;
        numCount++;
        if (n < min) min = n;
        if (n > max) max = n;
      }
    }
    if (valueCol) valueColSum += U.num(row[valueCol]);
  }

  if (!cellCount && !selectedRowIds.size) { bar.classList.remove('show'); bar.innerHTML = ''; return; }

  const tol = tpl.toleranceValue || 0;
  const selRows = Array.from(selectedRowIds).map(rid => sess.data.find(r => r._id === rid)).filter(Boolean);
  const within = Reco.isWithinTolerance(tpl, valueColSum, selRows);
  const tolLabel = tpl.toleranceMode === 'percentage' ? tol + '%' : tol;

  let h = '<span>Rows: <b>' + selectedRowIds.size + '</b></span>';
  h += '<span>Cells: <b>' + cellCount + '</b></span>';
  if (numCount) {
    h += '<span>Sum: <b>' + U.fmtNum(sum) + '</b></span>';
    h += '<span>Avg: <b>' + U.fmtNum(sum / numCount) + '</b></span>';
  }
  if (valueCol) {
    h += '<span>Σ ' + valueCol + ': <b>' + U.fmtNum(valueColSum) + '</b></span>';
    h += within ? '<span style="background:rgba(255,255,255,0.18); padding:2px 8px; border-radius:8px;">Within tolerance ✓</span>'
                : '<span style="background:rgba(220,38,38,0.85); padding:2px 8px; border-radius:8px;">Outside tolerance (±' + tolLabel + ')</span>';
    if (within && selectedRowIds.size) {
      const ids = Array.from(selectedRowIds);
      h += '<button class="small" style="background:#fff;color:var(--primary);" onclick="Reco._xlOffsetSelectedRows(' + U.esc(JSON.stringify(ids)) + ')">Offset Selected</button>';
    }
  }
  bar.innerHTML = h;
  bar.classList.add('show');
},

_xlOffsetSelectedRows(rowIds) {
  if (!Array.isArray(rowIds) || !rowIds.length) return;
  const id  = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  const chk = Reco.checkOffsetTolerance(tpl, sess, rowIds);
  if (!chk.ok) { U.toast(chk.msg, 'error'); return; }
  const rid = 'M' + Date.now().toString(36);
  const mm = AppState.manualOffsetMaster[id] = AppState.manualOffsetMaster[id] || {};
  let n = 0;
  rowIds.forEach(rowId => {
    const row = sess.data.find(r => r._id === rowId);
    if (!row || sess.offsets[rowId]) return;
    sess.offsets[rowId] = true;
    row._recoId = rid;
    row._manualOffset = true;
    const pk = Reco.getRowPK(tpl, row);
    if (pk) mm[pk] = { recoId: rid, byUser: true };
    n++;
  });
  AppState.save();
  App.navigate('reco');
  U.toast('Offset ' + n + ' row(s)', 'success');
},

_xlDestroy() {
  if (Reco._xlInstance) {
    try {
      if (Reco._xlInstance.destroy) Reco._xlInstance.destroy();
      else if (Reco._xlWorksheet && Reco._xlWorksheet.destroy) Reco._xlWorksheet.destroy();
    } catch(e) {}
  }
  Reco._xlInstance = null;
  Reco._xlWorksheet = null;
  Reco._xlRows = null;
  Reco._xlCols = null;
},


/* ============== JSPREADSHEET SPIKE (REMOVABLE) ============== */

_jssInstance: null,
_jssFiltered: null,
_jssCols: null,

openJssSpike() {
  const id   = AppState.activeRecoId;
  const tpl  = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  if (!tpl || !sess || !sess.data.length) { U.toast('Load data first', 'error'); return; }
  if (typeof jspreadsheet === 'undefined') {
    U.toast('jspreadsheet library not loaded — check lib/ folder', 'error');
    return;
  }

  const body = '<div id="jssSpikeContainer" style="height: 75vh; overflow: auto;"></div>'
             + '<div class="text-muted" style="margin-top:6px; font-size:11px;">'
             +   'Beta — edits are saved to the same session and versioned CSV as the normal view. '
             +   'Status badges / AEG dropdowns / formatting are not wired up here yet.'
             + '</div>';
  const footer = '<button onclick="Reco._jssClose()">Close</button>';
  App.openModal('Spreadsheet (beta)', body, footer);

  // Widen the modal almost full screen
  const modalEl = document.querySelector('#appModal .modal');
  if (modalEl) { modalEl.style.maxWidth = '96vw'; modalEl.dataset._jssWidened = '1'; }

  setTimeout(() => Reco._jssInit(tpl, sess), 80);
},

_jssInit(tpl, sess) {
  const root = document.getElementById('jssSpikeContainer');
  if (!root) return;

  const displayCols = Reco.effectiveDisplayCols(tpl, sess);
  const extra = [].concat(tpl.additionalColumns || [], sess.extraColumns || []);
  const extraNames = extra.map(a => a.name).filter(n => displayCols.indexOf(n) === -1);
  const allCols = displayCols.concat(extraNames);

  const columns = allCols.map(name => {
    const std = (tpl.columns || []).find(c => c.name === name);
    let type = 'text';
    if (std && std.isDate)  type = 'calendar';
    if (std && std.isValue) type = 'numeric';
    return { type, title: name, width: sess.columnWidths[name] || 120 };
  });

  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const data = filtered.map(row => allCols.map(c => row[c] != null ? row[c] : ''));

  Reco._jssFiltered = filtered;
  Reco._jssCols     = allCols;

  Reco._jssInstance = jspreadsheet(root, {
    worksheets: [{
      data,
      columns,
      columnSorting: true,
      columnDrag:    true,
      allowInsertRow:    false,
      allowInsertColumn: false,
      allowDeleteRow:    false,
      allowDeleteColumn: false
    }],
    onchange:    Reco._jssOnChange,
    onselection: Reco._jssOnSelection
  });
},

_jssOnChange(instance, cell, x, y, newVal) {
  const row = Reco._jssFiltered && Reco._jssFiltered[y];
  if (!row) return;
  const col = Reco._jssCols[x];
  if (col == null) return;

  row[col] = newVal;

  const id  = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(t => t.id === id);
  const pk  = row._pk || Reco.getRowPK(tpl, row);
  if (pk) Versioning.queueChange(tpl, pk, row).then(v => { if (v) row._ver = v; });
  AppState.save();
},

_jssOnSelection(instance, x1, y1, x2, y2) {
  // Lightweight info bar — JSS has its own status at bottom too, this just demonstrates the hook
  if (!Reco._jssFiltered || !Reco._jssCols) return;
  const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
  let sum = 0, count = 0, num = 0;
  for (let y = minY; y <= maxY; y++) {
    const row = Reco._jssFiltered[y]; if (!row) continue;
    for (let x = minX; x <= maxX; x++) {
      const col = Reco._jssCols[x]; if (col == null) continue;
      const v = row[col]; if (v === '' || v == null) continue;
      count++;
      const n = parseFloat(String(v).replace(/,/g, ''));
      if (!isNaN(n) && isFinite(n)) { sum += n; num++; }
    }
  }
  // Stash on the title bar for easy visibility
  const t = document.getElementById('appModalTitle');
  if (t) t.textContent = 'Spreadsheet (beta) — ' + count + ' cells'
    + (num ? ', Sum ' + U.fmtNum(sum) : '');
},

_jssClose() {
  if (Reco._jssInstance) {
    try { Reco._jssInstance.destroy(); } catch(e) {}
    Reco._jssInstance = null;
  }
  Reco._jssFiltered = null;
  Reco._jssCols     = null;
  // Restore modal width
  const modalEl = document.querySelector('#appModal .modal');
  if (modalEl && modalEl.dataset._jssWidened) { modalEl.style.maxWidth = ''; delete modalEl.dataset._jssWidened; }
  App.closeModal();
  // Refresh the underlying view so any edits show in the regular table
  App.navigate('reco');
},

/* ============== SPREADSHEET MODE — PHASE 5: ADD ROWS & COLUMNS ============== */

_ssBlankRow(tpl) {
  const row = { _id: U.uid(), _ssAdded: true };
  (tpl.columns || []).forEach(c => { row[c.name] = ''; });
  return row;
},

ssAddRow(persistent) {
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  if (!tpl || !sess) return;
  const row = Reco._ssBlankRow(tpl);
  if (persistent) {
    row._ssPersistent = true;
    row._pk = '_added_' + row._id;
    Versioning.appendUpload(tpl, [row])
      .then(p => { sess.activeVersionFile = p; AppState.save(); })
      .catch(e => console.error('appendUpload (added row)', e));
  }
  sess.data.push(row);
  // Jump to last page so the user sees the new row
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const pageSize = sess.pageSize || 200;
  sess.page = Math.max(0, Math.ceil(filtered.length / pageSize) - 1);
  AppState.save();
  App.navigate('reco');
  U.toast('Added ' + (persistent ? 'persistent ' : '') + 'row', 'success');
},

ssOpenAddColModal() {
  let h = '';
  h += '<label class="field"><span class="label-text">Column name</span>';
  h += '<input type="text" id="ssNewColName" placeholder="e.g. Comment, Adjustment, Status" /></label>';
  h += '<label class="inline"><input type="checkbox" id="ssNewColPersist"> Save to template (persistent — everyone sees it on this template)</label><br>';
  h += '<label class="inline"><input type="checkbox" id="ssNewColSingle"> Single-use (auto-removed after the next AEG entry is generated)</label>';
  h += '<div class="help">New columns are added as free-text. Convert to formula / lookup later via the template editor.</div>';
  App.openModal('Add Column', h,
    '<button onclick="App.closeModal()">Cancel</button>' +
    '<button class="primary" onclick="Reco.ssCommitAddCol()">Add</button>');
  setTimeout(() => { const i = document.getElementById('ssNewColName'); if (i) i.focus(); }, 80);
},

ssCommitAddCol() {
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  if (!tpl || !sess) return;
  const name = (document.getElementById('ssNewColName')?.value || '').trim();
  if (!name) { U.toast('Name is required', 'error'); return; }
  const persist = !!document.getElementById('ssNewColPersist')?.checked;
  const single  = !!document.getElementById('ssNewColSingle')?.checked;

  // Conflict checks
  const allCols = (tpl.columns || []).map(c => c.name)
    .concat((tpl.additionalColumns || []).map(a => a.name))
    .concat((sess.extraColumns || []).map(a => a.name));
  if (allCols.indexOf(name) !== -1) { U.toast('Column "' + name + '" already exists', 'error'); return; }

  if (persist) {
    tpl.additionalColumns = tpl.additionalColumns || [];
    tpl.additionalColumns.push({ name, type: 'custom', _ssAdded: true, _ssSingleUse: single });
  } else {
    sess.extraColumns.push({ name, type: 'custom', _ssAdded: true, _ssSingleUse: single });
  }
  AppState.save();
  App.closeModal();
  App.navigate('reco');
  U.toast('Added column "' + name + '"' + (persist ? ' to template' : ' (session-only)') + (single ? ' · single-use' : ''), 'success');
},

ssToggleRowSingleUse(rowId) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const row = sess && sess.data.find(r => r._id === rowId);
  if (!row) return;
  row._ssSingleUse = !row._ssSingleUse;
  AppState.save();
  App.navigate('reco');
},

ssDeleteRow(rowId) {
  if (!confirm('Delete this row from the session? Persistent rows remain in the versioned CSV on disk and will be reloaded on next open.')) return;
  const sess = AppState.recoSessions[AppState.activeRecoId];
  sess.data = sess.data.filter(r => r._id !== rowId);
  delete sess.offsets[rowId];
  if (sess.selectedRows) delete sess.selectedRows[rowId];
  AppState.save();
  App.navigate('reco');
  U.toast('Row deleted', 'success');
},

ssToggleColSingleUse(name) {
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  let col = (sess.extraColumns || []).find(c => c.name === name);
  if (!col) col = (tpl.additionalColumns || []).find(c => c.name === name && c._ssAdded);
  if (!col) return;
  col._ssSingleUse = !col._ssSingleUse;
  AppState.save();
  document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
  App.navigate('reco');
},

ssPromoteCol(name) {
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  const idx = (sess.extraColumns || []).findIndex(c => c.name === name);
  if (idx < 0) return;
  const col = sess.extraColumns[idx];
  sess.extraColumns.splice(idx, 1);
  tpl.additionalColumns = tpl.additionalColumns || [];
  tpl.additionalColumns.push(col);
  AppState.save();
  document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
  App.navigate('reco');
  U.toast('"' + name + '" promoted to template', 'success');
},

ssDeleteCol(name) {
  if (!confirm('Delete column "' + name + '"? Values in this column are removed from every row in the session.')) return;
  const id = AppState.activeRecoId;
  const tpl = AppState.recoTemplates.find(x => x.id === id);
  const sess = AppState.recoSessions[id];
  // Remove from wherever it lives
  sess.extraColumns = (sess.extraColumns || []).filter(c => c.name !== name);
  tpl.additionalColumns = (tpl.additionalColumns || []).filter(c => !(c.name === name && c._ssAdded));
  // Strip the value from every row
  sess.data.forEach(r => { delete r[name]; });
  AppState.save();
  document.querySelectorAll('.col-dropdown').forEach(d => d.remove());
  App.navigate('reco');
  U.toast('Column "' + name + '" deleted', 'success');
},

// Called from commitEntryFromPreview after an entry is generated
_ssCleanupSingleUseAfterEntry(sourceRows) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess) return { rows: 0, cols: 0 };

  // 1. Drop single-use rows that were part of this entry
  const singleUseIds = (sourceRows || []).filter(r => r._ssSingleUse).map(r => r._id);
  const rowsRemoved = singleUseIds.length;
  if (rowsRemoved) {
    sess.data = sess.data.filter(r => singleUseIds.indexOf(r._id) === -1);
    singleUseIds.forEach(rid => { delete sess.offsets[rid]; if (sess.selectedRows) delete sess.selectedRows[rid]; });
  }

  // 2. Drop single-use columns (session and template-level _ssAdded)
  const removeSession  = (sess.extraColumns || []).filter(c => c._ssSingleUse);
  const removeTemplate = (tpl.additionalColumns || []).filter(c => c._ssSingleUse && c._ssAdded);
  const allRemove = removeSession.concat(removeTemplate);
  allRemove.forEach(c => sess.data.forEach(r => { delete r[c.name]; }));
  sess.extraColumns       = (sess.extraColumns || []).filter(c => !c._ssSingleUse);
  tpl.additionalColumns   = (tpl.additionalColumns || []).filter(c => !(c._ssSingleUse && c._ssAdded));

  return { rows: rowsRemoved, cols: allRemove.length };
},

/* ============== SPREADSHEET MODE — PHASE 4: FORMATTING ============== */

_ssFmtRowKey(row) {
  return row && (row._pk || row._id);
},

_ssFmtFor(sess, row, col) {
  if (!row || !sess.cellFormats) return null;
  const rk = Reco._ssFmtRowKey(row);
  const byRow = sess.cellFormats[rk];
  return (byRow && byRow[col]) || null;
},

_ssFmtStyle(fmt) {
  if (!fmt) return '';
  let s = '';
  if (fmt.bg)        s += 'background-color:' + fmt.bg + ';';
  if (fmt.fg)        s += 'color:' + fmt.fg + ';';
  if (fmt.bold)      s += 'font-weight:700;';
  if (fmt.italic)    s += 'font-style:italic;';
  if (fmt.align)     s += 'text-align:' + fmt.align + ';';
  return s;
},

_ssFmtClass(fmt) {
  if (!fmt || !fmt.fontSize) return '';
  return ' fmt-' + fmt.fontSize;
},

_ssApplyNumFmt(val, numFmt) {
  if (val == null || val === '' || !numFmt || numFmt === 'general') return val;

  // Date formats
  if (numFmt === 'date_short' || numFmt === 'date_long' || numFmt === 'month_year') {
    const d = U.parseDate(val);
    if (!d) return val;
    if (numFmt === 'date_short') return U.fmtDate(d, 'DD/MM/YY');
    if (numFmt === 'date_long')  return U.fmtDate(d, 'DD-MMM-YYYY');
    if (numFmt === 'month_year') return U.fmtDate(d, 'MMM-YY');
  }

  // Numeric formats
  const n = parseFloat(String(val).replace(/,/g, ''));
  if (isNaN(n) || !isFinite(n)) return val;
  switch (numFmt) {
    case 'number':     return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    case 'number0':    return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    case 'currency':   return 'AED ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    case 'accounting':
      if (n < 0) return '(' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ')';
      return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    case 'percent':    return (n * 100).toFixed(2) + '%';
    default:           return val;
  }
},

_ssCellsInSelection(sess, tpl) {
  // Returns array of { row, col, rowKey } for every cell in the current selection
  const out = [];
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const cols = Reco._ssVisibleCols();
  if (sess.selRange) {
    const sr = sess.selRange;
    const minF = Math.min(sr.startFidx, sr.endFidx);
    const maxF = Math.max(sr.startFidx, sr.endFidx);
    const sc = cols.indexOf(sr.startCol), ec = cols.indexOf(sr.endCol);
    const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
    for (let f = minF; f <= maxF; f++) {
      const row = filtered[f]; if (!row) continue;
      const rk = Reco._ssFmtRowKey(row);
      for (let c = minC; c <= maxC; c++) {
        const col = cols[c]; if (!col) continue;
        out.push({ row, col, rowKey: rk });
      }
    }
  } else if (sess.activeCell) {
    const row = filtered[sess.activeCell.fidx];
    if (row) out.push({ row, col: sess.activeCell.col, rowKey: Reco._ssFmtRowKey(row) });
  }
  return out;
},

toggleFormatToolbar() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess) return;
  // Auto-enable sheet mode if the user reaches for formatting
  if (!sess.spreadsheetMode) sess.spreadsheetMode = true;
  sess.formatToolbarOpen = !sess.formatToolbarOpen;
  AppState.save();
  App.navigate('reco');
},

_ssRenderFormatToolbar(sess) {
  if (!sess.spreadsheetMode || !sess.formatToolbarOpen) return '';
  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const cells = Reco._ssCellsInSelection(sess, tpl);

  // Use the active cell's format to highlight active states
  let probe = null;
  if (sess.activeCell) {
    const filtered = Reco.applyTableFiltersSort(tpl, sess);
    const r = filtered[sess.activeCell.fidx];
    if (r) probe = Reco._ssFmtFor(sess, r, sess.activeCell.col);
  }
  const isB = !!(probe && probe.bold);
  const isI = !!(probe && probe.italic);
  const al  = (probe && probe.align) || '';
  const sz  = (probe && probe.fontSize) || '';
  const nf  = (probe && probe.numFmt) || '';

  let h = '<div class="format-toolbar">';
  h += '<button class="small fmt-btn'+(isB?' active':'')+'" onclick="Reco._ssApplyFormat(\'bold\',\'toggle\')" title="Bold (Ctrl+B)"><b>B</b></button>';
  h += '<button class="small fmt-btn'+(isI?' active':'')+'" onclick="Reco._ssApplyFormat(\'italic\',\'toggle\')" title="Italic (Ctrl+I)"><i>I</i></button>';
  h += '<span class="sep"></span>';
  h += '<button class="small fmt-btn'+(al==='left'?' active':'')+'"   onclick="Reco._ssApplyFormat(\'align\',\'left\')"   title="Align left">⬅</button>';
  h += '<button class="small fmt-btn'+(al==='center'?' active':'')+'" onclick="Reco._ssApplyFormat(\'align\',\'center\')" title="Align center">↔</button>';
  h += '<button class="small fmt-btn'+(al==='right'?' active':'')+'"  onclick="Reco._ssApplyFormat(\'align\',\'right\')"  title="Align right">➡</button>';
  h += '<span class="sep"></span>';

  h += '<select onchange="Reco._ssApplyFormat(\'fontSize\',this.value); this.selectedIndex=0">';
  h += '<option value="">Size…</option>';
  [['xs','XS'],['sm','S'],['md','M'],['lg','L'],['xl','XL']].forEach(s => {
    h += '<option value="'+s[0]+'"'+(sz===s[0]?' selected':'')+'>'+s[1]+'</option>';
  });
  h += '</select>';

  h += '<select onchange="Reco._ssApplyFormat(\'numFmt\',this.value); this.selectedIndex=0">';
  h += '<option value="">Format…</option>';
  [
    ['general','General'],
    ['number','Number 1,234.56'],
    ['number0','Number 1,235'],
    ['currency','Currency AED'],
    ['accounting','Accounting'],
    ['percent','Percent %'],
    ['date_short','Date DD/MM/YY'],
    ['date_long','Date DD-MMM-YYYY'],
    ['month_year','Month MMM-YY']
  ].forEach(o => { h += '<option value="'+o[0]+'"'+(nf===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
  h += '</select>';

  h += '<span class="sep"></span>';
  h += '<button class="small fmt-btn" onclick="Reco._ssToggleColorPicker(this,\'bg\')" title="Fill color">🎨 Fill</button>';
  h += '<button class="small fmt-btn" onclick="Reco._ssToggleColorPicker(this,\'fg\')" title="Text color"><b>A</b> Text</button>';

  h += '<span class="sep"></span>';
  h += '<button class="small fmt-btn" onclick="Reco._ssClearFormat()" title="Clear formatting on selection">⌫ Clear</button>';
  h += '<span class="sel-info">'+cells.length+' cell'+(cells.length===1?'':'s')+' selected</span>';
  h += '<button class="small fmt-btn" onclick="Reco.toggleFormatToolbar()" title="Close (Alt+H)">×</button>';
  h += '</div>';
  return h;
},

_ssToggleColorPicker(btn, prop) {
  document.querySelectorAll('.color-palette').forEach(p => p.remove());
  const fillColors = ['', '#fee2e2','#fed7aa','#fef3c7','#d1fae5','#cffafe','#dbeafe','#ede9fe','#fce7f3','#f3f4f6'];
  const textColors = ['', '#b91c1c','#c2410c','#a16207','#15803d','#0e7490','#1d4ed8','#6d28d9','#be185d','#4b5563'];
  const colors = prop === 'fg' ? textColors : fillColors;

  const palette = document.createElement('div');
  palette.className = 'color-palette';
  colors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c ? '' : ' none');
    sw.style.background = c || 'transparent';
    sw.title = c || (prop === 'fg' ? 'Default color' : 'No fill');
    sw.onclick = () => {
      Reco._ssApplyFormat(prop, c);
      palette.remove();
    };
    palette.appendChild(sw);
  });
  document.body.appendChild(palette);
  const r = btn.getBoundingClientRect();
  palette.style.left = Math.min(r.left, window.innerWidth - 180) + 'px';
  palette.style.top  = (r.bottom + 6) + 'px';
  setTimeout(() => {
    const close = e => { if (!palette.contains(e.target) && e.target !== btn) { palette.remove(); document.removeEventListener('click', close); } };
    document.addEventListener('click', close);
  }, 0);
},

_ssApplyFormat(prop, value) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess || !tpl) return;
  const cells = Reco._ssCellsInSelection(sess, tpl);
  if (!cells.length) { U.toast('Select a cell or range first', 'error'); return; }

  sess.cellFormats = sess.cellFormats || {};
  cells.forEach(c => {
    sess.cellFormats[c.rowKey] = sess.cellFormats[c.rowKey] || {};
    const fmt = sess.cellFormats[c.rowKey][c.col] = sess.cellFormats[c.rowKey][c.col] || {};
    if (value === 'toggle') {
      fmt[prop] = !fmt[prop];
    } else if (value === '' || value == null) {
      delete fmt[prop];
    } else {
      fmt[prop] = value;
    }
    // Clean up empty objects
    if (!Object.keys(fmt).length) {
      delete sess.cellFormats[c.rowKey][c.col];
      if (!Object.keys(sess.cellFormats[c.rowKey]).length) delete sess.cellFormats[c.rowKey];
    }
  });

  AppState.save();
  App.navigate('reco');
},

_ssClearFormat() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess || !tpl) return;
  const cells = Reco._ssCellsInSelection(sess, tpl);
  if (!cells.length) { U.toast('Select a cell or range first', 'error'); return; }
  sess.cellFormats = sess.cellFormats || {};
  cells.forEach(c => {
    if (sess.cellFormats[c.rowKey]) {
      delete sess.cellFormats[c.rowKey][c.col];
      if (!Object.keys(sess.cellFormats[c.rowKey]).length) delete sess.cellFormats[c.rowKey];
    }
  });
  AppState.save();
  App.navigate('reco');
  U.toast('Cleared formatting on '+cells.length+' cell(s)', 'success');
},


/* ============== SPREADSHEET MODE — PHASE 2: FORMULAS ============== */

_ssRowKey(row) {
  return row._pk || row._id;
},

_ssPreprocessFormula(formula, cols) {
  let f = String(formula || '').trim();
  if (f.startsWith('=')) f = f.slice(1);

  // 1) Protect string literals so we don't mangle them later
  const strings = [];
  f = f.replace(/'[^']*'|"[^"]*"/g, m => {
    strings.push(m);
    return '\u0001' + (strings.length - 1) + '\u0001';
  });

  // 2) Replace bare & with string concat (preserve && for logical AND)
  f = f.replace(/&&/g, '\u0002');
  f = f.replace(/&/g, ' + "" + ');
  f = f.replace(/\u0002/g, '&&');

  // 3) Wrap bare column references in {} so Formula.evaluate substitutes them.
  //    Skip names already in {...} and names that look like function calls (followed by `(`).
  const sorted = cols.slice().sort((a, b) => b.length - a.length);
  sorted.forEach(col => {
    const escaped = col.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?<!\\{)\\b' + escaped + '\\b(?!\\s*\\()', 'g');
    f = f.replace(re, '{' + col + '}');
  });

  // 4) Restore string literals
  f = f.replace(/\u0001(\d+)\u0001/g, (m, n) => strings[parseInt(n, 10)]);

  return f;
},

_ssEvalFormula(formula, row, tpl) {
  if (!formula) return '';
  const cols = tpl.columns.map(c => c.name)
                .concat((tpl.additionalColumns || []).map(ac => ac.name));
  const code = Reco._ssPreprocessFormula(formula, cols);
  try {
    return Formula.evaluate(code, row);
  } catch (e) {
    return '#ERR';
  }
},

_ssRenderFormulaBar(sess) {
  if (!sess.spreadsheetMode) return '';
  let h = '<div class="formula-bar">';
  h += '<span class="cell-addr" id="cellAddr">— no cell —</span>';
  h += '<span class="fx" title="Formulas start with =">fx</span>';
  h += '<input type="text" id="formulaInput" autocomplete="off" spellcheck="false" '
     + 'placeholder=\'Type a value or =formula  (e.g. =LEFT(Description,5)  or  =Amount * 0.05  or  =Code & " - " & Name)\' '
     + 'onkeydown="Reco._ssFormulaInputKey(event)" />';
  h += '<button class="small" onclick="Reco._ssCommit(false)" title="Apply to this cell (Enter)">✓ Apply</button>';
  h += '<button class="small primary" onclick="Reco._ssCommit(true)" title="Apply formula to every row in this column (Ctrl+Enter)">↓ Fill Column</button>';
  h += '<button class="small" onclick="Reco._ssClearActive()" title="Clear cell (Delete)">×</button>';
  h += '<button class="small" onclick="Reco._ssShowFormulaHelp()" title="Function reference">?</button>';
  h += '</div>';
  return h;
},

_ssUpdateFormulaBar() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess) return;
  const addr = document.getElementById('cellAddr');
  const input = document.getElementById('formulaInput');
  if (!addr || !input) return;
  // Don't clobber what the user is currently typing
  if (document.activeElement === input) return;

  const ac = sess.activeCell;
  if (!ac) { addr.textContent = '— no cell —'; input.value = ''; return; }
  addr.textContent = ac.col + ' · row ' + (ac.fidx + 1);

  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const row = filtered[ac.fidx];
  if (!row) { input.value = ''; return; }
  const rowKey = Reco._ssRowKey(row);
  const formula = (sess.cellFormulas[rowKey] || {})[ac.col];
  input.value = formula != null ? formula : (row[ac.col] != null ? String(row[ac.col]) : '');
},

_ssFormulaInputKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    Reco._ssCommit(e.ctrlKey || e.metaKey);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    e.target.blur();
    Reco._ssUpdateFormulaBar();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    Reco._ssCommit(false, e.shiftKey ? 'left' : 'right');
  }
},

_ssCommit(fillColumn, moveDir) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const ac = sess && sess.activeCell;
  if (!ac) return;
  const input = document.getElementById('formulaInput');
  if (!input) return;
  const raw = input.value;
  const filtered = Reco.applyTableFiltersSort(tpl, sess);

  if (fillColumn) {
    let n = 0;
    if (raw.startsWith('=')) {
      filtered.forEach(row => {
        const rk = Reco._ssRowKey(row);
        sess.cellFormulas[rk] = sess.cellFormulas[rk] || {};
        sess.cellFormulas[rk][ac.col] = raw;
        n++;
      });
    } else {
      const pkRows = [];
      filtered.forEach(row => {
        const rk = Reco._ssRowKey(row);
        if (sess.cellFormulas[rk]) delete sess.cellFormulas[rk][ac.col];
        row[ac.col] = raw;
        if (row._pk) pkRows.push({ pk: row._pk, row });
        n++;
      });
      if (pkRows.length) {
        Versioning.appendChangesBatch(tpl, pkRows).then(versions => {
          pkRows.forEach(p => { if (versions[p.pk]) p.row._ver = versions[p.pk]; });
          AppState.save();
        }).catch(err => console.error('appendChangesBatch', err));
      }
    }
    U.toast('Applied to ' + n + ' row(s)', 'success');
  } else {
    const row = filtered[ac.fidx];
    if (!row) return;
    const rk = Reco._ssRowKey(row);
    sess.cellFormulas[rk] = sess.cellFormulas[rk] || {};
    if (raw.startsWith('=')) {
      sess.cellFormulas[rk][ac.col] = raw;
    } else {
      delete sess.cellFormulas[rk][ac.col];
      row[ac.col] = raw;
      if (row._pk) Versioning.queueChange(tpl, row._pk, row).then(v => { if (v) row._ver = v; });
    }
  }

  AppState.save();
  App.navigate('reco');

  // Move to the next cell so the bar is free for the next entry
  setTimeout(() => {
    const cols = Reco._ssVisibleCols();
    if (!cols.length) return;
    let nextF = ac.fidx, nextC = cols.indexOf(ac.col);
    if (moveDir === 'right') nextC = Math.min(cols.length - 1, nextC + 1);
    else if (moveDir === 'left') nextC = Math.max(0, nextC - 1);
    else if (!fillColumn) nextF = Math.min(filtered.length - 1, ac.fidx + 1);
    Reco._ssSetActiveCell(nextF, cols[nextC] || ac.col, false);
  }, 60);
},

_ssClearActive() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess || !sess.activeCell) return;
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const row = filtered[sess.activeCell.fidx];
  if (!row) return;
  const rk = Reco._ssRowKey(row);
  if (sess.cellFormulas[rk]) delete sess.cellFormulas[rk][sess.activeCell.col];
  row[sess.activeCell.col] = '';
  if (row._pk) Versioning.queueChange(tpl, row._pk, row).then(v => { if (v) row._ver = v; });
  AppState.save();
  App.navigate('reco');
},

/* ============== SPREADSHEET MODE — PHASE 3: DRAG-TO-FILL ============== */

_ssRenderFillHandle() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const wrap = document.querySelector('.reco-table-wrap');
  let handle = document.getElementById('ssFillHandle');

  if (!sess || !sess.spreadsheetMode || !sess.activeCell || !wrap) {
    if (handle) handle.style.display = 'none';
    return;
  }

  // Anchor at the bottom-right of the range (if any) else the active cell
  let anchorFidx = sess.activeCell.fidx;
  let anchorCol  = sess.activeCell.col;
  if (sess.selRange) {
    anchorFidx = Math.max(sess.selRange.startFidx, sess.selRange.endFidx);
    const cols = Reco._ssVisibleCols();
    const sc = cols.indexOf(sess.selRange.startCol);
    const ec = cols.indexOf(sess.selRange.endCol);
    anchorCol = cols[Math.max(sc, ec)] || anchorCol;
  }

  const cellEl = wrap.querySelector('tr[data-frow="'+anchorFidx+'"] td[data-col="'+CSS.escape(anchorCol)+'"]');
  if (!cellEl) {
    if (handle) handle.style.display = 'none';
    return;
  }

  if (!handle) {
    handle = document.createElement('div');
    handle.id = 'ssFillHandle';
    handle.className = 'ss-fill-handle';
    handle.title = 'Drag to fill';
    handle.addEventListener('mousedown', Reco._ssOnFillMouseDown);
    wrap.appendChild(handle);
  } else if (handle.parentNode !== wrap) {
    wrap.appendChild(handle);
  }

  const cellRect = cellEl.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const top  = cellRect.bottom - wrapRect.top  + wrap.scrollTop  - 4;
  const left = cellRect.right  - wrapRect.left + wrap.scrollLeft - 4;
  handle.style.top  = top  + 'px';
  handle.style.left = left + 'px';
  handle.style.display = 'block';
},

_ssOnFillMouseDown(e) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess.activeCell) return;

  // Source = active cell (or bottom-right corner of range, if any)
  let srcFidx = sess.activeCell.fidx;
  let srcCol  = sess.activeCell.col;
  if (sess.selRange) {
    srcFidx = Math.max(sess.selRange.startFidx, sess.selRange.endFidx);
    const cols = Reco._ssVisibleCols();
    const sc = cols.indexOf(sess.selRange.startCol);
    const ec = cols.indexOf(sess.selRange.endCol);
    srcCol = cols[Math.max(sc, ec)] || srcCol;
  }
  sess._fillDrag = { srcFidx, srcCol, curFidx: srcFidx, curCol: srcCol };

  // Disable pointer events on the handle so elementFromPoint can see cells underneath
  const handle = document.getElementById('ssFillHandle');
  if (handle) handle.style.pointerEvents = 'none';

  document.addEventListener('mousemove', Reco._ssOnFillMouseMove);
  document.addEventListener('mouseup', Reco._ssOnFillMouseUp, { once: true });
},

_ssOnFillMouseMove(e) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  if (!sess || !sess._fillDrag) return;

  // Auto-scroll when cursor nears wrap edges
  const wrap = document.querySelector('.reco-table-wrap');
  if (wrap) {
    const r = wrap.getBoundingClientRect();
    const edge = 32, step = 14;
    if (e.clientY - r.top    < edge) wrap.scrollTop  -= step;
    if (r.bottom - e.clientY < edge) wrap.scrollTop  += step;
    if (e.clientX - r.left   < edge) wrap.scrollLeft -= step;
    if (r.right - e.clientX  < edge) wrap.scrollLeft += step;
  }

  // Find cell under cursor
  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  if (elUnder) {
    const td = elUnder.closest('td[data-col]');
    const tr = elUnder.closest('tr[data-frow]');
    if (td && tr) {
      const col = td.dataset.col;
      const fidx = parseInt(tr.dataset.frow, 10);
      if (!isNaN(fidx)) {
        sess._fillDrag.curFidx = fidx;
        sess._fillDrag.curCol  = col;
      }
    }
  }

  Reco._ssRenderFillPreview();
  Reco._ssRenderFillTooltip(e);
},

_ssRenderFillPreview() {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const fd = sess && sess._fillDrag;
  const wrap = document.querySelector('.reco-table-wrap');
  if (!wrap) return;
  wrap.querySelectorAll('td.ss-fill-preview').forEach(td => td.classList.remove('ss-fill-preview'));
  if (!fd) return;

  const cols = Reco._ssVisibleCols();
  const sc = cols.indexOf(fd.srcCol);
  const ec = cols.indexOf(fd.curCol);
  if (sc < 0 || ec < 0) return;
  const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
  const minF = Math.min(fd.srcFidx, fd.curFidx);
  const maxF = Math.max(fd.srcFidx, fd.curFidx);

  for (let f = minF; f <= maxF; f++) {
    const tr = wrap.querySelector('tr[data-frow="'+f+'"]');
    if (!tr) continue;
    for (let c = minC; c <= maxC; c++) {
      const col = cols[c]; if (!col) continue;
      const td = tr.querySelector('td[data-col="'+CSS.escape(col)+'"]');
      if (td) td.classList.add('ss-fill-preview');
    }
  }
},

_ssRenderFillTooltip(e) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  const fd   = sess && sess._fillDrag;
  if (!fd) return;

  let tip = document.getElementById('ssFillTooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'ssFillTooltip';
    tip.className = 'ss-fill-tooltip';
    document.body.appendChild(tip);
  }

  const cols = Reco._ssVisibleCols();
  const sc = cols.indexOf(fd.srcCol), ec = cols.indexOf(fd.curCol);
  const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
  const minF = Math.min(fd.srcFidx, fd.curFidx), maxF = Math.max(fd.srcFidx, fd.curFidx);
  const numCells = (maxC - minC + 1) * (maxF - minF + 1);

  // Get source value (formula text if present, else raw value)
  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const srcRow = filtered[fd.srcFidx];
  let srcRaw = '';
  let isFormula = false;
  if (srcRow) {
    const rk = Reco._ssRowKey(srcRow);
    const f  = ((sess.cellFormulas || {})[rk] || {})[fd.srcCol];
    if (f) { srcRaw = f; isFormula = true; }
    else srcRaw = srcRow[fd.srcCol] != null ? String(srcRow[fd.srcCol]) : '';
  }
  const srcNum = parseFloat(String(srcRaw).replace(/,/g, ''));
  const isNum = !isFormula && !isNaN(srcNum) && isFinite(srcNum);

  let txt = numCells + ' cell' + (numCells > 1 ? 's' : '');
  if (isNum) txt += ' · Sum: ' + U.fmtNum(srcNum * numCells);
  else if (isFormula) txt += ' · formula';
  else if (srcRaw) txt += ' · "' + (srcRaw.length > 24 ? srcRaw.substring(0,24)+'…' : srcRaw) + '"';

  tip.textContent = txt;
  tip.style.left  = (e.clientX + 14) + 'px';
  tip.style.top   = (e.clientY + 14) + 'px';
  tip.style.display = 'block';
},

_ssOnFillMouseUp() {
  document.removeEventListener('mousemove', Reco._ssOnFillMouseMove);

  const sess = AppState.recoSessions[AppState.activeRecoId];
  const fd = sess && sess._fillDrag;

  // Clean up UI
  const tip = document.getElementById('ssFillTooltip');
  if (tip) tip.style.display = 'none';
  const handle = document.getElementById('ssFillHandle');
  if (handle) handle.style.pointerEvents = '';
  const wrap = document.querySelector('.reco-table-wrap');
  if (wrap) wrap.querySelectorAll('td.ss-fill-preview').forEach(td => td.classList.remove('ss-fill-preview'));

  if (!fd) return;
  sess._fillDrag = null;
  Reco._ssCommitFill(fd);
},

_ssCommitFill(fd) {
  const sess = AppState.recoSessions[AppState.activeRecoId];
  const tpl  = AppState.recoTemplates.find(x => x.id === AppState.activeRecoId);
  if (!sess || !tpl) return;

  const cols = Reco._ssVisibleCols();
  const sc = cols.indexOf(fd.srcCol), ec = cols.indexOf(fd.curCol);
  if (sc < 0 || ec < 0) return;
  const minC = Math.min(sc, ec), maxC = Math.max(sc, ec);
  const minF = Math.min(fd.srcFidx, fd.curFidx);
  const maxF = Math.max(fd.srcFidx, fd.curFidx);

  // No-op drag (just clicked, didn't move)
  if (minC === maxC && minF === maxF) return;

  const filtered = Reco.applyTableFiltersSort(tpl, sess);
  const srcRow = filtered[fd.srcFidx];
  if (!srcRow) return;

  const srcRowKey  = Reco._ssRowKey(srcRow);
  const srcFormula = ((sess.cellFormulas || {})[srcRowKey] || {})[fd.srcCol];
  const isFormula  = !!srcFormula;
  const srcVal     = isFormula ? srcFormula : (srcRow[fd.srcCol] != null ? srcRow[fd.srcCol] : '');

  sess.cellFormulas = sess.cellFormulas || {};
  const pkRowMap = {};      // de-dupe by pk: write one Cn per pk
  let filledCount = 0;

  for (let f = minF; f <= maxF; f++) {
    const row = filtered[f]; if (!row) continue;
    const rk = Reco._ssRowKey(row);
    for (let c = minC; c <= maxC; c++) {
      const col = cols[c]; if (!col) continue;
      if (f === fd.srcFidx && col === fd.srcCol) continue; // skip source

      if (isFormula) {
        sess.cellFormulas[rk] = sess.cellFormulas[rk] || {};
        sess.cellFormulas[rk][col] = srcVal;
      } else {
        if (sess.cellFormulas[rk]) delete sess.cellFormulas[rk][col];
        row[col] = srcVal;
        if (row._pk) pkRowMap[row._pk] = row;
      }
      filledCount++;
    }
  }

  const pkRows = Object.keys(pkRowMap).map(pk => ({ pk, row: pkRowMap[pk] }));
  if (pkRows.length) {
    Versioning.appendChangesBatch(tpl, pkRows).then(versions => {
      pkRows.forEach(p => { if (versions[p.pk]) p.row._ver = versions[p.pk]; });
      AppState.save();
    }).catch(err => console.error('appendChangesBatch', err));
  }

  AppState.save();
  App.navigate('reco');
  if (filledCount) U.toast('Filled ' + filledCount + ' cell' + (filledCount > 1 ? 's' : ''), 'success');
},
