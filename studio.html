<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure Studio — HTML Content (lite) measure builder</title>
<style>
:root{
  --bg:#e6eaee;--panel:#fbfcfd;--panel-2:#f2f5f8;--ink:#15202b;--sub:#5a6776;--rule:#cbd3dc;--rule-2:#e0e6ec;
  --lit:#0b746f;--expr:#6a3cc2;--kw:#a1400f;--ref:#1d5faf;--cmt:#8a949f;--num:#8a5a00;
  --hi:#f2c811;--hi-ink:#231b00;--err:#b42318;--ok:#1c7c4a;--wrn:#a15c00;
  --ui:"Segoe UI Variable Text","Segoe UI","IBM Plex Sans",system-ui,sans-serif;
  --mono:"Cascadia Mono","IBM Plex Mono",Consolas,"Courier New",monospace;
  --outh:34vh;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--ui);color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
#app{height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr) 356px;grid-template-rows:46px minmax(0,1fr) var(--outh);grid-template-areas:"top top top" "rail stage insp" "rail out insp"}
/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 10px 0 12px;background:var(--ink);color:#e8edf2}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand b{font-weight:650;letter-spacing:.01em}
.mark{width:22px;height:22px}
.tag{font-size:11px;color:#a9b8c8;border:1px solid #34485c;border-radius:4px;padding:1px 6px}
.mname{display:flex;align-items:center;gap:8px;flex:1;min-width:120px;max-width:440px}
.mname span{color:#8fa1b4;font-size:12px}
.mname input{flex:1;min-width:0;background:#213142;border:1px solid #34485c;border-radius:6px;padding:5px 9px;color:#fff;font:600 13px var(--mono)}
.acts{margin-left:auto;display:flex;gap:6px}
.top button{background:#213142;border:1px solid #34485c;color:#e8edf2;border-radius:6px;padding:5px 11px}
.top button:hover{background:#2a3e53}
.top .ib{padding:5px 9px}
.top .primary{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:650}
.top .primary:hover{background:#ffd83d}
/* rail */
.rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--rule);overflow:auto;padding:8px 8px 20px}
.rh{display:flex;align-items:center;justify-content:space-between;margin:12px 6px 6px;font-size:12px;font-weight:650;color:var(--sub)}
.rh:first-child{margin-top:4px}
.ri{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;color:var(--ink)}
.ri:hover{background:var(--panel-2)}
.ri.on,.bi.on{background:#fff6cc;box-shadow:inset 3px 0 0 var(--hi)}
.ri em{margin-left:auto;font-style:normal;font-size:11px;color:var(--sub);background:var(--panel-2);border-radius:9px;padding:0 7px}
.g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--panel-2);color:var(--sub);font:600 12px var(--mono);flex:none}
.mini{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:1px 8px;font-size:12px;color:var(--ink)}
.mini:hover{border-color:var(--sub)}
.blist{display:flex;flex-direction:column;gap:2px}
.bi{display:flex;align-items:center;gap:8px;border-radius:7px;padding:5px 6px 5px 8px;cursor:pointer;position:relative}
.bi:hover{background:var(--panel-2)}
.bi.off .bt{opacity:.45}
.bi.drag{opacity:.4}
.bi.over{box-shadow:inset 0 2px 0 var(--ink)}
.bt{display:flex;flex-direction:column;min-width:0;flex:1}
.bt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx{display:none;gap:1px}
.bi:hover .bx,.bi.on .bx{display:flex}
.bx button{border:0;background:none;width:20px;height:20px;border-radius:4px;color:var(--sub);font-size:12px;padding:0}
.bx button:hover{background:#fff;color:var(--ink)}
.addgrid{display:none;grid-template-columns:1fr 1fr;gap:4px;margin:6px 2px}
.addgrid.open{display:grid}
.addgrid button{display:flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:#fff;border-radius:7px;padding:5px 6px;font-size:12px;text-align:left}
.addgrid button:hover{border-color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 4px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:5px;padding:1px 6px;font:11px var(--mono);color:var(--ref);cursor:grab;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.v{color:var(--expr)}
.chip:hover{border-color:var(--ref)}
.hint{color:var(--sub);font-size:11.5px;margin:4px 6px}
/* stage */
.stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.sbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--panel)}
.sbar label{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:12px}
.sbar select,.sbar input[type=number]{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:3px 6px;font-size:12px;color:var(--ink)}
.sbar input[type=number]{width:64px}
.badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:#fff;border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge.w i{background:var(--wrn)}.badge.e i{background:var(--err)}
.sview{flex:1;overflow:auto;padding:16px;min-height:0}
.fwrap{margin:0 auto;transform-origin:top left;box-shadow:0 1px 3px rgba(21,32,43,.15),0 10px 30px -18px rgba(21,32,43,.45);background:#fff;border-radius:3px}
.fwrap iframe{display:block;border:0;width:100%;height:100%;background:transparent}
.fwrap.chk{background-color:#fff;background-image:linear-gradient(45deg,#eef1f4 25%,transparent 25%),linear-gradient(-45deg,#eef1f4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef1f4 75%),linear-gradient(-45deg,transparent 75%,#eef1f4 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
/* output */
.out{grid-area:out;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--rule);background:var(--panel);position:relative}
.grip{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:row-resize;z-index:5}
.otabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule-2);min-height:36px;flex-wrap:wrap}
.ot{border:0;background:none;padding:8px 10px;color:var(--sub);border-bottom:2px solid transparent;font-weight:550}
.ot.on{color:var(--ink);border-bottom-color:var(--hi)}
.ot em{font-style:normal;font-size:11px;background:var(--panel-2);border-radius:9px;padding:0 6px;margin-left:4px}
.oacts{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.oacts select{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:2px 6px;font-size:12px}
.btn{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink)}
.btn:hover{border-color:var(--sub)}
.btn.pr{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:650}
.btn.dn{color:var(--err)}
.obody{flex:1;overflow:auto;min-height:0;position:relative}
/* ledger-paper code view */
.code{margin:0;font:12px/20px var(--mono);white-space:pre;tab-size:4;counter-reset:ln;padding:4px 0 24px;background-color:#fcfdfb;min-height:100%;
  background-image:repeating-linear-gradient(to bottom,transparent 0 19px,#e9eee6 19px 20px),linear-gradient(to right,#f3f5f1 0 48px,#e4b6ba 48px 49px,transparent 49px);background-position:0 4px,0 0;background-attachment:local}
.code .l{display:block;padding-left:60px;position:relative;min-height:20px}
.code .l::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:40px;text-align:right;color:#a7b1a3;font-size:11px}
.tk-s{color:var(--lit)}.tk-k{color:var(--kw);font-weight:650}.tk-f{color:var(--expr)}.tk-r{color:var(--ref)}.tk-c{color:var(--cmt);font-style:italic}.tk-n{color:var(--num)}.tk-a{color:#c2185b;font-weight:700}.tk-v{color:#1f3a52}
.stat{padding:0 6px;color:var(--sub)}
.otext{width:100%;height:100%;border:0;resize:none;padding:10px 12px;font:12px/1.55 var(--mono);background:#fcfdfb;color:var(--ink);outline:none}
.opad{padding:12px 14px;max-width:980px}
.chk-list{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.chk-list li{display:grid;grid-template-columns:18px 170px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:6px;background:#fff;border:1px solid var(--rule-2)}
.chk-list .d{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--sub)}
.chk-list .err .d{background:var(--err)}.chk-list .warn .d{background:var(--wrn)}.chk-list .info .d{background:var(--ref)}
.chk-list b{font-weight:600;font-size:12px;color:var(--sub);word-break:break-word}
/* inspector */
.insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--rule);overflow:auto;min-height:0}
.ih{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--rule-2);padding:10px 12px 0}
.ih h2{margin:0 0 2px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.ih p{margin:0 0 8px;color:var(--sub);font-size:12px}
.itabs{display:flex;gap:2px}
.itab{border:0;background:none;padding:6px 10px;color:var(--sub);border-bottom:2px solid transparent;font-weight:550}
.itab.on{color:var(--ink);border-bottom-color:var(--hi)}
.ibody{padding:4px 12px 40px}
.sec{margin:14px 0 6px;font-size:12px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.f{margin:0 0 9px}
.f>label{display:block;font-size:12px;color:var(--sub);margin:0 0 3px}
.f .h{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.35}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.in{width:100%;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:5px 8px;font-size:12.5px}
.in:focus{border-color:#8795a5;outline:none;box-shadow:0 0 0 3px rgba(242,200,17,.35)}
textarea.in{resize:vertical;display:block}
.code-in{font:12px/1.5 var(--mono)}
.dax-in{font:12px/1.5 var(--mono);color:#20304a;background:#fdfdfb;min-height:30px;overflow:hidden;resize:none}
.dax-in.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.tpl-in{font:12px var(--mono)}
.sw-row{display:flex;align-items:center;gap:8px}
.tg{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.tg input{appearance:none;width:30px;height:17px;border-radius:99px;background:#c9d1da;position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg input:checked{background:var(--ink)}
.tg input:checked::after{left:15px}
.rng{display:flex;align-items:center;gap:8px}.rng input{flex:1}.rng b{font:600 12px var(--mono);width:44px;text-align:right}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.icons button{height:30px;border:1px solid var(--rule-2);background:#fff;border-radius:6px;display:grid;place-items:center;padding:0}
.icons button.on{border-color:var(--ink);background:#fff6cc}
.icons svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item{border:1px solid var(--rule-2);border-radius:8px;background:#fff;margin:0 0 8px}
.item>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item>summary b{font-weight:600}
.item>summary small{color:var(--sub);font:11px var(--mono)}
.item>summary .sp{flex:1}
.item .ib2{border:0;background:none;color:var(--sub);width:22px;height:22px;border-radius:4px;padding:0}
.item .ib2:hover{background:var(--panel-2);color:var(--ink)}
.item>.ic{padding:4px 10px 6px;border-top:1px solid var(--rule-2)}
.addrow{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.tgrid{display:grid;grid-template-columns:94px 30px 1fr;gap:5px 8px;align-items:center}
.tgrid span{font:12px var(--mono);color:var(--sub)}
.tgrid input[type=color]{width:30px;height:26px;border:1px solid var(--rule);border-radius:5px;padding:1px;background:#fff}
.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);border-radius:7px;background:#fff;padding:5px 8px;cursor:pointer}
.opt.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--hi)}
.opt .sws{display:flex;margin-left:auto}
.opt .sws i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid #fff}
.opt em{font-style:normal;font-size:11px;color:var(--sub)}
.note{background:#fff8d6;border:1px solid #efd97a;border-radius:7px;padding:8px 10px;font-size:12px;margin:8px 0;color:#4a3d00}
.note.b{background:#eef4fb;border-color:#c5d6ea;color:#1c3550}
.kbd{font:11px var(--mono);background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.smp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:4px 8px;align-items:center}
.smp code{font:11.5px var(--mono);color:var(--ref);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
#toast{position:fixed;left:50%;bottom:22px;translate:-50% 20px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,translate .2s;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#toast.show{opacity:1;translate:-50% 0}
.mtabs{display:none}
@media (max-width:900px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) 52px;grid-template-areas:"top" "main" "tabs";height:100dvh}
  .top{flex-wrap:wrap;gap:6px;padding:8px}
  .mname{order:3;max-width:none;flex-basis:100%}
  .acts{flex-wrap:wrap}
  .top button:not(.primary):not(.ib){display:none}
  .rail,.stage,.out,.insp{grid-area:main;display:none;border:0}
  body.m-blocks .rail,body.m-edit .insp{display:block}
  body.m-preview .stage,body.m-dax .out{display:flex}
  .mtabs{grid-area:tabs;display:flex;background:var(--ink)}
  .mtabs button{flex:1;border:0;background:none;color:#9fb0c2;font-size:12px}
  .mtabs button.on{color:#fff;box-shadow:inset 0 3px 0 var(--hi)}
  .grip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="m-preview">
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#f2c811"/><path d="M9 10.5 5.5 16 9 21.5M23 10.5l3.5 5.5-3.5 5.5" fill="none" stroke="#15202b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 21h6M12.5 11h7" stroke="#15202b" stroke-width="2.2" stroke-linecap="round"/><path d="M16 11v10" stroke="#15202b" stroke-width="2.2"/></svg>
      <b>Measure Studio</b><span class="tag" id="edTag">HTML Content (lite)</span>
    </div>
    <label class="mname"><span>Measure</span><input id="mName" spellcheck="false" aria-label="Measure name"></label>
    <div class="acts">
      <button id="bUndo" class="ib" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="bRedo" class="ib" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      <button id="bNew" title="Start a new project">New</button>
      <button id="bOpen" title="Open a saved project, a .dax measure or an HTML file">Open…</button>
      <button id="bSave" title="Save the project as JSON (Ctrl+S)">Save project</button>
      <button id="bCopy" class="primary" title="Copy the DAX measure">Copy measure</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Project and blocks"></nav>
  <main class="stage">
    <div class="sbar" id="sbar"></div>
    <div class="sview" id="sview"><div class="fwrap" id="fwrap"><iframe id="pv" title="Preview" sandbox="allow-same-origin"></iframe></div></div>
  </main>
  <section class="out" id="out"><div class="grip" id="grip" title="Drag to resize"></div><div class="otabs" id="otabs"></div><div class="obody" id="obody"></div></section>
  <aside class="insp" id="insp" aria-label="Inspector"></aside>
  <nav class="mtabs" id="mtabs"><button data-m="blocks">Blocks</button><button data-m="preview" class="on">Preview</button><button data-m="edit">Edit</button><button data-m="dax">DAX</button></nav>
</div>
<input type="file" id="fOpen" hidden accept=".json,.dax,.txt,.html,.htm">
<input type="file" id="fImg" hidden accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml">
<datalist id="fmtList"></datalist>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================================
   Measure Studio — HTML Content (lite) measure builder
   Part 1: utilities + preview number formatting
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const num = (x) => (x === null || x === undefined || x === '' || typeof x === 'boolean' || isNaN(+x)) ? 0 : +x;
const has = (x) => x !== null && x !== undefined && x !== '';
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);

function hashStr(s) { let a = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { a ^= s.charCodeAt(i); a = Math.imul(a, 16777619); } return a >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function b64enc(str) { const by = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64) { const bin = atob(b64); const by = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
const identOk = (s) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(s || '');
const slug = (s) => String(s || '').replace(/[^A-Za-z0-9_]/g, '_').replace(/^([0-9])/, '_$1') || 'x';

/* parse a sample value typed by the user: 1,234 · (1,234) · 12.5% · 3.2M · 850k */
function parseNum(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[,\s]/g, '');
  let mult = 1;
  if (/%$/.test(s)) { mult = 0.01; s = s.slice(0, -1); }
  else if (/[kK]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  else if (/[mM]$/.test(s)) { mult = 1e6; s = s.slice(0, -1); }
  else if (/(bn|BN|b|B)$/.test(s)) { mult = 1e9; s = s.replace(/(bn|BN|b|B)$/, ''); }
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const n = parseFloat(s) * mult;
  return neg ? -n : n;
}
/* sample value: number when numeric, otherwise the text */

        pts = X(M.raw('spt', `CONCATENATEX(\n    ${sx},\n    FORMAT(COALESCE(DIVIDE([@i], ${sn} - 1), 0.5) * 1000, "0") & "," & FORMAT(270 - DIVIDE([@y] - ${lo}, ${rg}) * 240, "0"),\n    " ", [@i], ASC\n)`));

TYPES.donut = {

  make: () => base({ span: 5, title: 'Revenue mix', subtitle: '', src: "VALUES('Revenue'[Line])", label: "'Revenue'[Line]", value: '[Revenue]', fmt: '#,0.0,,"M"', top: '5', othersLabel: 'Others',
    center: 'Total', thick: '48', size: '150', legend: true, smil: true,
    sample: gridText(['l', 'v'], POOL_CAT.slice(0, 7).map((l, i) => ({ l, v: Math.round(300e6 / (i + 1) ** 1.5) }))) }),
  form: [...F_TITLE, { sec: 'Data' }, { k: 'src', t: 'dax', label: 'Slices (table expression)' }, { k: 'label', t: 'dax', label: 'Label (row context)' },
    { k: 'value', t: 'dax', label: 'Value' }, { k: 'fmt', t: 'fmt', label: 'Value format' },
    { k: 'top', t: 'num', label: 'Top N slices, rest grouped (0 = all)' }, { k: 'othersLabel', t: 'text', label: 'Others label' },
    { sec: 'Display' }, { k: 'center', t: 'tpl', label: 'Centre caption (blank hides the total)' }, { k: 'thick', t: 'num', label: 'Ring thickness (8–80)' },
    { k: 'size', t: 'num', label: 'Diameter (px)' }, { k: 'legend', t: 'bool', label: 'Legend with values and share' },
    { k: 'smil', t: 'bool', label: 'Sweep animation (SVG, needs lite 1.6.1+)' },
    { sec: 'Preview sample' }, { k: 'sample', t: 'grid', keys: () => ['l', 'v'], hint: 'l = label · v = value (positive values only)' }],
  css: (b) => `.ms-${b.id}{--dn:${clamp(+b.size || 150, 60, 400)}px;--dnw:${clamp(+b.thick || 48, 8, 80)}px}`,
  build(b, M) {
    const N = Math.max(0, parseInt(b.top, 10) || 0);
    const pv = {};
    if (!M.dax) {
      const g = M.grid().filter((r) => num(r.v) > 0).sort((a, z) => num(z.v) - num(a.v) || cmpVal(a.l, z.l));
      pv.all = g; pv.top = N ? g.slice(0, N) : g;
      pv.tot = g.reduce((s, r) => s + num(r.v), 0);
      let cum = 0; pv.top.forEach((r, i) => { r.k = i; r.cb = cum; cum += num(r.v); });
      pv.ot = pv.tot - cum; pv.tsum = cum;
    }
    const all = M.tbl('a', `FILTER(\n    ADDCOLUMNS(\n        ${indent(b.src, '        ')},\n        "@l", ${b.label},\n        "@v", ${b.value}\n    ),\n    [@v] > 0\n)`, pv.all);
    const top = N ? M.tbl('t', `TOPN(${N}, ${all.d}, [@v], DESC, [@l], ASC)`, pv.top) : all;
    const before = `FILTER(${top.d}, [@v] > __v || ([@v] = __v && [@l] < __l))`;
    const seg = M.tbl('s', `ADDCOLUMNS(\n    ${top.d},\n    "@k", VAR __v = [@v] VAR __l = [@l] RETURN COUNTROWS(${before}) + 0,\n    "@cb", VAR __v = [@v] VAR __l = [@l] RETURN SUMX(${before}, [@v]) + 0\n)`, pv.top);
    const tot = M.def('tot', V(`SUMX(${all.d}, [@v])`, pv.tot));
    const ts = N ? M.def('ts', V(`SUMX(${top.d}, [@v])`, pv.tsum)) : tot;
    const ot = N ? M.def('ot', V(`${tot.d} - ${ts.d}`, pv.ot)) : null;
    const smil = b.smil !== false;
    const circ = (cls, len, off, tip) => `<circle class='ms-seg ${cls}' cx='200' cy='200' r='159.155' stroke-dasharray='${len} 1000' stroke-dashoffset='${off}'>${smil ? `<animate attributeName='stroke-dasharray' from='0 1000' to='${len} 1000' dur='0.9s' fill='freeze'/>` : ''}<title>${tip}</title></circle>`;
    const scls = (g) => M.dax ? `ms-s${X(`FORMAT(MOD([@k], 6) + 1, "0")`)}` : `ms-s${(num(g('k').p) % 6) + 1}`;
    const lenOf = (v) => M.i(Vo.clamp(Vo.sub(Vo.mul(Vo.div(v, tot), Vo.n(1000)), Vo.n(3)), 0, 1000));
    const segs = M.each(seg, (g) => circ(scls(g), lenOf(g('v')), M.i(Vo.mul(Vo.div(g('cb'), tot), Vo.n(-1000))), `${M.t(g('l'))}: ${M.f(g('v'), b.fmt)}`), [['[@k]', 'ASC']]);
    const otSeg = ot ? M.when(Vo.gt(ot, Vo.n(0)), circ('so', lenOf(ot), M.i(Vo.mul(Vo.div(ts, tot), Vo.n(-1000))), `${h(b.othersLabel || 'Others')}: ${M.f(ot, b.fmt)}`)) : '';
    const svg = `<svg viewBox='0 0 400 400'><g transform='rotate(-90 200 200)'>${segs}${otSeg}</g></svg>`;
    const cen = b.center ? `<div class='ms-dc'><b>${M.f(tot, b.fmt)}</b><span>${M.tpl(b.center)}</span></div>` : '';
    let leg = '';
    if (b.legend !== false) {
      const li = M.each(seg, (g) => `<div class='${scls(g)}'><i></i><span>${M.t(g('l'))}</span><b>${M.f(g('v'), b.fmt)}</b><em>${M.f(Vo.div(g('v'), tot), '0.0%')}</em></div>`, [['[@k]', 'ASC']]);
      const lo = ot ? M.when(Vo.gt(ot, Vo.n(0)), `<div class='so'><i></i><span>${h(b.othersLabel || 'Others')}</span><b>${M.f(ot, b.fmt)}</b><em>${M.f(Vo.div(ot, tot), '0.0%')}</em></div>`) : '';
      leg = `<div class='ms-dl'>${li}${lo}</div>`;
    }
    return wrap(b, M, `<div class='ms-dn'><div class='ms-dw'>${svg}${cen}</div>${leg}</div>`);
  },
};

TYPES.gauge = {
  name: 'Gauge', glyph: '◠', kit: ['gauge'],
  make: () => base({ span: 4, title: 'Budget achievement', subtitle: '', value: '[Revenue]', min: '0', max: '[Revenue Budget] * 1.2', target: '[Revenue Budget]', fmt: '#,0.0,,"M"',
    caption: '{{ DIVIDE([Revenue], [Revenue Budget]) | pct1 }} of budget', rag: true, t1: '0.9', t2: '1', smil: true,
    sample: { v: '412500000', min: '0', max: '516000000', t: '430000000' } }),
  form: [...F_TITLE, { sec: 'Data' }, { k: 'value', t: 'dax', label: 'Value' }, { k: 'min', t: 'dax', label: 'Minimum' }, { k: 'max', t: 'dax', label: 'Maximum' },
    { k: 'target', t: 'dax', label: 'Target tick (optional)' }, { k: 'fmt', t: 'fmt', label: 'Format' }, { k: 'caption', t: 'tpl', label: 'Caption under the value' },
    { k: 'rag', t: 'bool', label: 'Colour by value ÷ target' }, { k: 't1', t: 'text', label: 'Red below (ratio)', show: (b) => b.rag }, { k: 't2', t: 'text', label: 'Amber below (ratio)', show: (b) => b.rag },
    { k: 'smil', t: 'bool', label: 'Sweep animation (SVG, needs lite 1.6.1+)' },
    { sec: 'Preview sample' }, { k: 'sample.v', t: 'text', label: 'Value' }, { k: 'sample.min', t: 'text', label: 'Minimum' }, { k: 'sample.max', t: 'text', label: 'Maximum' }, { k: 'sample.t', t: 'text', label: 'Target' }],
  build(b, M) {
    const s = b.sample || {};
    const v = M.val('v', b.value, s.v), mn = M.val('mn', b.min || '0', s.min ?? 0), mx = M.val('mx', b.max, s.max);
    const f = M.def('f', Vo.clamp(Vo.div(Vo.sub(v, mn), Vo.sub(mx, mn)), 0, 1));
    const hasT = !!(b.target || '').trim();
    const t = hasT ? M.val('t', b.target, s.t) : null;
    let rag = '';
    if (hasT && b.rag) {
      const r = M.def('r', Vo.div(v, t));
      rag = ' ' + M.pick3(Vo.lt(r, V(b.t1 || '0.9', parseNum(b.t1) ?? 0.9)), 'r', Vo.lt(r, V(b.t2 || '1', parseNum(b.t2) ?? 1)), 'a', 'g');
    }
    const len = M.i(Vo.mul(f, Vo.n(1000)));
    const path = "M40 200 A160 160 0 0 1 360 200";
    const tick = hasT ? `<g transform='rotate(${M.i(Vo.mul(Vo.clamp(Vo.div(Vo.sub(t, mn), Vo.sub(mx, mn)), 0, 1), Vo.n(180)))} 200 200)'><line class='ms-ggk' x1='22' y1='200' x2='58' y2='200'/></g>` : '';
    const svg = `<svg viewBox='0 0 400 225'><path class='ms-ggt' d='${path}' pathLength='1000'/><path class='ms-ggv' d='${path}' pathLength='1000' stroke-dasharray='${len} 1000'>${b.smil !== false ? `<animate attributeName='stroke-dasharray' from='0 1000' to='${len} 1000' dur='1s' fill='freeze'/>` : ''}</path>${tick}</svg>`;
    const inner = `<div class='ms-gg${rag}'>${svg}<div class='ms-ggc'><b>${M.f(v, b.fmt)}</b>${b.caption ? `<span>${M.tpl(b.caption)}</span>` : ''}</div></div><div class='ms-ggl'><span>${M.f(mn, b.fmt)}</span><span>${M.f(mx, b.fmt)}</span></div>`;
    return wrap(b, M, inner);
  },
};

/* ---------------- Waterfall / bridge ---------------- */
TYPES.wf = {
  name: 'Waterfall', glyph: '⫼', kit: ['wf'],
  make: () => base({ span: 5, title: 'Bridge: previous month → current month', subtitle: '', startLabel: 'PM', start: '[Revenue PM]', endLabel: 'CM',
    src: "VALUES('Revenue'[Line])", label: "'Revenue'[Line]", delta: '[Revenue] - [Revenue PM]', sort: 'abs', sortExpr: '', zero: false, fmt: '#,0.0,,"M"', dfmt: '+#,0.0,,"M";-#,0.0,,"M";0',
    sample: 'start = 398200000\n' + gridText(['l', 'v'], [{ l: 'Passenger', v: 9.8e6 }, { l: 'Cargo', v: -4.1e6 }, { l: 'Excess baggage', v: 1.9e6 }, { l: 'Mail', v: -0.6e6 }, { l: 'Ancillary', v: 7.3e6 }]) }),
  form: [...F_TITLE, { sec: 'Data' }, { k: 'startLabel', t: 'text', label: 'Start label' }, { k: 'start', t: 'dax', label: 'Start value' },
    { k: 'src', t: 'dax', label: 'Steps (table expression)' }, { k: 'label', t: 'dax', label: 'Step label (row context)' }, { k: 'delta', t: 'dax', label: 'Step change (row context)' },
    { k: 'endLabel', t: 'text', label: 'End label', hint: 'end = start + sum of steps' },
    { k: 'sort', t: 'sel', label: 'Step order', opts: [['abs', 'Largest change first'], ['label', 'Label A → Z'], ['custom', 'Custom sort key']] },
    { k: 'sortExpr', t: 'dax', label: 'Sort key (row context)', show: (b) => b.sort === 'custom' },
    { k: 'fmt', t: 'fmt', label: 'Total format' }, { k: 'dfmt', t: 'fmt', label: 'Step format' },
    { k: 'zero', t: 'bool', label: 'Axis starts at zero', hint: 'off = bridge style: the axis starts just below the lowest level so small steps stay visible' },
    { sec: 'Preview sample' }, { k: 'sample', t: 'grid', keys: (b) => ['l', 'v', ...(b.sort === 'custom' ? ['o'] : [])], hint: 'first line may be "start = 123"; then l = step label · v = change' }],
  build(b, M) {
    const cust = b.sort === 'custom';
    const pv = {};
    if (!M.dax) {
      const txt = String(b.sample || '');
      const sm = txt.match(/^\s*start\s*=\s*(.+)$/m);
      const lwf = liveRows(b); /* ColSift */
      pv.s = lwf ? num(liveEval(b.start, null)) : sm ? num(parseNum(sm[1])) : 1000;
      const g = (lwf || parseGrid(txt.replace(/^\s*start\s*=.*$/m, ''))).filter((r) => !nul(r.v));
      g.forEach((r) => { r.o = cust ? r.o : b.sort === 'label' ? r.l : -Math.abs(num(r.v)); });
      g.sort((a, z) => cmpVal(a.o, z.o) || cmpVal(a.l, z.l));
      let c = pv.s; g.forEach((r) => { r.c0 = c; c += num(r.v); });
      pv.rows = g; pv.e = c;
      const levels = [pv.s, pv.e, ...g.flatMap((r) => [r.c0, r.c0 + num(r.v)])];
      pv.hi = Math.max(...levels); pv.lo = Math.min(...levels);
    }
    const s = M.def('s', V(b.start || '0', pv.s));
    const ord = cust ? b.sortExpr : b.sort === 'label' ? '[@l]' : '-ABS([@v])';
    const st = M.tbl('st', `ADDCOLUMNS(\n    ${indent(b.src, '    ')},\n    "@l", ${b.label},\n    "@v", ${b.delta}\n)`, pv.rows);
    const so = M.tbl('so', `ADDCOLUMNS(${st.d}, "@o", ${ord})`, pv.rows);
    const sx = M.tbl('sx', `ADDCOLUMNS(\n    ${so.d},\n    "@c0", VAR __o = [@o] VAR __l = [@l] RETURN ${s.d} + SUMX(FILTER(${so.d}, [@o] < __o || ([@o] = __o && [@l] < __l)), [@v])\n)`, pv.rows);
    const e = M.def('e', V(`${s.d} + SUMX(${so.d}, [@v])`, pv.e));
    const hi = M.def('hi', V(`MAXX({ ${s.d}, ${e.d}, MAXX(${sx.d}, [@c0]), MAXX(${sx.d}, [@c0] + [@v]) }, [Value])`, pv.hi));
    const lo = M.def('lo', V(`MINX({ ${s.d}, ${e.d}, MINX(${sx.d}, [@c0]), MINX(${sx.d}, [@c0] + [@v]) }, [Value])`, pv.lo));
    let mx, mn, bs;
    if (b.zero) {
      mx = M.def('mx', V(`MAX(0, ${hi.d})`, Math.max(0, num(pv.hi))));
      mn = M.def('mn', V(`MIN(0, ${lo.d})`, Math.min(0, num(pv.lo))));
      bs = V('0', 0);
    } else {
      const spP = pv.hi === pv.lo ? Math.abs(num(pv.hi)) + 1 : num(pv.hi) - num(pv.lo);
      const sp = M.def('sp', V(`IF(${hi.d} = ${lo.d}, ABS(${hi.d}) + 1, ${hi.d} - ${lo.d})`, spP));
      mx = M.def('mx', V(`${hi.d} + ${sp.d} * 0.1`, num(pv.hi) + spP * 0.1));
      mn = M.def('mn', V(`${lo.d} - ${sp.d} * 0.6`, num(pv.lo) - spP * 0.6));
      bs = mn;
    }
    const rg = M.def('rg', V(`IF(${mx.d} = ${mn.d}, 1, ${mx.d} - ${mn.d})`, (num(mx.p) - num(mn.p)) || 1));
    const lvl = (x) => Vo.mul(Vo.div(Vo.sub(x, mn), rg), Vo.n(1000));
    const totCol = (x, label) => {
      const lo = M.dax ? V(`MIN(${bs.d}, ${x.d})`, null) : V(null, Math.min(num(bs.p), num(x.p)));
      const hi = M.dax ? V(`MAX(${bs.d}, ${x.d})`, null) : V(null, Math.max(num(bs.p), num(x.p)));
      return `<div class='ms-wc tot' style='--b:${M.i(lvl(lo))};--h:${M.i(Vo.mul(Vo.div(Vo.sub(hi, lo), rg), Vo.n(1000)))};--e:${M.i(lvl(x))}'><em class='ms-wv'>${M.f(x, b.fmt)}</em><em class='ms-tip'>${h(label)}<b>${M.f(x, b.fmt)}</b></em></div>`;
    };
    const steps = M.each(sx, (g) => {
      const c0 = g('c0'), v = g('v');
      const c1 = Vo.add(c0, v);
      const lo = M.dax ? V(`MIN(${c0.d}, ${c1.d})`, null) : V(null, Math.min(num(c0.p), num(c1.p)));
      return `<div class='ms-wc ${M.pick(Vo.lt(v, Vo.n(0)), 'dn', 'up')}' style='--b:${M.i(lvl(lo))};--h:${M.i(Vo.mul(Vo.div(Vo.abs(v), rg), Vo.n(1000)))};--e:${M.i(lvl(c1))}'><em class='ms-wv'>${M.f(v, b.dfmt || b.fmt)}</em><em class='ms-tip'>${M.t(g('l'))}<b>${M.f(v, b.dfmt || b.fmt)}</b></em></div>`;
    }, [['[@o]', 'ASC'], ['[@l]', 'ASC']]);
    const xl = M.each(sx, (g) => `<span>${M.t(g('l'))}</span>`, [['[@o]', 'ASC'], ['[@l]', 'ASC']]);
    const inner = `<div class='ms-wf'><div class='ms-wp'>${totCol(s, b.startLabel || 'Start')}${steps}${totCol(e, b.endLabel || 'End')}</div><div class='ms-wx'><span>${h(b.startLabel || 'Start')}</span>${xl}<span>${h(b.endLabel || 'End')}</span></div></div>`;
    return wrap(b, M, inner);
  },
};

TYPES.notes = {
  name: 'Notes list', glyph: '✎', kit: ['notes'],
  make: () => base({ span: 12, title: 'Remarks', subtitle: '', src: "FILTER('Remarks', NOT ISBLANK('Remarks'[Description]))", ttl: "'Remarks'[Element]", body: "'Remarks'[Description]",
    meta: '', badge: '', sort: "'Remarks'[Element]", dir: 'ASC', max: '0', empty: 'No remarks for this period', layout: 'list',
    sample: gridText(['t', 'b', 'm', 'k'], [{ t: 'Passenger', b: 'Yield up on premium cabins; Europe capacity added mid-month.', m: '', k: '' }, { t: 'Cargo-f', b: 'Freighter rotations reduced for two weeks of heavy maintenance.', m: '', k: '' }, { t: 'Mail-c', b: 'Postal contract rate revision posted in arrears.', m: '', k: '' }]) }),
  form: [...F_TITLE, { sec: 'Data' }, { k: 'src', t: 'dax', label: 'Rows (table expression)' }, { k: 'ttl', t: 'dax', label: 'Heading (row context)' },
    { k: 'body', t: 'dax', label: 'Text (row context)' }, { k: 'meta', t: 'dax', label: 'Meta, right aligned (optional)' }, { k: 'badge', t: 'dax', label: 'Badge (optional)' },
    { k: 'sort', t: 'dax', label: 'Sort key' }, { k: 'dir', t: 'sel', label: 'Direction', opts: [['ASC', 'Ascending'], ['DESC', 'Descending']] },
    { k: 'max', t: 'num', label: 'Max items (0 = all)' }, { k: 'empty', t: 'text', label: 'Text when empty' },
    { k: 'layout', t: 'sel', label: 'Layout', opts: [['list', 'List'], ['cards', 'Cards']] },
    { sec: 'Preview sample' }, { k: 'sample', t: 'grid', keys: () => ['t', 'b', 'm', 'k'], hint: 't = heading · b = text · m = meta · k = badge' }],
  build(b, M) {
    const N = Math.max(0, parseInt(b.max, 10) || 0);
    const pv = M.dax ? null : M.grid().slice(0, N || undefined);
    const add = [`"@t", ${b.ttl || '""'}`, `"@b", ${b.body || '""'}`, `"@o", ${b.sort || '1'}`];
    if ((b.meta || '').trim()) add.push(`"@m", ${b.meta}`);
    if ((b.badge || '').trim()) add.push(`"@k", ${b.badge}`);
    const a = M.tbl('a', `ADDCOLUMNS(\n    ${indent(b.src, '    ')},\n    ${add.join(',\n    ')}\n)`, pv);
    const r = N ? M.tbl('r', `TOPN(${N}, ${a.d}, [@o], ${b.dir === 'DESC' ? 'DESC' : 'ASC'})`, pv) : a;
    const br = (v) => M.dax ? X(`SUBSTITUTE(${escDax(v.d)}, UNICHAR(10), "<br>")`) : h(v.p ?? '').replace(/\n/g, '<br>');
    const items = M.each(r, (g) => `<li class='ms-ni'><div><div class='ms-nh'><span class='ms-nt'>${M.t(g('t'))}</span>${(b.badge || '').trim() ? `<span class='ms-nk'>${M.t(g('k'))}</span>` : ''}${(b.meta || '').trim() ? `<span class='ms-nm'>${M.t(g('m'))}</span>` : ''}</div><div class='ms-nb'>${br(g('b'))}</div></div></li>`,
      [['[@o]', b.dir === 'DESC' ? 'DESC' : 'ASC']]);
    let list;
    if (M.dax) { const it = M.raw('h', splitMarkup(items)[0].e); list = X(`IF(${it} = "", ${dq(`<li class='ms-ne'>${h(b.empty || '')}</li>`)}, ${it})`); }
    else list = items || `<li class='ms-ne'>${h(b.empty || '')}</li>`;
    return wrap(b, M, `<ul class='ms-nl'>${list}</ul>`, { cls: b.layout === 'cards' ? 'ms-nc' : '' });
  },
};

      <div class="opts">${g.options.map((x, i) => `<div class="opt${i === selI ? ' on' : ''}" data-act="gsel" data-g="${k}" data-i="${i}"><b>${h(x.name)}</b>${x.name === g.fixed ? '<em>default</em>' : ''}<span class="sws">${sws(x)}</span></div>`).join('')}</div>
      <div class="addrow"><button class="btn" data-act="gdup" data-g="${k}">Duplicate selected</button><button class="btn" data-act="gup" data-g="${k}">Move up</button><button class="btn dn" data-act="gdel" data-g="${k}">Delete selected</button><button class="btn" data-act="gjson" data-g="${k}">Edit all as JSON</button></div>
      <div class="sec">Edit "${h(o.name)}"</div>
      ${fieldHtml({ k: 'name', t: 'text', label: 'Name' }, o, `${k}.options.${selI}`)}
      <div class="tgrid">${keys.map((key) => { const v = o.vars[key] ?? ''; const c = isT ? color(v) : null; return `<span>--${key}</span>${c ? `<input type="color" data-k="${k}.options.${selI}.vars.${key}" value="${c}" data-mirror="1">` : '<span></span>'}<input class="in tpl-in" data-k="${k}.options.${selI}.vars.${key}" value="${h(v)}" data-mirror="1" spellcheck="false">`; }).join('')}</div>
      <div id="gjsonBox"></div></div>`;
}

/* ---------- block inspector ---------- */
function inspBlock(b) {
  const T = TYPES[b.type], i = blockIndex(b.id), path = 'blocks.' + i;
  const hdr = `<div class="ih"><h2><span class="g">${h(T.glyph)}</span>${h(T.name)}</h2><p>Block <span class="kbd">${h(b.id)}</span> → <span class="kbd">VAR _${h(b.id)}</span> in the measure · <a href="#" data-act="showdax">view its DAX</a></p></div>`;
  const idf = `<div class="frow">${fieldHtml({ k: 'id', t: 'text', label: 'Block id' }, b, path)}${fieldHtml({ k: 'hide', t: 'sel', label: 'Visibility', opts: [['', 'Shown'], ['1', 'Hidden (kept, not output)']] }, { hide: b.hide ? '1' : '' }, path)}</div>`;
  return hdr + `<div class="ibody">${idf}${formHtml(T.form, b, path)}${b.type === 'dax' ? '' : formHtml(F_LAYOUT, b, path)}</div>`;
}
function renderInsp() {
  const el = $('#insp'), s = UI.sel;
  const scroll = el.scrollTop;
  if (s.k === 'block') { const b = curBlock(); el.innerHTML = b ? inspBlock(b) : '<div class="ibody hint">Select or add a block.</div>'; }
  else el.innerHTML = (PANELS[s.k] || PANELS.canvas)();
  $$('.dax-in', el).forEach(autosize);
  el.scrollTop = scroll;
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(320, t.scrollHeight + 2) + 'px'; }

/* ---------- inspector events ---------- */
function coerce(t) {
  if (t.type === 'checkbox') return t.checked;
  if (t.type === 'range') return +t.value;
  return t.value;
}
function onField(t, final) {
  const P = UI.P;
  if (t.dataset.sp) { const o = getPath(P, t.dataset.sp) || {}; if (!getPath(P, t.dataset.sp)) setPath(P, t.dataset.sp, o); const obj = getPath(P, t.dataset.sp); if (t.value === '') delete obj[t.dataset.sk]; else obj[t.dataset.sk] = t.value; commit({ rail: false }); return; }
  const p = t.dataset.k; if (!p) return;
  let v = coerce(t);
  if (/\.hide$/.test(p)) { setPath(P, p, v === '1'); commit({ insp: final }); return; }
  if (/^blocks\.\d+\.id$/.test(p)) {
    if (!final) return;
    const old = getPath(P, p);
    if (!identOk(v) || P.blocks.some((b) => b.id === v && b.id !== old)) { toast('Block id must be unique: letters, digits and _'); t.value = old; return; }
    setPath(P, p, v); UI.sel = { k: 'block', id: v }; commit({ insp: true }); return;
  }
  setPath(P, p, v);
  if (t.dataset.mirror) { const twin = $$(`#insp [data-k="${CSS.escape(p)}"]`).find((x) => x !== t); if (twin && (twin.type !== 'color' || /^#[0-9a-f]{6}$/i.test(v))) twin.value = v; }
  if (t.dataset.dax) { const bad = String(v).trim() ? daxCheck(v) : []; t.classList.toggle('bad', !!bad.length); t.title = bad.join('; '); autosize(t); }
  const fp = $(`#insp [data-fmtp="${CSS.escape(p)}"]`); if (fp) fp.innerHTML = fmtExample(v);
  if (t.type === 'range') { const b = t.parentElement.querySelector('b'); if (b) b.textContent = v + '/12'; }
  const structural = final && (t.tagName === 'SELECT' || t.type === 'checkbox' || /\.(key|type|cols\.\d+\.grp)$/.test(p));
  commit({ insp: structural, top: p === 'settings.name' || p === 'settings.edition' });
  if (p === 'settings.edition' || /^(theme|style)\./.test(p)) renderSbar();
}
function wireInsp() {
  const el = $('#insp');
  el.addEventListener('input', (e) => { const t = e.target; if (t.dataset.k || t.dataset.sp) onField(t, false); });
  el.addEventListener('change', (e) => { const t = e.target; if (t.dataset.k || t.dataset.sp) onField(t, true); });
  el.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.item) { if (d.open) UI.openItems.add(d.dataset.item); else UI.openItems.delete(d.dataset.item); } }, true);
  el.addEventListener('dragover', (e) => { if (e.target.matches('input.in, textarea.in')) e.preventDefault(); });
  el.addEventListener('drop', (e) => {
    const t = e.target; if (!t.matches('input.in, textarea.in')) return;
    const txt = e.dataTransfer.getData('text/plain'); if (!txt) return;
    e.preventDefault(); t.focus(); UI.focusEl = t; insertAtCursor(txt);
  });
  el.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    e.preventDefault();
    const P = UI.P, act = a.dataset.act, p = a.dataset.p, i = +a.dataset.i;
    const arr = p ? getPath(P, p) : null;
    switch (act) {
      case 'icon': setPath(P, p, a.dataset.v); commit({ insp: true }); break;
      case 'img': UI.imgPath = p; $('#fImg').click(); break;
      case 'imgclr': setPath(P, p, ''); commit({ insp: true }); break;
      case 'regen': { const b = curBlock(); if (!b) break; b.sample = TYPES[b.type].genSample ? TYPES[b.type].genSample(b) : TYPES[b.type].make().sample; commit({ insp: true }); toast('Sample regenerated'); break; }
      case 'fixhdr': { const b = curBlock(); if (!b) break; const lines = String(b.sample || '').split('\n'); const hi = lines.findIndex((l) => l.trim() && !/^\s*(--|start\s*=)/.test(l)); const keys = a.dataset.keys.split('|').join(' | '); if (hi >= 0) lines[hi] = keys; else lines.unshift(keys); b.sample = lines.join('\n'); commit({ insp: true }); break; }
      case 'ladd': arr.push({ name: 'Series ' + (arr.length + 1), expr: '[Measure]', dash: false }); UI.openItems.add(p + '.' + (arr.length - 1)); commit({ insp: true }); break;
      case 'ldel': arr.splice(i, 1); commit({ insp: true }); break;
      case 'ldup': { const c = clone(arr[i]); if (c.key) c.key = uniqKey(curBlock(), c.key); arr.splice(i + 1, 0, c); commit({ insp: true }); break; }
      case 'lmove': { const j = i + (+a.dataset.d); if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; commit({ insp: true }); } break; }
      case 'colp': { const b = curBlock(); const c = COL_PRESETS[i][1](b); arr.push(c); UI.openItems.add(p + '.' + (arr.length - 1)); commit({ insp: true }); toast(`Column [@${c.key}] added`); break; }
      case 'tokadd': P.tokens.push({ name: 'my-var', value: '1', expr: '', note: 'Use it in CSS as var(--my-var)' }); UI.openItems.add('tokens.' + (P.tokens.length - 1)); commit({ insp: true }); break;
      case 'varadd': { let n = '_v' + (P.vars.length + 1); P.vars.push({ name: n, expr: '', sample: '' }); commit({ insp: true }); break; }
      case 'recipe': P.css = (P.css ? P.css.replace(/\s*$/, '\n') : '') + RECIPES[i][1]; commit({ insp: true }); toast('Recipe added to Custom CSS'); break;
      case 'gsel': if (a.dataset.g === 'theme') UI.themeSel = i; else UI.styleSel = i; renderInsp(); break;
      case 'gdup': case 'gdel': case 'gup': case 'gjson': groupAct(a.dataset.g, act); break;
      case 'gjsonApply': { try { const arr2 = JSON.parse($('#gjsonTa').value); if (!Array.isArray(arr2) || !arr2.every((x) => x && x.name && x.vars)) throw new Error('Expected [{ "name": …, "vars": { … } }, …]'); P[a.dataset.g].options = arr2; commit({ insp: true }); renderSbar(); toast('Applied'); } catch (err) { toast('JSON not applied: ' + err.message); } break; }
      case 'demo': { snapshot(); const D = defaultProject(); P.blocks = D.blocks; P.vars = P.vars.length ? P.vars : D.vars; UI.sel = { k: 'block', id: P.blocks[0].id }; commit({ insp: true }); break; }
      case 'clearall': if (confirm('Remove all blocks? (Ctrl+Z undoes)')) { snapshot(); P.blocks = []; commit({ insp: true }); } break;
      case 'replace': {
        const f = $('#frFind').value, r = $('#frRepl').value; if (!f) { toast('Type what to find'); break; }
        let n = 0; const walk = (o) => { for (const k of Object.keys(o)) { const v = o[k]; if (typeof v === 'string' && k !== 'sample' && k !== 'logo' && v.includes(f)) { n += v.split(f).length - 1; o[k] = v.split(f).join(r); } else if (v && typeof v === 'object') walk(v); } };
        walk(P.blocks); walk(P.vars); walk(P.tokens); if (P.theme.expr) walk(P.theme); if (P.style.expr) walk(P.style);
        commit({ insp: true }); toast(n ? `${n} replacement${n > 1 ? 's' : ''} made` : 'Nothing matched'); break;
      }
      case 'impAdd': case 'impNew': { try { toast(applyImport(importText($('#impIn').value), act === 'impNew' ? 'replace' : 'add')); } catch (err) { toast('Import failed: ' + err.message); } break; }
      case 'impFile': $('#fOpen').click(); break;
      case 'showdax': UI.outTab = 'block'; renderOut(true); if (window.innerWidth <= 900) setMobile('dax'); break;
    }
  });
  $('#fImg').onchange = (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f || !UI.imgPath) return;
    if (f.size > 400 * 1024) toast('Large image — it will make the measure long; consider a smaller PNG');
    const rd = new FileReader(); rd.onload = () => { setPath(UI.P, UI.imgPath, String(rd.result)); commit({ insp: true }); }; rd.readAsDataURL(f);
  };
}
function groupAct(k, act) {
  const P = UI.P, g = P[k]; const key = k === 'theme' ? 'themeSel' : 'styleSel'; const i = Math.min(UI[key], g.options.length - 1);
  if (act === 'gdup') { const c = clone(g.options[i]); let n = c.name + ' copy', j = 2; while (g.options.some((x) => x.name === n)) n = c.name + ' copy ' + j++; c.name = n; g.options.splice(i + 1, 0, c); UI[key] = i + 1; }
  else if (act === 'gdel') { if (g.options.length <= 1) return toast('Keep at least one'); const gone = g.options.splice(i, 1)[0]; if (g.fixed === gone.name) g.fixed = g.options[0].name; if (g.alt === gone.name) g.alt = g.options[0].name; UI[key] = Math.max(0, i - 1); }
  else if (act === 'gup') { if (i > 0) { [g.options[i - 1], g.options[i]] = [g.options[i], g.options[i - 1]]; UI[key] = i - 1; } }
  else if (act === 'gjson') { const box = $('#gjsonBox'); box.innerHTML = `<div class="sec">All as JSON</div><textarea class="in code-in" id="gjsonTa" rows="14" spellcheck="false">${h(JSON.stringify(g.options, null, 1))}</textarea><div class="addrow"><button class="btn pr" data-act="gjsonApply" data-g="${k}">Apply JSON</button></div>`; return; }
  commit({ insp: true }); renderSbar();
}

/* ---------- boot ---------- */
function boot() {
  $('#fmtList').innerHTML = FMT_PRESETS.map((f) => `<option value="${h(f)}">`).join('');
  const saved = restore();
  UI.P = normalizeProject(saved && saved.P ? saved.P : defaultProject());
  if (saved && saved.ui) Object.assign(UI, { size: saved.ui.size || 'fit', w: saved.ui.w || 1280, h: saved.ui.h || 720, canvas: saved.ui.canvas || 'white', sim: saved.ui.sim !== false, outh: saved.ui.outh || '' });
  if (UI.outh) document.documentElement.style.setProperty('--outh', UI.outh);
  UI.sel = UI.P.blocks.length ? { k: 'block', id: UI.P.blocks.find((b) => b.type === 'table')?.id || UI.P.blocks[0].id } : { k: 'canvas' };
  UI.lastSnap = JSON.stringify(UI.P);
  wireTop(); wireRail(); wireSbar(); wireFrame(); wireOut(); wireInsp();
  renderEverything();
  if (window.innerWidth <= 900) setMobile('preview');
}
document.addEventListener('DOMContentLoaded', boot);

</script>
<script>
/* ColSift bridge — only when the host set window.__MS_EMBED ('edit' or 'render') */
(function () {
  const mode = window.__MS_EMBED;
  if (!mode) return;
  const send = (m) => window.parent.postMessage(Object.assign({ ms: true }, m), '*');
  const setLive = (live, P) => {
    LIVE.on = !!(live && (live.values || live.ctx));
    LIVE.strict = !!(live && live.strict);
    LIVE.values = (live && live.values) || {};
    LIVE.ctx = (live && live.ctx) || {};
    LIVE.vars = P ? (P.vars || []) : null;
  };
  /* the host's measures as fields, so the rail offers them and {{ }} finds them */
  const mergeFields = (P, fields) => {
    const lines = String(P.fields || '').split(/\r?\n/), seen = new Set();
    const out = lines.map((l) => {
      const m = l.match(/^\s*\[([^\]]+)\]\s*(=|\t)?/);
      if (!m) return l;
      const f = fields.find((x) => x.name.toLowerCase() === m[1].trim().toLowerCase());
      if (!f) return l;
      seen.add(f.name.toLowerCase());
      return `[${f.name}] = ${f.sample ?? ''}`;
    });
    fields.filter((f) => !seen.has(f.name.toLowerCase())).forEach((f) => out.push(`[${f.name}] = ${f.sample ?? ''}`));
    P.fields = out.filter((l, i) => l.trim() || i < out.length - 1).join('\n');
  };
  const render = (project, live) => {
    const keep = Object.assign({}, LIVE);
    const P = normalizeProject(clone(project || defaultProject()));
    if (live && live.strict) P.settings.anim = 'none';     // a dashboard redraws often: no entrance animations
    setLive(live, P);
    let html;
    try { html = buildMeasure(P, { dax: false }).html; } finally { Object.assign(LIVE, keep); }
    if (P.settings.edition !== 'regular') html = sanitizeLite(html, { allowUrls: P.settings.allowUrls }).html;
    return html;
  };
  /* [Name] references that are measures, not 'Table'[Column] or [@key] */
  const refs = (P) => {
    const text = JSON.stringify([(P && P.blocks) || [], ((P && P.vars) || []).map((v) => v.expr)]);
    const out = new Map();
    for (const m of text.matchAll(/(^|[^\w'\]])\[([^\]@\[\\"][^\]\\"]*)\]/g)) {
      const n = m[2].trim();
      if (n && !out.has(n.toLowerCase())) out.set(n.toLowerCase(), n);
    }
    return [...out.values()];
  };
  /* what ColSift can feed: blocks that draw rows, KPIs with a sparkline */
  const blocks = (P) => ((P && P.blocks) || []).filter((b) => TYPES[b.type]).map((b) => ({
    id: b.id, type: b.type, kind: TYPES[b.type].name, title: String(b.title || '').replace(/\{\{[^}]*\}\}/g, '…').trim(),
    rows: !!LIVE_ROW[b.type], spark: b.type === 'kpi' && !!(b.spark && b.spark.on), records: b.type === 'notes' || b.type === 'table',
    hidden: !!b.hide }));
  /* a first design from a card's measures: a header, KPI cards, a bar list */
  const starter = (o) => {
    const P = normalizeProject(defaultProject());
    P.settings.name = o.name || 'ColSift visual';
    P.vars = [];
    P.blocks = [];
    const ms = (o.measures || []).filter(Boolean);
    P.blocks.push(newBlock(P, 'header', { title: o.name || 'Dashboard', subtitle: o.subtitle || '', chips: '' }));
    const n = Math.min(4, ms.length) || 1;
    ms.slice(0, 4).forEach((name) => P.blocks.push(newBlock(P, 'kpi', {
      span: Math.max(3, Math.floor(12 / n)), title: name, value: `[${name}]`, fmt: '#,0', cmp: '', cmpLabel: '', target: '',
      spark: Object.assign(TYPES.kpi.make().spark, { on: false }) })));
    if (ms.length && o.by) P.blocks.push(newBlock(P, 'bar', {
      span: 12, title: `${ms[0]} by ${o.by}`, subtitle: '', src: `VALUES('Data'[${o.by}])`, label: `'Data'[${o.by}]`,
      value: `[${ms[0]}]`, fmt: '#,0', marker: '', top: '10' }));
    P.fields = ms.map((name) => `[${name}] = `).join('\n');
    return P;
  };
  window.msColSift = { render, dax: (P) => buildMeasure(normalizeProject(clone(P)), { dax: true }).dax, refs, blocks, starter };
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || !m.ms) return;
    try {
      if (m.type === 'render') {
        send({ type: 'html', id: m.id, html: render(m.project, m.live) });
      } else if (m.type === 'dax') {
        send({ type: 'dax', id: m.id, dax: buildMeasure(normalizeProject(clone(m.project)), { dax: true }).dax });
      } else if (m.type === 'load') {
        UI.P = normalizeProject(clone(m.project || defaultProject()));
        if (m.fields && m.fields.length) mergeFields(UI.P, m.fields);
        if (m.name) UI.P.settings.name = m.name;
        setLive(m.live, null);
        UI.sel = UI.P.blocks.length ? { k: 'block', id: UI.P.blocks[0].id } : { k: 'canvas' };
        UI.undo = []; UI.redo = []; UI.lastSnap = JSON.stringify(UI.P);
        renderEverything();
      } else if (m.type === 'live') {
        setLive(m.live, null);
        schedule(0);
      }
    } catch (err) {
      send({ type: 'error', id: m.id, error: String((err && err.message) || err) });
    }
  });
  document.addEventListener('DOMContentLoaded', () => {
    if (mode === 'edit') {
      const acts = document.querySelector('.top .acts');
      if (acts) {
        const mk = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b; };
        acts.prepend(mk('Cancel', '', () => send({ type: 'close' })));
        acts.appendChild(mk('Use in ColSift', 'primary', () => send({ type: 'save', project: UI.P })));
      }
    }
    send({ type: 'ready', mode });
  });
})();
</script>
